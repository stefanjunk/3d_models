    status: pending
    master_mesh: generated/reference-master-mesh.stl
    manufacturing_mesh: generated/manufacturing-mesh.stl
    method: null
    tolerance_mm: null
    protected_regions:
      - drawer guide runners and stops
      - perimeter frames and load-path ties
      - smooth sliding faces
      - bed-contact planes
      - relief borders and seams
    comparison_report: null
    resource_budget:
      triangle_target: 1000000
      triangle_stop: 5000000
      peak_memory_gib: 8
      max_mesh_mib: 100
