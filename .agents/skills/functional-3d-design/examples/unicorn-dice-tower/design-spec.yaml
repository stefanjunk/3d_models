  depth_mm: 0.40
  minimum_host_wall_mm: 1.20
  minimum_remaining_wall_mm: 0.80
function:
  summary: An integrated board-game dice tower and landing tray with original unicorn engraving.
  users: [board-game-player]
  interfaces:
    - open top receives common gaming dice
    - front exit discharges into integrated tray
risk:
  class: normal-functional
  hazards: [trapped-die, sharp-edge, small-part-age-suitability]
  assumptions:
    - Typical dice are at most approximately 26 mm across their bounding envelope.
    - The intended user is old enough for the dice and game components.
fabrication:
  preference: integrated-print
  assembly_target: none
  repairability: low
  note: Tower, ramps, and tray are one print; optional felt remains purchased.
printer:
  model: generic-fdm
  build_volume_mm: [250, 250, 250]
  enclosure: false
manufacturing:
  process: fdm-fff
  material: pla-plus
  nozzle_mm: 0.4
  layer_height_mm: 0.20
  target_formats: [stl]
