version: 1
project:
  name: example-multicolor-project
  purpose: decorative functional object
  risk_class: decorative
  units: mm

printer:
  model: Anycubic Kobra 3 Max
  material_changer: ACE 2 Pro
  nozzle_mm: 0.4
  layer_height_mm: 0.2
  max_filaments: 4
  slicer: Anycubic Slicer Next

source:
  path: source/model.obj
  kind: textured_mesh       # parametric_cad | textured_mesh | plain_mesh | existing_3mf
  preserve_immutable: true
  units: mm
  texture_paths:
    - source/texture.png
  source_sha256: null

representation:
  method: separate_solids   # layer_change | separate_solids | slicer_paint | texture_paint_handoff | voxel_partitions
  authoritative_color_data: named_solids
  destination_format: 3mf
  slicer_project_required: true

palette:
  path: filament-palette.yaml
  maximum_colors: 4
  mapping_method: ciede2000_fixed_palette
  dither: false
  island_cleanup:
    enabled: true
    minimum_area_mm2: 0.8
    minimum_width_mm: 0.8
    reassignment: nearest_neighbor

geometry:
  minimum_color_width_mm: 0.8
  minimum_inlay_depth_mm: 0.4
  interface_clearance_mm: 0.0
  overlap_allowed: false
  gap_allowed_mm: 0.03
  shell_depth_mm: 1.2
  voxel_pitch_mm: 0.6

materials:
  require_same_polymer_family: true
  allowed_family: PLA
  opacity_review_required: true

purge:
  matrix_path: purge-matrix.yaml
  maximum_changes: 600
  maximum_purge_volume_mm3: 40000
  permit_flush_into_infill: false
  light_wall_show_through_review: true

acceptance:
  all_color_parts_manifold: true
  preserve_common_coordinate_frame: true
  final_slicer_slot_mapping_reviewed: true
  final_slicer_preview_reviewed: true
  color_boundary_coupon_required: true
  maximum_mean_delta_e: 18.0
  maximum_p95_delta_e: 35.0
