interface:
  display_name: organic mesh functionalization
  short_description: Add precise parametric or functional geometry to high-resolution
    organic AI-generated meshes. Use for hollowing, cutting openings, replacing regions,
    fitting inserts, adding compartments, stairs, hinges, soles, mounts, ducts, threads,
    or other engineered features to STL/OBJ/GLB meshes while preserving ornamented
    surfaces and validating topology, wall thickness, fit, printability, and unintended
    changes. Covers Blender, CadQuery, FreeCAD, OpenSCAD, Trimesh, Manifold3D, voxel/SDF
    workflows, hybrids, memory control, and automated acceptance tests.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
