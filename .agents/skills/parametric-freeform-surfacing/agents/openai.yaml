interface:
  display_name: parametric freeform surfacing
  short_description: Create, reconstruct, fair, parameterize, validate, and FDM-prepare
    smooth aesthetic curves and freeform product envelopes using B-splines/NURBS,
    section lofts, SubD, free-form deformation, morph targets, and local SDF blends.
    Use when a new shoe, vessel, vehicle body, enclosure, furniture part, or decorative
    product looks boxy or faceted; when hardpoints must remain exact while the visible
    shell becomes organic; or when an AI/scan reference must become an editable parametric
    surface rather than remain a dense mesh.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
