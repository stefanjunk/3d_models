tests:
  - id: source-run
    stage: V0
    action: Generate STEP and print-oriented STL files.
    pass: All exports complete and parameter assertions hold.
  - id: mesh
    stage: V1
    action: Validate each STL as one watertight volume.
    pass: validate_mesh.py passes.
  - id: fit-coupon
    stage: V4
    action: Print a small drawer-wall clearance coupon at 0.20, 0.30, 0.35, 0.40, and 0.50 mm per side.
    pass: Select the smallest repeatable nonbinding clearance.
  - id: subassembly
    stage: V5
    action: Assemble lower body, upper tray, pins, and drawers.
    pass: Parts seat without cracking; drawers move through full travel.
  - id: anti-tip
    stage: V6
    action: Load one drawer and extend it fully on representative desk surface.
    pass: No tip-over under specified content envelope.
