material: PLA or PLA+ for easiest detail; PETG for more impact toughness after bridge calibration
nozzle_mm: 0.4
layer_height_mm: 0.20
line_width_mm: 0.45
perimeters: 3
bottom_layers: 5
top_layers: 5
infill_percent: 12
infill_pattern: gyroid
orientation: integrated tray and tower bases on bed, tower vertical
supports: disabled initially; inspect ramps and front engraving in slicer
notes:
  - A 0.6 mm nozzle can be used by increasing wall/ramp thickness and engraving dimensions.
  - Slow external walls improve engraving definition.
  - Add thin felt only after confirming adhesive compatibility and dice clearance.
