project:
  id: calibration-coupons
  revision: 1.0.0
  owner: example
function:
  summary: Isolate fit, thin-wall, engraving, and bridge uncertainty for a specific printer/material/nozzle/profile.
  users: [designer, printer-operator]
  interfaces: [measurement-tools, test-pins]
risk:
  class: decorative
  hazards: [hot-nozzle-during-print]
  assumptions: [Coupons are not material certification specimens.]
fabrication:
  preference: integrated-print
  assembly_target: none
  repairability: not-applicable
printer:
  model: generic-fdm
  build_volume_mm: [250, 250, 250]
  enclosure: false
manufacturing:
  process: fdm-fff
  material: user-selected
  nozzle_mm: 0.6
  layer_height_mm: 0.30
  target_formats: [stl]
dimensions:
  units: mm
  envelope_mm: [180, 180, 25]
loads: []
environment:
  indoor_outdoor: indoor
  temperature_c: [10, 35]
  moisture: normal
  uv: none
purchased_parts:
  - {item: caliper, purpose: dimensional measurement}
  - {item: nominal-test-pin-or-drill-shank, purpose: fit comparison}
acceptance:
  - id: measured
    criterion: Every tested feature has a recorded dimension/observation and profile identity.
    method: test-result record
  - id: applied
    criterion: Selected values are copied into the target project's parameter/profile files.
    method: design review
test_plan: README.md
outputs:
  source: model.scad
  exports: generated/
  validation: generated/
