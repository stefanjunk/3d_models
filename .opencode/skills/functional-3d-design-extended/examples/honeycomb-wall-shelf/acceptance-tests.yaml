tests:
  - id: source-run
    stage: V0
    action: Run model.py with default and boundary parameter sets.
    pass: All intended sets export without exceptions.
  - id: mesh
    stage: V1
    action: Validate each STL as watertight and one body.
    pass: validate_mesh.py returns passed true.
  - id: keyhole-coupon
    stage: V4
    action: Print the coupon in the same orientation/material/profile and test the actual screw.
    pass: Entry, downward seating, retention, and removal work without cracks.
  - id: module-proof
    stage: V6
    action: Mount to representative substrate with selected hardware and progressively proof-load behind a barrier.
    pass: User-defined deflection and damage limits are satisfied.
  - id: creep
    stage: V6
    action: Hold working load for a defined duration and inspect/measure.
    pass: No progressive deformation, slot damage, or anchor movement beyond limit.
