material: PETG or ASA when outdoor exposure is intended and the printer supports it
nozzle_mm: 0.6
layer_height_mm: 0.30
line_width_mm: 0.68
perimeters: 5
bottom_layers: 6
top_layers: 6
infill_percent: 18
infill_pattern: gyroid-or-cubic
orientation: back panel on build plate; open display face upward
supports: none expected for default geometry
notes:
  - Calibrate keyhole fit with the supplied coupon.
  - Use perimeter count and local mount pads rather than relying on infill for screw bearing.
  - Actual temperatures, cooling, speeds, and flow come from the exact filament profile.
