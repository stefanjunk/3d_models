project:
  id: replace-me
  revision: 0.1.0
  owner: unknown
function:
  summary: Describe what the part must do.
  users: []
  interfaces: []
risk:
  class: normal-functional
  hazards: []
  assumptions: []
fabrication:
  preference: balanced-hybrid
  assembly_target: low
  repairability: preferred
printer:
  model: unknown
  build_volume_mm: [250, 250, 250]
  enclosure: false
manufacturing:
  process: fdm-fff
  material: petg
  nozzle_mm: 0.6
  layer_height_mm: 0.3
  target_formats: [step, 3mf, stl]
dimensions:
  units: mm
  envelope_mm: [100, 100, 100]
loads: []
environment:
  indoor_outdoor: indoor
  temperature_c: [10, 35]
  moisture: normal
  uv: none
purchased_parts: []
acceptance:
  - id: geometry-valid
    criterion: Exported manufacturing mesh is watertight with the intended body count.
    method: scripts/validate_mesh.py
  - id: bed-fit
    criterion: Intended orientation fits the configured build volume.
    method: slicer preflight
test_plan: test-plan.yaml
outputs:
  source: source/
  exports: exports/
  validation: validation/
