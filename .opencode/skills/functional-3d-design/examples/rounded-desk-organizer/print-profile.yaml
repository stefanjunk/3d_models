material: PLA+ for easy indoor print, PETG for more impact/temperature margin, ASA only with enclosure
nozzle_mm: 0.6
layer_height_mm: 0.30
line_width_mm: 0.68
perimeters: 3
bottom_layers: 5
top_layers: 5
infill_percent: 12
infill_pattern: gyroid-or-cubic
orientations:
  lower-carcass-print.stl: back panel on bed, drawer openings upward
  upper-tray-print.stl: flat bottom on bed
  drawers: drawer base on bed
  alignment-pin: vertical; print four plus spares
supports: generally none for defaults; confirm finger-scoop and pin geometry in slicer
notes:
  - Calibrate drawer clearance on the exact printer/material/nozzle.
  - Felt or rubber feet improve desk grip without complicating the printed geometry.
