project_id: replace-me
revision: 0.1.0
tests:
  - id: mesh-validation
    level: V1
    specimen: final-export
    setup: Run validate_mesh.py with intended body-count and bed limits.
    measurement: JSON report
    pass: All configured checks pass.
  - id: slicer-review
    level: V2
    specimen: final-export
    setup: Slice with exact printer/material/nozzle profile.
    measurement: Visual layer review and profile record.
    pass: No missing walls, trapped supports, unintended bridges, or bed collision.
  - id: physical-prototype
    level: V5
    specimen: final-assembly
    setup: Define application-specific fixture and safe procedure.
    measurement: Dimensions, function, deformation, failure mode.
    pass: Link to acceptance criteria.
