project: decorative-dice-tower
units: mm
source_mesh: source/dice-tower-shell.stl
operation: cavity-and-insert
coordinate_system:
  origin_mm: [0, 0, 0]
  x_axis: right
  y_axis: courtyard-forward
  z_axis: tower-up
functional_roi:
  type: cylinder
  center_mm: [0, 0, 70]
  radius_mm: 39
  height_mm: 145
  axis: z
transition_band_mm: 1.5
protected_region:
  rule: outside_roi_plus_transition
  max_surface_deviation_mm: 0.15
  p95_surface_deviation_mm: 0.08
keep_out_regions:
  - description: exterior relief and courtyard floor
functional_geometry:
  source: functional_parts.py
  master_format: STEP
  handoff_mesh_tolerance_mm: 0.08
boolean:
  operation: difference_then_separate_insert
  engine_preference: [manifold, blender]
  overshoot_mm: 0.3
printing:
  process: FDM
  nozzle_mm: 0.4
  layer_height_mm: 0.2
  minimum_wall_mm: 2.4
acceptance:
  require_watertight: true
  expected_body_count: 1
  preserve_protected_surface: true
  manual_section_review: true
  slicer_preview_review: true
