tests:
  - id: topology
    method: inspect_mesh
    pass: watertight and positive_volume and expected_body_count
  - id: protected-surface
    method: validate_edit
    pass: p95 and maximum deviation within plan limits
  - id: cross-sections
    method: section_report plus visual review
    pass: no unintended membranes, slivers, or blocked passages
  - id: interface-coupon
    method: physical print
    pass: assembly clearance and retention meet design values
  - id: full-function
    method: repeated physical use
    pass: project-specific cycle and load criteria
