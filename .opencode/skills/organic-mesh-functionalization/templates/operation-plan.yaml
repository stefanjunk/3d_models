project: organic-functional-edit
units: mm
source_mesh: source/original.stl
source_hash_sha256: null
risk_class: normal-functional
operation: cavity-and-insert
coordinate_system:
  origin_mm: [0, 0, 0]
  x_axis: right
  y_axis: forward
  z_axis: up
  transform_file: transforms/source-to-project.json
functional_roi:
  type: box
  center_mm: [0, 0, 0]
  size_mm: [50, 50, 50]
transition_band_mm: 2.0
protected_region:
  rule: outside_roi_plus_transition
  max_surface_deviation_mm: 0.20
  p95_surface_deviation_mm: 0.10
keep_out_regions: []
functional_geometry:
  source: source/functional_part.py
  master_format: STEP
  handoff_mesh_tolerance_mm: 0.08
boolean:
  operation: difference_then_union
  engine_preference: [manifold, blender]
  overshoot_mm: 0.20
  permit_voxel_fallback: true
  voxel_fallback_mm: 0.35
printing:
  process: FDM
  nozzle_mm: 0.4
  layer_height_mm: 0.2
  minimum_wall_mm: 1.2
acceptance:
  require_watertight: true
  expected_body_count: 1
  preserve_protected_surface: true
  manual_section_review: true
  slicer_preview_review: true
