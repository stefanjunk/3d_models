  revision: "0.1.0"
  target_use: "FDM-Prototyp eines alltagstauglichen Minimal-/Barfussschuhs; zwei Konstruktionsvarianten"
  target_size_mm: {x: 277.0, y: 118.5, z: 66.0}
  coordinate_system:
    origin: "Mitte der Zehenkante auf der Bauplatte"
    x_axis: "Zehe nach Ferse"
    y_axis: "quer über den Fuß"
    z_axis: "Bauplatte nach oben"

