schema_version: 1
project:
  name: flapping-submarine-fish-ribs
  units: mm
  product_family: articulated-aquatic-toy
  language: de
  manufacturing: fdm-fff
  risk_class: normal-functional

intent:
  visual_language:
    keywords: [fish-like, streamlined, longitudinal-ribs, restrained]
    forbidden_characteristics: [boxy, faceted, scale-texture, arbitrary-waves]
  symmetry: bilateral
  visible_surfaces: [nose, articulated-segment-shells, capsule-upper-and-side-shell]
  reference_role: none
  reference_provenance: []

semantic_parameters:
  - name: rib_count
    value: 5
    min: 3
    max: 7
    unit: count
    affects: [rib-angle-family, visible-envelope]
  - name: rib_peak_radius
    value: 1.40
    min: 1.00
    max: 2.00
    unit: mm
    affects: [rib-sections, silhouette]
  - name: rib_end_radius
    value: 0.80
    min: 0.65
    max: 1.20
    unit: mm
    affects: [rib-end-blends, manufacturing-splits]
  - name: rib_overlap
    value: 0.65
    min: 0.40
    max: 0.90
    unit: mm
    affects: [rib-root, connected-topology]
  - name: dorsal_scale
    value: 1.15
    min: 1.00
    max: 1.35
    unit: ratio
    affects: [top-silhouette]
  - name: lateral_scale
    value: 0.90
    min: 0.80
    max: 1.00
    unit: ratio
    affects: [side-silhouette, print-overhang]

hardpoints:
  tolerance_mm: 0.10
  datum_planes: [global-XY, global-XZ, global-YZ]
  points: [nose-bladder-axis, capsule-cap-seat, motor-shaft-exit]
  axes: [five-vertical-hinge-axes, motor-shaft-X, rocker-pivot-X]
  protected_faces: [bayonet-seat, o-ring-glands, hinge-bores, motor-cradle, keel-plug-thread]
  keep_out_volumes: [joint-sweep-volumes, cap-removal-volume, keel, rear-drive-sweep, bladder-knob-travel]

surface_strategy:
  primary: bspline-loft
  continuity_default: G2
  intentional_creases: [raised-rib-root]
  section_count_target: 4
  controls_per_curve_target: 4
  closed_section_seam_landmark: top-rib

reference_fitting:
  enabled: false
  target_file: null
  fit_region: null
  maximum_rms_error_mm: 1.0
  maximum_local_error_mm: 2.0
  preserve_target_noise: false

fdm:
  printer_build_volume_mm: [220.0, 220.0, 250.0]
  nozzle_mm: 0.4
  layer_height_range_mm: [0.12, 0.24]
  intended_orientation: existing-per-part-orientations
  visible_orientation_sensitive_regions: [nose-dome, dorsal-rib, lateral-ribs]
  minimum_wall_mm: 1.20
  maximum_overhang_deg_from_vertical: 50.0
  mesh_export:
    chord_tolerance_mm: 0.08
    angular_tolerance_deg: 4.0
    maximum_edge_mm: 1.5

acceptance:
  hardpoint_drift_mm_max: 0.10
  watertight_when_solid: true
  connected_components_expected: 1
  degenerate_face_count_max: 0
  curvature_spikes_allowed: 0
  unexplained_curvature_extrema_per_primary_curve_max: 4
  self_intersections_allowed: false
  minimum_signed_volume_mm3: 1.0
  slicer_review_required: true
  physical_coupon_required: false

outputs:
  editable_source_required: true
  step_required: false
  obj_required: false
  stl_or_3mf_required: true
  reports_required: true
