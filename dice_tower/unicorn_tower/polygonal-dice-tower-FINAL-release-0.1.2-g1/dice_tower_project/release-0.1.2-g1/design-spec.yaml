  build_volume_mm: [420, 420, 500]
  enclosure: false

manufacturing:
  process: fdm-fff
  material: PLA-or-PLA-plus
  nozzle_mm: 0.4
  layer_height_mm: 0.2
  preferred_orientation: original base flat on build plate; tower vertical
  target_formats: [stl, parameterized-source, validation-reports]

