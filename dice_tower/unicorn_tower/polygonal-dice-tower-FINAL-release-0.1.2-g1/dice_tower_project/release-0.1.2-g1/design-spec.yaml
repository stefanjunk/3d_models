requirement_sources:
  user_stated:
    - Preserve and functionalize the supplied decorative outer shell.
    - Hollow the upright tower while keeping the floor closed.
    - Cut an internal cylindrical volume for a spiral stair path.
    - Add the spiral stair path so dice tumble downward.
    - Add a rear upper roof opening for inserting dice.
    - Add a lower opening from the tower into the front forecourt.
    - Do not breach or unacceptably thin the decorative side walls.
    - Preserve the roof horn; do not let the inlet cut remove it.
    - Place the inlet diagonally at the rear-upper roof and use a short clean channel.
    - Preserve the rear wall outside the inlet opening.
    - Use a clean rounded front outlet or a short channel rather than a ragged cut.
    - Reduce the central cylinder and use only a few fall stages.
    - Shorten the visible upper inlet tube so it sits closer to the roof.
    - Shorten the visible lower outlet channel so it sits closer to the tower.
  inferred:
    - Source semantic axes are +Y up, +Z front, and +X right.
    - The protruding disc at low source Y and positive source Z is the forecourt.
    - The object is intended as a one-piece indoor FDM dice tower.
    - The known target printer is an Anycubic Kobra 3 Max.
  recommended:
    - Uniformly scale the normalized source to 220 mm total height.
    - Support dice whose maximum physical envelope is 25 mm.
    - Use staggered, rotated spiral baffles with self-supporting undersides rather than a continuous unsupported helix.
    - Use a 0.4 mm nozzle, 0.20 mm layers, and PLA/PLA+ as the baseline process.
    - Preserve at least 3.2 mm structural wall and target at least 3.5 mm around the cylindrical cavity.
  resolved_by_requirements_approval:
    - Approved the recommended 220 mm overall height.
    - Approved the recommended 25 mm maximum die envelope.
    - Approved the one-piece, supportless spiral-baffle interpretation.

function:
  summary: >-
    Accept a die through the rear roof opening, route it through a spiral sequence
    of internal impact surfaces, and discharge it through the lower front portal
    into the existing forecourt without allowing escape through the floor or walls.
  users:
    - tabletop-game users
  interfaces:
    - 45-degree rear-upper round insertion channel
    - lower front rounded arch channel into forecourt
    - print-bed-facing closed underside
  largest_die_envelope_mm: 25.0
  minimum_free_path_mm: 32.0

risk:
  class: normal-functional
  hazards:
    - dice jam inside an inaccessible cavity
    - wall breach or weak portal edge
    - trapped support material
    - sharp cut edges
  assumptions:
    - indoor decorative tabletop use
    - no children-under-three or food-contact claim
    - no impact loads beyond repeatedly dropped gaming dice

fabrication:
  preference: integrated-print
  assembly_target: one printed body
  repairability: limited
  support_policy: no trapped internal supports

printer:
