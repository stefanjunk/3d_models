acceptance:
  - id: source-preserved
    criterion: Uploaded source bytes and checksum remain unchanged.
    method: sha256 comparison
  - id: geometry-valid
    criterion: Manufacturing mesh is one intended watertight positive-volume body with consistent winding.
    method: independent topology inspection
  - id: exterior-preserved
    criterion: Exterior outside approved ROIs is unchanged within 0.20 mm p95 and 1.00 mm maximum.
    method: sampled source/result surface comparison
  - id: wall-reserve
    criterion: Finished structural walls and floor are at least 3.2 mm; target cylindrical shell reserve is at least 3.5 mm.
    method: section sampling and ray/distance checks
  - id: dice-path
    criterion: A 25 mm clearance body passes from entry to forecourt with at least 32 mm specified free openings and no trapped pockets.
    method: swept/rigid-body clearance check plus physical drop test
  - id: support-access
    criterion: No inaccessible internal support material is required in the preferred orientation.
    method: overhang analysis and slicer preview
  - id: bed-fit
    criterion: Proposed 149.555 x 152.077 mm footprint fits the configured printer bed.
    method: bounds check
  - id: watermark-release
    criterion: Exact JSI-WM-001-R1 mark is recessed, readable, structurally safe, and explicitly approved on current geometry.
    method: watermark release gate

test_plan:
  digital:
    - topology and component count
    - outside-ROI change comparison
    - full-height wall-thickness sections
    - 25 mm clearance-body path analysis
    - overhang and trapped-support review
    - slicer dry run
  physical:
    - ten drops each with D6, D12, and D20 at or below the approved envelope
    - acceptance is zero jams, zero rebounds through the entry, and all dice reaching the forecourt

