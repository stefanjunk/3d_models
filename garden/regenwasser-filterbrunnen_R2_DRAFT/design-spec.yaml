maintenance:
  target:
    value: Werkzeugloser Ausbau aller Filtereinsaetze von oben; Gehaeusefugen mit Handgriffen loesbar
    provenance: recommended
  cleaning:
    - Wirbelschlammfang nach sichtbarer Fuellung leeren
    - Lamellenkassette herausziehen und abspritzen
    - Filtermedien einzeln entnehmen, waschen oder ersetzen
  service_life_target_years:
    value: 3
    provenance: recommended
    evidence_status: requires-field-test

appearance:
  form_language:
    value: Technische Wasserreinigungsskulptur mit offen ablesbarem Wasserweg
    provenance: inferred
  visibility:
    value: Offene Einblicke und sichtbare Ueberlaeufe statt behaupteter transparenter FDM-Waende
    provenance: recommended
  color:
    value: Funktional frei waehlbar; Konzeptdarstellung in Anthrazit mit kontrastierenden Wasserwegen
    provenance: recommended

acceptance_criteria:
  - id: AC-01
    criterion: Jedes Einzelteil passt mit mindestens 5 mm Randreserve in 420 x 420 x 500 mm Bauraum.
    test: CAD-Huellkoerperpruefung und Slicer-Dry-Run
  - id: AC-02
    criterion: Der montierte Stapel steht auf ebener Flaeche kippsicher und Module koennen sich nicht unbeabsichtigt verdrehen oder abheben.
    test: Montagepruefung und Kipppruefung im leeren sowie gefuellten Zustand
  - id: AC-03
    criterion: 800 L/h laufen ohne Rueckstau oder unkontrolliertes Ueberlaufen durch alle drei Stufen.
    test: 30-min-Wassertest, danach Test mit teilweise zugesetzter Feinfiltermatte
  - id: AC-04
    criterion: Keine sichtbare Leckage an Schlauch- und Ablassanschluessen bei 1.2 m statischer Wassersaeule.
    test: 60-min-Dichtheitstest
  - id: AC-05
    criterion: Alle Schmutz- und Filtereinsatzteile sind ohne Zerstoerung und mit maximal einem Handwerkzeug entnehmbar.
    test: Wartungsdurchlauf und dokumentierte Demontagezeit
  - id: AC-06
    criterion: System ist vollstaendig entleerbar; keine geschlossenen Frosttaschen groesser als 5 ml.
    test: CAD-Schnittpruefung und Entleerungstest
  - id: AC-07
    criterion: Das System verbessert sichtbar die Partikelfracht, ohne eine hygienische Freigabe zu behaupten.
    test: Vorher-/Nachher-Proben mit Truebungs- oder Sedimentvergleich; Poolchemie separat pruefen

acceptance:
  - id: AC-01
    criterion: Jedes Einzelteil passt mit mindestens 5 mm Randreserve in 420 x 420 x 500 mm Bauraum.
  - id: AC-02
    criterion: Der montierte Stapel steht kippsicher und die Module sind gegen unbeabsichtigtes Verdrehen oder Abheben gesichert.
  - id: AC-03
    criterion: 800 L/h laufen ohne Rueckstau oder unkontrolliertes Ueberlaufen durch alle drei Stufen.
  - id: AC-04
    criterion: An Schlauch- und Ablassanschluessen tritt bei 1.2 m statischer Wassersaeule keine sichtbare Leckage auf.
  - id: AC-05
    criterion: Alle Schmutz- und Filtereinsatzteile sind ohne Zerstoerung und mit maximal einem Handwerkzeug entnehmbar.
  - id: AC-06
    criterion: Das System ist vollstaendig entleerbar und enthaelt keine geschlossenen Frosttaschen groesser als 5 ml.
  - id: AC-07
    criterion: Die sichtbare Partikelfracht wird reduziert, ohne eine hygienische Freigabe zu behaupten.

