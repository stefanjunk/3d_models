    provenance: user-stated
  - id: D-002
    date: 2026-08-11
    decision: Zulauf ueber austauschbaren Anschluss fuer 25-mm-Schlauch.
    provenance: user-stated
  - id: D-003
    date: 2026-08-11
    decision: Kaskadenauslauf mit optionalem Schlauchruecklauf.
    provenance: user-stated
  - id: D-004
    date: 2026-08-11
    decision: Gehaeuse und Druckteile aus UV-stabilisiertem PETG.
    provenance: user-stated
  - id: D-005
    date: 2026-08-11
    decision: Anforderungen Revision 2 wurden ausdruecklich freigegeben; Konzept-Gate ist zur Pruefung geoeffnet.
    provenance: user-stated
  - id: D-006
    date: 2026-08-11
    decision: Konzept Revision 2 wurde ausdruecklich freigegeben; Produktions-CAD darf beginnen.
    provenance: user-stated
  - id: D-007
    date: 2026-08-11
    decision: >-
      Der parametrische Master wird mit Replicad/OpenCascade erzeugt, weil die
      verfuegbare Laufzeit keinen CadQuery-Interpreter enthaelt. STEP und STL
      bleiben neutrale Exporte; Geometrie, Schnittstellen und Druckprozess der
      freigegebenen Revision 2 bleiben unveraendert.
    provenance: implementation
  - id: D-008
    date: 2026-08-11
    decision: Drei M6-Verbindungen je Modulfuge statt gedruckter Schnapphaken.
    provenance: recommended
  - id: D-009
    date: 2026-08-11
    decision: Vier optionale 9-mm-Bohrungen im Standflansch fuer eine M8-Kippsicherung.
    provenance: recommended
  - id: D-010
    date: 2026-08-11
    decision: Kaskade und optionaler Auslauf werden mit dem Montageflansch auf dem Bett exportiert.
    provenance: implementation
  - id: D-011
    date: 2026-08-11
    decision: >-
      JuSt-Asset JSI-WM-001-R1 kompakt, 1.5-fach und 0.40 mm tief wird auf
      allen drei Primargehaeuse-Unterseiten verwendet.
    provenance: recommended
  - id: D-012
    date: 2026-08-11
    decision: >-
      Status bleibt DRAFT, bis Slicer-Toolpaths und physische Pass-, Dichtheits-,
      Durchfluss-, Ueberlauf- und Standpruefungen vorliegen.
