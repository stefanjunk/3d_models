function:
  value: >-
    Partikelhaltiges Regenwasser bei 800 L/h durch Wirbelabscheidung,
    Lamellensedimentation und drei sequenzielle mechanische Filtermedien
    drucklos fuer die anschliessende Einleitung in den Pool vorfiltern.
  provenance: user-stated

risk:
  class: normal-functional
  class_provenance: recommended
  boundaries:
    - value: Das System ist ein druckloser mechanischer Vorfilter, kein Druckbehaelter.
      provenance: recommended
    - value: Keine Zusage zur mikrobiologischen oder chemischen Trinkwasserqualitaet.
      provenance: recommended
    - value: Pooldesinfektion, pH-Regelung und uebliche Poolfiltration bleiben erforderlich.
      provenance: recommended
    - value: Dachablaufwasser soll vor dem System einen Laubfang und First-Flush-Abscheider durchlaufen.
      provenance: recommended

functional_scope:
  included:
    - value: Drei separat druckbare und uebereinander stapelbare Filtermodule.
      provenance: user-stated
    - value: Stufe 1 als langsamer Vortex-/Wirbelabscheider mit tangentialem Zulauf.
      provenance: user-stated
    - value: Stufe 2 als Absetzstufe mit herausnehmbarer Lamellenkassette.
      provenance: user-stated
    - value: Stufe 3 als Durchlauffilter mit von oben entnehmbaren Medienkoerben.
      provenance: user-stated
    - value: Wasseruebergabe von Stufe zu Stufe durch Schwerkraft.
      provenance: user-stated
    - value: Sichtbarer, reinigbarer Schmutzfang in Wirbel- und Lamellenstufe.
      provenance: inferred
    - value: Notueberlauf gegen unkontrolliertes Ueberlaufen bei zugesetztem Filter.
      provenance: recommended
  excluded:
    - value: Aktiver Hochdruck-Hydrozyklon oder motorisierte Zentrifuge.
      provenance: user-stated
    - value: Biologischer Langsamsandfilter.
      provenance: user-stated
    - value: Vollstaendige Entfernung geloester Metalle, Salze oder organischer Chemikalien.
      provenance: user-stated

hydraulics:
  operating_mode:
    value: Oben gepumpter Zulauf, danach offene drucklose Schwerkraftkaskade zum Pool.
    provenance: user-stated
    status: confirmed
  design_flow_lph:
    value: 800
    adjustable_range: [400, 1200]
    provenance: user-stated
    status: confirmed
    rationale: >-
      Der begrenzte Teilstrom erhoeht Absetzzeit und Filterstandzeit; eine groessere
      vorhandene Pumpe wird ueber Ventil oder Bypass gedrosselt.
  inlet_interface:
    value: Austauschbare Schlauchtuelle fuer 25 mm Schlauch-Nennweite, angenommen Innen-Ø
    provenance: user-stated
    status: confirmed-with-measurement
    verification: Schlauch-Innen-Ø messen und Passcoupon drucken, bevor das Vollmodul gefertigt wird.
  outlet_mode:
    value: Sichtbare Kaskade in den Pool mit austauschbarem optionalem 25-mm-Schlauchanschluss
    provenance: user-stated
    status: confirmed
  max_static_head_m:
    value: 1.2
    provenance: recommended
  pressurized_operation_allowed:
    value: false
    provenance: recommended

geometry:
  coordinate_convention:
    value: Z nach oben; Wasserfluss im Stapel von oben nach unten
    provenance: recommended
  module_envelope_mm:
    max_x: 330
    max_y: 330
    max_z: 300
    provenance: recommended
  assembled_envelope_mm:
    diameter: 330
    height_target: 850
    height_max: 1000
    provenance: recommended
    built_height: 816
    installed_footprint_with_cascade: [330, 406]
  stage_1_vortex:
    nominal_diameter_mm: 300
    features:
      - tangentialer Zulauf
      - beruhigter zentraler Klarwasserabzug
      - konischer Schlammfang
      - herausnehmbarer Schmutzbecher oder Ablass
  stage_2_lamella:
    nominal_diameter_mm: 300
    plate_angle_deg: 60
    plate_gap_mm: 12
    plate_count_target: 12
    features:
      - Bodenzulauf mit Stroemungsdiffusor
      - nach oben gerichtete Stroemung durch Kassette
      - oberer Sammelring zum naechsten Modul
      - unterer Sedimentraum
  stage_3_media:
    nominal_diameter_mm: 300
    media_sequence:
      - 300-500 um Edelstahl- oder Kunststoffnetz
      - grobe waschbare Filtermatte
      - 50-100 um Feinfiltermatte, nur mit Ueberlaufanzeige
    features:
      - drei separat entnehmbare Koerbe
      - Verteilerplatte gegen Kanalbildung
      - Reinwassersammelraum
      - vier optionale 9-mm-Bohrungen fuer eine untergrundspezifische M8-Kippsicherung
  stacking_interface:
    value: Zentrierbund plus spritzgeschuetzte Ueberlappung; drei mechanische Sicherungen je Fuge
    provenance: recommended
  watertightness_strategy:
    value: Drucklose Wasserfuehrung; EPDM-Flachdichtungen nur an Ablass- und Schlauchanschluessen
    provenance: recommended

environment:
  location:
    value: Aussenbereich am privaten Pool
    provenance: user-stated
  exposure:
    water: continuous_wet_during_operation
    uv: outdoor
    chemicals: chlorinated_pool_splash_possible
    temperature_c:
      operating: [5, 40]
      storage: [-10, 50]
    provenance: inferred
  winterization:
    value: Vollstaendig entleerbar und frostfrei lagern oder demontieren
    provenance: recommended

