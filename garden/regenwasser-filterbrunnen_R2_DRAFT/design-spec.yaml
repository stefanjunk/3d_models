    generated_with: built-in-imagegen
    approved_by: user
    approved_at: 2026-08-11T22:09:08+02:00
    visual_ambiguity: >-
      Das Konzeptbild ist eine nicht masshaltige Produktvisualisierung. Die im
      Schnitt vereinfacht gezeichneten zentralen Uebergabepfeile sind nicht
