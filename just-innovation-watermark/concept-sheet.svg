<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1423"/>
      <stop offset="1" stop-color="#121f32"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7ebee"/>
      <stop offset="1" stop-color="#b8c1c8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#03070d" flood-opacity="0.28"/>
    </filter>
    <filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="1.8" flood-color="#111923" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#dce3e8" stroke-width="1" opacity="0.7"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ef8a2f"/>
    </marker>
    <symbol id="js-mark" viewBox="0 0 115.47 100">
      <path d="M31 4H84.47L111.47 50L84.47 96H31L4 50Z"
            fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
      <path d="M26 27H51V61Q51 76 38 76H35Q23 76 23 65"
            fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M88 28H70Q59 28 59 39Q59 49 70 49H77Q89 49 89 62Q89 76 76 76H58"
            fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <style>
      .title { font-family: 'DejaVu Sans', sans-serif; font-weight: 800; }
      .body { font-family: 'DejaVu Sans', sans-serif; }
      .caps { font-family: 'DejaVu Sans', sans-serif; font-weight: 700; letter-spacing: 2.2px; }
      .small { font-family: 'DejaVu Sans', sans-serif; font-size: 18px; fill: #647386; }
      .label { font-family: 'DejaVu Sans', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 1.5px; fill: #ef8a2f; }
      .panel-title { font-family: 'DejaVu Sans', sans-serif; font-weight: 800; font-size: 25px; fill: #142033; }
      .guide { fill: none; stroke: #9ba8b5; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>
  <circle cx="1630" cy="95" r="260" fill="#1f9aac" opacity="0.08"/>
  <circle cx="1725" cy="5" r="150" fill="#ef8a2f" opacity="0.10"/>

  <g transform="translate(82 72)">
    <text class="caps" x="0" y="0" font-size="18" fill="#ef8a2f">BEDMARK 01 · CONCEPT REVIEW</text>
    <text class="title" x="0" y="68" font-size="58" fill="#f4f7f9">JuSt Innovation</text>
    <text class="body" x="0" y="108" font-size="23" fill="#9eb0c2">Druckgerechte Markenfamilie für die Druckbettseite · vertieft · einfarbig reproduzierbar</text>
  </g>
  <g transform="translate(1500 80)" color="#f4f7f9">
    <use href="#js-mark" width="150" height="130"/>
  </g>

  <!-- Standard lockup -->
  <g filter="url(#shadow)">
    <rect x="80" y="220" width="1025" height="445" rx="26" fill="#f6f8fa"/>
  </g>
  <g transform="translate(120 260)">
    <text class="label" x="0" y="0">01 · STANDARD-LOCKUP</text>
    <text class="panel-title" x="0" y="42">Monogramm + vollständige Wortmarke</text>
    <text class="small" x="0" y="73">Außenmaß 32 × max. 10 mm · Leseseite: fertige Unterseite</text>

    <g transform="translate(22 115)">
      <rect x="0" y="0" width="768" height="240" rx="14" fill="#ffffff" stroke="#dbe2e8" stroke-width="2"/>
      <rect x="20" y="20" width="728" height="200" rx="8" class="guide"/>
      <g transform="translate(44 55)" color="#142033">
        <use href="#js-mark" width="150" height="130"/>
      </g>
      <g transform="translate(224 61)">
        <text class="title" x="0" y="54" font-size="58">
          <tspan fill="#ef8a2f">J</tspan><tspan fill="#142033">u</tspan><tspan fill="#ef8a2f">S</tspan><tspan fill="#142033">t</tspan>
        </text>
        <text class="caps" x="2" y="91" font-size="23" letter-spacing="4.2" fill="#142033">INNOVATION</text>
        <line x1="2" y1="108" x2="385" y2="108" stroke="#1f9aac" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g transform="translate(608 170)">
        <rect x="0" y="0" width="118" height="30" rx="15" fill="#e8eef2"/>
        <text class="caps" x="59" y="21" text-anchor="middle" font-size="12" letter-spacing="1.1" fill="#536273">MONO CUT</text>
      </g>
    </g>
    <g transform="translate(820 135)">
      <rect width="135" height="50" rx="25" fill="#142033"/>
      <text class="caps" x="67.5" y="32" text-anchor="middle" font-size="14" letter-spacing="1.2" fill="#ffffff">0.40 mm</text>
      <text class="small" x="67.5" y="76" text-anchor="middle" font-size="15">Vertiefung</text>
      <rect y="110" width="135" height="50" rx="25" fill="#1f9aac"/>
      <text class="caps" x="67.5" y="142" text-anchor="middle" font-size="14" letter-spacing="1.2" fill="#ffffff">≥ 0.80 mm</text>
      <text class="small" x="67.5" y="186" text-anchor="middle" font-size="15">Strichbreite</text>
    </g>
  </g>

  <!-- Compact symbol / simulated underside -->
  <g filter="url(#shadow)">
    <rect x="1135" y="220" width="585" height="445" rx="26" fill="#f6f8fa"/>
  </g>
  <g transform="translate(1175 260)">
    <text class="label" x="0" y="0">02 · KOMPAKTZEICHEN</text>
    <text class="panel-title" x="0" y="42">JS im Technik-Hexagon</text>
    <text class="small" x="0" y="73">10 mm Schlüsselweite · für kleine Druckteile</text>
    <g transform="translate(38 112)" color="#142033">
      <use href="#js-mark" width="242" height="210"/>
    </g>
    <line x1="38" y1="348" x2="280" y2="348" stroke="#ef8a2f" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text class="caps" x="159" y="380" text-anchor="middle" font-size="16" letter-spacing="1.4" fill="#142033">10 mm AF</text>

    <g transform="translate(330 125)">
      <path d="M0 48L133 0L205 55L72 104Z" fill="url(#plate)"/>
      <path d="M72 104L205 55V136L72 185Z" fill="#8e9ba5"/>
      <path d="M0 48L72 104V185L0 129Z" fill="#a9b3ba"/>
      <g transform="translate(57 27) skewY(22) scale(.82 .52)" color="#65727b" filter="url(#inner)">
        <use href="#js-mark" width="150" height="130"/>
      </g>
      <text class="caps" x="104" y="226" text-anchor="middle" font-size="13" letter-spacing="1.1" fill="#536273">FERTIGE UNTERSEITE</text>
    </g>
  </g>

  <!-- Brand logic and variants -->
  <g filter="url(#shadow)">
    <rect x="80" y="700" width="680" height="420" rx="26" fill="#f6f8fa"/>
  </g>
  <g transform="translate(120 740)">
    <text class="label" x="0" y="0">03 · MARKENLOGIK</text>
    <text class="panel-title" x="0" y="42">Wiedererkennbar in drei Größen</text>
    <text class="small" x="0" y="73">Hexagon konstant · Text und Code werden</text>
    <text class="small" x="0" y="96">abhängig von der verfügbaren Fläche zugeschaltet.</text>

    <g transform="translate(8 122)">
      <rect width="600" height="74" rx="15" fill="#ffffff" stroke="#dbe2e8"/>
      <g transform="translate(18 9)" color="#142033"><use href="#js-mark" width="65" height="56"/></g>
      <text class="caps" x="105" y="34" font-size="17" fill="#142033">COMPACT</text>
      <text class="small" x="105" y="56" font-size="14">Nur JS · ab 10 mm AF</text>
    </g>
    <g transform="translate(8 210)">
      <rect width="600" height="74" rx="15" fill="#ffffff" stroke="#dbe2e8"/>
      <g transform="translate(18 9)" color="#142033"><use href="#js-mark" width="65" height="56"/></g>
      <text class="title" x="102" y="33" font-size="25" fill="#142033">JuSt</text>
      <text class="caps" x="103" y="54" font-size="10" letter-spacing="2" fill="#142033">INNOVATION</text>
      <text class="small" x="285" y="45" font-size="14">Standard · 32 × 10 mm</text>
    </g>
    <g transform="translate(8 298)">
      <rect width="600" height="74" rx="15" fill="#ffffff" stroke="#dbe2e8"/>
      <g transform="translate(18 9)" color="#142033"><use href="#js-mark" width="65" height="56"/></g>
      <text class="title" x="102" y="33" font-size="25" fill="#142033">JuSt</text>
      <text class="caps" x="103" y="54" font-size="10" letter-spacing="2" fill="#142033">INNOVATION</text>
      <rect x="286" y="20" width="118" height="34" rx="8" fill="#eef2f5"/>
      <text class="caps" x="345" y="42" text-anchor="middle" font-size="11" letter-spacing="1.1" fill="#536273">JSI-26A1</text>
      <text class="small" x="430" y="44" font-size="14">Trace · ab 40 mm</text>
    </g>
  </g>

  <!-- Section -->
  <g filter="url(#shadow)">
    <rect x="790" y="700" width="930" height="420" rx="26" fill="#f6f8fa"/>
  </g>
  <g transform="translate(830 740)">
    <text class="label" x="0" y="0">04 · DRUCKBETT-DETAIL</text>
    <text class="panel-title" x="0" y="42">Vertiefung statt Erhebung</text>
    <text class="small" x="0" y="73">Die Standebene bleibt plan; das Zeichen öffnet sich zur Druckplatte.</text>

    <g transform="translate(10 118)">
      <rect x="0" y="0" width="540" height="220" rx="16" fill="url(#grid)" stroke="#dbe2e8"/>
      <path d="M52 44H488V168H350V126H196V168H52Z" fill="#1f9aac" opacity="0.90"/>
      <line x1="35" y1="168" x2="505" y2="168" stroke="#142033" stroke-width="4"/>
      <rect x="35" y="176" width="470" height="18" rx="4" fill="#b9c3ca"/>
      <text class="caps" x="270" y="215" text-anchor="middle" font-size="13" letter-spacing="1.5" fill="#536273">DRUCKPLATTE</text>

      <line x1="370" y1="126" x2="370" y2="168" stroke="#ef8a2f" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <text class="caps" x="390" y="152" font-size="13" letter-spacing="1.0" fill="#ef8a2f">0.40 mm</text>
      <line x1="196" y1="147" x2="350" y2="147" stroke="#f4f7f9" stroke-width="2" stroke-dasharray="7 5"/>
      <text class="body" x="61" y="82" font-size="17" fill="#ffffff">Bauteil</text>
      <text class="body" x="209" y="115" font-size="14" fill="#536273">Markenhohlraum</text>
    </g>

    <g transform="translate(590 112)">
      <rect x="0" y="0" width="260" height="235" rx="18" fill="#142033"/>
      <text class="caps" x="24" y="38" font-size="14" letter-spacing="1.3" fill="#ef8a2f">SOLLWIRKUNG</text>
      <g transform="translate(72 58)" color="#e8edf1">
        <use href="#js-mark" width="116" height="100"/>
      </g>
      <text class="body" x="130" y="184" text-anchor="middle" font-size="16" fill="#e8edf1">lesbar von unten</text>
      <text class="body" x="130" y="210" text-anchor="middle" font-size="14" fill="#94a5b5">keine Geometrie unter Z = 0</text>
    </g>
  </g>

  <text class="body" x="82" y="1160" font-size="16" fill="#7890a5">Konzeptbild · keine Maß- oder Druckfreigabe · Spezifikation JSI-WM-001 rev. 0.1</text>
  <text class="body" x="1718" y="1160" text-anchor="end" font-size="16" fill="#7890a5">JuSt Innovation · 2026-08-10</text>
</svg>
