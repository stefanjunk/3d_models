schema_version: 1.0.0
kind: eval
id: EVAL-core-product-portfolio-preflight-purpose-archive-001
title: Existing product portfolios receive explicit purposes, honest preflight backfills, and conservative version archives
category: core
status: draft
trigger: A product portfolio is bulk-audited, backfilled with preflights, reorganized by version, or extended with a new product boundary.
risk: Products can remain undocumented, retrospective assessments can be mislabeled as prospective, schema validity can be mistaken for release permission, or cleanup can hide/delete active user work and merge independent version lineages.
given:
  repository: A products/<family>/<product> portfolio containing heterogeneous existing artifacts, incomplete root documentation, version-labelled packages, and possibly dirty or untracked work.
  required_artifacts: PURPOSE.md, preflight/preflight-input.yaml, preflight/preflight-result.json, preflight/preflight-report.md, and design-spec.yaml workflow.preflight at every product boundary.
  cleanup_policy: Move only unambiguously older or explicitly legacy entries into product-local archive/; preserve and document ambiguity.
expected:
  - Every discovered product boundary has a non-TODO explicit PURPOSE.md with intended use, scope/release limits, assessed revision, and evidence basis.
  - Every preflight result satisfies the 3d-design-preflight schema, uses RETROSPECTIVE with backfill_missing_preflight, preserves UNKNOWN facts, and cites at least one repository basis reference.
  - Every root design-spec.yaml cross-links the current assessment identity, version, mode, product revision, timestamp, change triggers, and canonical artifact path.
  - HOLD, CONCEPT_ONLY, LOW_UNKNOWN, NOT_AUTONOMOUSLY_RELEASABLE, and Lane D/E remain visible controlling results rather than being treated as document-validation failures or release approval.
  - Every declared archive move has an absent source and present destination, an archive README, and no deletion requirement.
  - Dirty, untracked, ambiguous-current, or independent-component-lineage cases remain outside automatic cleanup and are listed as REVIEW_REQUIRED with their reason.
  - A second generator dry-run reports zero changed files.
failure_conditions:
  - Any product boundary lacks one required document, an explicit purpose, schema-valid traceability, or a matching design-spec link.
  - A retrospective backfill claims PROSPECTIVE mode or reconstructs unsupported dimensions, variants, loads, material/profile facts, or physical validation.
  - A blocked/restricted preflight is summarized as production-releasable merely because the JSON validates.
  - A planned archive source remains outside archive, an archive target is missing, or dirty/untracked ambiguity is silently moved, deleted, ignored, or labelled clean.
  - Re-running the generator would rewrite generated documents without a changed input or declared reassessment trigger.
fixtures:
  - products/PRODUCT-PREFLIGHT-AUDIT-2026-08-31.json
  - tools/backfill_product_preflights.py
  - tools/validate_product_preflight_portfolio.py
  - .agents/skills/3d-design-preflight/schemas/preflight-result.schema.json
grader:
  type: hybrid
  command: python tools/validate_product_preflight_portfolio.py
  expected_exit_code: 0
  rubric: Review the three root exceptions and confirm they preserve rather than hide pre-existing dirty/untracked state; sample at least one R0, one K3, one GO_WITH_CONTROLS, and one archived multi-version product for purpose and gate honesty.
  measurement_method: Deterministic product enumeration, schema and YAML-link validation, archive destination checks, audit reconciliation, and idempotence plus human review of ambiguous-root handling.
relationships:
  lessons:
    - EXP-00048
  regression_suites: []
