schema_version: 1.0.0
kind: eval
id: EVAL-geometry-bounded-analytic-position-codes-001
title: Twenty recessed position codes stay within the two-Boolean-per-position budget
category: geometry
status: draft
trigger: A repeated parametric storage array needs unique recessed identifiers and label Booleans affect regeneration time.
risk: Dense glyph construction can multiply Boolean operands and make deterministic model regeneration impractically slow.
given:
  project: products/organization-storage/mm-org-015-adapter-dongle-drawer-cassette
  positions: 01 through 20
  encoding: one nonzero tens bar plus one nonzero units bar per position
  maximum_cutters_per_position: 2
expected:
  - Positions 01 through 20 produce exactly 29 nonzero analytic bar cutters.
  - The total does not exceed twice the number of positions.
  - The complete generated cassette remains a single watertight positive-volume component.
failure_conditions:
  - Glyph segmentation or another label change increases the analytic cutter count above forty.
  - Any position loses its unique tens/units identity.
  - The label keep-out overlaps a connector keep-out or mesh generation fails.
fixtures:
  - products/organization-storage/mm-org-015-adapter-dongle-drawer-cassette/config/model-parameters.json
  - products/organization-storage/mm-org-015-adapter-dongle-drawer-cassette/tests/test_parameters.py
grader:
  type: deterministic
  command: python3 -m pytest products/organization-storage/mm-org-015-adapter-dongle-drawer-cassette/tests/test_parameters.py::test_position_code_boolean_budget -q
  expected_exit_code: 0
  rubric: null
  measurement_method: Count nonzero tens and units across the declared twenty positions, then retain the existing generated-mesh audit as downstream evidence.
