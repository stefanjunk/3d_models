schema_version: 1.0.0
kind: eval
id: EVAL-geometry-filleted-planar-tessellation-budget-001
title: Fully filleted planar manufacturing meshes remain within their declared triangle budget
category: geometry
status: draft
trigger: A CadQuery/OpenCascade part family with repeated small analytic fillets is tessellated for FDM export.
risk: Excessive mesh density increases artifact size and downstream cost without a demonstrated manufacturing benefit.
given:
  project: products/organization-storage/mm-org-023-page-holder-thumb-tool
  parameter_source: config/model-parameters.json
  mesh_report: validation/mesh-generation-report.json
  triangle_budget_per_part: 60000
expected:
  - Every unique manufacturing mesh contains at most 60,000 triangles.
  - The mesh-generation report remains PASS and the selected 0.10 mm / 0.18 rad tolerance pair is explicit in the parameter source.
failure_conditions:
  - Any unique mesh exceeds 60,000 triangles.
  - The mesh-generation report is not PASS or the tested tolerances are no longer the recorded pair.
fixtures:
  - products/organization-storage/mm-org-023-page-holder-thumb-tool/config/model-parameters.json
  - products/organization-storage/mm-org-023-page-holder-thumb-tool/validation/mesh-generation-report.json
  - products/organization-storage/mm-org-023-page-holder-thumb-tool/tests/test_parameters.py
grader:
  type: deterministic
  command: python3 -m pytest products/organization-storage/mm-org-023-page-holder-thumb-tool/tests/test_parameters.py::test_final_manufacturing_meshes_respect_triangle_budget -q
  expected_exit_code: 0
  rubric: null
  measurement_method: Parse the hash-bound mesh report and parameter source; compare every unique mesh triangle count to the declared hard limit.
