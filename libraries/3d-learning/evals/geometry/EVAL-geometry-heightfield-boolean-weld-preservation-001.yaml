schema_version: 1.0.0
kind: eval
id: EVAL-geometry-heightfield-boolean-weld-preservation-001
title: Height-field Boolean cleanup preserves the certified connected shell
category: geometry
status: draft
trigger: A closed manufacturing mesh produced by a manifold image-relief Boolean has microfacets and a coordinate-weld or simplification step is proposed before serialization or slicing.
risk: A cleanup that reduces diagnostic tiny facets can collapse valid transition triangles, create boundary edges or fragments, and silently turn one printable shell into an open multipart mesh.
given:
  source_mesh: certified Boolean result with recorded topology, bounds, volume, triangle count and physical relief pitch
  proposed_cleanup: exact weld or simplification tolerance plus the faces and vertices it changes
  protected_contract: body count, boundary/nonmanifold edge limits, volume sign, bounds, bed datum, counter/gap topology and geometric-error allowance
expected:
  - The source mesh is audited before cleanup so pre-existing defects are not attributed to the cleanup step.
  - The cleanup tolerance is stated in millimetres and compared with the smallest protected feature and physical relief pitch.
  - The post-cleanup mesh preserves expected body count, watertightness, winding, positive volume, zero boundary/nonmanifold edges, protected bounds and allowed geometric error.
  - Any reduction in degenerate or microfacet count is rejected if it opens the shell, disconnects a component, changes a protected silhouette or exceeds the error budget.
  - When the certified source passes manufacturing topology and the proposed cleanup fails, the unmodified source is retained and the failed cleanup evidence is preserved.
failure_conditions:
  - A decimal-place weld is assumed harmless without a before/after topology and geometric-error report.
  - Fewer degenerate faces are treated as success even though boundary edges, nonmanifold edges, disconnected components or negative volume increase.
  - Cleanup rewrites the manufacturing mesh after its slicer/hash evidence was generated.
  - One topology-preserving cleanup observed for isolated OCC fragments is generalized to a clipped height-field Boolean without an equivalent audit.
