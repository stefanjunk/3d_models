  command: null
  expected_exit_code: 0
  rubric: "Pass only when the retained manufacturing artifact has a successful independent topology audit and the rejected cleanup's before/after metrics are preserved. A physical print is not required for this digital topology eval."
  measurement_method: Exact-coordinate edge incidence, body count, watertightness, winding, volume and bounds before and after the proposed cleanup, plus immutable artifact hashes.
