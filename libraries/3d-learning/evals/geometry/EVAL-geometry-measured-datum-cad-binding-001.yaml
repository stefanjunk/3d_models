schema_version: 1.0.0
kind: eval
id: EVAL-geometry-measured-datum-cad-binding-001
title: Every declared user measurement drives and verifies a named CAD relation
category: geometry
status: draft
trigger: Functional parametric CAD declares user-measured interface or keep-out dimensions.
risk: A value can appear in requirements and parameters while the generated model silently ignores it and therefore does not match the physical interface.
given:
  project: products/printer-workshop/unregistered-kobra3max-purge-catcher/current/anycubic-kobra3max-purge-catcher-r7
  generator: src/generate_r7_z_rider.py
  parameters: params/r7-z-rider-draft2.json
  measured_values_mm: [17.0, 10.0, 37.0, 40.0]
expected:
  - A fresh generator run succeeds in a new temporary output directory.
  - The geometry report contains exactly four measurement-binding records with stable identifiers and non-empty named features.
  - Each binding records equal expected and actual values with zero nominal deviation.
  - Separate checks pass for screw-center pitch, purge-Z capture, throw-X capture center and rear-Y keep-out compliance.
failure_conditions:
  - A measurement exists only in requirements or parameters without a named geometric consumer.
  - Any expected/actual pair differs or a binding is missing.
  - The generator cannot reproduce the report from source in a fresh directory.
fixtures:
  - products/printer-workshop/unregistered-kobra3max-purge-catcher/current/anycubic-kobra3max-purge-catcher-r7/src/generate_r7_z_rider.py
  - products/printer-workshop/unregistered-kobra3max-purge-catcher/current/anycubic-kobra3max-purge-catcher-r7/params/r7-z-rider-draft2.json
