grader:
  type: deterministic
  command: python3 -m unittest products/printer-workshop/unregistered-kobra3max-purge-catcher/current/anycubic-kobra3max-purge-catcher-r7/tests/test_measured_datum_bindings.py -v
  expected_exit_code: 0
  rubric: null
  measurement_method: Regenerate R7-DRAFT-2, load the machine-readable geometry report and compare each expected value, actual relation, deviation and named feature.
