  command: "python products/art-decor/mm-art-010-modular-city-map-wall-panel/source/v0.4.0/berlin/check_candidate_connectivity.py --candidate digital-candidate-r9 --output <new-output-path>"
  expected_exit_code: 0
  rubric: "Pass only when all four mode/half checks report one retained raster component, one Bone White component and one regular composite component."
  measurement_method: "Connected-component labeling recorded by the generator plus exact serialized mesh metrics in the candidate build report."
