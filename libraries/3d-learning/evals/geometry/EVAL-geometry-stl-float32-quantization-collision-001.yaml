schema_version: 1.0.0
kind: eval
id: EVAL-geometry-stl-float32-quantization-collision-001
title: Float32 STL serialization preserves distinct Boolean vertices and shell topology
category: geometry
status: draft
trigger: A dense manifold Boolean mesh is exported to binary STL and the source contains distinct vertices close enough to alias at local float32 precision.
risk: The written STL can gain zero-area faces, nonmanifold edges or disconnected islands even though the indexed in-memory source reports a valid manifold.
given:
  source_mesh: indexed manifold result with float64 positions and recorded topology, bounds, relief metrics and triangle count
  destination_format: binary STL with float32 coordinates and unindexed triangle records
  protected_contract: one watertight positive-volume body, zero boundary/nonmanifold/duplicate faces, fixed bounds/bed datum, texture scale, counters, gaps and a physical displacement limit
expected:
  - Quantize the exact source positions to the destination representation before claiming export validity.
  - Detect groups where different source positions become the same destination coordinate; do not confuse them with intentionally shared topological positions.
  - Reject the export or resolve each collision by a documented topology-preserving method within the declared physical error budget.
  - Re-import the actual written STL, weld exact coordinate tuples as portable readers may do, and rerun body-count, watertightness, winding, volume, boundary-edge, nonmanifold-edge, duplicate-face, bounds and complexity checks.
  - Regenerate and hash exact slicer evidence after any collision correction; an in-memory Manifold PASS is not a substitute for the serialized-artifact audit.
failure_conditions:
  - The exporter writes float32 STL directly from a valid float64 mesh without checking distinct-position aliasing.
  - A topology failure found only after serialization is dismissed because the source half-edge graph was manifold.
  - Zero-area faces are merely deleted when that creates boundary edges or changes body topology.
  - Vertex nudging is applied globally, without original-position ordering, without a millimetre error limit, or without re-auditing the exact file.
  - Slicer evidence predates the corrected STL hash.
