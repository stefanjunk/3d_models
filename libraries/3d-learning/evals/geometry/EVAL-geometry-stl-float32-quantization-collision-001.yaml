  expected_exit_code: 0
  rubric: "Pass only when the source-to-float32 collision report is bounded and the exact written candidate independently returns one watertight positive-volume body with zero boundary/nonmanifold edges, followed by fresh exact-slicer success. Physical printing is outside this digital eval."
  measurement_method: Source/destination coordinate collision groups, maximum vertex displacement in millimetres, exact-coordinate edge incidence and components on the written STL, immutable artifact hashes, and exact slicer native result.
