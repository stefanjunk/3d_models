grader:
  type: hybrid
  command: "python products/toys-games/mm-toy-002-trailcam-cf10-rc-camera-rover/cad/validate_double_wishbone_v2.py --output <new-evidence-path>.json; jq -e '.checks[] | select(.id == \"halfshaft-cots-compatibility\") | .status == \"PASS\"' <new-evidence-path>.json"
  expected_exit_code: 0
  rubric: The deterministic report must show PASS for the halfshaft check using measured joint centers and verified operating limits; a human additionally reviews sample identity, engagement marks, play, guarded torque behavior and evidence uncertainty.
  measurement_method: Full-pose joint-center vector calculation followed by sample measurements at the reported length/angle extrema and a guarded forward/reverse bench test.
