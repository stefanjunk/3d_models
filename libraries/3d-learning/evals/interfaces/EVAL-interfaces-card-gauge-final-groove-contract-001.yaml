title: First-print card gauge reproduces every final tapered-groove variant
category: interfaces
status: draft
trigger: MM-ORG-038 slot depth, taper, tilt, gauge geometry or interface report changes.
risk: A cheap gauge can approve the wrong insertion behavior or hidden-content margin if it represents only the opening width or one final depth.
given:
  project: products/organization-storage/mm-org-038-milestone-photo-card-desk-display-block
  parameter_source: config/model-parameters.json
  interface_report: validation/interface-report.json
expected:
  - Gauge slot depths equal the rear and front final groove depths in their declared order.
  - Gauge and final grooves share the same top gap, bottom gap and back tilt.
  - The two-object coupon 3MF and aggregate digital validation remain PASS.
failure_conditions:
  - Any final depth variant is missing from or differs from the gauge.
  - Gauge taper or tilt drifts from the final source contract.
  - The interface report, coupon package or targeted regression is stale or non-PASS.
