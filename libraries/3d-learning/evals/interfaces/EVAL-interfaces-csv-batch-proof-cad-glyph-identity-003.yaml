schema_version: 1.0.0
kind: eval
id: EVAL-interfaces-csv-batch-proof-cad-glyph-identity-003
title: CSV participant batch, exact proof and removable caddy nameplates share one geometric glyph contract
category: interfaces
status: draft
trigger: Four removable caddy nameplates are personalized from CSV and require an exact proof before manufacturing.
risk: CSV import, proof rendering and CAD could normalize names or fit glyphs differently, so the approved proof and printed plates would diverge.
given:
  project: products/organization-storage/mm-org-029-craft-night-modular-personal-supply-caddy
  parameter_source: config/model-parameters.json
  csv_source: config/names.csv
  batch_source: config/name-batch.json
  glyph_source: cad/gridfont.py
  import_tool: tools/import_names.py
  proof_tool: tools/live_batch_preview.py
  import_report: reports/csv-import.json
  proof_report: reports/live-batch-preview.json
  cad_interface_report: validation/interface-report.json
expected:
  - CSV import, proof report and CAD interface all use font ID MM-GRID-5X7-v1.
  - All four normalized participant names match in order between imported batch, proof and CAD interface.
  - Batch JSON and retained SVG hashes match their executable reports.
  - The eight-character boundary and every default name retain at least 0.8 mm pixel width.
failure_conditions:
  - Font identity or normalized name order differs between CSV, proof and CAD.
  - Batch or SVG hash differs from the retained artifact.
  - An eight-character or default name falls below the declared pixel minimum.
