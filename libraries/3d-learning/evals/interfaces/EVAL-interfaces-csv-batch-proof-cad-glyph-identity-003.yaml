  - products/organization-storage/mm-org-029-craft-night-modular-personal-supply-caddy/config/model-parameters.json
  - products/organization-storage/mm-org-029-craft-night-modular-personal-supply-caddy/config/names.csv
  - products/organization-storage/mm-org-029-craft-night-modular-personal-supply-caddy/config/name-batch.json
