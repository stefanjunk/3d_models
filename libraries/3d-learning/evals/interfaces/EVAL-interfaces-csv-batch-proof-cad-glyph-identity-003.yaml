  command: python3 -m pytest products/organization-storage/mm-org-029-craft-night-modular-personal-supply-caddy/tests/test_parameters.py::test_csv_proof_and_cad_share_exact_glyph_contract products/organization-storage/mm-org-029-craft-night-modular-personal-supply-caddy/tests/test_parameters.py::test_maximum_name_keeps_printable_pixels -q
  expected_exit_code: 0
  rubric: null
  measurement_method: Compare normalized names, font identity, generated-batch hash, exact SVG hash and calculated eight-character pixel width.
