grader:
  type: hybrid
  command: null
  expected_exit_code: 0
  rubric: >-
    PASS only when physical datums and signs are unambiguous; all relevant
    machine, fastener, motion and service-envelope owners are measured or
    conservatively bounded; digital collision/clearance checks pass; a minimal
    real-machine interface/outline coupon passes; and no unresolved or rejected
    fit claim remains. Internal accessory equality and slicability alone cannot
    earn PASS.
  measurement_method: Review datum annotations and external keep-out ownership, run registered collision and insertion-sweep checks, then fit a minimal hole-pattern/outline gauge on the powered-off machine.
