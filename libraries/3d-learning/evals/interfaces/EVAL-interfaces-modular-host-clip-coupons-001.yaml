id: EVAL-interfaces-modular-host-clip-coupons-001
title: Host-gap and reusable-face coupons reproduce their final interfaces exactly
category: interfaces
status: draft
trigger: A reusable FDM accessory body is paired with multiple host-specific clips and separate first-print coupons.
risk: A coupon could give false fit confidence if it drifts from the final clip gap or reusable-body slot.
given:
  project: products/organization-storage/mm-org-024-deep-shelf-pull-tab-bin-front
  parameter_source: config/model-parameters.json
  interface_report: validation/interface-report.json
expected:
  - The gap gauge reports the same 2.2, 2.9 and 3.6 mm series as the three final clips.
  - The key-slot coupon reports the same key-slot dimensions as the final pull/label face.
failure_conditions:
  - Any coupon dimension differs from its final-part interface.
  - The source-linked interface report or either targeted test fails.
