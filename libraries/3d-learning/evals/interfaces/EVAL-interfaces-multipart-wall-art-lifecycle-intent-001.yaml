  - products/art-decor/mm-art-011-modular-topographic-relief-wall-panel/plan/hybrid-design-plan.json
grader:
  type: hybrid
  command: null
  expected_exit_code: null
  rubric: >-
    PASS when lifecycle intent is explicit and separate from bed segmentation,
    the current architecture contains no rear grid or replaceability features,
    the selected main parts fit the exact target machine, local permanent parts
    remain bounded and approval-gated, and all prior contradictory artifacts are
    visibly superseded. Physical joint and mounting performance remain NOT_RUN.
  measurement_method: Requirements/decomposition trace review, exact machine-envelope comparison and later process-matched seam/bond/standoff coupon tests.
