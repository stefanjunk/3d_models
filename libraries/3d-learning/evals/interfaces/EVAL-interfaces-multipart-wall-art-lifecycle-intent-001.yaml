schema_version: 1.0.0
kind: eval
id: EVAL-interfaces-multipart-wall-art-lifecycle-intent-001
title: Multipart wall art separates print-bed segmentation from lifecycle serviceability
category: interfaces
status: draft
trigger: A wall artwork must be manufactured in multiple prints because its assembled dimensions exceed the target printer bed.
risk: Treating the manufacturing split as a request for modular service can add unwanted grids, magnets, visible seams, parts, weight and failure modes.
given:
  project_city: products/art-decor/mm-art-010-modular-city-map-wall-panel
  project_topography: products/art-decor/mm-art-011-modular-topographic-relief-wall-panel
  requirements_city: products/art-decor/mm-art-010-modular-city-map-wall-panel/design-spec.yaml
  requirements_topography: products/art-decor/mm-art-011-modular-topographic-relief-wall-panel/design-spec.yaml
  user_intent: permanent one-off pilots with no rear grid and no replaceable sections
  target_machine: Anycubic Kobra 3 Max Combo with verified 420 x 420 x 500 mm build volume and four-color configuration
expected:
  - Manufacturing segmentation, assembled product identity and lifecycle/service intent are recorded as separate requirements.
  - Permanent one-off intent produces no magnets, removable retainers, replaceable-tile datums or service-cycle requirements.
  - The design selects the fewest reasonable bed-fitting main parts after checking the exact target machine envelope and seam/handling tradeoffs.
  - A rejected full rear grid is not reintroduced under another name; any proposed local joiner or isolated standoff has a bounded permanent role and requires explicit requirements approval.
  - Optional lighting preparation remains an unsupplied interface and does not turn the rear construction into a removable carrier.
  - A user correction that changes lifecycle architecture increments the requirements revision, blocks prior concept/decomposition authority and marks their artifacts as superseded before new CAD work.
failure_conditions:
  - The phrase "multiple prints" alone is used to justify replaceable tiles, magnets, a rear grid or repeated service-cycle tests.
  - A generic small printer envelope is used after the user identifies a larger exact target machine.
  - The old serviceable architecture remains current or authorizes CAD after the user rejects it.
  - Local permanent connectors grow into a continuous rear raster without a new approved requirement.
  - The part count is preserved solely because it appeared in an earlier concept, despite the verified bed fitting larger main parts.
