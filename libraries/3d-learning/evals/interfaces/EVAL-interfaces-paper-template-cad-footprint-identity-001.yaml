title: Paper templates and irregular tray CAD retain one footprint and calibration contract
category: interfaces
status: draft
trigger: A customer paper trace and CAD tray are generated for multiple irregular corner families.
risk: Redrawn templates, wrong print scaling or collapsed wall offsets could yield plausible but non-fitting trays.
given: {project: products/organization-storage/mm-org-030-irregular-corner-drawer-organizer-infill, parameter_source: config/model-parameters.json, footprint_source: cad/geometry.py, template_report: reports/template-generation.json, interface_report: validation/interface-report.json}
expected: [Three distinct valid footprints and inner offsets exist, all three retained SVG hashes match, every template has a 100 mm calibration contract, and coupon/CAD use the selected clearance.]
failure_conditions: [Any polygon/offset is invalid, a template hash drifts, the calibration line is absent, or clearance differs between template, CAD and coupon.]
