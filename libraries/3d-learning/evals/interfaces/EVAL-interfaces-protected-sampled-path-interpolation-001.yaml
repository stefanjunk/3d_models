schema_version: 1.0.0
kind: eval
id: EVAL-interfaces-protected-sampled-path-interpolation-001
title: Protected sampled interface matches its independent baseline between semantic stations
category: interfaces
status: draft
trigger: A new parametric surface reuses a protected legacy interface whose geometry is defined by sparse stations and a known interpolation method.
risk: Matching only station knots can hide between-station drift that prevents assembly fit or silently changes the legacy datum.
given:
  project: products/wearables/mm-sho-001-barefoot-shoe-collection/barfussschuh_v6_2_freeform
  candidate_revision: 6.2.0-draft.2
  reference: ../barfussschuh_v6_1_fitfix/v6_config.json
  sample_count: 1001
  maximum_drift_mm: 0.20
expected:
  - The reference is reconstructed independently with the legacy interpolation contract.
  - Dense left/right width, center and Z drift are all at or below 0.20 mm over the full interface.
  - The generated report is hash-bound to the parameter source, generator and legacy reference.
failure_conditions:
  - The candidate changes interpolation family without an equivalent dense regression.
  - Any dense sample exceeds 0.20 mm even when all source stations match.
  - The report is stale or uses the candidate implementation as its own reference.
fixtures:
  - products/wearables/mm-sho-001-barefoot-shoe-collection/barfussschuh_v6_2_freeform/generate_v6_2.py
