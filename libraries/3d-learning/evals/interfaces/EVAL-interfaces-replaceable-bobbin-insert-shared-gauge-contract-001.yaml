title: Replaceable bobbin inserts and first-print gauge share one dimensional contract
category: interfaces
status: draft
trigger: MM-ORG-037 host bay, insert envelope, bobbin nominal target, clearance, gauge geometry or interface report changes.
risk: A gauge could approve the wrong fit or an insert variant could force a host change if dimensional sources drift.
given:
  project: products/organization-storage/mm-org-037-sewing-bobbin-presser-foot-drawer-cassette
  parameter_source: config/model-parameters.json
  interface_report: validation/interface-report.json
expected:
  - Both final insert pocket diameters equal their nominal target plus the shared diametral clearance.
  - Both inserts retain the same 0.4 mm-per-side host-bay clearance and distinct index bars.
  - The separate bobbin and presser-foot gauges remain valid manufacturing artifacts.
failure_conditions:
  - Any final pocket target drifts from the shared source contract.
  - An insert changes the host geometry or loses the declared clearance.
  - The interface report or targeted test is stale or non-PASS.
