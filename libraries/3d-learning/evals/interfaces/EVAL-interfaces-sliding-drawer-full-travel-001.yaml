schema_version: 1.0.0
kind: eval
id: EVAL-interfaces-sliding-drawer-full-travel-001
title: A sliding drawer clears its housing over the full travel and keeps its fascia outside the cavity
category: interfaces
status: draft
trigger: A drawer, tray or cassette slides through a housing opening and has a wider or differently shaped fascia.
risk: Nominal clearance arithmetic passes while the actual solids collide at the front, rear corner transition or another point along travel.
given:
  input: Final housing and drawer STEP masters, assembly datums, allowed translation axis, full travel interval and nominal process-independent clearances.
expected:
  - Exact B-Rep intersection volume is zero at both travel endpoints and sufficient intermediate samples to cover every profile transition.
  - The fascia is assigned an explicit proud or inset datum and does not silently consume the drawer-body cavity.
  - Side, top and rear nominal clearances are reported separately.
  - Physical fit remains unqualified until the exact-process coupon and unchanged full-length drawer pass.
failure_conditions:
  - Any sampled position has positive unintended intersection volume.
  - Only bounding boxes or scalar clearance equations are checked.
  - A generic nominal clearance is called proven fit without process identity and coupon evidence.
