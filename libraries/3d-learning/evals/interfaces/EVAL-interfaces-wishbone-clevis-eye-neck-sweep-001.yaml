schema_version: 1.0.0
kind: eval
id: EVAL-interfaces-wishbone-clevis-eye-neck-sweep-001
title: Wishbone eye and outgoing arm neck clear the host across the complete suspension sweep
category: interfaces
status: draft
trigger: A wishbone or linkage eye is captured in a printed clevis and the arm section leaves the eye toward a moving outer joint.
risk: Pin fit and eye clearance can pass while the adjacent arm neck collides with a boss, rail or tower under static or swept motion.
given:
  required_inputs:
    - Frozen inboard pivot axes and outer-joint kinematics
    - Exact clevis, boss, rail and tower solids
    - Final arm-eye and load-bearing arm-neck geometry
    - Complete declared suspension and steering pose matrix
    - Protected tire, halfshaft, shock, fastener and tool-access envelopes
    - Numeric Boolean tolerance and physical fit/cycle test plan
  current_fixture:
    project: MM-TOY-002
    revision: 0.4.0-draft.3
    arm_geometry: 12.8 mm eye plus trimmed 6 mm diameter straight-neck proxy
expected:
  - Every seated arm eye has the specified axial and radial clearance without host overlap.
  - Every complete arm-neck solid has zero unintended host overlap at every required pose.
  - Boss ligament, rail/tower continuity, tire clearance and approved pivot axes remain valid after any relief or rerouting.
  - Unknown final arm sections, load paths or protected envelopes produce REVIEW_REQUIRED and block arm manufacturing approval.
failure_conditions:
  - Any arm eye or arm-neck solid intersects the host above the declared Boolean tolerance.
  - Only the neutral pose or seated eye cylinder is checked.
  - The arm section is thinned without structural evidence solely to make the collision disappear.
  - Approved kinematic axes are moved without reopening the interface contract.
  - Host relief breaks boss ligament, rail attachment, tool access or another protected keep-out.
