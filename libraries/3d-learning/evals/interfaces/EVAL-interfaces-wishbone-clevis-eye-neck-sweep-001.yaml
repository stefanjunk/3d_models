grader:
  type: hybrid
  command: "python products/toys-games/mm-toy-002-trailcam-cf10-rc-camera-rover/cad/validate_double_wishbone_v2_pivot_host_coupon.py --output <new-evidence-path>.json; test $? -eq 1; jq -e '.checks[] | select(.id == \"straight-arm-neck-routing\") | .status == \"PASS\"' <new-evidence-path>.json"
  expected_exit_code: 0
  rubric: The deterministic report must show PASS for eye clearance and the final arm-neck route over all required poses; a human additionally reviews the real arm section, load path, fastener/tool access and printed motion coupon.
  measurement_method: Full-pose B-Rep Boolean intersection followed by physical assembly, reamed-pivot fit and guarded full-travel cycling.
