  expected_exit_code: 0
  rubric: "Digital checks pass only the pipeline, mesh and slicer portion. Physical PASS requires the unchanged A/B/C/D coupon record, controlled comparison and an explicit selection; until then the result is review-required."
  measurement_method: "Exact rebuild/hash comparison, same-coordinate source and relief-span metrics, deterministic mesh/slicer validation, then fixed-condition human visual and tactile review."
