  expected_exit_code: null
  rubric: "At concept stage, require distinct source classes, non-empty counts, the Tegeler See fixture and honest context-coverage limits. At manufacturing stage, require component reconciliation, protected-bridge reporting, final body ownership, connectivity/open-fraction checks, four-body 3MF validation and fresh exact Anycubic slices."
  measurement_method: "OGR/GeoJSON source inspection, EPSG:25833 geometry analysis, source-to-mask/body accounting, mesh connectivity and overlap checks, vendor-aware 3MF inspection and target-slicer reports."
