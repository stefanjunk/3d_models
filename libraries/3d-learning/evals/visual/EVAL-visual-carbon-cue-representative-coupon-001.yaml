  expected_exit_code: 0
  rubric: Require representative coupon orientation and clean digital presentation; final recognition, tactility and snagging remain a human physical gate under three fixed light angles.
  measurement_method: STEP bounding-box orientation plus controlled visual and physical coupon review.
