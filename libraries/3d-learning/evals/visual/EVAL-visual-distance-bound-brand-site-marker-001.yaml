schema_version: 1.0.0
kind: eval
id: EVAL-visual-distance-bound-brand-site-marker-001
title: Visible brand site marker is bound to the approved asset and viewing distance
category: visual
status: draft
trigger: A raised or inlaid brand marker on a printed product must be recognizable from a declared viewing distance.
risk: A render or minimum-feature check can pass while the wrong identity, undersized lockup, poor contrast or real viewing conditions make the printed brand unrecognizable.
given:
  approved_requirements: exact brand asset/revision, placement datum, intended distance, size or sizing rule, relief/inlay process, material colors and lighting condition
  geometry_candidate: registered logo body plus host, split, perimeter, interface and aperture keep-outs
  process_context: printer, nozzle, layer height, orientation, exact filament products and slicer profiles
expected:
  - The exact approved asset identifier and cryptographic hash are recorded; spelling, aspect ratio, orientation and brand clear space are preserved.
  - The complete logo envelope and intended viewing distance are explicit parameters rather than inferred from a concept image.
  - Deterministic checks prove that the logo remains on its intended part, clears splits, perimeters, apertures and interfaces, and contains no feature below the qualified process threshold.
  - The marker reuses the declared semantic tool or otherwise stays within the approved material/color architecture.
  - A process-matched coupon reproduces the relevant base/logo colors, relief height, minimum features and surface orientation.
  - A human reviewer recognizes the intended brand from the declared distance under the declared ordinary-use lighting before any visibility claim is released.
failure_conditions:
  - The generated outline differs from the approved asset or changes spelling, aspect ratio, orientation or clear space.
  - Logo size is inherited from a placeholder or chosen without the declared viewing-distance requirement.
  - The logo clips a perimeter, crosses a split, conflicts with protected geometry, adds an unapproved fifth tool or loses a printable component.
  - A render, mesh audit or successful slice is treated as proof of real-distance recognition.
  - The physical test uses different colors, relief, orientation, lighting or distance without recording the deviation.
