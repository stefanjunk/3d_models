id: EVAL-visual-drawer-housing-front-language-001
title: Drawer fascia silhouette and reveal continue the approved rounded housing language
category: visual
status: draft
trigger: A drawer fascia visually closes a housing with rounded front corners or a rounded concept reference.
risk: The manufactured design looks unrelated to its approved concept even when the drawer fits and the mesh is valid.
given:
  input: Approved concept, housing radius, fascia XZ profile, reveal, scoop keep-out, assembled STEP and front three-quarter render.
expected:
  - The fascia rounds the front-plane XZ corners rather than only filleting its thin plan edges.
  - Both identical drawers use the same centered silhouette and reveal.
  - The scoop is an actual void through the upper center of the fascia.
  - The assembled fascia does not intersect the housing.
failure_conditions:
  - A straight rectangular front is paired with a visibly rounded housing intent.
  - The specified scoop probe remains material.
  - A render offset hides a positive assembly intersection.
