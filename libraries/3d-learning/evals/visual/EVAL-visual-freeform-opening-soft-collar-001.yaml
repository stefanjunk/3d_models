  expected_exit_code: 0
  rubric: Fixed cameras must show a continuous soft loop without voxel stepping, faceting, an isolated anterior peak, paired rear peaks or unexplained reflection-line breaks.
  measurement_method: Deterministic method/fairness/topology/self-intersection checks plus hash-bound Blender fixed-view review.
