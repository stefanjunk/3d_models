  expected_exit_code: 0
  rubric: Side, medial and three-quarter silhouettes must descend from the collar without a secondary crest; numeric sampling is necessary but not sufficient.
  measurement_method: Dense centerline height/step evaluation plus hash-bound fixed-camera visual review and protected-interface regression.
