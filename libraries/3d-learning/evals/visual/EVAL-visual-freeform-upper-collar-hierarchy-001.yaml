schema_version: 1.0.0
kind: eval
id: EVAL-visual-freeform-upper-collar-hierarchy-001
title: Collar-adjacent upper follows the approved height hierarchy without an unintended secondary peak
category: visual
status: draft
trigger: A freeform upper transitions forward from a collar/opening whose front edge is the approved local height datum.
risk: Smooth interpolation can create a mathematically fair but visually unnecessary crest above the collar, enclosing unused volume and breaking the intended silhouette.
given:
  project: products/wearables/mm-sho-001-barefoot-shoe-collection/barfussschuh_v6_2_freeform
  revision: 6.2.0-draft.3
  datum: front-collar
  graded_curve: forward-upper-centerline-through-midfoot
  required_views: [lateral, medial, three-quarter]
expected:
  - The collar height datum and the graded forward interval are explicit in the design contract.
  - Dense sampling shows no positive centerline step beyond the declared numerical tolerance and no height above the approved collar-relative limit.
  - Fixed lateral, medial and three-quarter views show one calm descent without a secondary visible crest.
  - Lowering the aesthetic envelope leaves protected fit/interface datums within tolerance.
failure_conditions:
  - The centerline or visible envelope rises above the approved collar-relative limit inside the graded interval.
  - Numerical checks pass only at sparse guide stations while an interpolated peak remains between them.
  - A fixed side or three-quarter view shows a second peak or unexplained empty envelope between collar and forefoot.
