observation:
  summary: The user reports that the existing funnel coupon printed well after a 90-degree rotation and requests the production segments use that orientation.
  expected: The prior project README recommended printing the integrated funnel part upside down with support.
  actual: A short coupon reportedly worked at 90 degrees.
  outcome: correction
  parameter: print_orientation_degrees
  recommended_value: 90
  units: degrees; axis unresolved until concept approval
explanation:
  hypothesis: Standing a short U-profile on its complete end cross-section may preserve a continuous bed-contact frame and avoid the support scarring of an upside-down funnel surface.
  mechanism: A short on-end segment converts the installed length into print height while the U-shaped end frame anchors the walls and top plate to the bed.
  alternatives:
    - The success may depend mainly on the exact material, brim, cooling, or slicer profile rather than orientation alone.
    - The user's 90-degree rotation may have been about a different model axis.
    - The coupon may have been acceptable despite local defects that were not measured.
