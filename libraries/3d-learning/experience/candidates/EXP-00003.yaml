applicability:
  triggers:
    - An Anycubic FDM project needs a local exact-profile slicer dry run with machine-readable evidence.
    - An authored Anycubic 3MF needs batch export without changing its plate arrangement.
  exclusions:
    - Resin slicing.
    - Authoring or correcting color painting and ACE slot mapping.
    - Autonomous upload, print start, or physical acceptance.
    - Byte-identical or normalized-byte-identical G-code regression assumptions.
  transfer_limits:
    - Re-run the live capability test after any slicer, package, profile, or OS change.
    - Do not generalize the simple-STL timestamp-only repeat result to support-bearing, complex, or multicolor jobs.
    - Define explicit metric tolerances and review path diffs when same-scope reproducibility matters.
    - Treat missing version/profile/native-result/G-code evidence as fail-closed.
    - Require GUI preview for layers, supports, seams, tools/colors, and purge.
