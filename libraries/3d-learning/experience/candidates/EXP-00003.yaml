observation:
  summary: Local Anycubic Slicer Next CLI runs generated parseable G-code from exact external profiles and an embedded-profile 3MF, while exposing timestamp, toolpath-repeatability, layer-summary, and isolated-working-directory path differences.
  expected: A headless local slicer could export G-code with exact input/profile provenance and no printer action.
  actual: Both original input routes returned native success and parseable G-code. The simple STL repeat differed only by generation timestamp, but the support-bearing 3MF repeat retained nine path segmentation/order differences after removing timestamp and progress metadata, with about 0.8 mm extrusion, 56.8 mm travel, and 1 s estimate deltas. Its footer reported 95 layers while 94 executable markers and the header agreed. Later product runs passed adapter existence checks with relative source paths but failed inside the isolated slicer working directory; fresh absolute-path runs passed. MM-ORG-033 preserved a native exclusion-zone failure for build items at X/Y zero and passed after a 20 mm layout margin. MM-ORG-034 independently reproduced the relative-path failure on three material-separated 3MF jobs, then produced warning-free PETG and TPU G-code from the same exact profile set with absolute paths.
  outcome: mixed
  parameter: cli_export_and_metadata_behavior
  recommended_value: Use the fail-closed adapter, retain raw hashes, compare parsed metrics, and keep metadata warnings visible.
  units: null
explanation:
  hypothesis: The Orca-derived CLI is suitable for local automated export when its version, profile semantics, output freshness, and non-deterministic metadata are explicitly handled.
  mechanism: The CLI accepts explicit settings/filament JSON or embedded 3MF settings, writes native result.json plus G-code, and exposes toolpath metadata that a deterministic wrapper can hash and analyze.
  alternatives:
    - Another packaging build or operating system may parse flags or locate resources differently.
    - The 3MF footer mismatch may depend on this project, adaptive layers, supports, or version-specific summary code.
    - Internal support scheduling, path traversal, or geometry iteration order may explain the observed 3MF path variation.
    - Additional nondeterministic fields or paths may appear in multicolor, timelapse, or cloud-enabled jobs not tested here.
    - The relative-path failure is attributable to wrapper path handling in the observed adapter revision, not to the source mesh or Anycubic profile contents.
    - The origin rejection may depend on the Kobra 3 Max profile's exclusion geometry; 20 mm is one passing layout value, not a universal margin.
  validated: false
  validation_method: null
