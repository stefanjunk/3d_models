    - A passive long tapered filler can expose its hidden underside to the build plate and can tolerate modeled roof bridge bays.
  exclusions:
    - Structural rails, sliding/bearing rails, seals, liquid barriers or parts requiring a closed underside.
    - Geometries where rib islands do not share reliable bed contact or roof connection.
    - Any claim about real print time, mass, bridge quality or service life before matching evidence exists.
  transfer_limits:
