observation:
  summary: In one parametric CadQuery rail pair, replacing equivalent solid wedges with open-underside perimeter shells and cross-ribs preserved valid one-body geometry while reducing CAD volume by 55.5% left and 50.0% right.
  expected: At least 25% CAD-volume reduction while each manufacturing mesh remains one watertight positive-volume body and modeled unsupported roof spans remain at or below 12 mm.
  actual: Left 55.525% and right 50.009% CAD-volume reduction; both manufacturing meshes passed topology/resource audits; modeled maximum roof span was approximately 9.6 mm.
  outcome: success
  parameter: cad_volume_reduction_percent
  recommended_value: null
  units: percent
explanation:
  hypothesis: Removing the hidden solid core and retaining perimeter walls plus closely spaced cross-ribs can reduce geometric material volume while the ribs preserve roof support and body connectivity for this narrow tapered-rail geometry.
  mechanism: The cavity removes most of the full-height wedge core; bed-to-roof cross-ribs subdivide the roof bridge length and fuse the longitudinal walls into one solid.
  alternatives:
    - A slicer may already use sparse infill in a solid wedge, so deposited-material and time savings may be much smaller than CAD-volume reduction.
    - Extra ribs, corners and bridge paths may increase toolpath overhead relative to a simpler shell.
    - Exact material, cooling and bridge settings may make the roof unacceptable despite the geometric span bound.
  validated: false
  validation_method: null
