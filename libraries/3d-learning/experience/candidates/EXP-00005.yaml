observation:
  summary: Across two parametric CadQuery products, one repository-owned 5x7 glyph approach removed installed-font dependency; the second product also generated an exact SVG proof from the same normalization, layout and glyph source.
  expected: Keep every engraved pixel at or above its declared 0.8-0.9 mm process minimum, keep each plate one valid component, preserve identical normalized text and font identity in CAD and proof, and slice both unchanged 3MF packages.
  actual: MM-ORG-010 retained 1.018 mm pixels at its 16-character boundary. MM-ORG-026 retained 0.891 mm title pixels at its 26-character boundary; its proof and CAD matched font ID and normalized text, its SVG hash matched exactly, its plate was one watertight 6,028-triangle component, and its five-object 3MF sliced to 100 layers without warnings.
  outcome: success
  parameter: minimum_raster_pixel_width_mm
  recommended_value: null
  units: mm
explanation:
  hypothesis: A small explicit raster alphabet can make functional personalization deterministic and licence-independent while a separate plate isolates customer text from the reusable support geometry; using the identical renderer for the proof prevents text-layout drift.
  mechanism: Each allowed character maps to a fixed binary grid; available plate width and height determine one uniform pitch, disjoint recessed pixels are subtracted from a single plate solid, and the proof uses the same normalized strings, layout function and pixel rectangles.
  alternatives:
    - An owned vector font or stroke font may produce more attractive or space-efficient text while remaining reproducible.
    - Recessed pixels may collect debris or lose contrast in low-light single-color prints.
    - A removable plate adds fit, wear and rattle risks that permanent text avoids.
    - Real extrusion width, elephant-foot compensation and XY calibration may require a larger pixel or channel-clearance minimum.
  validated: false
  validation_method: null
