observation:
  summary: In one parametric CadQuery plate, embedded 5x7 raster glyphs removed installed-font dependency, retained 1.018 mm pixels at the 16-character boundary and exported as one watertight body that passed a local reference-profile slice.
  expected: Keep every engraved pixel at or above 0.9 mm, keep the plate one valid component and successfully slice the unchanged two-object 3MF.
  actual: Default METRIMADE pixels were 1.825 mm; the 16-character boundary calculated 1.018 mm; the nameplate was one watertight component with 2,876 triangles; the two-object 3MF sliced to 640 layers with no G-code warning.
  outcome: success
  parameter: minimum_raster_pixel_width_mm
  recommended_value: null
  units: mm
explanation:
  hypothesis: A small explicit raster alphabet can make functional personalization deterministic and licence-independent while a separate plate isolates customer text from the large chassis.
  mechanism: Each allowed character maps to a fixed binary grid; available plate width and height determine one uniform pitch, and disjoint recessed pixels are subtracted from a single plate solid.
  alternatives:
    - An owned vector font or stroke font may produce more attractive or space-efficient text while remaining reproducible.
    - Recessed pixels may collect debris or lose contrast in low-light single-color prints.
    - A removable plate adds fit, wear and rattle risks that permanent text avoids.
    - Real extrusion width, elephant-foot compensation and XY calibration may require a larger pixel or channel-clearance minimum.
  validated: false
  validation_method: null
