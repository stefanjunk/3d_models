observation:
  summary: Across three parametric CadQuery products, one repository-owned 5x7 glyph approach removed installed-font dependency; two products generated exact SVG proofs from the same normalization, layout and glyph source, and the third extended the contract to a validated CSV batch.
  expected: Keep every engraved pixel at or above its declared 0.8-0.9 mm process minimum, keep each plate or cap one valid component, preserve identical normalized text and font identity across imported data, CAD and proof, and slice unchanged production 3MF packages.
  actual: MM-ORG-010 retained 1.018 mm pixels at its 16-character boundary. MM-ORG-026 retained 0.891 mm title pixels at its 26-character boundary and matched proof/CAD identity. MM-ORG-027 retained 1.337 mm pixels across six CSV-driven caps; batch JSON, exact SVG and CAD interface matched normalized label order and font ID, all six caps were watertight single components, and the selected fourteen-object PETG 3MF sliced to 12 layers without warnings.
  outcome: success
  parameter: minimum_raster_pixel_width_mm
  recommended_value: null
  units: mm
explanation:
  hypothesis: A small explicit raster alphabet can make functional personalization deterministic and licence-independent while separate plates or caps isolate customer text from reusable geometry; using the identical renderer and validated intermediate batch for the proof prevents text-layout drift.
  mechanism: Each allowed character maps to a fixed binary grid; available plate width and height determine one uniform pitch, disjoint recessed pixels are subtracted from one solid, and the proof consumes the same normalized strings, layout function and pixel rectangles as CAD.
  alternatives:
    - An owned vector font or stroke font may produce more attractive or space-efficient text while remaining reproducible.
    - Recessed pixels may collect debris or lose contrast in low-light single-color prints.
    - A removable plate adds fit, wear and rattle risks that permanent text avoids.
    - Real extrusion width, elephant-foot compensation and XY calibration may require a larger pixel or channel-clearance minimum.
  validated: false
  validation_method: null
