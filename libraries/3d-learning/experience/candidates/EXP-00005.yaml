applicability:
  triggers:
    - A functional dry-indoor product needs short uppercase personalization without external font dependencies.
    - The personalized region can be isolated as a flat replaceable part.
    - A customer proof must reflect the exact normalized text and glyph geometry before manufacturing.
    - A short CSV label batch must remain identical across import, proof and manufactured geometry.
  exclusions:
    - Decorative typography, mixed scripts, lowercase-dependent names, braille or safety-critical labels.
    - Tiny products that force the calculated pixel below the process minimum.
    - Permanent legal, safety, traceability or calibration markings.
  transfer_limits:
    - Treat only as an experiment candidate for similar flat organizer or display plates.
    - Require a glyph/readability coupon and repeated exact-process channel-cycle tests before promotion.
