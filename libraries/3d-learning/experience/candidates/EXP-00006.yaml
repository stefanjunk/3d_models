applicability:
  triggers:
    - A canonical recessed or raised mark is mapped from its default face to a differently oriented side wall.
    - A mark must be readable from a declared assembled inspection direction.
  exclusions:
    - Hidden forensic marks with no human reading-direction requirement.
    - Marks whose generator explicitly emits and validates the target surface/view-normal variant.
    - Any conclusion about physical readability before a process-matched coupon passes.
  transfer_limits:
    - Test the actual candidate geometry from every declared inspection side; do not prescribe reflection from face names alone.
    - Preserve scale, depth and wall-clearance checks independently of handedness correction.
    - Retain the failed render or trace and rebuild all manufacturing artifacts after correction.
