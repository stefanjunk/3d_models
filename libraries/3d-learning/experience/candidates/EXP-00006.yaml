observation:
  summary: The selector-approved scale-1.0 watermark first rendered mirrored from the declared drain-cavity inspection side; a rigid local-X placement reflection corrected reading direction without changing profile dimensions.
  expected: The integrated inner-wall mark would read metriMade.com and MM-BTH-003 · v3.1.0-draft.1 left-to-right from the drain cavity.
  actual: The first actual-STL render was mirrored. After the local-X placement reflection and a complete rebuild, the final actual-STL render read both lines correctly; selector fit, 0.4 mm depth, 2.6 mm residual wall, mesh audits and retained slicer toolpaths still passed.
  outcome: mixed
  parameter: inspection_side_reading_orientation
  recommended_value: Validate the actual marked manufacturing geometry from the declared finished inspection side before release; treat orientation as a rigid placement transform distinct from scale.
  units: null
explanation:
  hypothesis: A 2D cutter's apparent handedness depends on the surface normal, extrusion direction and selected inspection side, so a profile authored for an underside can become mirrored under a valid side-wall rotation.
  mechanism: Mapping profile axes onto a different face changes the relationship between local profile X and the viewer's screen-right direction. Fit selectors verify envelope, rotation, clearance and wall thickness but do not by themselves prove viewer-facing handedness.
  alternatives:
    - The initial render camera basis rather than the placement could have introduced the apparent mirror; a second camera and the final geometry render reduced but did not eliminate this general risk.
    - A generator could emit separate named view-normal variants rather than relying on a placement reflection.
    - Placing the mark on the opposite inner wall could change handedness and vertical orientation differently.
  validated: false
  validation_method: null
