observation:
  summary: Independent audits found one watertight positive-volume rack throughout, but the native slicer warning cleared only after local shelf ribs became continuous rising undersides and a cosmetic fascia that began below each shelf was removed.
  expected: A topologically connected support-free rack would slice without a native floating-region warning.
  actual: Revision r1 with local ribs and fascias warned; r2 with continuous wedges and fascias still warned; r3 with continuous wedges and no fascias sliced 520 consistent layers with an empty native warning field and no G-code warnings.
  outcome: mixed
  parameter: continuous_prior_layer_path
  recommended_value: null
  units: null
explanation:
  hypothesis: B-Rep connectivity and watertightness do not ensure that every feature has printable support at its first deposited layer.
  mechanism: The fascia was connected to the finished solid but began ten millimetres below its shelf without material in the preceding layer; continuous wedge support fixed the shelves, and deleting the remaining mid-air fascia cleared the warning.
  alternatives:
    - Enable generated support and accept cleanup/material cost.
    - Reorient or split the rack if continuous undersides conflict with product access.
    - Replace the fascia with a base-grown wall or a chamfered feature that has a prior-layer path.
    - A native warning may be conservative; layer preview and physical coupons are still needed.
