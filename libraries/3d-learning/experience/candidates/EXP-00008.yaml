observation:
  summary: Eight tray notches and three coupon notches each exported one nonmanifold chord when the cylindrical cutter was tangent to the wall top; a 0.6 mm exterior overlap cleared every edge.
  expected: Two valid one-solid B-Reps would export as watertight positive-volume STL meshes.
  actual: The tangent revision had 8 and 3 nonmanifold edges respectively; after the one-variable cutter-height change both independent audits reported watertight positive volumes and zero boundary or nonmanifold edges.
  outcome: mixed
  parameter: cutter_top_overlap_mm
  recommended_value: 0.6
  units: mm
explanation:
  hypothesis: Exact tangency between a Boolean cutter and an exterior boundary can create an ambiguous tessellated chord even when the source B-Rep remains valid.
  mechanism: Moving the cylinder beyond the wall top changes the tangential contact into a positive open cut, removing the four-face mesh edge.
  alternatives:
    - Build the notch from a profile cut that crosses the top boundary explicitly.
    - Apply a small chamfered opening instead of a tangent cylinder.
    - Repair the mesh after export, while retaining CAD-level audits to prevent recurrence.
  validated: false
  validation_method: null
