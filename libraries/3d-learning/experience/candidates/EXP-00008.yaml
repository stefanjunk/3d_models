    - Toolchains or geometries already qualified with a different overlap rule.
  transfer_limits:
    - Treat 0.6 mm as the passing value for this geometry, not a production standard.
    - Re-audit after changing wall thickness, radius, tessellation tolerance or CAD kernel.
