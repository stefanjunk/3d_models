observation:
  summary: A seven-object 3MF fit inside the nominal bed rectangle but exact destination slicing rejected divider-1980 near an exclusion zone; three packages containing unchanged meshes all passed without native warnings.
  expected: Nominal X/Y bounds inside 426 x 420 mm would be sufficient for slicer placement acceptance.
  actual: The initial slicer returned -64 and named the exclusion-zone conflict; packages with 4, 3 and 3 objects respectively returned success and emitted one warning-free G-code file each.
  outcome: mixed
  parameter: destination_profile_accepted_partition_count
  recommended_value: 3
  units: packages-for-this-artifact-set
explanation:
  hypothesis: Destination profiles can reserve non-rectangular or machine-specific regions inside the advertised bed envelope.
  mechanism: The exact slicer applies profile-specific placement constraints absent from a simple bounding-box test, so partitioning moves every object into the accepted region without changing geometry.
  alternatives:
    - Repack automatically against an extracted machine-profile placement polygon.
    - Apply a conservative interior inset before authoring a single package.
    - Keep per-part STL files and let a human arrange them after inspecting the destination plate.
  validated: false
  validation_method: null
