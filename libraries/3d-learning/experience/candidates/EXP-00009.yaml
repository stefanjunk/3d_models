applicability:
  triggers:
    - A multi-object build layout approaches a nominal bed boundary or packs long parts in adjacent columns.
    - Simple bed-envelope validation passes but the destination slicer reports an exclusion-area conflict.
  exclusions:
    - Centrally placed single objects with ample profile-qualified margin.
    - Layouts already validated against an exact machine-readable allowed-placement region.
    - A claim that three packages are optimal for other part sets.
  transfer_limits:
    - Treat exact destination slicing as the acceptance test for this candidate.
    - Re-evaluate after changing machine profile, object transforms, skirt/brim behavior or slicer version.
