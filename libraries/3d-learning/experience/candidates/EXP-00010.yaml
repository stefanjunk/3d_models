observation:
  summary: Applying the thin-card 0.15 mm clearance to every class falsely reduced calculated 3.0 mm card engagement below 4.0 mm; explicit 0.10 mm acrylic-class clearance restored agreement across CAD, report and test.
  expected: The 3.0 mm acrylic class passes its declared 4.0 mm engagement requirement.
  actual: Global 0.15 mm clearance calculated 3.816 mm engagement; the declared 0.10 mm class clearance calculated 4.032 mm.
  outcome: correction
  parameter: side_clearance_mm_ownership
  recommended_value: per-interface-class
  units: data-model-scope
explanation:
  hypothesis: A shared global clearance is unsafe when interface classes intentionally use different fit allowances.
  mechanism: In a tapered slot, effective insert width determines seating height; adding 0.10 mm excessive total allowance moves the calculated seat upward and can change a boundary decision.
  alternatives:
    - Define separate named global parameters for every material family and map classes explicitly.
    - Compute clearance from a validated material/process lookup once physical evidence exists.
    - Use a parameter sweep over class-specific clearance ranges rather than one nominal value.
  validated: false
  validation_method: null
