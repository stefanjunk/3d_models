applicability:
  triggers:
    - Multiple insert classes share one tapered or compliant receiver but require different clearances.
    - A unit test or report derives seating depth from both thickness and clearance.
    - CAD, preview and validation code consume overlapping interface parameters.
  exclusions:
    - A truly single-class interface with one validated process-specific clearance.
    - A clearance sweep whose class identity is already an explicit independent variable.
  transfer_limits:
    - Transfer only the ownership pattern, not these numeric card clearances.
    - Re-evaluate whether clearance belongs to the class, material/process record or measured fit profile in other architectures.
