applicability:
  triggers:
    - Repeated recessed position glyphs create many Boolean operands in a parametric CAD model.
    - Human-readable labels can be replaced by a documented compact code for the intended workflow.
    - Build performance is part of deterministic regeneration acceptance.
  exclusions:
    - Consumer-facing text that must be immediately readable without a legend.
    - CAD kernels whose native engraving operation already handles the complete vector set efficiently.
    - Safety, compliance or accessibility labels.
  transfer_limits:
    - Transfer the bounded-operand decision pattern, not the specific bar scales or 23.8-second timing.
    - Validate readability, code uniqueness and protected-surface clearance for each new product.
