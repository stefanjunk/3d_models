observation:
  summary: Replacing 177 seven-segment label cutters with 29 two-bar cutters reduced one full cassette/card build to 23.8 seconds while preserving twenty unique codes and a watertight cassette.
  expected: Repeated recessed identifiers remain unique without dominating the product build.
  actual: The seven-segment concept remained in label subtraction beyond the 30-second command yield; the bounded code completed the entire build in 23.8 seconds.
  outcome: correction
  parameter: analytic_label_cutter_count
  recommended_value: no-more-than-two-nonzero-code-cutters-per-position
  units: Boolean-cutters
explanation:
  hypothesis: A bounded analytic code reduces repeated Boolean overhead when full glyph construction dominates a CAD build.
  mechanism: Each nonzero decimal digit becomes one simple box instead of multiple glyph segments, reducing operand count from 177 to 29 before a single compound cut.
  alternatives:
    - Export labels as a separate color or decal workflow with no recessed geometry.
    - Use a single engraved vector face operation if the CAD kernel handles it efficiently.
    - Place an external paper or laser-marked index map beside the cassette.
