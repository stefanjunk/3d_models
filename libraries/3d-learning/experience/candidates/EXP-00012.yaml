observation:
  summary: One self-intersecting Pulse polygon was invalid and caused the combined Signal-12 plate to fail; replacing it with a simple seven-vertex path and checking all twelve cutters yielded a watertight single-component plate.
  expected: Twelve named cutter solids subtract from one plate without invalid topology.
  actual: The initial set contained eleven valid cutters and one invalid self-intersecting cutter; the corrected set contains twelve valid single solids.
  outcome: correction
  parameter: analytic_profile_validity
  recommended_value: valid-single-solid-before-compound-boolean
  units: gate-state
explanation:
  hypothesis: Checking generated analytic cutter validity individually localizes profile defects that otherwise surface only as a failed compound Boolean.
  mechanism: A self-intersecting 2D wire can extrude into an invalid solid; including that solid in a compound subtraction propagates the defect to the result.
  alternatives:
    - Validate and repair source wires before extrusion.
    - Subtract cutters serially with an indexed failure report.
    - Use a planar polygon library to detect intersections before CadQuery construction.
