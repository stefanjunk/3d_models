applicability:
  triggers:
    - Multiple generated polygon or spline cutters enter one compound Boolean.
    - A final-part failure does not identify which repeated profile is defective.
    - Analytic symbol, vent, texture or stencil paths are created parametrically.
  exclusions:
    - Trusted kernel-native primitives with no generated wire path.
    - Workflows already performing a stronger source-wire intersection and orientation proof.
  transfer_limits:
    - Transfer the staged validation gate, not the Pulse coordinates or stencil dimensions.
    - Retain whole-part and mesh validation because individually valid cutters can still interact badly.
