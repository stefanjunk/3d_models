observation:
  summary: Three individually valid socket cutters at 7 mm center pitch overlapped along the coupon boundary and left three disconnected solids; spacing them at 14 mm yielded one valid solid and one watertight mesh component.
  expected: One connected clearance gauge after all three open-edge sockets and identity holes are cut.
  actual: The initial gauge contained three solids; the corrected gauge contains one.
  outcome: correction
  parameter: final_component_count
  recommended_value: exactly-one-solid-after-all-open-edge-cuts
  units: gate-state
explanation:
  hypothesis: Overlapping boundary-opening cutters can isolate residual edge strips even when every cutter and the resulting multi-solid B-Rep report valid geometry.
  mechanism: Adjacent cuts intersect the outer boundary over overlapping spans, separating material between the sockets from the main coupon body.
  alternatives:
    - Increase spacing between boundary-opening cutters.
    - Move the sockets to different edges.
    - Add a protected interior spine and prove its minimum ligament.
