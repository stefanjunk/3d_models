observation:
  summary: The initial instruction selected the largest fitting tile, but larger tiles have larger cutaways and will be looser; the rule was corrected to the smallest seating tile and bound to a monotonic-volume regression.
  expected: Instruction direction agrees with analytic material inclusion.
  actual: Initial direction was reversed; corrected direction now matches all six tile volumes.
  outcome: correction
  parameter: radius_selection_rule
  recommended_value: smallest-no-force-seating-tile-for-increasing-cutaway
  units: semantic-gate
explanation:
  hypothesis: A geometry-direction regression prevents documentation from reversing which member of an ordered gauge family represents the tight boundary.
  mechanism: Increasing the quarter-circle cutaway radius removes more material, so any larger tile that seats provides only a looser upper bound.
  alternatives:
    - Use convex plugs whose material inclusion increases with radius and document the opposite rule.
    - Use paired go/no-go tiles around each nominal radius.
