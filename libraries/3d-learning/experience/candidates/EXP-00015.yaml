    - products/organization-storage/mm-org-019-label-tape-cartridge-rack/tests/test_parameters.py
applicability:
  triggers:
    - Multiple module variants change depth or another non-interface envelope dimension.
    - Variants must mate directly in one front-referenced assembly.
  exclusions:
    - Variants intentionally use incompatible connector families.
    - Connectors referenced to an explicitly shared rear datum.
  transfer_limits:
    - Select datums from each product's assembly contract instead of copying these coordinate values.
