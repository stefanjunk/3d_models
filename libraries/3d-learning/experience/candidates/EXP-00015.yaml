lifecycle:
  state: candidate
  maturity: E0
  confidence: low
  review: {status: pending, reviewed_by: null, reviewed_at: null, notes: One digital rack family; no printed joint evidence.}
feature:
  type: cross-variant-planar-connector-datums
  geometry: paired trapezoid tabs and sockets on different-depth modules
  design_parameters:
    initial_rule: depth-relative-y-fractions-0.28-and-0.72
    corrected_rule: shared-absolute-y-datums-25-and-55-mm
    nominal_clearance_mm: 0.25
  named_datums: [front-face-y0, base-face-z0, connector-center-y25, connector-center-y55]
  constraints:
    - All variants intended to interconnect must expose identical connector-center coordinates in the shared assembly frame.
    - Envelope depth may vary without moving connector datums.
scope:
  process: CadQuery/OpenCascade analytic extrusion
  machine: {manufacturer: not-specific, model: digital-only, unit_id: null, firmware: null}
  material: {manufacturer: not-specific, product: digital-geometry, variant: planar-joint, color: null, batch: null, conditioning: null}
  nozzle: {diameter_mm: 0.4, material: unknown, geometry: null, hotend: null, wear_state: null}
  orientation: broad base down
  slicer: {name: Anycubic Slicer Next, version: 1.3.9.4, profile: 0.20 mm Standard, profile_hash: dec0a101aaa644997c96146f4aaf1973b7f710e73f023c4871024833ad200b81}
  geometry_class: variable-depth-side-coupled-storage-modules
  environment: digital-only
  transfer_limits:
    - Applies when module fronts share an assembly datum and different depths must connect side by side.
    - Does not prescribe the absolute 25/55 mm values for other module families.
    - Physical joint clearance and cycle life remain unvalidated.
observation:
  summary: Depth-relative connector positions produced different center coordinates in the 75.4 and 95.4 mm presets; shared absolute coordinates restored digital interchangeability.
  expected: Both connector pairs align between every intended rack variant.
  actual: Initial centers differed; corrected centers are identical at Y=25/55 mm.
  outcome: correction
  parameter: connector.centers_y_mm
  recommended_value: shared-assembly-datums-independent-of-variable-envelope
  units: geometry-contract
explanation:
  hypothesis: Connector coordinates must be owned by the assembly interface rather than by a variable module envelope.
  mechanism: Percentage placement propagates unrelated depth variation into mating geometry; an absolute front-referenced datum removes that coupling.
  alternatives:
    - Use a separate adapter between depth families.
    - Align modules by rear face and make the front offset explicit.
  validated: false
  validation_method: null
