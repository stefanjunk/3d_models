observation:
  summary: The valid one-solid B-Rep produced a closed main component plus eight isolated zero-area STL triangles; conservative facet cleanup restored a one-component audited mesh.
  expected: A valid single-solid B-Rep exports as one watertight positive-volume mesh.
  actual: Raw export had 9756 faces and 9 components; the conservative export had 9748 faces, one component and no degenerate or duplicate faces.
  outcome: correction
  parameter: manufacturing-mesh-cleanup-policy
  recommended_value: remove-only-degenerate-and-duplicate-facets-then-fail-closed-audit
  units: topology-contract
explanation:
  hypothesis: OCC generated numerical sliver facets where two small fillet families converged at the rib top corners.
  mechanism: Zero-area triangles have no manufacturing surface contribution; removing them and unreferenced vertices exposes the unchanged closed main tessellation for a fresh fail-closed audit.
  alternatives:
    - Redesign the local fillet sequence or radius transition.
    - Change tessellation tolerance after a controlled sweep.
    - Export through a different CAD kernel and compare surfaces.
  validated: false
  validation_method: null
