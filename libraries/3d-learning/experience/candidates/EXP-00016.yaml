applicability:
  triggers:
    - A valid one-solid B-Rep exports a closed main component plus isolated zero-area facets.
    - An independent audit can prove the removed facets are degenerate and the retained mesh is a closed positive volume.
  exclusions:
    - Disconnected components with positive area or volume.
    - Mesh errors caused by unintended CAD openings, overlaps or missing faces.
  transfer_limits:
    - Diagnose the source geometry first and use conservative cleanup only with before/after evidence.
