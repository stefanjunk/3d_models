feature:
  type: tessellated-small-compound-fillet-junction
  geometry: three thin rounded textile-test ribs fused to a planar coupon base
  design_parameters:
    rib_thickness_mm: 3.0
    leading_radii_mm: [0.6, 1.0, 1.4]
    tessellation_linear_mm: 0.08
    tessellation_angular_rad: 0.15
    isolated_zero_area_faces_before: 8
  named_datums: [coupon-base-z0, textile-rib-leading-edges]
  constraints:
    - Cleanup may remove only provably degenerate or duplicate facets and unreferenced vertices.
