observation:
  summary: Relaxing OCC tessellation from 0.06 mm / 0.12 rad to 0.10 mm / 0.18 rad brought four fully filleted manufacturing meshes below 60,000 triangles while all topology audits stayed PASS.
  expected: Every unique manufacturing mesh remains below the declared triangle budget and passes the topology contract.
  actual: Initial holders contained 68,232 to 72,842 triangles; final parts contained 23,880 to 35,880 triangles, each with one watertight winding-consistent positive-volume component.
  outcome: correction
  parameter: OCC-linear-and-angular-tessellation-tolerance
  recommended_value: controlled-sweep-with-0.10-mm-and-0.18-rad-as-this-scope-candidate
  units: mm-and-radians
explanation:
  hypothesis: The tighter initial tessellation over-sampled repeated 1 mm fillets and obround boundaries relative to the 0.4 mm nozzle manufacturing resolution.
  mechanism: Increasing the maximum chordal and angular deviation permits fewer facets along curved analytic edges while preserving the closed B-Rep-derived surface.
  alternatives:
    - Reduce the number or scope of analytic fillets.
    - Add deterministic local tessellation controls when supported by the export toolchain.
    - Raise the artifact budget for appearance-critical curvature after an explicit review.
  validated: false
  validation_method: null
