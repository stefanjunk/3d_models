    - A valid analytic B-Rep with repeated small fillets exceeds a declared manufacturing-mesh triangle budget.
    - The product has a documented nozzle-scale resolution context and can be rebuilt and audited deterministically.
  exclusions:
    - Organic, relief, scanned or appearance-critical freeform surfaces without a surface-deviation benchmark.
    - Any result with boundary, nonmanifold, degenerate, duplicate, winding, volume or component-count failures.
  transfer_limits:
