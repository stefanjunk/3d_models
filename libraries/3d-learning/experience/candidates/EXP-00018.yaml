lifecycle:
  state: candidate
  maturity: E0
  confidence: low
  review: {status: pending, reviewed_by: null, reviewed_at: null, notes: "One digital accessory family, no physical PETG fit or fatigue evidence."}
feature:
  type: modular-bin-front-host-interface
  geometry: one pull-label face, three planar U-clips, one gap gauge and one key-slot coupon
  design_parameters:
    clip_gaps_mm: [2.2, 2.9, 3.6]
    target_host_thicknesses_mm: [1.92, 2.67, 3.3]
    key_entry_clearance_height_mm: 0.4
    key_track_clearance_height_mm: 0.4
    key_entry_clearance_width_mm: 0.6
  named_datums: [face-back-z0, clip-broad-face-z0, locked-centers-plus-minus-46.5]
  constraints:
    - Each host clip must preserve the same face-side key geometry.
    - The gap gauge must reproduce every protected clip gap exactly.
    - The key coupon must reproduce the face slot from the same parameters.
scope:
  process: CadQuery/OpenCascade parametric FDM design
  machine: {manufacturer: Anycubic, model: Kobra 3 Max reference profile, unit_id: null, firmware: null}
  material: {manufacturer: Anycubic, product: PETG reference profile, variant: digital-only, color: null, batch: null, conditioning: null}
  nozzle: {diameter_mm: 0.4, material: unknown, geometry: null, hotend: null, wear_state: null}
  orientation: face back down; clips and coupons broad side down
  slicer: {name: Anycubic Slicer Next, version: 1.3.9.4, profile: 0.20 mm Standard, profile_hash: dec0a101aaa644997c96146f4aaf1973b7f710e73f023c4871024833ad200b81}
  geometry_class: detachable-face-with-planar-host-clips
  environment: digital-only
  transfer_limits:
    - Dimensional identity does not establish real spring preload, retention, fatigue, creep or host-surface safety.
    - The exact gaps and clearances apply only to the recorded product and process candidate.
    - A coupon that passes does not create a universal-fit or load-rating claim.
observation:
  summary: A single face-side key contract served three host-specific clip gaps, while two small coupons reproduced the host and assembly interfaces exactly.
  expected: Host fit and face-key fit fail on small artifacts before a full visible face needs to be printed.
  actual: Three clip gaps and both coupon relationships passed deterministic dimensional regression checks; six manufacturing meshes and the shared 3MF also passed.
  outcome: success
  parameter: interface-ownership-and-coupon-decomposition
  recommended_value: reusable-face-plus-host-clip-series-plus-two-source-linked-coupons
  units: architecture-contract
explanation:
  hypothesis: Separating the stable visible face from the variable host clip reduces full-part reprints and keeps host measurement uncertainty out of the label/pull geometry.
  mechanism: The gap gauge selects a host-side dimension, while the key coupon tests the stable clip-to-face connection; both are generated from the same parameter source as the final parts.
  alternatives:
    - Print a monolithic face for every host thickness.
    - Use adhesive or purchased fasteners.
    - Put all fit uncertainty into a single full-size prototype.
  validated: false
  validation_method: null
