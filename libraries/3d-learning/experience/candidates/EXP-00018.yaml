applicability:
  triggers:
    - One visible accessory body must adapt to several measured passive host thicknesses.
    - Both the host-side fit and the reusable-body interface can be isolated in low-cost coupons.
  exclusions:
    - Safety-critical, structural, lifting or high-energy attachment interfaces.
    - Host surfaces that cannot tolerate clip contact or lack a measured flat attachment zone.
  transfer_limits:
    - Reuse the decomposition and source-linking idea only; determine new gaps, clearances and tests for every host/process scope.
