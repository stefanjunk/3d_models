  orientation: camera normal to the closed palette face; scale in the same plane
  slicer: {name: Anycubic Slicer Next, version: 1.3.9.4, profile: 0.20 mm Standard, profile_hash: dec0a101aaa644997c96146f4aaf1973b7f710e73f023c4871024833ad200b81}
  geometry_class: thin-rectangular-consumer-object
  environment: synthetic digital fixture; dry indoor downstream use
  transfer_limits:
    - The 3 percent threshold is a project candidate, not a validated camera-metrology accuracy statement.
    - Nonplanar or strongly lens-distorted objects require another capture method.
    - Thickness and hinge protrusions remain manual caliper measurements.
observation:
  summary: A scale-calibrated four-corner method reproduced two face dimensions while the contract kept thickness as an independent input and rejected an intentionally skewed fixture.
  expected: The example returns 130.0 by 71.0 mm, retains the 15.2 mm caliper value and fails when opposing edge lengths exceed the 3 percent skew limit.
  actual: The deterministic happy-path, skew-failure and zero-reference tests passed; the measured example fed an organizer lane-selection record without inferring depth.
  outcome: success
  parameter: capture-dimension-ownership
  recommended_value: overhead-photo-for-in-plane-width-height-plus-caliper-for-maximum-thickness
  units: workflow-contract
explanation:
  hypothesis: Assigning each dimension to an observable measurement mode prevents false precision from single-view depth inference while preserving a low-friction customer capture step.
  mechanism: An in-plane scale converts pixels to millimetres and opposing edges expose perspective error; a caliper owns the orthogonal thickness dimension.
  alternatives:
    - Infer all three dimensions from one uncalibrated photo.
    - Require calipers for every face dimension.
    - Use a multi-view photogrammetry workflow for a mostly planar storage object.
  validated: false
  validation_method: null
