feature:
  type: photo-assisted-parametric-input-capture
  geometry: flat closed palette face with in-plane reference scale
  design_parameters:
    reference_length_mm: 100.0
    maximum_perspective_skew_percent: 3.0
    retrieval_clearance_added_to_thickness_mm: 1.0
  named_datums: [reference-edge-in-object-plane, palette-corners-TL-TR-BR-BL, maximum-closed-thickness]
  constraints:
    - The reference edge must be in the same plane as the measured closed face.
    - Opposing-edge disagreement must stay at or below the configured perspective threshold.
    - A single overhead image must not be used to infer closed thickness.
