  constraints:
    - Keep the selected hub key connected to the build plate when printed in the declared base-down orientation.
    - Keep the mating caddy channel open through its bottom and top so a bed-built key can seat without a collision.
    - Require the exact destination slicer's native warning list, not only exit code, to be empty.
    - Treat the clearance coupon as mandatory because support-free topology does not prove printed sliding fit.
