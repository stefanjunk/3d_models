feature:
  type: support-free-vertical-dovetail-docking-key
  geometry: four horizontal dovetail projections on a shared open cup, mating vertical channels in four caddy bosses, and a representative gauge/key coupon
  design_parameters:
    initial_key_origin_z_mm: 3.0
