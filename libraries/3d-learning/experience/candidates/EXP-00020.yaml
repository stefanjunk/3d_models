applicability:
  triggers:
    - A no-support functional key, rail or hook projects horizontally from a vertical wall in base-down orientation.
    - The projection begins above the build plate and the exact slicer reports a floating cantilever.
  exclusions:
    - Qualified bridge, arch, chamfer, sacrificial-web or supported geometries.
    - Cosmetic-only warnings or geometries whose mating contract requires a closed channel bottom.
  transfer_limits:
    - Use as a candidate check to inspect native slicer warnings and projection support paths; do not force every vertical dovetail to Z zero.
