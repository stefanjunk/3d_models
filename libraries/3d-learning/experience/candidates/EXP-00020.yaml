observation:
  summary: Two narrower functional features that first appeared above the build plate produced native floating-cantilever warnings despite successful slice exits; grounding the same load paths at Z=0 removed the warnings.
  expected: A declared support-free system should slice with an empty native warning list while retaining the same key cross-section, caddy/hub orientation and one-tool process.
  actual: Initial 0.20 mm live output contained one warning for shared-center-hub. Revised 0.20 and 0.28 mm reports contain zero native/parser warnings. Independently, MM-ORG-034's 12 mm TPU ring centered within a 30 mm side-printed clip began at Z=9 mm and triggered the same warning; shifting the ring/connector flush to one side began them at Z=0 and final exact run-003 was warning-free, one-tool and 150 layers.
  outcome: mixed
  parameter: key_origin_z_mm
  recommended_value: null
  units: mm
explanation:
  hypothesis: The Z=3 mm key's first outward layer had no preceding material below it, so the slicer classified it as a floating cantilever; connecting the same cross-section to the build plate removed that unsupported start condition.
  mechanism: Extending the projection and its channel to Z=0 lets the key grow upward from bed-supported contours while preserving horizontal dovetail capture after assembly.
  alternatives:
    - The native warning heuristic may have changed due to another regenerated mesh detail.
    - A local chamfer, sacrificial web or bridge-tuned key could avoid the warning without a through-bottom channel.
    - Support could manufacture the Z=3 mm geometry but violates the selected no-support requirement and adds interface cleanup risk.
  validated: false
  validation_method: null
