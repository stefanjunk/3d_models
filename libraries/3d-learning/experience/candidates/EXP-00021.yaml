observation:
  summary: One polygon source produced three valid CAD shells and three A4 SVG outlines carrying the same 1.0 mm clearance, while deterministic checks retained exact template hashes and a separate height contract.
  expected: Template and CAD footprint identities remain coupled, every polygon/offset is valid, and the calibration/clearance gates are explicit.
  actual: Three distinct valid outer polygons, three noncollapsed inner offsets, three exact SVGs and five selected printable objects passed their digital checks and warning-free slicing.
  outcome: success
  parameter: measurement-template-to-cad-source-identity
  recommended_value: null
  units: workflow-contract
explanation:
  hypothesis: A single footprint function prevents redraw drift, while an in-plane calibration line and separate depth measurement limit two common sources of paper-template false precision.
  mechanism: The SVG and B-Rep consume identical ordered points and clearance; the user verifies page scale before tracing and supplies the orthogonal height separately.
  alternatives: [Manual CAD redraw from a sketch, photo-only scaling, full drawer scan, flexible universal filler.]
