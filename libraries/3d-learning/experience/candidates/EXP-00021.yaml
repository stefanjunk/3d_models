  design_parameters: {template_scale: 1.0, calibration_line_mm: 100.0, allowed_scale_error_percent: 0.5, selected_clearance_per_side_mm: 1.0, clearance_coupon_series_mm: [0.5, 1.0, 1.5], tray_height_mm: 40.0}
