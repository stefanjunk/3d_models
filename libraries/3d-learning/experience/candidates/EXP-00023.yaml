    - .agents/skills/functional-3d-design/scripts/select_watermark.py
applicability:
  triggers:
    - A safe product marking region cannot fit the Full metriMade identity mark without prohibited scaling.
  exclusions:
    - Safety, certification or statutory labels whose required visible fields cannot be omitted or rearranged.
    - Processes, nozzles, materials or orientations without tier-specific feature and legibility validation.
    - Customer-specific hidden tracking codes or forensic identification systems.
  transfer_limits:
    - Treat as an E0 digitally validated workflow candidate, not a universal minimum-feature rule.
