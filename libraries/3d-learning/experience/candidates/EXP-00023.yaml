  material_count: 0
  nozzle_count: 1
  measured: true
  measurement_method: Generated envelope metadata, exact selector decisions, SHA-256 manifests and deterministic watertight/positive-volume mesh audits.
  uncertainty: Physical first-layer legibility, character ambiguity, finishing durability and cross-process transfer remain unknown.
