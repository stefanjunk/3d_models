observation:
  summary: One top-face-down grid platform and two common-deck support coupons produced connected watertight meshes and warning-free exact Anycubic slices with generated support disabled.
  expected: The deck begins at manufacturing Z=0 and each overlapping support grows from prior printed layers without native floating-region warnings.
  actual: Platform and coupon exact reports passed with empty native warning strings; the strict project contract passed and retained physical load/creep as an optional human gate.
  outcome: success
  parameter: manufacturing-orientation-and-support-root-overlap
  recommended_value: use-top-face-down with 0.4 mm source overlap
  units: orientation-contract-and-mm
explanation:
  hypothesis: Printing the continuous deck first provides preceding-layer roots for every prismatic support, while explicit volumetric overlap prevents disconnected CAD bodies.
  mechanism: The 180 x 140 mm deck occupies manufacturing Z=0..4 and each support continues upward from that connected solid region.
  alternatives:
    - Print in use orientation with support generation and validate removal and underside quality.
    - Split the deck and legs into mechanically joined parts with separate interface validation.
    - Add gussets or thicker supports when physical buckling or creep evidence requires them.
  validated: true
  validation_method: Parametric source checks, exact-coordinate topology audits, strict 3MF audits, warning-free exact-profile native slices, G-code analysis and aggregate project validation; physical behavior excluded.
