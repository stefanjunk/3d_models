feature:
  type: recessed-product-identity-land
  geometry: 100 x 20 x 2 mm underside land carrying the unscaled R2 Full recessed mark
  design_parameters:
    initial_land_origin_y_mm: 70.0
    accepted_land_origin_y_mm: 90.0
    engraving_depth_mm: 0.4
    residual_wall_mm: 1.6
