observation:
  summary: The centered identity land intersected a center post and produced nine sealed glyph void shells; moving the land behind the post restored a single connected watertight result.
  expected: Every recessed glyph opens to the intended visible underside while the host stays one connected solid.
  actual: Y=70 mm yielded 10 exact-coordinate components; Y=90 mm yielded one component, zero boundary edges and a readable feature-edge render.
  outcome: mixed
  parameter: identity-land-position-relative-to-hidden-supports
  recommended_value: place the entire recessed land in a support-clear bay and assert one connected component
  units: datum-contract-and-mm
explanation:
  hypothesis: A support intersecting the back of a recessed glyph can close its opening and leave an enclosed inner surface that topology tools count as an additional shell.
  mechanism: Translating the land behind the center-post rear face removes the intersecting backing solid so each subtraction reaches the exposed underside.
  alternatives:
    - Move the mark to another nonfunctional clear bay.
    - Use a raised mark if local clearance and print orientation permit it.
    - Split or locally pocket the hidden support only if load-path validation allows it.
  validated: true
  validation_method: Exact-coordinate component audit, boundary-edge audit, selector report, source datum assertion and finished-underside feature-edge render; physical legibility excluded.
