    notes: One barefoot-shoe interface exposes a deterministic interpolation mismatch and correction; transfer to other interfaces is untested.
feature:
  type: protected-parametric-interface-regression
  geometry: Longitudinal left/right upper-to-sole boundary reconstructed from sparse semantic stations
  design_parameters:
    station_count: 12
    rejected_interpolation: natural-cubic
    accepted_interpolation: pchip
    rejected_dense_drift_mm_approx: 1.45
    accepted_dense_drift_mm: 1.7053025658242404e-13
    acceptance_drift_mm: 0.20
    dense_samples: 1001
  named_datums: [V6.1-sole-upper-interface, heel-end, toe-end]
  constraints:
    - Protected behavior is measured continuously between semantic stations, not only at the source knots.
    - The independent baseline is reconstructed from the prior revision's source configuration.
    - Visible freeform changes outside the protected interface remain allowed.
