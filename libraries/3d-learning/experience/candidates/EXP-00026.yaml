  nozzle: {diameter_mm: 0.4, material: unknown, geometry: null, hotend: null, wear_state: null}
  orientation: V6/V6.1 upper orientation; exact manufacturing orientation unresolved
  slicer: {name: Anycubic Slicer Next, version: null, profile: null, profile_hash: null}
  geometry_class: sparse-station freeform shoe interface with PCHIP baseline
  environment: deterministic Python/NumPy/SciPy geometry comparison; no physical print
  transfer_limits:
    - Applies only when a prior protected interface has a known interpolation contract.
    - Does not establish PCHIP as the correct method for every visible freeform curve.
observation:
  summary: Re-evaluating V6.1 sole stations with a natural cubic spline matched the knots but drifted between them; restoring PCHIP reduced dense interface drift to numerical noise.
  expected: V6.2 remains within 0.20 mm of the protected V6.1 sole/lip boundary across the full shoe length.
  actual: Natural cubic interpolation drifted by about 1.45 mm; independent PCHIP reconstruction measured 1.7053025658242404e-13 mm maximum drift over 1001 samples.
  outcome: correction
  parameter: sole-interface-interpolation
  recommended_value: Reuse the baseline interpolation family and run a dense independent regression between semantic stations.
  units: method-and-mm
explanation:
  hypothesis: Interpolation family is part of a sampled interface's design intent because equal knot values do not imply equal paths between knots.
  mechanism: Natural cubic and shape-preserving Hermite splines use different derivative constraints; the former overshot the PCHIP-defined width/shift/top curves between V6.1 stations.
  alternatives:
    - Store a denser immutable master curve and compare the candidate surface directly.
    - Use an analytic interface definition if the prior design exposes one.
  validated: true
  validation_method: Controlled interpolation substitution plus independent 1001-sample width, center and Z regression against V6.1 source data.
evidence:
  observations: 2
  same_scope_repetitions: 0
  geometry_count: 1
  machine_count: 0
  material_count: 0
  nozzle_count: 0
  measured: true
  measurement_method: Deterministic floating-point comparison of left/right interface points against independently reconstructed V6.1 PCHIP curves.
  uncertainty: The accepted residual is numerical precision; only this V6.1/V6.2 interface and SciPy implementation were tested.
  sources:
