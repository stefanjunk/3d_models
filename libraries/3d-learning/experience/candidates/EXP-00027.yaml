observation:
  summary: A topologically valid collar still failed visual review because its throat formed an isolated peak; after an explicit low-order edge profile, the 4.5 mm thick variant self-intersected until its offset tapered locally near the fairing.
  expected: One continuous soft collar loop, smooth visible rails, no voxel character, and collision-free printable variants.
  actual: Attempt 1 had a 61.9479 mm throat peak; the accepted 52.0/44.3/49.0 mm profile passed visual review, and tapering only the thick envelope to 2.6 mm near the collar reduced PyMeshLab self-intersections to zero across all exports.
  outcome: correction
  parameter: collar-edge-profile-and-local-offset
  recommended_value: Declare the edge-height profile, split fairness at removed-domain gaps, and cap thick local offsets using exported self-intersection evidence.
  units: profile-mm-and-domain-contract
explanation:
  hypothesis: Opening geometry creates both a visual boundary condition and a local curvature radius; global guide checks and uniform offsets can become invalid near that boundary.
  mechanism: The initial surface inherited a high anterior boundary value and paired rear shoulders; explicit periodic edge targets removed those peaks, while the 4.5 mm inward normal offset exceeded the locally safe curvature radius until tapered.
  alternatives:
    - Rebuild the entire upper from additional semantic loft sections rather than applying a local height fairing.
    - Reduce the thick variant globally, at the cost of its intended envelope thickness.
    - Use an offset-surface kernel with medial-axis collision trimming and revalidate the visible envelope.
  validated: true
  validation_method: Fixed-camera render rejection/acceptance, opening-aware dense curvature analysis, topology audits and PyMeshLab exported-face self-intersection checks.
