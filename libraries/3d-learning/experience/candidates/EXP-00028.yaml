observation:
  summary: One generic cassette supports two factual-dimension bobbin variants by changing only a removable insert, while separate gauges reproduce the final pocket targets and preserve physical fit as a human gate.
  expected: Adding a bobbin-size variant does not alter the ten presser-foot cells or host envelope, and the first-print gauge remains tied to final-part dimensions.
  actual: Both inserts pass the same 0.4 mm-per-side bay contract, expose seven pockets at nominal diameter plus 0.8 mm, and package with the unchanged cassette; the targeted source/report check passes.
  outcome: success
  parameter: host-insert-and-gauge-contract
  recommended_value: Keep the host interface invariant, derive final and gauge fit features from one parameter source, and qualify a variant with the gauge before the full kit.
  units: architecture-and-mm
explanation:
  hypothesis: Separating uncertain accessory fit from the reusable body localizes dimensional risk and lets one low-cost gauge screen both the variant choice and printer-process bias.
  mechanism: The host owns only the rectangular bay datum; each insert owns its accessory pockets, while the gauge reuses the same nominal targets before the main cassette is printed.
  alternatives:
    - Print one monolithic organizer per accessory standard.
    - Use adjustable dividers and accept lower spatial specificity.
    - Use a universal loose compartment without fitted pockets.
  validated: false
  validation_method: Digital parameter, interface, topology, package and exact-slicer checks only; no physical fit mechanism has been isolated.
