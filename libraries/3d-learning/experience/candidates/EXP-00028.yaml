feature:
  type: interchangeable-measured-fit-insert-family
  geometry: 210 x 150 x 28 mm generic cassette with a 205.2 x 46 mm rear bay, two 204.4 x 45.2 mm seven-pocket inserts and separate fit gauges
  design_parameters:
    insert_clearance_per_side_mm: 0.4
    bobbin_diametral_clearance_mm: 0.8
    cb_nominal_diameter_mm: 20.5
    horizontal_nominal_diameter_mm: 21.6
    presser_foot_gauge_widths_mm: [30.0, 35.0, 40.0]
    insert_index_bars: [1, 2]
  named_datums: [rear-bay-inner-faces, insert-envelope, bobbin-pocket-axis, gauge-pocket-axis]
  constraints:
    - Compatibility is stated with measured dimensions rather than a universal or brand-wide claim.
    - Gauge and final pockets derive from the same nominal-diameter and clearance parameters.
    - The reusable host remains unchanged when the bobbin insert standard changes.
    - Physical gauge results remain authoritative for the intended accessories and printer.
scope:
  process: FFF
  machine: {manufacturer: Anycubic, model: Kobra 3 Max, unit_id: null, firmware: null}
