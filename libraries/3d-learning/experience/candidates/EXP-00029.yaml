    notes: One Anycubic Slicer Next PLA G-code exposes the arithmetic effect; other files, precision modes, slicers and physical flow remain untested.
feature:
  type: gcode-rounded-coordinate-flow-validation
  geometry: MM-ORG-037 CB cassette-plus-insert plate with a 0.00224 mm extrusion lead-in segment
  design_parameters:
    gcode_decimal_precision: 5
    profile_flow_limit_mm3_s: 13.0
    raw_parser_peak_mm3_s: 14.521609422147138
    raw_peak_segment_length_mm: 0.002236067977472335
    macro_segment_threshold_mm: 0.05
    macro_peak_mm3_s: 12.748795750204946
    macro_acceptance_limit_mm3_s: 13.3
  named_datums: [gcode-line-108794, previous-feed-F9000, profile-volumetric-limit]
  constraints:
    - Exact manufacturing G-code and exact profile remain unchanged.
    - Any raw-flow allowance is confined below a declared microsegment length.
    - All extrusion segments at or above the macro threshold pass a separately tighter limit.
    - A macro-segment excess remains fail-closed.
scope:
  process: FFF
  machine: {manufacturer: Anycubic, model: Kobra 3 Max, unit_id: null, firmware: null}
  material: {manufacturer: Anycubic, product: PLA profile, variant: standard, color: null, batch: null, conditioning: null}
  nozzle: {diameter_mm: 0.4, material: unknown, geometry: null, hotend: null, wear_state: null}
  orientation: MM-ORG-037 cassette and CB insert base-down on one plate
  slicer: {name: Anycubic Slicer Next, version: 1.3.9.4, profile: 0.20mm Standard @Anycubic Kobra 3 Max 0.4 nozzle, profile_hash: dec0a101aaa644997c96146f4aaf1973b7f710e73f023c4871024833ad200b81}
  geometry_class: rounded absolute-E linear G-code reconstructed from endpoint coordinates
  environment: deterministic offline G-code parsing; no printer upload, print or physical flow measurement
  transfer_limits:
    - Applies only to endpoint-derived estimates from rounded emitted coordinates when the exact excess segment and macro domain are preserved.
    - Does not justify exceeding a material/profile limit, rewriting G-code, or relaxing checks for sustained paths.
observation:
  summary: The raw endpoint parser exceeded the 13 mm3/s profile value on a 0.00224 mm lead-in, while an independent length-aware pass found every extrusion segment at least 0.05 mm long at or below 12.75 mm3/s.
  expected: Exact-profile G-code passes without hiding a real sustained flow excess or mutating the manufacturing artifact.
  actual: A flat 13.3 mm3/s raw ceiling rejected the file; a bounded two-domain check retained the exact file and passed only after localizing the excess below 0.01 mm and verifying the macro domain separately.
  outcome: correction
  parameter: parser-flow-allowance-domain
  recommended_value: Record both raw and macro peaks with source line and segment length; allow a raw excess only for a declared rounded-coordinate microsegment while the macro domain stays tightly bounded.
  units: mm3/s-and-mm
explanation:
  hypothesis: Rounding absolute extrusion and position endpoints to finite decimals can disproportionately perturb a flow ratio when both distance and extrusion are extremely small.
  mechanism: The `E0.00009` increment is divided by a 0.00224 mm motion duration; endpoint quantization therefore dominates the reconstructed instantaneous ratio even though neighboring printable-length paths remain under the profile limit.
  alternatives:
    - Have the slicer emit higher-precision coordinates.
    - Derive flow from unrounded internal slicer paths if an authoritative trace is available.
    - Fail the file if the excess occurs on any macro segment or cannot be independently localized.
  validated: true
  validation_method: Two independent parsers agree on line, flow and segment length; a separate macro-segment scan is bound into the print-candidate gate. Physical extrusion response is explicitly excluded.
