applicability:
  triggers:
    - A rigid slot must accept uncertain paper or card stock before a larger product is printed.
    - Multiple final groove depths or tapers could change grip or hidden-content margin.
  exclusions:
    - Safety-critical retention, load-bearing joints, flexible clips, wet materials, universal stock-fit claims, or stock outside the declared range.
  transfer_limits:
    - Treat as an E0 architecture candidate; do not reuse its project-specific gap or angle values without a scoped physical test.
