applicability:
  triggers:
    - A fixed external flow audit fails an exact slice and the excess is not accepted by a separately validated rounded-microsegment rule.
    - The slicer supports an explicit project filament profile with a lower volumetric ceiling.
  exclusions:
    - Unbounded or sustained flow excess, unknown machine/material profiles, edited G-code, printer-side overrides, physical flow qualification, or safety-critical parts.
  transfer_limits:
    - Treat the 0.2 mm3/s adjustment as project evidence only; choose and validate headroom per profile, slicer precision and geometry.
