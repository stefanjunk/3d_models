observation:
  summary: The stock 13.0 mm3/s filament profile produced a 13.453 mm3/s parser peak that failed the fixed 13.3 audit; an otherwise equivalent fresh slice with an inherited 12.8 mm3/s profile passed at 13.246 mm3/s, and both complete kits also passed.
  expected: Manufacturing candidates satisfy the predeclared audit without weakening the ceiling or mutating G-code.
  actual: Stock gauge run-001 was preserved as FAIL. Conservative gauge run-002 and the square and round complete-kit runs were freshly generated, hash-bound, warning-free, and independently parsed below 13.3 mm3/s.
  outcome: correction
  parameter: explicit-filament-volumetric-headroom
  recommended_value: If an exact flow excess is outside the separately approved rounded-microsegment scope, lower the explicit inheriting filament-profile ceiling modestly, reslice to a fresh directory, and re-run the unchanged audit.
  units: workflow-and-mm3/s
explanation:
  hypothesis: Small explicit volumetric headroom lets the slicer reduce nominal path speed enough for finite-coordinate reconstruction to remain below an unchanged external ceiling.
  mechanism: Lowering the slicer-side maximum from 13.0 to 12.8 mm3/s reduced the emitted feed on the limiting path; the independently reconstructed peak fell by about 0.207 mm3/s while geometry and process settings remained fixed.
  alternatives:
    - Use the bounded microsegment allowance from EXP-00029 when its exact length and macro-domain conditions pass.
    - Lower process speeds or select a physically qualified filament profile with a lower volumetric limit.
    - Fail closed and defer the candidate if no fresh exact slice satisfies the audit.
  validated: false
  validation_method: One paired exact slice plus two same-profile companion plates and deterministic regression; slicer nondeterminism and physical extrusion behavior remain unisolated.
