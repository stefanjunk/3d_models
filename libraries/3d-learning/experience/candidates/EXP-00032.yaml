observation:
  summary: Circular add-on ribs did not make the segmented drum-chain hull read as one fish; a shared side/top envelope with restrained crests and fins was selected and implemented after the user correction.
  expected: The neutral articulated assembly should read as a streamlined fish while its functional modules and hardpoints remain exact.
  actual: The approved concept and production candidate use global guides and registered loft sections; deterministic tests report zero hardpoint drift and passing mesh/motion checks, while final human appearance review remains open.
  outcome: correction
  parameter: silhouette-construction-order
  recommended_value: Define and review the global envelope first, then use broad shallow crests and restrained fins only as secondary silhouette cues.
  units: workflow
explanation:
  hypothesis: Viewers read the continuous outer contour and taper before they read local ribs or fin cues, so a globally coordinated envelope is more likely to establish the intended animal silhouette than protrusions on an unchanged cylindrical base.
  mechanism: Shared side/top guides coordinate module height, width and taper across neutral joint planes; fins then reinforce dorsal, lateral and caudal landmarks without altering functional cores.
  alternatives:
    - Stronger per-module ellipse taper without longitudinal crests.
    - Fins alone on the baseline cylinders.
    - A continuous flexible skin spanning joints, which was excluded because it would change motion and sealing scope.
  validated: false
  validation_method: One concept approval, fixed-view production renders and deterministic CAD/mesh regression; no cross-geometry or physical validation.
