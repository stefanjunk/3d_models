applicability:
  triggers:
    - A segmented or modular aquatic body is intended to read as one organic animal but still reads as a chain of cylinders, boxes or drums.
    - Functional hardpoints prevent replacing the internal modules with a monolithic sculpted shell.
  exclusions:
    - Continuous flexible skins, rigid monolithic hulls, scanned animal replicas or parts whose hydrodynamics have already been physically optimized.
  transfer_limits:
    - Re-tune guides, sections, fin roots, clearances and print orientation for every product; do not reuse these dimensions as defaults.
