observation:
  summary: Draft 2 passed watertight topology but the user still saw front and rear holes and an unnecessary upper peak above the collar; Draft 3 added material-filled terminal zones and lowered the forward centerline, then passed topology, section-area and fixed-view checks.
  expected: A closed shoe upper should show no heel/toe tunnel and should transition from the collar toward the forefoot without a second higher crest.
  actual: Draft 2 exposed visible inner arches and a 7.1341 mm collar-relative peak; Draft 3 measured 0.0 mm2 terminal residual aperture and a non-increasing centerline with maximum z=52.0 mm.
  outcome: correction
  parameter: terminal-material-closure-and-collar-relative-centerline
  recommended_value: Declare intended closed-end sections and collar-relative silhouette relationships explicitly, then grade material sections, exported mesh integrity and fixed end/side views together.
  units: boundary-and-visual-contract
explanation:
  hypothesis: Watertightness alone only proves a closed boundary representation; it does not prove that a hollow shell's terminal silhouette is material-filled or that its freeform height hierarchy matches the intended collar transition.
  mechanism: The earlier hollow shell legally closed around an annular terminal arch while its unconstrained natural-cubic height stations overshot the collar; explicit solid terminal regions and collar-relative centerline stations removed the two independent visible failures.
  alternatives:
    - Build each terminal as an analytic closed loft section instead of unioning a local solid plug.
    - Extend the mating sole or toe/heel bumper to mask the shell aperture, which would change protected product scope.
    - Accept a non-monotonic upper ridge if a future approved concept intentionally requires it.
  validated: true
  validation_method: Controlled Draft-2/Draft-3 geometry comparison, section material-area checks, dense centerline sampling, exact-coordinate mesh audits and hash-bound fixed-camera visual review.
