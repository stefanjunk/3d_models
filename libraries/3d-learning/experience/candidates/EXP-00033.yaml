applicability:
  triggers:
    - A hollow freeform shell terminates at a visible end and is intended to read as solidly closed.
    - A collar or opening is the approved height datum for an adjacent upper surface.
  exclusions:
    - Intentionally ventilated/open terminal designs or approved sculptural ridges above the collar datum.
    - Monolithic solids without an inner terminal contour.
  transfer_limits:
    - Re-establish datums, wall/closure dimensions and visual intent for every product; only the combined outcome-check structure is proposed for reuse.
