observation:
  summary: "The user accepted the R6 catcher direction, rejected its mounting/setup, then rejected the stationary R7 dock proposal because the Wiper and purge source move along Z."
  expected: "A useful purge catcher should preserve close interception while being simple to place, empty and clean without disturbing the printer or requiring two independent alignments."
  actual: "R6 uses an unverified screw adapter and long vertical slide; the intermediate R7 dock removed Wiper load but incorrectly fixed the catcher in the world frame while the purge source moves with the Wiper along Z."
  outcome: correction
  parameter: service-and-datum-chain-architecture
  recommended_value: "Before retaining any machine accessory interface, grade source coordinate frame, load owner, sensitive-host interaction, datum/transfer chain, service path, wrong-assembly states, repeated placement and full-motion evidence together."
  units: interface-contract
explanation:
  hypothesis: "The rejected experience is caused by the system-level coordinate-frame, load, datum and service chain rather than by the local catch geometry alone."
  mechanism: "R6 couples normal service to an unverified moving Wiper interface, while the intermediate dock overcorrected by placing the local catcher in the stationary frame; neither architecture had yet reconciled source motion, low moving mass, short service and the non-contact transfer to storage."
  alternatives:
    - "The digital R6 depiction may undersell an interface that would be acceptable after real fit and access testing."
    - "The source could purge only at firmware-restricted heights, but no machine/G-code evidence currently supports designing around that assumption."
    - "A fully measured direct clip could outperform a freestanding dock where floor space is the dominant requirement."
    - "The loose lower bin may be adequate if the real purge trajectory and work surface are unusually tolerant."
