observation:
  summary: "The user accepted the R6 catcher design direction but rejected its mounting, setup and physical interface after comparing several local examples."
  expected: "A useful purge catcher should preserve close interception while being simple to place, empty and clean without disturbing the printer or requiring two independent alignments."
  actual: "R6 places the accessory load on an unverified Wiper screw adapter, removes the catcher vertically through a tolerance-sensitive slide and leaves the lower bin independently positioned."
  outcome: correction
  parameter: service-and-datum-chain-architecture
  recommended_value: "Before retaining any machine accessory interface, grade its load owner, sensitive-host interaction, datum chain, service path, wrong-assembly states, repeated placement and full-motion evidence together."
  units: interface-contract
explanation:
  hypothesis: "The rejected experience is caused by the system-level load, datum and service chain rather than by the local catch geometry alone."
  mechanism: "A service-sensitive Wiper becomes the structural support while a second freestanding body owns storage, so installation, removal and bin placement can each disturb function independently even when the local slide fits."
  alternatives:
    - "The digital R6 depiction may undersell an interface that would be acceptable after real fit and access testing."
    - "The user may primarily object to visual bulk rather than the load or datum chain."
    - "A fully measured direct clip could outperform a freestanding dock where floor space is the dominant requirement."
    - "The loose lower bin may be adequate if the real purge trajectory and work surface are unusually tolerant."
