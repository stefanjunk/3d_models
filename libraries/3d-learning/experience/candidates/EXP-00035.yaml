observation:
  summary: "A stationary Dock-Tower was proposed after the mounting interface was rejected, but the user clarified that the Wiper and purge source rise along Z and can eject purge at higher positions."
  expected: "The capture head should remain adjacent to the purge source throughout operation while storage capacity stays off the moving Wiper."
  actual: "The stationary proposal fixed the catch opening at one world-Z position and would need a full-height tower to cover the moving source; the user instead requested a Wiper-mounted catcher with immediate downward diversion."
  outcome: correction
  parameter: source-and-catcher-coordinate-frame
  recommended_value: "Before architecture selection, identify the emitting source's coordinate frame and full travel; co-move the local catcher or prove complete stationary coverage, then verify the downstream transfer at representative travel positions."
  units: interface-contract
explanation:
  hypothesis: "The failed proposal assigned the local catch function to the stationary machine frame even though the emitting source belongs to the moving Wiper frame."
  mechanism: "As the Wiper translates in Z, a fixed catch opening loses source-relative alignment; extending stationary geometry across the full travel restores coverage only by adding bulk and collision area. A lightweight local head keeps the short source-relative path while gravity transfers waste to stationary storage."
  alternatives:
    - "Firmware or G-code may restrict purge to a few known heights, but no evidence currently supports using that restriction as a requirement."
    - "A flexible hose could connect moving and stationary stages, but may add drag, snagging, purge adhesion and service burden."
    - "A stationary wide or full-height receiver could work if its complete envelope and keep-outs were proven, despite the user's stated preference against a tower."
    - "A direct one-piece screw mount may reduce mass relative to a quick release but could worsen cleaning and repeated machine-fastener service."
