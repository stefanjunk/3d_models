observation:
  summary: "User noticed that the r2 concept main view of the TrailCam CF10 rover showed only two wheels while the underside view showed four; regenerating r3 with an explicit two-axle/four-wheel constraint for every view resolved the inconsistency."
  expected: "Every full-vehicle view of the concept sheet shows four wheels on two axles, matching the approved requirements."
  actual: "The r2 main view omitted the far-side wheels (two visible wheels, one-axle impression) while the r2 underside view showed four wheels; the sheet was internally inconsistent."
  outcome: correction
  parameter: wheel/axle depiction consistency across views
  recommended_value: "state wheel and axle count as a hard per-view prompt constraint and self-review every view before presenting the sheet"
  units: null
explanation:
  hypothesis: "Image generators treat far-side wheels as occludable detail unless the wheel/axle count is stated as a hard constraint per view; multi-panel sheets drift in consistency between panels."
  mechanism: ""
  alternatives:
    - "the reference image layout dominated generation and missing far-side wheels were inherited"
    - "panels were generated without a shared vehicle structure graph"
