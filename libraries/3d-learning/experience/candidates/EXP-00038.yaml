observation:
  summary: "An experimental suspension source diverged from the approved double-wishbone/ball-joint decomposition, statically collided with the chassis and over-constrained steering and drivetrain motion."
  expected: "Upper and lower wishbones locate each upright through approved pins/ball joints, the shock only springs/damps, two chassis-fixed motor modules drive articulated half-shafts, and the neutral/swept assembly has required clearance."
  actual: "The source used one lower/trailing arm, named the shock as the upper link, rigidly fastened the carrier with two vertical screws, added a motor clamp and chassis tabs to every carrier, and produced 434.408 mm3 arm/chassis plus 713.987 mm3 carrier/chassis common volume per measured side."
  outcome: failure
  parameter: suspension_joint_topology_and_degrees_of_freedom
  recommended_value: "trace every locating, steering, damping and drive function to an approved joint/part before refining solids; fail the source when joint topology or degrees of freedom differ"
  units: null
explanation:
  hypothesis: "Part-by-part geometry refinement can appear locally plausible while silently changing the mechanism when the approved joint graph and degrees of freedom are not asserted as source-level contracts."
  mechanism: "Using the shock as a locating link removes the approved upper arm; two separated vertical carrier fasteners remove steering rotation; carrier motor clamps plus chassis tabs over-constrain suspension and change the purchased-component count."
  alternatives:
    - "The experimental source may have been intended only as a static packaging proxy but was named and exported like component CAD."
    - "Ambiguous use of 'carrier' and 'rigid axle housing' may have mixed independent-suspension and live-axle concepts."
    - "Missing exact purchased motor, joint, wheel and shock geometry encouraged placeholders to become unintended interfaces."
