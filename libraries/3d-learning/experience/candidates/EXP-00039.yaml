applicability:
  triggers:
    - A successful image-derived repeating texture is being transferred to a different FFF product or surface orientation and full-resolution engraving would create excessive mesh or compute cost.
  exclusions:
    - Recognizable heightmap subjects whose local continuous-tone relief cannot be tiled or phase-cropped without changing the subject.
    - Functional mating, sealing, bearing, label or grip surfaces where relief has not been separately allowed.
    - Nozzles, layer heights, materials, machines or orientations outside the recorded scope without a new coupon.
  transfer_limits:
    - Treat 0.45, 0.50 and 0.60 mm as experiment candidates for this coupon, not universal texture resolutions.
    - Do not infer that coarser sampling preserves every pattern; spatial content and mapping must be held constant and physically reviewed.
