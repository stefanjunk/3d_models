  recommended_value: null
  units: mm
explanation:
  hypothesis: Physical surface sampling near the extrusion width, local print orientation and the texture's spatial-frequency content may dominate visible fidelity after a practical raster resolution has been reached.
  mechanism: A denser source image cannot create printable detail below the deposited line/layer response, while geometry-dependent extrusion direction, seams, curvature and grazing light can reinforce or suppress the same relief. Sampling only the exposed patch at a physical pitch can therefore reduce mesh cost without necessarily reducing printed quality.
  alternatives:
    - The successful and unsuccessful prints may differ mainly in filament color, gloss, drying, flow calibration or temperature.
    - Different source images may have different tonal range, feature scale, seams or relief-depth normalization.
    - Surface curvature, mapping distortion, wall count, seam placement or lighting may explain the reported difference independently of orientation.
    - The repository's 0.20 mm Honeycomb default and the user's 0.12 mm actual-print statement may refer to different revisions.
  validated: false
  validation_method: "Print the unchanged A/B/C upright coupon at 0.4 mm nozzle and 0.12 mm layers, then use the fixed-condition physical rubric."
