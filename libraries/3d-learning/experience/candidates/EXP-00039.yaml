  summary: The user reports that the image-derived wood surface printed very well on the Honeycomb shelf, while other products and patterns were less successful, using a 0.4 mm nozzle and 0.12 mm layers.
  expected: Image engraving with comparable source quality would transfer consistently to other products and patterns.
