applicability:
  triggers:
    - A purchased telescoping or articulated shaft is selected between a fixed gearbox/spool and a suspended or steerable upright.
    - Compatibility is currently inferred from nominal track, axle width or neutral installed length.
  exclusions:
    - Rigid axles whose verified joint centers do not move relative to each other
    - Shafts with supplier-authoritative full-motion CAD and operating limits already proven against the same installed datums
  transfer_limits:
