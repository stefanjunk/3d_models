observation:
  summary: A halfshaft family that appeared compatible from nominal track/spool arithmetic only partially overlapped its published length range when the declared three-dimensional suspension and steering sweep was evaluated.
  expected: The provisional RC4WD VVV-S0183 published 55–70 mm length envelope would contain every halfshaft length in the v2 point model.
  actual: The deterministic point model spans 53.056684–55.105130 mm and 0.003371–21.522384 degrees, so most short-length poses fall below 55 mm; the supplier publishes no running articulation, plunge-under-angle, minimum engagement or torque limit.
  outcome: failure
  parameter: installed halfshaft length and articulation over the complete required motion matrix
  recommended_value: null
  units: mm and degrees
explanation:
  hypothesis: Nominal track-minus-spool arithmetic omits the exact inner/outer joint-center positions and their three-dimensional movement under suspension and steering, so it can falsely suggest COTS compatibility.
  mechanism: Steering rotates the upright-fixed outer joint around an inclined axis while unequal wishbones translate and roll the upright; the resulting shaft vector changes in x, y and z rather than only across half the track.
  alternatives:
    - The current proxy joint centers may not match the eventual measured cups and stub axle; a farther-out outer joint could place all poses inside the published range.
    - The supplier's 55–70 mm values may describe overall installation extrema rather than a safe running range with adequate spline engagement.
    - A different spool width, cup adapter or shaft family may satisfy the sweep without changing suspension geometry.
  validated: false
  validation_method: Measure one exact shaft sample at declared angles and engagements, freeze both installed joint centers, then rerun the deterministic full-pose eval and a guarded torque bench test.
