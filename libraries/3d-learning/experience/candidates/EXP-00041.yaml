observation:
  summary: The rejected R7-DRAFT-1 stored the four measurements in parameters, but only the 17 mm screw pitch was verifiably represented in the generated geometry; the user correctly could not find a model matching all dimensions.
  expected: All 17, 10, 37 and 40 mm measurements would be visible as mounting, capture or keep-out relationships in the generated model and validation evidence.
  actual: R7-DRAFT-1 treated multiple values as documentation-only parameters; R7-DRAFT-2 now binds all four to named features and reports zero nominal deviation.
  outcome: correction
  parameter: measured datum to CAD-feature binding
  recommended_value: null
  units: mm
explanation:
  hypothesis: A requirements table can appear complete while the CAD silently ignores entries unless every measurement has a named geometric consumer and an independently graded relation.
  mechanism: R7-DRAFT-2 constructs the hole/slot centers, capture zone, capture-center plane and rear keep-out from the measurement fields, then compares actual geometric relations with the expected values.
  alternatives:
    - Some photo endpoints may have been interpreted differently than the physical reference intended.
    - Nominal equality in the generator may still miss physical printer offsets or tolerance stack-up.
  validated: true
  validation_method: Fresh generator run plus deterministic regression test of all four named bindings and the associated geometry checks.
