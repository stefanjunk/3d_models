applicability:
  triggers:
    - A user states that a generated model does not match dimensions already present in requirements or parameter files.
    - Functional CAD is driven by photographed or manually recorded machine-interface measurements.
  exclusions:
    - Purely descriptive values intentionally not used as geometry or keep-outs
    - Values already proven by an authoritative imported interface model with equivalent named-datum checks
  transfer_limits:
    - E0 correction candidate; use for targeted review and regression planning, not as a universal production rule.
    - The physical measurement method and tolerance must still be selected per interface.
