observation:
  summary: All seated arm-eye proxies had zero host overlap and nominal clearances passed, yet the outgoing straight arm-neck proxy intersected the same host across the suspension sweep.
  expected: A clevis with adequate axial/radial eye clearance and a relieved rail pocket would also admit the provisional straight 6 mm arm-neck route.
  actual: Eye overlap is zero, but the maximum straight-neck overlap is 28.490562 mm3 for a lower leg and 46.275362 mm3 for an upper leg; the final arm therefore needs a separately validated dog-leg, taper or host transition.
  outcome: failure
  parameter: swept Boolean intersection between the host and the arm section immediately outside each inboard eye
  recommended_value: null
  units: mm3
explanation:
  hypothesis: A seated-eye clearance check ignores the volume occupied by bosses, rail walls and tower webs along the moving arm's outgoing direction.
  mechanism: The arm rotates about the longitudinal inboard axis while its two legs converge on the outer joint, so a finite-radius neck leaves the eye obliquely and can enter adjacent host material even when the eye cylinder itself is clear.
  alternatives:
    - A tapered or dog-leg neck may route through the available corridor without changing the approved joint centers.
    - Local host relief may be possible if boss ligament, rail continuity and tire clearance remain valid.
    - The 6 mm cylindrical proxy may overstate a final noncircular load-aligned section, but reducing it without strength evidence would not establish a pass.
  validated: false
  validation_method: Generate a structural arm-neck candidate, sweep its full B-Rep against both host variants and all protected envelopes, then verify fit and motion with a printed, reamed physical coupon.
