applicability:
  triggers:
    - A printed wishbone or linkage eye sits inside a chassis clevis and the arm leaves the eye toward a remote joint.
    - Interface approval currently checks only pin fit, clevis gap, boss ligament or the eye cylinder.
  exclusions:
    - Pure revolute links whose complete swept solid has already been collision-tested against the same host
    - Supplier-authoritative joint assemblies with verified full-motion CAD and equivalent installed clearance evidence
  transfer_limits:
    - E0 digital observation; use to plan targeted checks, not as a universal geometry rule or clearance value.
    - Required proxy section, poses and collision tolerance must be justified per mechanism.
