observation:
  summary: The R7-DRAFT-2 datum illustration looked plausible to the user, but the user stated that the generated models would not fit the real machine.
  expected: A model advertised as the current print candidate would occupy a measured free machine envelope and mount through physically confirmed hardware and service paths.
  actual: Digital checks proved self-consistency only. The model assigned 37 mm to its own catcher center, 40 mm to one reference plane and 10 mm to a plane within its own capture zone while stock machine solids and the full installation envelope were absent.
  outcome: failure
  parameter: internal-datum-proof versus external-machine-fit proof
  recommended_value: null
  units: interface-contract
explanation:
  hypothesis: The fit rejection arose because an internally consistent accessory coordinate model was mistaken for a registered external interface model.
  mechanism: Without machine-side solids or conservative measured keep-outs, the checker can prove accessory topology and nominal relationships while being mathematically unable to detect collisions, mirror/orientation errors or insufficient installation clearance.
  alternatives:
    - The catcher may be on the wrong side or mirrored relative to the physical Wiper.
    - The 62 x 44 x 62 mm envelope may collide with stock purge hardware, head, roller, cable or bed.
    - The assumed 18 x 41 x 2.4 mm plate, 4.4 mm holes or 8.5 mm head keep-out may not match the real fasteners and bracket.
    - More than one of these unresolved causes may contribute.
