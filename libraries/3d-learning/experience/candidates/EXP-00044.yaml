applicability:
  triggers:
    - A machine accessory is intended for one printer variant while available CAD, meshes, photos or measurements name a sibling variant.
    - A product-family name is being used as if it proved a shared mounting or keep-out interface.
  exclusions:
    - The manufacturer explicitly documents the exact interface as identical across the named variants.
    - Both physical variants have been compared against the same named datums with recorded uncertainty.
  transfer_limits:
    - E0 correction candidate; use for targeted review and experiment planning, not as a universal incompatibility claim.
    - Required evidence depth depends on interface risk and the consequences of non-fit.
