observation:
  summary: The product folder suggested Kobra 3 Max while every dimensioned reference described Kobra 3, so the target variant remained blocked until the user explicitly confirmed Kobra 3 Max.
  expected: The exact printer variant and the applicability of every dimensional reference are explicit before any machine-interface geometry is created.
  actual: The user confirmed Kobra 3 Max; the requirements now keep the Kobra 3 dimensions as construction-only evidence and leave all Max interface fields unknown.
  outcome: correction
  parameter: target-printer variant identity and dimensional-evidence applicability
  recommended_value: Confirm the exact target variant and quarantine sibling-variant dimensions until target-specific physical or authoritative compatibility evidence exists.
  units: interface-contract
explanation:
  hypothesis: Shared family naming can make a plausible sibling-variant mesh appear authoritative for an unmeasured target interface.
  mechanism: The reference title and files name Kobra 3, while the target is Kobra 3 Max and official replacement-part information treats their printhead assemblies as distinct variants; therefore a numerical transfer lacks an evidence bridge.
  alternatives:
    - The covers may coincidentally share an interface, but that remains an unverified compatibility hypothesis.
    - A later target-specific supplier drawing or physical comparison may establish some shared datums.
  validated: false
  validation_method: Measure the Kobra 3 Max original cover or compare both physical covers against named datums, then qualify a minimal Max interface coupon.
