applicability:
  triggers:
    - A large printed artwork is divided because the assembled envelope exceeds the printer bed.
    - Terms such as multipart, modular or multiple prints appear without explicit lifecycle/service intent.
    - Magnets, replaceable tiles or a rear carrier are being proposed for a commissioned one-off.
  exclusions:
    - Replaceability, transport breakdown, recurring maintenance or interchangeable content is an explicit approved requirement.
    - A rear carrier is explicitly requested or independently required by validated loads and mounting constraints.
  transfer_limits:
    - E0 correction candidate; use to trigger requirement separation and targeted review, not to prohibit all modular systems.
    - The smallest part count still depends on bed margin, warping, handling, transport and actual process evidence.
