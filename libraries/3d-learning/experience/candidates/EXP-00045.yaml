feature:
  type: multipart-wall-art-lifecycle-architecture
  geometry: 600 x 400 mm wall relief split into bed-fitting printed main parts with optional rear halo lighting
  design_parameters:
    previous_print_split: "3 x 2 replaceable 200 x 200 mm tiles"
    corrected_print_split: "2 x 1 permanent 300 x 400 mm halves"
    target_printer: "Anycubic Kobra 3 Max Combo"
