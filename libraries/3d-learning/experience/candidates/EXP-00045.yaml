    - permanent center seam
    - concealed one-way connector pockets and spring roots
    - local hanger/standoff snap sockets
    - isolated hanger/standoff wall plane
  constraints:
    - Manufacturing segmentation and customer service segmentation are separate requirement decisions.
    - A permanent one-off split only to fit the print bed receives no magnets, removable retainers or service-cycle acceptance tests.
    - Local seam joiners and isolated standoffs do not become a full rear grid or exchange interface.
