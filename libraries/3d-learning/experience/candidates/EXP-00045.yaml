observation:
  summary: The initial architecture incorrectly turned a request for multiple prints into six replaceable tiles on a magnetic rear grid; the user required no rear grid, no replaceability and one permanent one-off per pilot.
  expected: The workflow asks or records lifecycle intent independently from printer-bed segmentation and selects the fewest reasonable main parts that fit the verified machine.
  actual: Revision 0.2.0 added a segmented grid, magnets and service interfaces that were not required; revision 0.3.0 now records an approved permanent two-half architecture with glue-free one-way connectors and snap-in local standoffs, while physical interfaces remain coupon-gated.
  outcome: correction
  parameter: relationship between manufacturing split and lifecycle/service architecture
  recommended_value: Treat bed-fit splitting as manufacturing decomposition only unless replaceability or repeated service is explicitly approved.
  units: architecture-contract
explanation:
  hypothesis: The phrase "from multiple prints" was conflated with modular ownership and serviceability rather than interpreted as a printer-envelope constraint.
  mechanism: A 3 x 2 tile solution introduced a separate rear-grid owner, magnets, retention datums, seven visible seams and service-cycle requirements even though the 420 x 420 mm bed permits two 300 x 400 mm halves and the customer wants one permanent artwork.
  alternatives:
    - Six permanent tiles could satisfy non-replaceability, but add unnecessary seams and alignment work on the verified target machine.
    - A separate rear frame could simplify hanging, but the user explicitly rejected a rear grid and it remains outside the current requirement.
  validated: false
  validation_method: Apply the targeted lifecycle-intent eval now, then validate the selected one-way seam connectors and isolated snap-in standoffs with process-matched coupons before full assembly.
