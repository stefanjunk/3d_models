applicability:
  triggers:
    - A successful image-derived relief is transferred to another FFF geometry and a lower-cost raster or mesh representation is proposed.
  exclusions:
    - Primarily optical material effects that do not need height geometry.
    - Recognizable nonrepeating subjects where patch repetition changes the design.
    - Functional interfaces or sealing surfaces without a separately approved relief allowance.
    - Other patterns, scales, nozzle sizes, layer heights, orientations, machines or materials without a new controlled coupon.
  transfer_limits:
    - Preserve the reference preprocessing and sampler until an A/B comparison shows that an optimization is physically equivalent.
    - Treat the 0.45 mm grid, 120 x 45 mm patch and 0.6/0.9 mm depths as NameForm experiment values, not universal settings.
