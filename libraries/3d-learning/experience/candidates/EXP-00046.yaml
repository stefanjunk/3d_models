observation:
  summary: The prefiltered v0.1 coupon looked flat, while the later direct-sampled v0.2 candidate C was reported to look quite good and was selected for the next NameForm design.
  expected: Preserving full-master direct sampling while limiting only the 0.45 mm physical geometry grid would retain enough of the Honeycomb wood character for a repeating NameForm patch.
  actual: The v0.1 fields failed visually; after the direct-transfer correction, the user selected C with its 120 x 45 mm patch, 24 px seam blend, 0.6 mm depth, and 0.45 mm grid. A/B/D and seam quality were not separately reported.
  outcome: mixed
  parameter: preprocessing and sampling pipeline equivalence
  recommended_value: "direct full-master bilinear sampling at the physical mesh vertices; no low-resolution build-raster prefilter"
  units: null
explanation:
  hypothesis: The added Lanczos downsampling before mesh sampling suppressed much of the source contrast and was a major contributor to the visually flat v0.1 print; the physical C preference supports preserving direct sampling but does not isolate every alternative cause.
  mechanism: On an equivalent 45 x 45 mm wall patch, direct full-master sampling retains a normalized P95-P5 span of 0.5763 while the failed build-raster path retains 0.3760. At 0.6 mm maximum depth this reduces robust modeled relief span from about 0.346 mm to 0.226 mm before slicing. Limiting only the physical mesh grid avoids paying for source-image pixels as geometry while preserving the successful sampling behavior.
  alternatives:
    - Upright perimeter deposition may suppress the relief even when the direct-sampled mesh has adequate digital amplitude.
    - The failed coupon may differ from the shelf in filament color, gloss, drying, temperature, flow, wall count or seam placement.
    - Physical scale or source-axis mapping may be more important than the prefilter.
    - The absence of photos or measured surface depth can hide an orientation or lighting failure rather than a geometry-amplitude failure.
  validated: false
  validation_method: "Preserve the selected C pipeline on a masked, upright NameForm glyph-front and connector coupon at 0.4 mm nozzle and 0.12 mm layers; record exact material/profile, fixed-condition appearance, seam, gap, counter, and handling results."
