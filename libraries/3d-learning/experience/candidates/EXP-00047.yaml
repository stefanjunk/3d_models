observation:
  summary: The newly added 3d-design-preflight skill existed in .agents, while functional-3d-design still began with design-spec requirements and had no mandatory preflight artifact, lifecycle, update trigger, validator linkage, or legacy-project backfill rule.
  expected: Every new functional design starts with a documented preflight, relevant changes update it, and existing designs missing it receive an explicit retrospective backfill before further design work.
  actual: The pre-change functional workflow had no reference to 3d-design-preflight or preflight/preflight-result.json and could proceed through requirements, concept, CAD, and release validation without that assessment.
  outcome: failure
  parameter: workflow entry gate and assessment lifecycle
  recommended_value: mandatory prospective preflight, stale-on-relevant-change update, and source-linked retrospective backfill with deterministic validation
  units: workflow contract
explanation:
  hypothesis: A first-class project artifact, explicit lifecycle state, canonical path, cross-file validator, and release gate make omission or stale reuse visible and fail-closed at the points that create or release design artifacts.
  mechanism: The functional skill now routes to 3d-design-preflight first; project scaffolds record pending state and input; current state requires schema/project/revision agreement; relevant changes become stale; final validation requires current status; legacy absence routes to RETROSPECTIVE backfill.
  alternatives:
    - A prose-only instruction might be sufficient for attentive agents but would not expose missing or mismatched artifacts deterministically.
    - A global AGENTS.md rule alone could route new work but would not document per-project scores, interfaces, decisions, or update history.
    - Project-template changes alone would not protect manually created or legacy products.
  validated: false
  validation_method: Run the linked targeted eval on each workflow/schema/initializer/validator change and collect real new-design, stale-update, and retrospective-backfill traces before considering promotion.
