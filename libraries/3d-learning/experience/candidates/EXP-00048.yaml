applicability:
  triggers:
    - An existing products portfolio is missing per-product purpose or preflight documents.
    - Product roots contain multiple version-labelled or legacy packages that need conservative archival.
    - A bulk documentation pass must preserve dirty, untracked, or multi-lineage product state.
  exclusions:
    - Physical product validation, certification, or compatibility approval.
    - Automatic selection among ambiguous active variants or independent component lineages.
    - Destructive deletion of old or user-owned artifacts.
  transfer_limits:
    - Keep this at E0 until another portfolio or later product batch reproduces the coverage and exception behavior.
    - Re-score products when scope, evidence, variant, manufacturing profile, or tests change; do not reuse the 2026-08-31 scores as timeless facts.
