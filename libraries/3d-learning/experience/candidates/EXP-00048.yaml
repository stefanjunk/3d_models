observation:
  summary: The portfolio contained 108 product boundaries, no canonical preflight results, no uniform explicit PURPOSE.md documents, and multiple mixed current/legacy roots. A conservative retrospective backfill produced complete purpose and preflight coverage, archived 42 unambiguous entries, and preserved three dirty or ambiguous cases as explicit review exceptions.
  expected: Every existing product has an explicit purpose, a source-linked schema-valid retrospective preflight cross-linked from its root design spec, and only current/unambiguous work outside archive, without treating documentation completeness as product release permission.
  actual: Before correction, coverage was inconsistent and preflight results were absent. After correction, 108/108 purposes and preflights validate, 42 archive destinations verify, the generator dry-run is idempotent, 103 products remain HOLD, five are GO_WITH_CONTROLS, and three roots remain visibly review-required instead of being guessed clean.
  outcome: mixed
  parameter: portfolio documentation coverage and conservative version-root cleanup
  recommended_value: deterministic full-boundary audit with explicit purpose, retrospective traceability, fail-closed gates, product-local archives, and documented dirty/ambiguous exceptions
  units: repository workflow contract
explanation:
  hypothesis: Enumerating formal product boundaries, generating canonical source-linked artifacts, validating cross-file identity, and recording rather than hiding ambiguous root state makes omissions and unsafe cleanup decisions detectable while preserving honest release gates.
  mechanism: The backfill script derives only from non-archived evidence, writes one stable product contract set, links workflow.preflight, verifies every planned archive destination, emits an aggregate audit, and fails validation when coverage, schema, links, traceability, archive evidence, or idempotence diverges.
  alternatives:
    - Manual one-off documentation could reach the same coverage, but consistency and stale omissions would be harder to detect.
    - A naive version-name sort could clean more roots, but it would conflate separate component lineages and absorb dirty or untracked user content.
    - Treating every schema-valid assessment as releasable would simplify the summary, but would erase hard-gate and evidence limitations.
  validated: false
  validation_method: Re-run the linked eval on later portfolio changes and repeat the workflow in another repository or a newly added batch before considering promotion.
