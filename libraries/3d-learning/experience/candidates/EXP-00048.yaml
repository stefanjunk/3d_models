    notes: "Observed in one repository-wide backfill and one subsequent product-owned prospective reassessment. Structural coverage, successor preservation, audit refresh, and idempotence pass, but the explanation has not been tested in another portfolio and three intentionally unresolved dirty/ambiguous roots remain."
feature:
  type: product-portfolio preflight, purpose, and version-archive governance
  geometry: heterogeneous existing product folders; documentation workflow rather than one geometry class
  design_parameters:
    product_boundaries: 108
    canonical_purpose: PURPOSE.md
    canonical_preflight: preflight/preflight-result.json
    retrospective_mode: RETROSPECTIVE
    current_mode_counts:
      RETROSPECTIVE: 107
      PROSPECTIVE: 1
    archive_moves: 42
    root_review_exceptions: 3
  named_datums: []
  constraints:
    - Every products/<family>/<product> boundary receives an explicit evidence-linked purpose.
    - Every missing assessment is backfilled from current evidence and never described as historically prospective.
    - A later schema-valid current product-owned assessment supersedes the generated backfill and must not be rewritten by the inventory generator.
    - The aggregate audit follows the live current assessment identity, revision, and scorecard regardless of whether its valid mode is RETROSPECTIVE or PROSPECTIVE.
    - Schema validity and current status do not override HOLD, CONCEPT_ONLY, or restricted lanes.
    - Only unambiguously older or explicitly legacy entries are moved; dirty, untracked, or multi-lineage ambiguity remains visible for human review.
    - Archive moves preserve files and are idempotently verifiable.
