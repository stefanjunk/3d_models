observation:
  summary: A conservative retrospective backfill produced complete purpose/preflight coverage and safe archives; after NameForm received a newer valid PROSPECTIVE assessment, the backfill generator initially tried to overwrite it and left the aggregate scorecard stale. The generator now preserves current product-owned successors and refreshes the audit from live results.
  expected: Every existing product has an explicit purpose and a source-linked schema-valid current preflight cross-linked from its root design spec; missing legacy assessments are RETROSPECTIVE, while later product-owned PROSPECTIVE reassessments remain authoritative and only current/unambiguous work stays outside archive.
  actual: All 108 purposes and preflights validate, including 107 retrospective backfills and one prospective successor; 42 archive destinations verify; the aggregate audit matches live identities/revisions/scorecards; the generator dry-run is idempotent; and three roots remain visibly review-required.
  outcome: mixed
  parameter: portfolio documentation coverage and conservative version-root cleanup
  recommended_value: deterministic full-boundary audit with explicit purpose, retrospective creation only for missing assessments, preservation of valid current successors, fail-closed gates, product-local archives, and documented dirty/ambiguous exceptions
  units: repository workflow contract
explanation:
  hypothesis: Enumerating formal product boundaries, generating canonical source-linked artifacts, validating cross-file identity, and recording rather than hiding ambiguous root state makes omissions and unsafe cleanup decisions detectable while preserving honest release gates.
  mechanism: The backfill script first recognizes a complete current product-owned contract whose result and design-spec link agree; it preserves that contract, generates only missing/invalid legacy records, verifies archive destinations, rebuilds the aggregate audit from the selected live results, and fails validation when coverage, schema, links, traceability, audit values, archive evidence, or idempotence diverges.
  alternatives:
    - Manual one-off documentation could reach the same coverage, but consistency and stale omissions would be harder to detect.
    - A naive version-name sort could clean more roots, but it would conflate separate component lineages and absorb dirty or untracked user content.
    - Treating every schema-valid assessment as releasable would simplify the summary, but would erase hard-gate and evidence limitations.
    - Re-running the original retrospective generator after every product change would keep its own output stable but silently revert legitimate prospective reassessments.
  validated: false
  validation_method: Re-run the linked eval on later portfolio changes and repeat the workflow in another repository or a newly added batch before considering promotion.
