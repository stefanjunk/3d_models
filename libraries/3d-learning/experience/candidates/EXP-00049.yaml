    status: pending
    reviewed_by: null
    reviewed_at: null
    notes: "Observed once in one 108-product and 300-idea portfolio. Coverage and source reconciliation pass, but neither the preliminary bands nor the structured R2 concept preflights and directional trend scores have been calibrated against completed idea-to-product projects or German sales evidence."
feature:
  type: portfolio preflight scorecard and research-planning overlay
  geometry: heterogeneous existing products and pre-CAD research concepts; planning workflow rather than one geometry class
  design_parameters:
    product_directories: 108
    portfolio_rows: 99
    research_ideas: 300
    linked_product_preflights: 37
    preliminary_idea_estimates: 163
    structured_r2_concept_preflights: 100
    structured_complexity_split:
      C1: 5
      C2: 95
    structured_criticality: K1
    structured_trend_score_range: "87–94"
    compact_form: "C# · R# · K# · Lane X · CONFIDENCE"
    preliminary_readiness: "R0–R1"
    preliminary_current_lane: E
  named_datums: []
  constraints:
    - Existing products use exact current values from their documented product-local preflight.
    - Unstarted ideas use labelled C/K bands and retain R0–R1, Lane E, and low/limited confidence until product evidence exists.
    - A research idea may use exact R2 only when purpose, exclusions, envelope, measurable customer inputs, critical-interface evidence route, candidate manufacturing envelope, and verification plan are explicit.
    - Structured R2 concepts remain Lane E and CONCEPT_ONLY while an exact manufacturing profile or another hard gate is open.
    - The likely target lane after evidence is stored separately and never replaces the current lane or release decision.
    - Market opportunity remains separate from complexity, readiness, criticality, lane, and confidence.
    - A directional trend score remains separate from the preflight scorecard and is labelled as unvalidated demand.
