applicability:
  triggers:
    - A portfolio view combines released/current products and pre-CAD research ideas.
    - Market opportunity needs to be compared with implementation complexity without hiding evidence or criticality gates.
    - A research batch is screened for trend and preflight constraints before CAD selection.
    - A compact preflight score is copied outside the owning product folder.
    - A generic idea is narrowed to one named product revision, published standard, or dimensioned COTS interface to raise design-input readiness.
  exclusions:
    - Product release, safety approval, certification, or replacement of the full preflight artifact.
    - Numeric success probabilities or a combined market/preflight average.
    - Treating a directional trend score as German demand evidence or as input to R, K, or current-lane permission.
    - Reuse of a mapped product scorecard when the research concept is not actually represented by that product scope.
    - Copying one named child's R3 to a generic parent or sibling without equivalent interface/process/verification evidence.
  transfer_limits:
    - Keep this at E0 until multiple named children complete physical coupons and later full preflights demonstrate whether the preliminary/R2/R3 assessments and target lanes were directionally useful.
    - Regenerate the overlay and advancement register whenever product preflights, implementation mappings, sources, variants, process baselines, or research planning inputs change.
