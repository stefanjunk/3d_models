    - A target lane is a planning hypothesis after evidence closure, not current design or release authorization.
observation:
  summary: The portfolio overlay now supports exact product scorecards, explicitly preliminary legacy bands, structured R2 concepts, and separate evidence-backed R3 named children without transferring their maturity to generic parents or averaging market and engineering fields.
  expected: Every existing product and every research idea has a compact, traceable preflight view and explicit purpose; specific variants may advance only through their own evidence, while all 422 records retain a named bottleneck and next evidence action.
  actual: The generated workbook contains exact scorecards for all 99 portfolio rows, a separate 108-product preflight/purpose register, and complete 314-idea overlays split into 37 linked current product preflights, 163 labelled preliminary estimates, 100 structured R2 concepts, and 14 separate R3 named variants. The 422-row advancement register covers all 314 ideas and 108 product directories; generic parents remain unchanged, and the R3 children remain conditional pending real coupons/items/hosts.
  outcome: success
  parameter: portfolio-level market-potential versus implementation-complexity planning
  recommended_value: source-linked exact product scorecards plus classified preliminary/R2/R3-child assessments, strict generic-parent evidence isolation, separate trend/market fields and lanes, and deterministic 314-idea plus 108-product advancement coverage
  units: repository workflow contract
explanation:
  hypothesis: Keeping the exact/preliminary/structured status, current lane, target lane, and trend/market scores in separate filterable fields prevents a compact portfolio view from implying evidence, demand, or release permission that does not exist.
  mechanism: The generated CSV links mapped ideas to product-local preflights, derives conservative bands for legacy unmapped ideas, carries explicit PC/R/K/gate evidence for R2 concepts, and assigns R3 only to separate named children with E3 nominal sources and a pinned exact process. The workbook and validator reconcile four research tabs, priority, the 422-row advancement register, parent/child IDs, formulas, sources, gates, purposes, and disclaimers.
  alternatives:
    - Assigning Lane B–D directly to raw ideas would appear more discriminating but would violate the R<=1 Lane E rule.
    - Showing only current Lane E would be safe but would hide the likely engineering path; a separate target-lane field preserves both facts.
    - Folding market potential and preflight into one score would simplify ranking but erase criticality and evidence gates.
    - Assigning R2 from trend strength or a broad product name would be simpler but would not establish interface, process-envelope, or verification readiness.
    - Raising a generic parent after researching one exact device or furniture article would overstate the evidence domain; a separate child SKU preserves both the broad opportunity and the narrow maturity claim.
    - Calling source-complete nominal data R4 would skip independent dimensional and physical validation; R3 plus CONDITIONAL keeps the next gate visible.
  validated: false
  validation_method: Re-run the linked eval after research, mapping, source, process, variant, preflight, or workbook changes; physically test multiple named children and compare preliminary/R2/R3 planning assessments with eventual full product preflights before considering promotion.
