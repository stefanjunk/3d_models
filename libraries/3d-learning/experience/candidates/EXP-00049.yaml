observation:
  summary: The portfolio overlay now supports exact product scorecards, explicitly preliminary legacy bands, and structured R2 concept preflights without averaging market potential, trend, and implementation feasibility.
  expected: Every existing product and every idea in all three 100-row research tabs has a compact, traceable preflight view that preserves unknowns, distinguishes evidence classes, and keeps current permission separate from the likely workflow after evidence capture.
  actual: The generated workbook contains exact scorecards for all 99 portfolio rows, a separate 108-product preflight/purpose register, and complete 300-idea overlays split into 37 linked current product preflights, 163 labelled preliminary estimates, and 100 structured R2 concept preflights. The structured batch has explicit purposes, C1–C2, K1, directional trend scores 87–94, and current Lane E because G3 remains open.
  outcome: success
  parameter: portfolio-level market-potential versus implementation-complexity planning
  recommended_value: source-linked exact product scorecards plus explicitly classified preliminary or structured concept assessments, separate trend/market fields and target lanes, and deterministic 300-row coverage validation
  units: repository workflow contract
explanation:
  hypothesis: Keeping the exact/preliminary/structured status, current lane, target lane, and trend/market scores in separate filterable fields prevents a compact portfolio view from implying evidence, demand, or release permission that does not exist.
  mechanism: The generated CSV links mapped ideas to product-local preflights, derives conservative bands for legacy unmapped ideas, and carries explicit PC/R/K/gate evidence for the structured batch; the workbook builder joins those rows into all three research tabs and the priority sheet; a validator reconciles IDs, values, source paths, disclaimers, formulas, and counts.
  alternatives:
    - Assigning Lane B–D directly to raw ideas would appear more discriminating but would violate the R<=1 Lane E rule.
    - Showing only current Lane E would be safe but would hide the likely engineering path; a separate target-lane field preserves both facts.
    - Folding market potential and preflight into one score would simplify ranking but erase criticality and evidence gates.
    - Assigning R2 from trend strength or a broad product name would be simpler but would not establish interface, process-envelope, or verification readiness.
  validated: false
  validation_method: Re-run the linked eval after research, mapping, preflight, or workbook changes; compare both preliminary and structured concept assessments with eventual full preflights and implementation outcomes for multiple selected ideas before considering promotion.
