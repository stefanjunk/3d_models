observation:
  summary: The portfolio workbook contained market and implementation-priority fields but no compact C/R/K/lane/confidence view. A source-linked overlay now exposes exact product preflights and explicitly preliminary idea bands without averaging market potential and implementation feasibility.
  expected: Every existing product and every idea in both 100-row research tabs has a compact, traceable preflight view that preserves unknowns and distinguishes current permission from the likely workflow after evidence capture.
  actual: The generated workbook now contains exact scorecards for all 99 portfolio rows, a separate 108-product preflight/purpose register, and complete 200-idea overlays split into 37 linked current product preflights and 163 labelled preliminary estimates. All preliminary unstarted ideas remain R0–R1 and Lane E.
  outcome: success
  parameter: portfolio-level market-potential versus implementation-complexity planning
  recommended_value: source-linked exact product scorecards plus visibly preliminary research bands, separate target lanes, and deterministic 200-row coverage validation
  units: repository workflow contract
explanation:
  hypothesis: Keeping the exact/preliminary status, current lane, target lane, and market score in separate filterable fields prevents a compact portfolio view from implying evidence or release permission that does not exist.
  mechanism: The generated CSV links mapped ideas to product-local preflights and derives conservative bands for unmapped ideas; the workbook builder joins those rows into both research tabs and the priority sheet; a validator reconciles IDs, values, source paths, disclaimers, and counts.
  alternatives:
    - Assigning Lane B–D directly to raw ideas would appear more discriminating but would violate the R<=1 Lane E rule.
    - Showing only current Lane E would be safe but would hide the likely engineering path; a separate target-lane field preserves both facts.
    - Folding market potential and preflight into one score would simplify ranking but erase criticality and evidence gates.
  validated: false
  validation_method: Re-run the linked eval after research, mapping, preflight, or workbook changes and compare preliminary bands with the eventual full preflight of multiple newly implemented ideas before considering promotion.
