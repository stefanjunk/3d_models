applicability:
  triggers:
    - A portfolio view combines released/current products and pre-CAD research ideas.
    - Market opportunity needs to be compared with implementation complexity without hiding evidence or criticality gates.
    - A compact preflight score is copied outside the owning product folder.
  exclusions:
    - Product release, safety approval, certification, or replacement of the full preflight artifact.
    - Numeric success probabilities or a combined market/preflight average.
    - Reuse of a mapped product scorecard when the research concept is not actually represented by that product scope.
  transfer_limits:
    - Keep this at E0 until multiple ideas receive later full preflights and demonstrate whether the preliminary band and target lane were directionally useful.
    - Regenerate the overlay whenever product preflights, implementation mappings, or research planning inputs change.
