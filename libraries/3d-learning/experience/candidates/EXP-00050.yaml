applicability:
  triggers:
    - A personalized FFF name object must read as freestanding characters while remaining one connected body.
    - A full plaque or background panel is explicitly rejected as the dominant front silhouette.
  exclusions:
    - Text printed as an inlay, label, or shallow relief on a deliberately visible plaque.
    - Independent loose letters that do not need a shared printable connector.
    - Safety-critical signs or load-bearing letter structures without separate engineering.
  transfer_limits:
    - Treat the 122 mm cap height, 1.8/1.2 mm gap values, 6.0 mm setback, and 2.4 mm web as NameForm experiment values until physically tested.
