feature:
  type: letter-dominant personalized facade with hidden connector
  geometry: large extruded STE and FAN glyph groups fused to a retained bookend core by a recessed rear web and local inter-glyph bridges
  design_parameters:
    default_cap_height_mm: 122.0
    nominal_inter_glyph_gap_mm: 1.8
    minimum_finished_gap_mm: 1.2
    glyph_body_depth_mm: 6.0
    rear_connector_thickness_mm: 2.4
    rear_connector_front_setback_mm: 6.0
    front_texture_candidate: C
    front_texture_depth_mm: 0.6
    front_texture_mesh_pitch_mm: 0.45
  named_datums:
    - glyph-front-y0
    - front-view-minus-y
    - shared-glyph-baseline-z
    - rear-connector-front-y6
    - print-bed-z0
  constraints:
    - The front silhouette is defined by glyphs, not a rectangular panel.
    - Glyph counters remain open and neighboring fronts retain a visible gap.
    - Only local shadowed bridges may appear between glyphs from the intended front view.
    - The rear connector remains outside the book load path and is protected from wood relief.
    - Candidate C is applied to glyph fronts without changing its source, physical period, seam blend, depth, or direct-sampling method.
