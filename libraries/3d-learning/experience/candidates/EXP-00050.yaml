observation:
  summary: The existing broad textured wing still read as a panel with letters on it; the user requested a stand that reads primarily as large wooden characters, and the resulting digital candidate now preserves that hierarchy with local recessed bridges.
  expected: The existing architecture would present the split name clearly while retaining a decorative textured wing.
  actual: The user selected the wood texture but requested larger tightly spaced glyphs, wood appearance on the glyphs including the front, and a background moved far behind so it only joins the letters and is barely visible. The generated STE/FAN pair has true 122 mm caps, 1.8 mm real outline gaps, one watertight body per side, open A counter, local 6 mm bridge bands at a nominal 6 mm setback, and no rectangular front panel in the reviewed renders.
  outcome: correction
  parameter: visible facade architecture and connector depth hierarchy
  recommended_value: "large outline-packed glyph bodies with open counters, >=1.2 mm finished gaps, and only local rear bridges beginning 6.0 mm behind the glyph front"
  units: mm
explanation:
  hypothesis: A full rectangular backer remains visually legible from the front even when translated rearward; masking the rear layer to glyph silhouettes and adding only local bridges preserves negative space while keeping the letters in one printable body.
  mechanism: The glyph bodies occlude a matching recessed rear layer, while only short bridge spans occupy inter-glyph gaps. Their 6.0 mm setback places those spans in shadow and prevents the facade from reading as a sign panel.
  alternatives:
    - A full recessed panel may remain visible through every counter and gap and continue to read as a plaque.
    - Very thin or single-point bridges may fracture during transport or cleaning.
    - Side relief can reduce the finished gap or make bridges more visible if gap keep-outs are not enforced.
    - Some personalized glyph pairs may not offer two robust bridge bands and must fail closed or use a different local bridge layout.
  validated: false
  validation_method: "The approved concept and deterministic digital candidate pass silhouette, counter, 1.8 mm gap, one-body, relief-mask, compute-budget, reproducibility, and exact-slicer checks. Print the exact FA coupon and require wood recognition, open gap/counter, acceptable bridge visibility, and normal-handling survival before the complete pair can validate the mechanism."
