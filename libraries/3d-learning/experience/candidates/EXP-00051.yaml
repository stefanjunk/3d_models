observation:
  summary: The direct Manifold output was watertight and single-body, but merging vertices to four decimal places and removing collapsed faces opened the same shell into three components.
  expected: A sub-micron decimal weld would remove only numerical Boolean residue while preserving the certified shell.
  actual: The raw 120874-triangle output had one watertight component; the cleanup removed 10 faces and produced a non-watertight three-component mesh. Retaining the raw output passed exact-coordinate audit with zero boundary and nonmanifold edges and sliced successfully.
  outcome: failure
  parameter: post-Boolean vertex-weld cleanup
  recommended_value: preserve-certified-manifold-output-unless-topology-aware-simplification-passes-before-after-contract
  units: topology-contract
explanation:
  hypothesis: Valid sub-0.0001 mm transition triangles at exact cap/bed clipping planes collapsed under coordinate rounding, after which degenerate-face removal deleted faces required to close the shell.
  mechanism: Decimal welding is geometric quantization rather than a topology-aware simplifier. Coincident rounding can collapse a valid narrow transition even when the original edge incidence is closed; removing the new zero-area faces then exposes boundaries.
  alternatives:
    - Float32 STL quantization rather than the clipping plane may dominate the narrow transitions.
    - Expanding the closed cutter beyond protected silhouette boundaries could avoid some coplanar transitions.
    - Manifold topology-aware simplify or a higher-precision interchange format may remove microfacets without opening the shell.
  validated: false
  validation_method: Repeat on a second clipped relief geometry and compare raw, topology-aware simplify, decimal weld, and padded-cutter variants with exact edge-incidence and geometric-error reports.
