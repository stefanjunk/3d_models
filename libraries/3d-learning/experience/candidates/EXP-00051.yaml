applicability:
  triggers:
    - A manifold Boolean result contains tiny but topologically valid transition facets near clipped or coplanar relief boundaries.
    - A proposed coordinate-weld cleanup is intended to reduce diagnostic microfacets before STL delivery.
  exclusions:
    - Isolated zero-area export fragments that are not part of the closed primary shell and can be removed with a proved one-body before/after audit.
    - Meshes already containing boundary or nonmanifold edges before cleanup.
  transfer_limits:
    - Diagnose edge incidence before choosing cleanup; do not generalize the 0.0001 mm threshold to other kernels, scales, or formats.
