observation:
  summary: The certified float64 RITA Boolean became two-component and nonmanifold only after distinct vertices collapsed to one binary-STL float32 coordinate; separating the single collision by adjacent representable float32 values restored the serialized topology.
  expected: A certified one-body Manifold output would remain one watertight body after ordinary binary STL serialization.
  actual: Run01 re-import had two components and two nonmanifold edges. Run02 changed two vertices by at most 0.000022927 mm, retained 237192 triangles and the same relief contract, then passed exact-coordinate topology audit and exact slicing.
  outcome: mixed
  parameter: float32 serialization collision handling
  recommended_value: detect-distinct-vertex-collisions-before-stl-write-and-prove-the-serialized-artifact
  units: topology-contract
explanation:
  hypothesis: At the RITA facade's large positive X coordinate, two distinct float64 Boolean vertices were closer than the local float32 representable spacing and rounded to one coordinate tuple. Exact-coordinate readers welded them, producing zero-area faces and a nonmanifold edge island.
  mechanism: Binary STL stores 32-bit coordinates. Quantization is geometric and independent of indexed Manifold topology; distinct source positions can therefore alias even when the in-memory half-edge graph is valid. Assigning adjacent representable values in original geometric order preserves separate positions within a bounded sub-process error.
  alternatives:
    - A topology-aware remesh or a higher-precision manufacturing format may avoid the collision without coordinate nudging.
    - A different cutter phase or Boolean tessellation may avoid the near-coincident vertex pair.
    - Some importers may not weld exact coordinates and therefore may not expose the same defect, but slicer portability would remain unproved.
  validated: true
  validation_method: Controlled run01/run02 export comparison, exact-coordinate edge-incidence audit of the actual STL files, bounded vertex-displacement report, unchanged texture/triangle metrics, and exact Anycubic slicing of run02.
