applicability:
  triggers:
    - A certified indexed Boolean mesh is serialized to binary STL at coordinates where float32 spacing approaches the separation of distinct vertices.
    - In-memory topology passes but an exact-coordinate audit of the written STL adds nonmanifold edges, zero-area islands or components.
  exclusions:
    - Source meshes that already have boundary, nonmanifold, negative-volume or disconnected-body defects before quantization.
    - Unbounded smoothing, generic vertex welding, or coordinate nudging without a physical error limit and serialized-artifact regression checks.
  transfer_limits:
    - Recompute collisions from the exact candidate; do not reuse the observed 0.000022927 mm value as a universal tolerance.
