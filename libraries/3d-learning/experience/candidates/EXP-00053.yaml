applicability:
  triggers:
    - Tall personalized glyphs are joined mainly by a recessed rear web and local bridge bands.
    - Digital one-body topology passes but the printed facade appears weak or flexes during handling.
  exclusions:
    - Independent loose letters that intentionally have no shared connector.
    - Text embossed on a deliberately visible solid plaque.
    - Safety-critical or structurally rated text assemblies.
  transfer_limits:
    - Do not reuse the proposed dimensions as universal values across fonts, sizes, names, materials, orientations, nozzles, or machines.
