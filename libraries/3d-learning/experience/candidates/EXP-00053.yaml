observation:
  summary: The printed 0.4.0 MARITA letter-to-letter connections looked insufficiently stable to the user even though the digital meshes were connected and watertight.
  expected: The 6 mm-deep glyphs, 2.4 mm rear web, 0.1 mm nominal depth overlap, and 6 mm local bridge bands would look adequately integrated while the connector remained visually subordinate.
  actual: The user reported that the letters did not look very stable where they hang together and requested deeper letters plus a stronger connection farther behind the visible front.
  outcome: correction
  parameter: glyph depth, connector setback/thickness/overlap, and local bridge-band width
  recommended_value: "Unapproved 0.4.1 proposal: 12 mm glyph depth; connector front at y=10 mm; 4 mm connector thickness; at least 2 mm positive overlap; 12 mm local bridge bands."
  units: mm
explanation:
  hypothesis: The combination of shallow glyph extrusion, almost tangent connector overlap, thin rear-web depth, and narrow single local bridge bands can make the facade appear and potentially behave like lightly attached plates even though a mesh connectivity audit passes.
  mechanism: Greater glyph depth increases the visible and geometric section behind each front. A thicker connector with meaningful positive overlap transfers load through a finite shared volume, while wider local bands enlarge the inter-glyph section; moving that structure farther back preserves the letter-only front hierarchy.
  alternatives:
    - The geometry may only look delicate while still being adequate under normal handling.
    - Material, perimeter count, under-extrusion, layer adhesion, cooling, or profile deviations may dominate the physical result.
    - A single nearest-point bridge location may be the main weakness even if its width and depth are increased.
    - A stronger full rear panel would improve rigidity but violate the approved letter-only appearance.
  validated: false
  validation_method: "Compare the historical and approved reinforced sections digitally, exact-slice the reinforced candidate, then print a process-matched representative glyph/bridge coupon and record front visibility, handling, force/deflection if available, and any fracture."
