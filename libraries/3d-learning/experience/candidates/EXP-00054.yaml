observation:
  summary: A nominally open contour fragment produced a buffered polygon with one interior ring; subtracting it created a separate 147.809 mm3 terrain island.
  expected: Open buffered contour fragments create only through-slots and preserve one connected panel component.
  actual: Rhenish right decomposed into two watertight components until candidates with polygon interior rings were rejected; all four final halves then remained single-component without cleanup.
  outcome: failure
  parameter: aperture-cutter topology before Boolean subtraction
  recommended_value: reject-any-buffered-aperture-polygon-with-an-interior-ring-and-assert-final-component-count
  units: topology-contract
explanation:
  hypothesis: A curved open source segment approached or crossed itself closely enough that its finite-width buffer closed locally and formed an annulus.
  mechanism: The annular cutter removed a closed loop through the panel, leaving the enclosed terrain as a disconnected solid even though the input LineString itself was open.
  alternatives:
    - Shorter or more aggressively simplified contour fragments may avoid the local loop but still require the same topology check.
    - Retaining the largest component after Boolean would hide a material design error and was rejected for any nontrivial orphan volume.
  validated: true
  validation_method: Record the failed decomposed volume, reject buffer polygons with interior rings, rebuild both pilots and require exactly one composite component per half plus independent mesh and exact-slicer PASS evidence.
