observation:
  summary: Vertices numerically on a horizontal material plane produced zero-area split facets that became repeated indices or an open body after STL welding; a bounded pre-split nudge eliminated the failures across both pilots.
  expected: Each horizontal band remains a closed material body after STL and 3MF vertex welding.
  actual: The initial Rhenish-right 3MF had two repeated-index triangles and a non-watertight material object; post-export cleanup then opened a Harz band. Moving only 72 Harz and 141 Rhenish near-plane vertices before the split yielded sixteen watertight STL color bodies and four warning-free valid 3MF packages.
  outcome: mixed
  parameter: sampled vertex distance from a horizontal split plane
  recommended_value: detect-near-plane-vertices-and-apply-a-recorded-pre-split-perturbation-below-the-process-error-budget
  units: topology-and-error-budget-contract
explanation:
  hypothesis: A sampled vertex at or within float32 precision of the split plane creates a tangent intersection; welding the serialized mesh collapses the resulting zero-area triangle.
  mechanism: The in-memory indexed manifold can retain distinct topology around the tangent point, while STL coordinate welding aliases coincident points and turns a triangle into repeated indices. Removing that face after export may expose a boundary, whereas moving the source vertex before splitting changes the intersection topology cleanly.
  alternatives:
    - A topology-aware indexed manufacturing format or kernel may preserve components without the same STL welding failure.
    - Shifting the entire color plane would break the approved layer-aligned color threshold and was rejected.
    - Generic post-export degenerate-face removal was observed to open another band's shell and was rejected.
  validated: true
  validation_method: Count near-plane vertices, apply the bounded source perturbation, rebuild both pilots, validate sixteen color STLs and four 3MF packages, then match all four composite hashes to exact Anycubic PASS inputs.
