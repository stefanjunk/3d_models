applicability:
  triggers:
    - A sampled or image-derived heightfield is split by horizontal planes into material bodies.
    - In-memory topology passes but welded STL or 3MF contains repeated-index, degenerate or open band meshes at the split plane.
  exclusions:
    - The source solid is already open, nonmanifold or disconnected before plane splitting.
    - A color boundary is not required to stay on a declared layer plane.
  transfer_limits:
    - Recompute the affected vertices and physical error bound for every model; do not reuse 0.001 mm as an untested universal constant.
