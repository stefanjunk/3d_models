observation:
  summary: Two standards-valid multipart 3MFs contained positive-volume watertight meshes but Anycubic rejected both before loading geometry; Anycubic-authored project containers using the same source STLs imported and sliced.
  expected: A structurally valid four-material 3MF opens in the target slicer with all four geometry volumes.
  actual: Both standards-only files returned native code -6 and no G-code. Repackaging the unchanged STL volumes through Anycubic, centering the project and normalizing four filament arrays produced native success, non-empty G-code, tools 0-3 and three tool changes for both halves.
  outcome: mixed
  parameter: target-slicer 3MF package representation
  recommended_value: exact-destination-slicer-import-and-slice-gate
  units: interoperability-contract
explanation:
  hypothesis: The recorded Anycubic parser path requires or more reliably accepts its vendor project package structure and metadata than the standards-only multipart package emitted by the generic writer.
  mechanism: The generic packages fail before any triangle count is reported, while the vendor package created from the exact same STL hashes reports the expected triangles and produces toolpaths.
  alternatives:
    - The standards-only writer may contain a narrower namespace, relationship or extension incompatibility that another standards-compliant encoding could correct without vendor metadata.
    - A different Anycubic release may import the same standards-only package.
    - GUI import behavior may differ from the headless parser in unrecorded versions.
  validated: false
  validation_method: Paired left/right target-slicer import of rejected packages and rebuilt vendor projects using unchanged source STL hashes.
