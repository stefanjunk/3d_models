applicability:
  triggers:
    - A G-code layer analyzer supports multiple comment syntaxes and one file emits more than one family.
    - Declared layers disagree with an additive marker count while one marker family has unique monotonic Z values matching the declaration.
  exclusions:
    - Canonical markers themselves repeat, omit layers or have non-unique/non-monotonic Z values.
    - Supplemental markers are the only available layer evidence.
  transfer_limits:
    - Define precedence per dialect and fixture; do not globally discard a marker family without regression coverage.
