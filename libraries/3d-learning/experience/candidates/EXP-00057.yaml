observation:
  summary: The analyzer counted two comment families for the same layers and reported 42 markers although the G-code contained 23 canonical layer changes with 23 unique Z values and matching header/footer declarations.
  expected: Layer-count consistency compares one canonical layer sequence with the declared count.
  actual: The analyzer increments for both exact `;LAYER_CHANGE` and non-consecutive `; layer #` comments. Product-local review finds 23 canonical markers, 19 supplemental comments and 23 unique Z values in both files.
  outcome: failure
  parameter: layer-comment precedence
  recommended_value: one-canonical-marker-family-with-cross-checks
  units: parser-contract
explanation:
  hypothesis: The generic analyzer treats alternative supported syntaxes as additive event streams instead of mutually exclusive descriptions of a layer sequence.
  mechanism: Its current control flow increments for every canonical marker and separately increments for every distinct supplemental marker; the recorded multicolor G-code emits both families.
  alternatives:
    - Supplemental comments could represent tool-local layers in another dialect and require a more explicit precedence rule rather than being ignored universally.
    - Header/footer metadata could be wrong in another file, so canonical Z uniqueness remains necessary.
  validated: true
  validation_method: Direct source inspection plus deterministic counts of canonical markers, supplemental comments, unique Z values and header/footer declarations in both exact G-code artifacts.
