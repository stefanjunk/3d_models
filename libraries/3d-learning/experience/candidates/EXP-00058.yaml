observation:
  summary: A rectangular relief whose network was clipped to Berlin retained substantial printed ground outside the intended map subject; the user requested an explicit choice between removing that ground and filling it with real surrounding context.
  expected: The product parameter communicates whether the desired subject controls the physical perimeter or is highlighted inside an intentionally contextual rectangular map.
  actual: The previous single mode mixed a Berlin-clipped network with a full rectangular backer, creating visually unused printed area. Revision 0.4.0 now separates boundary_crop and context_outline in the parameter and concept contracts.
  outcome: mixed
  parameter: display_mode
  recommended_value: boundary_crop-or-context_outline-explicit-enum
  units: topology-contract
explanation:
  hypothesis: Printed free area appears when content extent and physical outer perimeter are controlled by different implicit masks.
  mechanism: Clipping routes to an administrative polygon while retaining a rectangular base leaves valid but visually unassigned material between the polygon and rectangle. Using the same boundary as the positive-body mask removes it; alternatively, retaining routes from a larger source gives the rectangular area intentional context.
  alternatives:
    - A decorative border or typography could occupy the unused rectangle without changing the perimeter.
    - A closer rectangular crop could reduce, but not eliminate, non-Berlin ground.
    - Another city boundary may be too fragmented or mechanically weak for direct silhouette printing.
  validated: false
  validation_method: Deterministic concept render from the frozen Berlin boundary and network vectors plus parameter/schema inspection.
