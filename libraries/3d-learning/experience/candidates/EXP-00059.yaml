observation:
  summary: Closed or branching waterway apertures divided the retained 3.0 mm backer into multiple positive components, including large loose islands, even though the aperture fraction and outer-edge keep-outs passed.
  expected: Every physical half remains one connected printed backer while selected openings transmit rear light to the front.
  actual: Revision 0.4.0 candidate r9 required 4, 2, 2 and 2 local 2.0 mm bridges. After the corrected all-water extraction, revision 0.5.3 openings-only candidates contained 67, 61, 145 and 169 retained components; the selected candidate inserted 61, 56, 126 and 148 local 2.0 mm bridges, restoring 98.8125, 81.375, 221.9375 and 250.0625 mm2. Every final half then had one retained raster component, one connected base body and one watertight composite without a rear grid or rear ribs.
  outcome: correction
  parameter: retained_positive_component_count_per_physical_half
  recommended_value: 1
  units: connected-components
explanation:
  hypothesis: A buffered line network can form closed cuts whose complement contains enclosed positive regions; an open-area percentage alone cannot detect those floating bodies.
  mechanism: Subtracting a closed or effectively closed aperture loop from a planar backer separates its enclosed material from the main load path. Without a rear grid or another overlapping structural body, the slicer treats that region as a separate printed shell.
  alternatives:
    - Some initial tiny components came from seam-column raster ambiguity or sub-printable boundary slivers rather than aperture loops.
    - A continuous rear frame, transparent insert or separate retained inlay could intentionally support islands in another architecture.
    - Filling enclosed regions into the aperture instead of adding bridges could also remove loose bodies but would change open area and lighting character.
  validated: false
  validation_method: Eight raster connectivity checks across two revisions; for revision 0.5.3, exact serialized STL topology audits, vendor-aware four-body 3MF validation and four successful native Anycubic target slices.
