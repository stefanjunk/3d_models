applicability:
  triggers:
    - A through-cut line, texture or light-opening network is subtracted from a backer that has no continuous rear support.
    - The design contains loops, branches, holes-within-holes or per-part clipping that can change complement connectivity.
  exclusions:
    - Floating regions are intentional separately retained inlays with their own validated attachment.
    - A continuous structural layer remains behind the apertures and is explicitly part of the printed assembly.
  transfer_limits:
    - Recalculate connectivity separately after every part split, perimeter mask, source or aperture-width change.
    - Select bridge width from the actual process and structural/appearance requirements; 2.0 mm is only the observed Berlin candidate value.
