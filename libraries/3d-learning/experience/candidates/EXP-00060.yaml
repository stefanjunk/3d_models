applicability:
  triggers:
    - A multicolor design moves from recommended/catalog colors to physical spools already present in inventory.
    - Stable semantic color regions must survive palette revisions and destination-slicer slot changes.
  exclusions:
    - The new palette changes color-region geometry, layer ordering, mechanical material function or polymer-family compatibility.
    - The physical spool identity is unavailable or cannot be distinguished from another roll.
  transfer_limits:
    - Keep calibrated appearance, exact batch, conditioning, profile and directed purge evidence separate from inventory identity.
    - Re-run concept, target-slicer and physical gates for every palette or color-order change.
