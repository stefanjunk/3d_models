observation:
  summary: The user replaced a generic recommended retail palette with four exact physical inventory colors and assigned each to a stable semantic relief role.
  expected: A production-facing multicolor contract identifies the actual physical rolls for every semantic color body while keeping geometry, display approximation and machine-slot assignment as separate authorities.
  actual: Revision 0.4.0 named Bone White, Nardo Grey, Black and Orange without loaded-spool evidence. Revision 0.4.1 now binds Oak, Mint Green, Midnight and Sky Blue to FIL-0005, FIL-0001, FIL-0003 and FIL-0002, while concept approval and physical process gates remain open.
  outcome: correction
  parameter: semantic-role-to-inventory-spool mapping
  recommended_value: one explicit physical inventory ID and label identity per color role
  units: mapping-contract
explanation:
  hypothesis: Separating stable semantic body roles from physical spool identity prevents a visually plausible catalog palette from being mistaken for the material actually available to the slicer and printer.
  mechanism: Role names preserve design intent across revisions, inventory IDs bind that intent to traceable physical products, and a separate ACE map preserves destination-machine authority without changing the source geometry.
  alternatives:
    - A shop may reserve exact machine slots earlier, but slot numbers can change between jobs and should not become CAD semantics.
    - Calibrated printed swatches could replace the photo-derived display values without changing the role mapping.
    - The photographed rolls may differ in batch, conditioning or opacity from later replacement rolls even when product/color names match.
  validated: false
  validation_method: null
