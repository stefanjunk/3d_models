observation:
  summary: The system initially treated a pure four-filament reassignment as a new appearance-design revision and blocked production mapping on a new concept approval; the user corrected it to a product variant and slicer/filament-loading choice.
  expected: A parameterized product separates non-geometric palette selection from geometry-changing size, display-mode and map-extent parameters, preserving the already approved design and geometry candidate.
  actual: Revision 0.4.2 keeps revision 0.4.0 digital-candidate-r9 as immutable geometry authority, validates tools 1-4 in all four Anycubic projects, and registers the Oak/Mint/Midnight/Sky configuration without a new design gate.
  outcome: correction
  parameter: palette_variant_gate_effect
  recommended_value: non-geometric product configuration when semantic body topology is unchanged
  units: workflow-contract
explanation:
  hypothesis: Treating every filament substitution as a redesign conflates semantic geometry with job-specific manufacturing configuration and creates unnecessary approval and regeneration work.
  mechanism: Stable semantic tools own the geometry; a palette catalog owns filament identity; a machine map owns current ACE slots. Only axes that alter shape, interfaces, printability dimensions or source data re-enter parametric geometry and its design gates.
  alternatives:
    - A regulated color requirement or safety marking could make a color substitution a design-level change even with identical geometry.
    - A different polymer family could alter bonding, shrinkage, strength or temperature enough to reopen manufacturing and functional gates.
    - A palette preview may still be useful for customer communication without becoming design authority.
  validated: false
  validation_method: null
