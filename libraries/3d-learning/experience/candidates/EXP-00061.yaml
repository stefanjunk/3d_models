applicability:
  triggers:
    - A multicolor product already has stable semantic color bodies and only the physical filament selection changes.
    - Product configuration must expose palette separately from dimensions and source-dependent content.
  exclusions:
    - The palette changes body count, color-boundary geometry, relief topology, inlay depth or functional material behavior.
    - A color is a regulated safety marking, exact brand standard or otherwise design-critical appearance requirement.
  transfer_limits:
    - Preserve physical filament/profile/purge/appearance gates even when redesign gates remain closed.
    - Keep non-default size and source-dependent map extent fail-closed until implemented and revalidated.
