applicability:
  triggers:
    - A printed map relief needs a customer- or business-specific marker at an address or coordinate.
    - The same marker architecture should accept a later logo, icon or monochrome image silhouette.
  exclusions:
    - Multi-tone photographic relief or textured color artwork.
    - A marker that requires more tools than the target machine can supply.
    - Unverified live-address resolution in a release build.
  transfer_limits:
    - Recompute the transform and all keep-out checks for every map extent, scale and split.
    - Treat alternate artwork as new geometry even when its tool assignment remains unchanged.
