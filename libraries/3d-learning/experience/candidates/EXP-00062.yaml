observation:
  summary: The user required the Berlin company marker address to remain adjustable and the marker artwork to be replaceable by another logo, image or icon.
  expected: A reusable location-artwork feature exposes separate source-backed location, artwork, size, orientation, relief and existing-tool inputs with fail-closed validation.
  actual: Revision 0.5.0 freezes the official address result, records two mode-specific transforms, keeps a replaceable artwork contract and generates the 16.5 mm mark into tool 4 on both left halves. Candidate r7 preserves a 0.5 mm Oak reveal, at least 12.25 mm aperture clearance, four non-empty 3MF bodies per half and successful native Anycubic slices.
  outcome: success
  parameter: site_marker_parameter_contract
  recommended_value: separate location and artwork inputs plus fixed-process relief/tool controls
  units: workflow-contract
explanation:
  hypothesis: Coupling a logo mesh directly to one hard-coded map coordinate prevents safe reuse and makes later customer artwork changes difficult to validate.
  mechanism: A frozen geospatial point owns placement while an independently versioned monochrome asset owns the visible profile; process dimensions and semantic tool assignment remain explicit downstream controls.
  alternatives:
    - Freehand manual placement can be acceptable for purely decorative prototypes but weakens traceability.
    - A full-color image may require a different texture/quantization workflow and cannot inherit the four-tool single-color-marker contract.
    - A marker crossing a split or protected aperture needs a different placement or decomposition.
  validated: false
  validation_method: null
