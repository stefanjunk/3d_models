observation:
  summary: The user rejected the former metriCreate identity and compact size, requiring the metriMade logo to be recognizable from about 2 m.
  expected: The visible marker uses the canonical approved brand asset, records a viewing-distance target, fits protected geometry and remains subject to a physical sight test.
  actual: Digital-candidate-r4 uses the exact hashed canonical stacked monochrome metriMade lockup at 54.0 × 57.18 mm on both left-half variants. Four native four-body projects and the two-body Oak/Sky Blue coupon pass geometry and native slice checks, but recognition at 2 m remains untested.
  outcome: correction
  parameter: visible_brand_marker_identity_size_and_viewing_distance
  recommended_value: approved asset plus geometry-constrained size and process-matched distance test
  units: workflow-contract
explanation:
  hypothesis: A compact placeholder can pass minimum-feature and slicer checks yet fail the intended brand-recognition task because asset identity and viewing distance were not binding inputs.
  mechanism: Bind geometry generation to the approved asset hash and explicit physical envelope, then separate deterministic fit checks from a human sight test at the declared distance and lighting.
  alternatives:
    - Use the compact mark instead of the stacked lockup when human approval explicitly selects symbol-only recognition.
    - Move the marker when the required size cannot retain split, perimeter, aperture or interface clearances.
    - Use a separate applied badge only if the product architecture and color budget are deliberately changed.
