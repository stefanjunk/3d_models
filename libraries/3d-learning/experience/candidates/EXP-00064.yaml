observation:
  summary: The user found that Tegeler See was absent and that the blue body represented motorways rather than the intended transit layer.
  expected: All mapped waters remain light-through cutouts and Sky Blue represents S-Bahn/U-Bahn while motorways stay in Midnight.
  actual: The source contained Tegeler See as non-empty relation 451908, but the legacy extractor read only line features and the legacy tool-4 source was a motorway/trunk accent file. The resulting 0.5.1 3MFs were mesh-valid yet semantically wrong.
  outcome: correction
  parameter: geospatial_feature_class_to_geometry_body_contract
  recommended_value: explicit per-class extraction plus source-to-output component accounting and named regression fixtures
  units: workflow-contract
explanation:
  hypothesis: Mesh and slicer validation can pass while a printable map is wrong when source-layer semantics and named feature survival are not validated end to end.
  mechanism: Validate tag class, geometry type and intended output body separately; then track every source component through clipping, simplification, protected bridging, mask generation, Boolean operations and 3MF body ownership.
  alternatives:
    - Use a curated authoritative hydrography or transit source when OSM classification is incomplete, with a new provenance and coverage audit.
    - Represent very small water features as engraved symbols only when the user approves that visual rule and the omission report remains explicit.
    - Use track geometry instead of route relations only when the product intentionally depicts infrastructure rather than passenger-service lines.
  validated: false
  validation_method: null
