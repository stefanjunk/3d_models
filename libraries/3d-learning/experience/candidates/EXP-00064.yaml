applicability:
  triggers:
    - A printable map combines OSM polygon, line or route-relation classes into color bodies or openings.
    - A user reports that a named geographic feature is missing despite being present in the source.
    - A palette role changes from one geographic feature class to another.
  exclusions:
    - Purely decorative, explicitly fictional maps without geographic accuracy claims.
  transfer_limits:
    - Define region-specific named fixtures and tags; do not assume Berlin route/network tagging applies globally.
    - Revalidate physical ligaments, opening fraction and connectivity for each size and map extent.
