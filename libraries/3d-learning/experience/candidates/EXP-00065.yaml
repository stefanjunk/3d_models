applicability:
  triggers:
    - A pipeline stage mutates the array that an earlier stage already certified.
    - A named feature regression is expressed as nonzero rather than as a coverage fraction.
    - A protective keep-out is authored as a bounding rectangle around a functional part.
    - Polygons with interior rings are rasterised in bulk.
    - A brand mark is anchored on a geographic point without checking what lies under it.
  exclusions:
    - Single-stage generators where no later stage can modify the certified array.
  transfer_limits:
    - Coverage thresholds, ligament and opening cap are product-specific and must be re-derived.
    - Wall-mount and attribution conflicts must be resolved per layout, not by a global rule.
