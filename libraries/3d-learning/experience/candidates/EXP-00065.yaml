observation:
  summary: The user reported that Tegeler See was still completely missing and the Havel largely missing, one revision after the same defect class had been recorded as corrected.
  expected: All mapped waters are cut through, and the build's own PASS means the exported artifact is correct.
  actual: "Revision 0.5.3 digital-candidate-r4 reported status PASS and tegeler_see_final_opening_area_mm2 262.5625 and 202.9375. Sectioning the exported tool1-base STLs showed Tegeler See 7.5 percent open in context_outline and 18.3 percent in boundary_crop, and only 54.8 percent of all mapped in-panel water open in boundary_crop. Four independent causes were measured: the accounting ran inside raster_masks before update_aperture_keepout removed a further 821.375 mm2 and 552.25 mm2; the approved 54 mm brand mark was centred on its Tegel address and covered 248 mm2 of a 279 mm2 lake; socket keep-outs were 62 x 66 mm bounding rectangles costing 1326.9 mm2 of water and the 5.0 mm outline ligament cost 793.4 mm2; and the polygon rasteriser filled every exterior then punched every interior, so one water polygon's hole deleted a different lake, leaving Schlachtensee and Gross-Glienicker See 0.0 percent open."
  outcome: correction
  parameter: conformance_gate_measurement_point
  recommended_value: final pre-geometry array plus an independent check on the exported mesh
  units: workflow-contract
explanation:
  hypothesis: A gate placed mid-pipeline certifies a state that later stages still modify, so a green report and a wrong artifact are fully compatible.
  mechanism: "Place the gate on the last array before geometry conversion, express it as a coverage fraction against an independent naming authority, and add a second checker that reads only the exported artifact. Independently, derive protective keep-outs from the exact cutter footprint rather than its bounding box, and rasterise polygons per polygon so holes cannot cross object boundaries."
  alternatives:
    - Keep the mid-pipeline gate but re-run it after every later mutation; rejected because it depends on remembering each new mutation.
    - Forbid later mutations of the aperture array; rejected because the marker support ring is a legitimate late constraint.
    - Accept nonzero-area fixtures; rejected because 7.5 percent coverage satisfies nonzero.
  validated: true
  validation_method: "Two independent measurements of the same quantity: the build's own gate on the final aperture raster, and verify_candidate_water.py sectioning the exported tool1-base STLs at mid thickness. Both were computed for revision 0.5.3 digital-candidate-r4 and revision 0.5.4 digital-candidate-r2."
