  geometry: four-color planar street-map relief with water apertures and raised brand relief
  design_parameters:
    gate_input: final aperture array immediately before cross-section conversion
    gate_measure: open area fraction of mapped water per named body and in aggregate
    independent_check: cross-section of the exported tool-1 land base
    functional_keepout_rule: exact rear-cutter footprint dilated by the documented margin
    functional_margin_mm: 12.0
    outer_ligament_mm: 2.0
    site_marker_aperture_clearance_mm: 2.0
    site_marker_anchor: artwork_west_edge on the frozen address point
