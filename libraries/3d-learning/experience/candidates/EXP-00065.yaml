    - Havel corridor, official names Havel, Alte Havel, Havelschlenke
    - permanent center seam and the four wall-mount footprints
  constraints:
    - The array a gate measures must be the array that becomes geometry.
    - A pass threshold must be a coverage fraction, never merely nonzero.
    - Only an exact functional footprint or a logged bridge may interrupt water.
    - A polygon rasteriser must apply each polygon's holes to that polygon only.
