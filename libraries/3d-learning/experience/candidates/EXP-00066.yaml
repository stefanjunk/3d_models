applicability:
  triggers:
    - A rounded outer shell is hollowed or opened by a rectangular cutter.
    - A drawer fascia and sliding body share one depth stack.
    - An isolated watertight part is treated as proof of assembly clearance.
    - A texture coupon does not reproduce the final surface orientation.
  exclusions:
    - Open corners explicitly required as drainage, ventilation or access features.
    - Assemblies whose fascia is intentionally inset and verified with a distinct pocket.
  transfer_limits:
    - Derive probe points, radii, motion samples and fit values per product.
    - Do not transfer the nominal 0.45 mm clearance across printers, materials or profiles.
