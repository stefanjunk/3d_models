observation:
  summary: The owner reported a non-carbon appearance, open rear housing and sorter corners, inconsistent straight drawer fronts and doubtful play in draft.1.
  expected: Rounded shells retain closed corners, drawer fronts continue the approved rounded language, the assembled drawer clears the housing, and the carbon cue is tested on a representative surface.
  actual: Draft.1 used rectangular inner cutters through rounded outer solids, placed its fascia inside the housing, filleted the fascia in plan instead of the front silhouette, cut the scoop on the wrong side, used coarse crossed grooves, and built a 78 x 34 x 3 mm flat coupon for a vertical-wall effect.
  outcome: correction
  parameter: inner_profile_and_assembly_verification_route
  recommended_value: matched inner profiles plus final-STEP corner probes, full-travel B-Rep intersections and a process-representative texture coupon
  units: workflow-contract
explanation:
  hypothesis: A watertight single-component mesh can still contain deliberate but unintended through-openings and assembly collisions when checks cover only topology, nominal arithmetic and isolated part bounds.
  mechanism: Offset or otherwise matched pocket profiles preserve wall continuity through a rounded corner; placing the fascia outside the housing separates cosmetic closure from the sliding body; probes and B-Rep intersections measure the final solids rather than trusting the generator's construction intent.
  alternatives:
    - Fill the visible corner gaps after rectangular subtraction; rejected because it hides the incompatible construction and is harder to parameterize.
    - Keep the fascia inside the housing and add local clearances; rejected because it consumes depth and caused measurable overlap.
    - Accept topology PASS as proof of quality; rejected because draft.1 was watertight despite all reported openings.
  validated: true
  validation_method: Exact point classification and B-Rep intersections on immutable draft.1 and draft.2 STEP masters using cad/audit_quality.py.
