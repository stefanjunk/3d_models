    - .agents/skills/validate-printable-3d-projects/assets/p2-stage-manifest.schema.json
    - .agents/skills/validate-printable-3d-projects/scripts/fdm_validation/p2stage.py
    - .agents/skills/validate-printable-3d-projects/scripts/fdm_validation/p2author.py
    - business/tools/prepare_p2_stage.py
    - business/tools/audit_p2_stage.py
    - business/02-portfolio/p2-stage-audit.json
applicability:
  triggers:
    - A product is assigned, audited for, or retained at any lifecycle stage beginning with P2.
    - A legacy P2 inventory is missing one of the four required artifact roles.
    - Concept-stage authority is configured for automatic approval.
    - A multipart or variant product needs a complete print-set assertion.
  exclusions:
    - P0/P1 concepts and source-only models that are explicitly not claimed as P2.
    - Physical, safety, rights, appearance or commercial approval, which remain separate gates.
  transfer_limits:
    - Treat the rule as an E0 learning candidate even though it is immediately enforced in this repository at the user's direction.
    - Do not transfer the Kobra 3 Max profiles or the current support decisions to another machine or product without exact evidence.
