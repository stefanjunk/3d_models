id: EXP-00067
title: P2 needs a revision-bound content and manufacturing handoff, not only a model-status label
captured_at: 2026-09-05
source_type: user-correction
lifecycle:
  state: candidate
  maturity: E0
  confidence: medium
  review:
    status: pending
    reviewed_by: null
    reviewed_at: null
    notes: "The rule is structurally validated across the 78 current P2 products, but future-project compliance and physical usefulness of the packaged orientation/support choices still need longitudinal evidence."
feature:
  type: P2 lifecycle artifact and manufacturing-handoff gate
  geometry: cross-product FFF/FDM workflow; not geometry-specific
  design_parameters:
    required_artifact_count: 4
    description_language: en
    concept_scope: whole-product
    render_basis: current-model
    print_set_format: 3mf
    complete_print_parts_required: true
    orientation_decision_required: true
    support_decision_required: true
  named_datums: []
  constraints:
    - The English description, concept image, current-model render and complete 3MF are separate hash-bound artifacts for one named revision.
    - Concept auto approval changes the reviewer, never the requirement to create and retain the concept image.
    - A retrospective concept sheet closes only a legacy inventory gap and does not claim prior concept approval.
    - The 3MF contains every intended printed part and quantity and preserves the chosen orientation and support mode.
    - Failure of any required artifact demotes or retains the product below P2.
scope:
  process: FFF/FDM digital-candidate workflow
  machine:
    manufacturer: Anycubic for the audited portfolio handoff
    model: Kobra 3 Max for newly authored remediation projects
    unit_id: null
    firmware: null
  material:
    manufacturer: mixed
    product: PLA, PETG and TPU profile families
    variant: null
    color: null
    batch: null
    conditioning: null
  nozzle:
    diameter_mm: 0.4
    material: mixed or unknown
    geometry: null
    hotend: null
    wear_state: null
  orientation: revision-specific source orientation preserved and placed on the destination-slicer build plate
  slicer:
    name: Anycubic Slicer Next
    version: 1.3.9.4
    profile: product-specific or recorded workspace reference profile
    profile_hash: null
  geometry_class: mixed functional, decorative and hybrid printable products
  environment: repository-wide P2 inventory remediation; digital evidence only
  transfer_limits:
    - The four-artifact gate is a repository workflow candidate, not evidence that a product is physically or commercially ready.
    - Current orientation and support results are destination-slicer project decisions, not physical print qualification.
    - Machine, material and profile choices remain product-specific outside this audited portfolio.
observation:
  summary: The portfolio used P2 labels without consistently requiring an English description, whole-product concept, current-model render and one complete print-ready 3MF.
  expected: Every P2 row has all four revision-bound artifacts, and the 3MF records complete print-object coverage, orientation and support intent.
  actual: Before remediation, 31 products lacked an identifiable concept image, eight lacked an identifiable current-model render, 28 lacked any 3MF, and only seven 3MF files carried destination-slicer project metadata; four products could not truthfully meet the complete-current-print-set requirement.
  outcome: correction
  parameter: lifecycle-stage entry contract
  recommended_value: fail-closed P2 manifest plus deterministic portfolio audit
  units: workflow contract
explanation:
  hypothesis: A single product-local manifest with artifact hashes, semantic roles and 3MF manufacturing decisions prevents a lifecycle label from outrunning its inspectable evidence.
  mechanism: The P2 validator checks artifact existence and hashes, English description content, concept/render separation, declared versus actual 3MF object count, package structure, and embedded or linked support evidence; the portfolio audit reruns that validator for every current P2 row.
  alternatives:
    - Counting extensions alone was rejected because a coupon-only or incomplete 3MF can exist without representing the product.
    - Reusing the current render as the concept was rejected because design intent and manufactured geometry have different evidence roles.
    - Leaving deficient entries at P2 with TODO text was rejected because it preserves a false lifecycle claim.
  validated: true
  validation_method: Deterministic validation of 78 product-local manifests and 3MF packages plus a repository-wide portfolio audit; no physical printing was performed.
evidence:
  observations: 1
  same_scope_repetitions: 78
  geometry_count: 78
  machine_count: 1
  material_count: 3
  nozzle_count: 1
  measured: true
  measurement_method: CSV-to-manifest identity comparison, SHA-256 verification, Markdown/image-role checks, 3MF package/XML/object-count inspection and embedded support-setting checks.
  uncertainty: Object completeness is assessed against each named current revision and declared product scope; future scope changes require a new manifest and review.
  sources:
    - type: user-statement
      ref: conversation 2026-09-05 — mandatory P2 English description, concept, render and complete oriented/support-planned 3MF
      hash: null
