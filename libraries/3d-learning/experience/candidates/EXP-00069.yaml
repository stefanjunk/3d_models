observation:
  summary: Volute could not pass intake because the global backfill proposed changes to other products.
  expected: Retain existing assessments and refresh only stale aggregates after targeted intake repair.
  actual: The initial local dry-run proposed 198 paths; 106 mode comparisons rejected uppercase RETROSPECTIVE
    links. After repair the repeated dry-run proposes zero changes and both portfolio validators pass for 116
    products.
  outcome: success
  parameter: backfill changed paths
  recommended_value: Zero on repeated unchanged-input dry-run; fail without writes on incomplete existing intake.
  units: files
explanation:
  hypothesis: Case-sensitive workflow comparison and invalid-as-missing fallthrough caused retrospective regeneration;
    inventory-derived revision comparison could also displace the assessed revision.
  mechanism: Normalize only the supported mode comparison, validate existing records and links, preserve their
    explicit revision, and precheck the full inventory before writes.
  alternatives:
  - Missing product companions, stale aggregate data and mismatched assessment links independently blocked
    the same intake and required targeted reconciliation.
  validated: true
  validation_method: Nine temporary-repository regression tests, complete portfolio checks and SHA-256 preservation
    comparison.
