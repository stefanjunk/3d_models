surface_design:
  visual_language:
    - zen wave flow
    - kintsugi repair lines
    - layered stone and ink-wash depth
    - asymmetric but balanced sculptural silhouette
    - soft G2-like highlight flow on visible side envelopes
    - continuous oval ribbon cadence around each visible roll
    - dark slender vertical accents without exposed industrial X-frame character
  macro_ornament:
    method: fair guide curves plus lofted or SubD-derived printable solids
    motifs:
      - five oval ribbon frames that narrow and merge near module interfaces
      - cresting wave shoulders and overlapping side leaves across module seams
      - kintsugi branching network following rather than fighting curvature
      - open interwoven crown loops and pebble-like lower cradle transitions
  microtexture:
    intended_effect: fine cleanable ceramic-stone micro-peen plus directional seigaiha wave flow in selected recesses
    representation: compact procedural relief on exterior texture-skin regions
    pitch_mm: [1.8, 2.4]
    printable_feature_width_mm: [0.9, 1.2]
    relief_height_mm: [0.18, 0.28]
    protected_margin_mm: 3.0
    hygiene_note: no porous lattice or aggressive fuzzy skin on touch and roll-contact surfaces

environment:
  indoor_outdoor: indoor
  temperature_c: [10, 40]
  moisture: humid-bathroom-with-occasional-splash
  uv: low-indoor
  cleaning: damp-cloth-and-mild-household-cleaner

