  tests: tests/

decision_log:
  - id: D-001
    status: accepted-provisional
    decision: Keep FIFO clearance and five-roll baseline from version 1.
    basis: prior design history and explicit user request to redesign appearance/function architecture rather than storage capacity
  - id: D-002
    status: accepted
    decision: Split exact functional core, freeform side shells, rear struts, ornaments, texture skin, and four color solids.
    basis: preserves critical interfaces while enabling premium form, material efficiency, repair, and multicolor control
  - id: D-003
    status: accepted-provisional
    decision: Use a 0.4 mm nozzle for the premium visible architecture.
    basis: required 0.9-1.2 mm color and texture features; trade-off is longer print time than 0.6 mm
  - id: D-004
    status: accepted
    decision: Match the previous concept image and edit the existing source package rather than reconstructing from text.
    basis: source ZIP and concept image are now preserved as immutable references with recorded hashes
  - id: D-005
    status: accepted
    decision: Rebuild the primary visible form from fair freeform ribbons and shells; retain the old GLBs only as relief/style references and optional local organic donors.
    basis: the prior maximum-Z flattening preserved local depth but destroyed the concept's dominant three-dimensional massing
  - id: D-006
    status: accepted
    decision: Replace black preview panels with concept-faithful walnut/bronze spines and subtle warm-sand secondary relief.
    basis: the concept image is warm ivory, gold, wood/bronze, and sand rather than ivory, gold, and large charcoal slabs
  - id: D-007
    status: accepted
    decision: Use two non-crossing wave struts per side and module instead of X braces or a full rear wall.
    basis: the digital proxy preserves the rear load path, removes the technical cage character, and contributes to a 31.20 percent CAD solid-volume reduction
  - id: D-008
    status: accepted-provisional
    decision: Retain the final manufacturing tessellation without lossy decimation.
    basis: all STLs and 3MF objects validate, the largest module remains below 190k triangles, and the protected shallow texture/inlay/watermark features make unconstrained simplification higher risk than benefit; destination-slicer timing remains pending

concept_review:
  specification_revision: 2.1.0
  asset: generated_images/exec-aac29bb2-3398-46cb-a4d0-aeda2e99d638.png
  status: approved
  visible_correspondence:
    - requirement: five-roll passive FIFO with visible stock
      depiction: exactly five vertically stacked rolls in the main three-quarter view
    - requirement: top refill and bottom extraction
      depiction: open ribbon crown and unobstructed lower cradle
    - requirement: non-technical premium character
      depiction: continuous oval front ribbons and overlapping leaf-like side masses
    - requirement: thin closed side walls
      depiction: closed curved shells with restrained modular seams rather than flat slide plates
    - requirement: material-efficient rear structure
      depiction: narrow central mounting spine and sparse curved connectors in the rear cutaway
    - requirement: fine premium texture
      depiction: subtle ceramic-stone microtexture and shallow seigaiha line relief
    - requirement: up to four colors
      depiction: warm ivory, antique gold, walnut/bronze, and warm sand accents
    - requirement: fragrance-stone shelf
      depiction: integrated right-side pebble shelf in the hero and side views
  deliberate_simplifications:
