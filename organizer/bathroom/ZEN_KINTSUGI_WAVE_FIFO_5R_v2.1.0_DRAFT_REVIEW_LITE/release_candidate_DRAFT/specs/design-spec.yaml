acceptance:
  - id: fifo-clearance
    criterion: A 122 x 107 mm conservative roll proxy traverses every module transition and the full shaft without geometric collision.
    method: swept-proxy collision test at no fewer than 100 vertical positions
  - id: fifo-physical
    criterion: Five representative real rolls descend one position after each bottom removal for 20 consecutive cycles without manual correction.
    method: physical prototype test including at least one slightly oval roll
  - id: geometry-valid
    criterion: Every manufacturing body is manifold/watertight with intended body count and positive volume.
    method: STL and 3MF round-trip mesh inspection
  - id: wall-thickness
    criterion: Closed side shells retain at least 1.4 mm local wall after texture and ornament integration; mounting load paths meet their larger local targets.
    method: thickness sampling and section review
  - id: mounting
    criterion: The printed mounting spine shows no cracking, creep, pull-through, or visible permanent deformation in a wall-substrate-specific prototype test.
    method: physical test at a documented proof load; no universal rating claimed
  - id: appearance
    criterion: The matched front three-quarter view reproduces the concept's oval ribbon cadence, closed leaf-like side massing, open crown loops, gold branching, slender dark spines, fragrance shelf, and warm ceramic-stone character without visible industrial X-frame dominance.
    method: matched-view render review and physical texture/color coupon
  - id: multicolor
    criterion: All color bodies remain aligned, non-zero-thickness, printable, and mapped to the actual four-filament palette in the destination slicer.
    method: 3MF validation plus Anycubic Slicer Next preview
  - id: cleanability
    criterion: Exterior texture can be wiped without snagging tissue fibres; roll-contact and extraction surfaces remain smooth.
    method: physical texture coupon and wipe test
  - id: bed-fit
    criterion: Every intended print body fits the configured Kobra 3 Max build volume in its documented orientation.
    method: slicer preflight
  - id: watermark-release
    criterion: The exact JSI-WM-001-R1 mark is recessed, normally readable from the finished rear exterior, process-safe, and explicitly approved on the current geometry revision.
    method: functional-3d-design watermark release gate

