requirements_ledger:
  user_stated:
    - retain passive FIFO operation with top refill and bottom removal
    - store five toilet-paper rolls and remain parametrizable for more rolls
    - wall-mounted and space-saving for small bathrooms
    - make remaining roll count directly visible
    - move substantially closer to the Zen Kintsugi Wave concept image
    - add missing decoration and ornaments using freeform surfacing
    - cover exterior sides with a fine, detailed, premium texture
    - permit up to four different colors
    - decompose the object into appropriate functional, freeform, organic, texture, and color components
    - keep side walls closed, curved, raised, and material-efficient
    - replace a thick solid rear wall with a strut structure where feasible
    - avoid the simple, technical character of the previous model
  inferred:
    - bathroom exposure means humidity and splash resistance matter
    - roll-contact surfaces must remain smooth and texture-free to prevent FIFO jams
    - organic ornament is appearance-authoritative but must not own mounting, FIFO clearance, or module interfaces
    - the existing five-roll target remains compatible with rolls up to diameter 120 mm and width 105 mm
    - the existing 4 mm radial/side clearance target remains the FIFO baseline
  recommended:
    - use one polymer family for all four colors, preferably PETG
    - use a 0.4 mm nozzle and 0.20 mm visible layers for the premium exterior
    - preserve a modular height architecture for build-volume compatibility and extra-roll variants
    - use separate watertight color solids rather than slicer-only painting
    - use compact procedural relief rather than image displacement or uncontrolled fuzzy skin
    - keep the mounting spine and extraction cradle parametric and exact
  unresolved:
    - the actual four loaded filament colors and exact material products are unknown
    - the preferred 0.4 versus 0.6 mm nozzle strategy is not confirmed

evidence_classification:
  concept_image:
    authority: visual-target-only
    observed:
      - five vertically stacked rolls framed by continuous soft oval front ribbons
      - closed ivory side surfaces with large overlapping leaf and wave masses
      - fine seigaiha-like line relief concentrated in side recesses
      - thin irregular gold kintsugi branches crossing frame and side surfaces
      - dark walnut or bronze vertical corner accents
      - open sculptural ribbon crown with multiple interwoven loops
      - small integrated right-side fragrance-stone shelf
      - warm ceramic-stone appearance with rounded tactile edges
    inferred:
      - rear geometry and wall mounting are hidden and must be engineered independently
      - the apparent continuous shell must be split into registered print modules
      - shadows in the side relief are lighting cues and must not all become deep geometry
    not_authoritative_for:
      - exact dimensions
      - wall thickness
      - connector geometry
      - anchor selection
      - FIFO clearance
  existing_model:
    authority: functional-baseline-and-reusable-interfaces
    verified:
      - 122 x 107 mm proxy passes 98 shaft positions without collision
      - current manufacturing meshes are reported watertight
      - slide rail clearance is 0.25 mm per side with 0.27 mm depth clearance
      - five-roll assembly uses a 124 mm module pitch
    deficiencies:
      - primary body is still a technical extruded frame with visible X braces
      - organic GLBs were flattened to planar maximum-Z relief instead of driving freeform massing
      - front appliques are only about 20.5 mm wide and do not form the concept's full oval ribbon frames
      - repeated 4.4 mm thick slide panels read as attached plates rather than closed curved side shells
      - crown ornament is a flat-backed relief merged onto a short technical crown frame
      - current palette is effectively ivory/gold/wood with large dark-gray-looking surfaces in preview
      - current 0.6 mm nozzle and 0.30 mm layers are too coarse for the requested premium microdetail
      - current five-roll CAD solid volume is approximately 890327 mm3 before slicer infill treatment

function:
  summary: >-
    A premium wall-mounted decorative column that stores five toilet-paper rolls,
    is refilled from the top, dispenses from the bottom in passive FIFO order, and
    exposes the remaining roll count without a separate indicator mechanism.
  users:
    - adults in small domestic bathrooms
  operating_sequence:
    - mount the empty tower to a suitable wall with wall-specific anchors
    - load rolls through the open top crown
    - remove the lowest roll through the front-bottom extraction opening
    - allow the next roll to descend under gravity without manual intervention
  interfaces:
    - wall mounting spine and purchased wall-specific fasteners
    - modular body joints aligned to one global FIFO shaft datum
    - separate keyed or captured color/ornament bodies
    - removable fragrance-stone tray retained from the original theme if concept-compatible

risk:
  class: normal-functional
  hazards:
    - falling object if the wall substrate or anchors are unsuitable
    - roll jam caused by oval, damp, oversized, or highly deformed rolls
    - sharp ornament tips or detached small inlays
  assumptions:
    - indoor bathroom use, not direct shower exposure
    - anchors are selected and installed for the actual wall construction
    - no safety load rating is claimed without physical mounting tests

fabrication:
  preference: balanced-hybrid
  assembly_target: moderate
  repairability: preferred
  architecture:
    functional_core:
      authority: parametric
      owns:
        - roll envelope and FIFO keep-out
        - mounting datums and fastener seats
        - module registration and connectors
        - bottom extraction cradle and stop
        - rear load path
    side_envelopes:
      authority: hybrid-freeform
      owns:
        - continuous-looking closed curved side silhouette across registered modules
        - large overlapping leaf masses and raised wave shoulders from the concept image
        - thin shell and local ribs outside FIFO keep-out
    rear_structure:
      authority: parametric-freeform-hybrid
      owns:
        - central mounting spine
        - sparse curved diagonal struts hidden behind the rolls and side envelope
        - anti-racking load path
    ornaments:
      authority: organic-or-freeform
      owns:
        - five full-width oval front ribbons with flowing inter-module continuity
        - wave crests and leaf-like side masses
        - zen pebble transitions
        - open interwoven ribbon crown and lower flourish
      interface_owner: functional_core
    texture_skin:
      authority: procedural-surface
      owns:
        - exterior microtexture only
      keep_outs:
        - roll-contact surfaces
        - module joints
        - mounting faces
        - fastener seats
        - keyed inlay pockets
        - hand-contact extraction lip
    color_solids:
      authority: multicolor-fdm
      route: separate-watertight-solids

printer:
  model: Anycubic Kobra 3 Max
  build_volume_mm: [420, 420, 500]
  material_changer: ACE 2 Pro
  max_simultaneous_filaments: 4
  enclosure: false

manufacturing:
  process: fdm-fff
  material_family: PETG
  nozzle_mm: 0.4
  line_width_mm: 0.45
  layer_height_mm: 0.20
  target_formats: [step, 3mf, stl, obj]
  supports_target: none-or-localized-only
  color_architecture:
    - id: stone_ivory_body
      role: primary thin-shell body and structural core
      provisional_display_color: "#D7D0C1"
    - id: antique_gold_kintsugi
      role: broad printable inlays and selected wave crests
      provisional_display_color: "#B68A3A"
    - id: walnut_bronze_spines
      role: slender rear/corner spines and selected fragrance-tray structure
      provisional_display_color: "#5A3827"
    - id: warm_sand_relief
      role: subtle seigaiha recesses, fragrance-stone tray, and optional pebble accent
      provisional_display_color: "#B8A489"
  multicolor_rules:
    - all intended filament regions are named volumetric solids
    - isolated color features are at least 0.90 mm wide at 0.45 mm line width
    - inlays are at least 0.60 mm deep and use lead-in plus positive retention or adhesive allowance
    - small color islands are merged or removed
    - active colors per layer are minimized where appearance permits
    - concept fidelity takes priority over forcing all four colors into every module
    - use one PETG family for in-place ACE printing; separately bonded inserts may use another family only after a coupon

