appearance_and_relief:
  visual_language:
    value: "Warme, matte und klar als Holz erkennbare Innenoptik mit langen, ruhig driftenden Maserungslinien und wenigen grossen Astkonturen; keine Stahlplatten, Nieten oder fotorealistische Mikroporen."
    basis: "user-stated-and-recommended"
  intended_effect:
    value:
      geometric: "Flache, rein vertiefte und abgerundete Makro-Maserungsnuten; wenige ebenfalls vertiefte Astkonturen nur auf ausreichend grossen Bodenfeldern."
      optical: "Warmer Holzfarbton und matte Oberflaeche; feine Fasern und Poren werden nicht als Geometrie modelliert."
      tactile: "Leicht fuehlbar, aber glatt genug fuer Entnahme und Reinigung; keine erhabenen oder scharfkantigen Rippen."
      not_claimed: ["keine Kopie einer bestimmten Holzart oder eines konkreten Brettes", "keine strukturellen Eigenschaften von Holz"]
    basis: "recommended"
  source_texture:
    value: "Kein Rasterbild und keine vollflaechige Heightmap in der R2-Produktionsgeometrie. Die Holzmaserung wird aus kompakten, deterministischen Vektor-/Splineparametern mit gespeichertem Seed erzeugt. Die R1-Stahlbilder und 16-Bit-Master bleiben nur als unveraenderte Provenienz-/Baseline-Artefakte erhalten."
    basis: "recommended"
  representation:
    value:
      CORE: "Exakte parametrische Organizer-Geometrie, Modulverbinder, Wandknoten, Griffnuten, Pass- und Bettflaechen."
      MACRO_TEXTURE: "Sparsame prozedurale Vektorkurven und wenige verschachtelte Astkonturen als negative Cutter; keine dichte Flaechentessellation."
      MESO_TOOLPATH: "Gerichtete Deckschichtbahnen duerfen die Holzrichtung optisch unterstuetzen, muessen dann aber im exakten 3MF/Slicerprojekt reproduzierbar gespeichert werden."
      MATERIAL_FINISH: "Standardmaessig ungefuelltes warmbraunes PETG; Mikrofasern, Farbvariation und Glanz sind Material-/Finishaufgabe."
      KEEP_OUTS: "Verbinder, Modultrennflaechen, Unterseite, Wasserzeichen, Griffnut-Radien, Wandwurzel- und Knotenverrundungen sowie schmale Sicherheitsraender bleiben geometrisch glatt."
    basis: "recommended"
  r2_surface_scope:
    value:
      included:
        - "Alle nach oben offenen Fachboeden und der Boden der Schraubendreherzone, mit 2.0-mm-Reinigungsrand zu Wandwurzeln und Funktionsmerkmalen."
        - "Alle inneren senkrechten Wandseiten, die bei geoeffneter Schublade sichtbar sind; Maserungsband ab 4.0 mm ueber der Bodenwurzel bis 2.0 mm unter der Oberkante."
        - "Nach oben gerichtete Aussenrand-, Trennwand- und Knotenoberseiten sowie sichere Oberseiten des herausnehmbaren Schraubendreherkamms."
      appearance_only_on_smooth_keepouts:
        - "Griffnut-Radien, vollhohe Wandknoten-/Wurzelverrundungen und zu schmale Topflaechen bleiben nutfrei, erhalten aber denselben Holzfarbton."
      excluded:
        - "Aussenseiten der vier Module, Unterseiten, Bettaufstands- und Wasserzeichenflaechen."
        - "Puzzleverbinder, Modultrenn- und Passflaechen, Kammsteck-/Schlitzflaechen und sonstige Gleit-/Kontaktflaechen."
    basis: "user-stated-and-recommended"
    rationale: "Damit tragen genau die beim Oeffnen sichtbaren Innen- und Oberseiten die Holzoptik, ohne Passung, Reinigung oder Verbinder zu gefaehrden."
  procedural_grain:
    value:
      seed: 20260820
      grain_direction: "Auf grossen horizontalen Flaechen global Front-zu-Ruecken (+Y); auf senkrechten Flaechen entlang der jeweiligen langen lokalen Flaechenrichtung, mit kontrollierter Phase an Ecken."
      repeat_policy: "Kein Bild-Tiling; deterministische Kurven werden in Millimetern erzeugt, kontrolliert beschnitten und nicht anisotrop gestreckt."
      groove_width_mm: 0.90
      floor_groove_depth_mm: 0.20
