optimization:
  status: "pending"
  objective: "Bildbasierte Oberflaechentessellation und kurze Druckpfadsegmente deutlich reduzieren, ohne Huelle, Passung, Stabilitaet, Reinigbarkeit oder sichtbare Holzoptik zu verschlechtern."
  baseline_slicer_report: null
  selected_variant: "R2 compact procedural-vector wood grooves"
  comparison_report: "reports/R2-procedural-wood-digital-validation.json"
  mesh_simplification:
    status: "not-beneficial"
    rationale: "R2 entfernt die dichte Heightmap bereits parametrisch und unterschreitet mit 426832 Dreiecken und 21.34 MB die Budgets deutlich. Eine weitere verlustbehaftete Decimation bietet ohne exakten Slicernachweis keinen angemessenen Nutzen gegenueber dem Risiko fuer Passungen, Bettflaechen und 0.16/0.20-mm-Holznuten. Die 0.0001-mm-Manifold-Exportbereinigung und exakte interne Flaechenpaaraufhebung sind deterministische Exporthygiene, keine kosmetische Decimation."
    master_mesh: "output/DRAFT/DRAFT-R2-*-procedural-wood-unmarked.stl (reference manufacturing set; no lossy candidate selected)"
    master_geometry: "Parametrische JavaScript-/Manifold3D-Quelle plus versionierte JSON-Parameter"
    manufacturing_meshes: "output/DRAFT/DRAFT-R2-*-procedural-wood-unmarked.stl und zugehoerige R2-Coupons"
    decision_report: "reports/R2-mesh-simplification-decision.md"
    protected_regions:
      - "Gesamthuelle und Modultrennflaechen"
      - "Puzzleverbinder und 0.30-mm-Passung"
      - "Bettkontakt-Unterseiten und Wasserzeichenregionen"
      - "Wandwurzel-, T-/Kreuzungsknoten- und Griffnutgeometrie"
      - "Maserungsgrenzen, Astkonturen, Topkanten und sichtbare Silhouetten"
      - "Mindestboden und doppelseitige Mindestrestwand"
    resource_budget:
      triangle_target: 1500000
      triangle_stop: 1810000
      peak_memory_gib: 1.20
      max_mesh_mib: 90
      max_slicer_seconds: 120
    slicer_resolution_check:
      status: "pending"
      report: null

acceptance_criteria:
  dimensional_fit:
    value: "Gesamtaußenmaß ueberschreitet 227 x 357 x 76 mm nicht; an jeder Schubladenseite nominell 1.5 mm Spiel."
    basis: "recommended"
  geometry:
    value: "Jedes Druckmodul ist geschlossen, manifold/watertight, volumenhaltig und einzeln slicebar; keine unbeabsichtigten Koerper oder Kollisionen."
    basis: "recommended"
  stability:
    value: "Alle Trennwaende besitzen durchgehende Bodenanbindung; T- und Kreuzungsknoten sind vom Boden bis zur Wandoberkante tangential verrundet. Keine freie Wandlaenge ueber 120 mm ohne Anschluss oder Rippe."
    basis: "recommended"
  printability:
    value: "Supportfrei in Zielorientierung; kleinste geometrische Maserungsmerkmale >= 2 nominelle Linienbreiten oder durch Testcoupon im Zielprozess nachgewiesen."
    basis: "recommended"
  texture:
    value: "Die Oberflaeche ist bei 400-700 mm Betrachtungsabstand als ruhige Holzmaserung erkennbar; Richtung und Phase wirken ueber benachbarte sichtbare Flaechen kohaerent. Keine Stahl-/Nietenreste, kein Raster-Tiling, keine erhabenen Spitzen. Restboden >= 2.40 mm und doppelseitig genutete Restwand >= 2.88 mm."
    basis: "recommended"
  texture_scope:
    value: "Holzoptik auf offenen Innenboeden, sichtbaren inneren Wandseiten und nach oben gerichteten Rand-/Trennwand-/Kammoberseiten; Aussenseiten, Unterseiten, Verbinder und Passflaechen bleiben ohne geometrische Maserung."
    basis: "user-stated-and-recommended"
  texture_efficiency:
    value: "Vier Hauptmodule zusammen Ziel <= 1.50 Mio. Dreiecke und <= 90 MiB STL; mindestens 70 % Reduktion gegen R1.3. Kein Modul > 0.75 Mio. Dreiecke oder > 1.20 GiB Peak-RSS."
    basis: "recommended"
  ergonomic_grooves:
    value: "Alle vorgesehenen Kleinteilfaecher besitzen eine zentrierte 22 x 8 mm breite U-Griffnut mit 4 mm unteren Rundungen; keine scharfkantigen rechteckigen Ausschnitte."
    basis: "recommended"
  junction_aesthetics:
    value: "Vollhoehenblenden an T- und Kreuzungsknoten sind in Vorschau und Mesh sichtbar gleichmaessig, tangential und frei von Stufen oder Selbstueberschneidungen."
    basis: "recommended"
  physical_tests:
    value:
      - "Spiel-/Eckcoupon in der realen Schublade"
      - "Holztexturcoupon mit glatter Baseline sowie 0.12/0.16/0.20-mm-Tiefen auf horizontaler Flaeche und senkrechter Innenwand"
      - "Eck-/Topkappencoupon fuer Phasenkontinuitaet, schmale Oberseite, Reinigung und Kantensicherheit"
      - "Probemodul mit mindestens einer Kreuzung, Verbindung und Griffmulde"
    basis: "recommended"

