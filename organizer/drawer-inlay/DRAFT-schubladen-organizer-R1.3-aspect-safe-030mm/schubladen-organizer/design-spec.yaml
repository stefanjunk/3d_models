      top_groove_depth_mm: 0.20
      nominal_spacing_range_mm: [3.0, 6.5]
      wavelength_range_mm: [28.0, 70.0]
      lateral_drift_range_mm: [0.5, 1.8]
      knot_count_assembly_max: 3
      knot_diameter_range_mm: [12.0, 24.0]
      knot_location: "Nur grosse Bodenfelder; keine Knoten auf Waenden, Topkappen, Griff-/Knotenradien oder Funktionsflaechen."
      minimum_printed_feature_mm: 0.90
      curve_and_groove_roots: "abgerundet; keine spitzen Enden oder tangentialen Nullkontakte"
    basis: "recommended"
  operation:
    value: "Rein vertiefte prozedurale Nuten und Astkonturen; kein Emboss, keine bildbasierte Gravur, keine kontinuierliche Heightmap."
    basis: "recommended"
  provisional_depth:
    value: "0.20 mm auf horizontalen Boden-/Topflaechen und 0.16 mm auf senkrechten Innenwandflaechen; keine Erhoehung."
    basis: "recommended"
    rationale: "Eine Schicht Tiefe auf horizontalen Flaechen und eine sehr flache Seitenwandmodulation erzeugen eine sichtbare Maserung bei deutlich geringerer Geometrie- und Schmutzlast."
