<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">MM-ORG-001 Konzeptblatt</title>
  <desc id="desc">Dreiviertelansicht und orthogonale Draufsicht eines modularen Schubladenorganizers mit Werkzeugspur, achtzehn Kleinteilefächern und einem exakten Drei-mal-drei-Fertigungsraster.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#112431" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="navyFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173544"/>
      <stop offset="1" stop-color="#112431"/>
    </linearGradient>
    <linearGradient id="tealFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b8b90"/>
      <stop offset="1" stop-color="#08777D"/>
    </linearGradient>
    <linearGradient id="sandFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6bd96"/>
      <stop offset="1" stop-color="#C7AB82"/>
    </linearGradient>
    <style>
      .title { font: 700 34px Inter, DejaVu Sans, sans-serif; fill: #112431; letter-spacing: .2px; }
      .subtitle { font: 400 18px Inter, DejaVu Sans, sans-serif; fill: #46606c; }
      .view-label { font: 700 17px Inter, DejaVu Sans, sans-serif; fill: #112431; letter-spacing: 1.5px; }
      .small { font: 500 15px Inter, DejaVu Sans, sans-serif; fill: #46606c; }
      .tiny { font: 600 12px Inter, DejaVu Sans, sans-serif; fill: #112431; }
      .module-no { font: 700 13px Inter, DejaVu Sans, sans-serif; fill: #112431; text-anchor: middle; dominant-baseline: central; }
      .seam { stroke: #7FD5D3; stroke-width: 4; stroke-dasharray: 11 8; fill: none; }
      .seam-fine { stroke: #7FD5D3; stroke-width: 3; stroke-dasharray: 8 6; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#FBFAF7"/>
  <circle cx="1490" cy="100" r="170" fill="#C7AB82" opacity="0.08"/>
  <circle cx="115" cy="930" r="210" fill="#7FD5D3" opacity="0.07"/>

  <text x="72" y="72" class="title">MM-ORG-001 · METOD/MAXIMERA 60</text>
  <text x="72" y="104" class="subtitle">Konzept 0.1.0 · Werkzeuglayout und exakt neun Druckmodule</text>
  <line x1="72" y1="128" x2="1528" y2="128" stroke="#d9dfdf" stroke-width="2"/>

  <text x="72" y="172" class="view-label">ZUSAMMENGEBAUT</text>
  <text x="940" y="172" class="view-label">DRAUFSICHT · 3×3 MODULRASTER</text>

  <!-- Three-quarter concept view. Geometry is an intent diagram, not dimensional evidence. -->
  <g transform="translate(66 210) skewY(-9) scale(1 .82)" filter="url(#shadow)">
    <!-- visible lower faces -->
    <path d="M35 735 H795 L825 762 H65 Z" fill="#0c5960"/>
    <path d="M795 35 L825 62 V762 L795 735 Z" fill="#0b1a23"/>

    <!-- tray body and floor -->
    <rect x="35" y="35" width="760" height="700" rx="18" fill="url(#navyFace)"/>
    <rect x="58" y="58" width="714" height="654" rx="10" fill="url(#sandFloor)"/>

    <!-- continuous tool lane -->
    <rect x="55" y="55" width="184" height="660" rx="15" fill="url(#sandFloor)" stroke="#112431" stroke-width="15"/>
    <rect x="231" y="47" width="15" height="676" rx="6" fill="#112431"/>

    <!-- exactly 18 hardware bins: 3 columns x 6 rows -->
    <g fill="url(#sandFloor)" stroke="#112431" stroke-width="12">
      <rect x="241" y="55" width="177" height="110" rx="14"/>
      <rect x="418" y="55" width="177" height="110" rx="14"/>
      <rect x="595" y="55" width="177" height="110" rx="14"/>
      <rect x="241" y="165" width="177" height="110" rx="14"/>
      <rect x="418" y="165" width="177" height="110" rx="14"/>
      <rect x="595" y="165" width="177" height="110" rx="14"/>
      <rect x="241" y="275" width="177" height="110" rx="14"/>
      <rect x="418" y="275" width="177" height="110" rx="14"/>
      <rect x="595" y="275" width="177" height="110" rx="14"/>
      <rect x="241" y="385" width="177" height="110" rx="14"/>
      <rect x="418" y="385" width="177" height="110" rx="14"/>
      <rect x="595" y="385" width="177" height="110" rx="14"/>
      <rect x="241" y="495" width="177" height="110" rx="14"/>
      <rect x="418" y="495" width="177" height="110" rx="14"/>
      <rect x="595" y="495" width="177" height="110" rx="14"/>
      <rect x="241" y="605" width="177" height="110" rx="14"/>
      <rect x="418" y="605" width="177" height="110" rx="14"/>
      <rect x="595" y="605" width="177" height="110" rx="14"/>
    </g>

    <!-- finger scallop suggestions -->
    <g fill="#C7AB82">
      <circle cx="329" cy="159" r="15"/><circle cx="506" cy="159" r="15"/><circle cx="683" cy="159" r="15"/>
      <circle cx="329" cy="269" r="15"/><circle cx="506" cy="269" r="15"/><circle cx="683" cy="269" r="15"/>
      <circle cx="329" cy="379" r="15"/><circle cx="506" cy="379" r="15"/><circle cx="683" cy="379" r="15"/>
      <circle cx="329" cy="489" r="15"/><circle cx="506" cy="489" r="15"/><circle cx="683" cy="489" r="15"/>
      <circle cx="329" cy="599" r="15"/><circle cx="506" cy="599" r="15"/><circle cx="683" cy="599" r="15"/>
      <circle cx="329" cy="709" r="15"/><circle cx="506" cy="709" r="15"/><circle cx="683" cy="709" r="15"/>
    </g>

    <!-- removable screwdriver comb -->
    <g fill="#C7AB82" stroke="#a98c62" stroke-width="2">
      <rect x="76" y="364" width="140" height="19" rx="5"/>
      <rect x="80" y="337" width="11" height="35" rx="3"/>
      <rect x="96" y="337" width="11" height="35" rx="3"/>
      <rect x="112" y="337" width="11" height="35" rx="3"/>
      <rect x="128" y="337" width="11" height="35" rx="3"/>
      <rect x="144" y="337" width="11" height="35" rx="3"/>
      <rect x="160" y="337" width="11" height="35" rx="3"/>
      <rect x="176" y="337" width="11" height="35" rx="3"/>
      <rect x="192" y="337" width="11" height="35" rx="3"/>
    </g>

    <!-- exact 3 x 3 manufacturing seams, deliberately independent of compartments -->
    <line x1="288.33" y1="35" x2="288.33" y2="735" class="seam"/>
    <line x1="541.67" y1="35" x2="541.67" y2="735" class="seam"/>
    <line x1="35" y1="268.33" x2="795" y2="268.33" class="seam"/>
    <line x1="35" y1="501.67" x2="795" y2="501.67" class="seam"/>

    <!-- restrained conceptual interlock markers -->
    <g fill="#7FD5D3">
      <rect x="280" y="139" width="17" height="34" rx="5"/><rect x="533" y="139" width="17" height="34" rx="5"/>
      <rect x="280" y="372" width="17" height="34" rx="5"/><rect x="533" y="372" width="17" height="34" rx="5"/>
      <rect x="280" y="605" width="17" height="34" rx="5"/><rect x="533" y="605" width="17" height="34" rx="5"/>
      <rect x="151" y="260" width="34" height="17" rx="5"/><rect x="404" y="260" width="34" height="17" rx="5"/><rect x="657" y="260" width="34" height="17" rx="5"/>
      <rect x="151" y="493" width="34" height="17" rx="5"/><rect x="404" y="493" width="34" height="17" rx="5"/><rect x="657" y="493" width="34" height="17" rx="5"/>
    </g>
  </g>

  <!-- Exact orthographic plan. -->
  <g transform="translate(940 205)" filter="url(#shadow)">
    <rect x="0" y="0" width="560" height="537" rx="16" fill="url(#navyFace)"/>
    <rect x="18" y="18" width="524" height="501" rx="8" fill="url(#sandFloor)"/>
    <rect x="15" y="15" width="180" height="507" rx="12" fill="url(#sandFloor)" stroke="#112431" stroke-width="13"/>
    <rect x="188" y="10" width="14" height="517" rx="5" fill="#112431"/>

    <!-- 18 plan bins -->
    <g fill="url(#sandFloor)" stroke="#112431" stroke-width="9">
      <rect x="198" y="15" width="116" height="84.5" rx="10"/><rect x="314" y="15" width="116" height="84.5" rx="10"/><rect x="430" y="15" width="116" height="84.5" rx="10"/>
      <rect x="198" y="99.5" width="116" height="84.5" rx="10"/><rect x="314" y="99.5" width="116" height="84.5" rx="10"/><rect x="430" y="99.5" width="116" height="84.5" rx="10"/>
      <rect x="198" y="184" width="116" height="84.5" rx="10"/><rect x="314" y="184" width="116" height="84.5" rx="10"/><rect x="430" y="184" width="116" height="84.5" rx="10"/>
      <rect x="198" y="268.5" width="116" height="84.5" rx="10"/><rect x="314" y="268.5" width="116" height="84.5" rx="10"/><rect x="430" y="268.5" width="116" height="84.5" rx="10"/>
      <rect x="198" y="353" width="116" height="84.5" rx="10"/><rect x="314" y="353" width="116" height="84.5" rx="10"/><rect x="430" y="353" width="116" height="84.5" rx="10"/>
      <rect x="198" y="437.5" width="116" height="84.5" rx="10"/><rect x="314" y="437.5" width="116" height="84.5" rx="10"/><rect x="430" y="437.5" width="116" height="84.5" rx="10"/>
    </g>

    <!-- top-view comb -->
    <g fill="#C7AB82" stroke="#a98c62" stroke-width="1.5">
      <rect x="38" y="257" width="136" height="17" rx="4"/>
      <rect x="43" y="233" width="9" height="31" rx="2"/><rect x="58" y="233" width="9" height="31" rx="2"/>
      <rect x="73" y="233" width="9" height="31" rx="2"/><rect x="88" y="233" width="9" height="31" rx="2"/>
      <rect x="103" y="233" width="9" height="31" rx="2"/><rect x="118" y="233" width="9" height="31" rx="2"/>
      <rect x="133" y="233" width="9" height="31" rx="2"/><rect x="148" y="233" width="9" height="31" rx="2"/>
    </g>

    <!-- exact 3 x 3 module grid -->
    <line x1="186.67" y1="0" x2="186.67" y2="537" class="seam-fine"/>
    <line x1="373.33" y1="0" x2="373.33" y2="537" class="seam-fine"/>
    <line x1="0" y1="179" x2="560" y2="179" class="seam-fine"/>
    <line x1="0" y1="358" x2="560" y2="358" class="seam-fine"/>

    <!-- module numbers make the nine-part interpretation explicit -->
    <g>
      <g transform="translate(30 30)"><circle r="15" fill="#FBFAF7" opacity=".92"/><text class="module-no">1</text></g>
      <g transform="translate(217 30)"><circle r="15" fill="#FBFAF7" opacity=".92"/><text class="module-no">2</text></g>
      <g transform="translate(403 30)"><circle r="15" fill="#FBFAF7" opacity=".92"/><text class="module-no">3</text></g>
      <g transform="translate(30 209)"><circle r="15" fill="#FBFAF7" opacity=".92"/><text class="module-no">4</text></g>
      <g transform="translate(217 209)"><circle r="15" fill="#FBFAF7" opacity=".92"/><text class="module-no">5</text></g>
      <g transform="translate(403 209)"><circle r="15" fill="#FBFAF7" opacity=".92"/><text class="module-no">6</text></g>
      <g transform="translate(30 388)"><circle r="15" fill="#FBFAF7" opacity=".92"/><text class="module-no">7</text></g>
      <g transform="translate(217 388)"><circle r="15" fill="#FBFAF7" opacity=".92"/><text class="module-no">8</text></g>
      <g transform="translate(403 388)"><circle r="15" fill="#FBFAF7" opacity=".92"/><text class="module-no">9</text></g>
    </g>
  </g>

  <!-- Connector concept detail -->
  <g transform="translate(940 786)">
    <rect x="0" y="0" width="560" height="142" rx="16" fill="#ffffff" stroke="#d9dfdf" stroke-width="2"/>
    <text x="24" y="34" class="view-label">CONNECTOR-KONZEPT</text>
    <text x="24" y="61" class="small">Flach, werkzeuglos steckbar; Profil und Spiel folgen erst aus dem Coupon-Test.</text>
    <g transform="translate(50 84)">
      <path d="M0 0 H152 V36 H0 Z M152 10 H176 Q190 18 176 26 H152 Z" fill="url(#tealFace)"/>
      <path d="M410 0 H258 V36 H410 Z M258 8 H230 Q208 18 230 28 H258 Z" fill="url(#navyFace)"/>
      <line x1="198" y1="18" x2="212" y2="18" stroke="#7FD5D3" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(72 944)">
    <rect width="18" height="18" rx="4" fill="#112431"/><text x="28" y="14" class="small">Außen- und Trennwände</text>
    <rect x="235" width="18" height="18" rx="4" fill="#C7AB82"/><text x="263" y="14" class="small">Fachböden</text>
    <rect x="410" width="18" height="18" rx="4" fill="#7FD5D3"/><text x="438" y="14" class="small">Fertigungsnähte / Connector-Zonen</text>
  </g>
  <text x="1528" y="958" class="tiny" text-anchor="end">DESIGNINTENT · KEIN MASS- ODER DRUCKNACHWEIS</text>
</svg>
