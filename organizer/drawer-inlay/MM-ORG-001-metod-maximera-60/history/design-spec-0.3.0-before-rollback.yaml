risk_and_evidence:
  risk_class: normal-functional
  hazards:
    - "fit too tight may jam or mark the drawer"
    - "cumulative module tolerance may exceed the published reference envelope"
    - "connector fit may be too tight, too loose or induce rocking if printer/material compensation is unqualified"
    - "male connector roots or locally opened mating walls may crack under forced assembly"
    - "sharp print defects may cut or scratch the user/drawer"
    - "unqualified material/finish may be mistaken for food-safe or dishwasher-safe"
  assumptions:
    - "the published UPPDATERA envelope is a reliable system-fit reference"
    - "actual drawer revisions may vary and therefore require physical evidence"
    - "the first prototype targets the approved Kobra 3 Max 420 mm profile; common-220 remains a later parameter profile"
  stop_rules:
    - "no compatibility claim before real-drawer fit evidence"
    - "no full tray-set print before a same-profile planar-connector clearance coupon passes"
    - "no forced connector assembly; a non-fitting coupon requires a measured clearance revision"
    - "no texture if it invades fit, abutting walls, marking or minimum-wall keep-outs"
    - "no release if a module exceeds the selected printer profile's usable footprint"

acceptance:
  digital:
    - id: module-validity
      criterion: "Every generated tray and shim is a watertight, manifold, positive-volume single body."
    - id: bed-fit
      criterion: "Every tray fits the selected profile: common-220 ≤216 × 216 mm; Kobra-420 ≤416 × 416 mm; one-piece only when the usable bed fits the full envelope."
    - id: assembly-envelope
      criterion: "The packed set is nominally 512 × 491 × 50 mm and never exceeds 514 × 493 × 50.5 mm."
    - id: protected-geometry
      criterion: "Minimum walls, flat drawer-contact datums, abutting walls, finger access and watermark keep-outs pass deterministic checks."
    - id: package
      criterion: "One profile-specific safe-core 3MF contains the exact generated tray count and matches the manifest."
  physical:
    - id: connector-fit
      criterion: "Every connector pair seats by hand without tools or forcing; joined tray floors remain coplanar and the packed set has no objectionable seam rotation, looseness or rocking."
    - id: drawer-fit
      criterion: "Assembled set inserts/removes without tools or damage, lies flat, and drawer opens/closes fully in the exact target revision."
    - id: loaded-use
      criterion: "5 kg distributed contents; 100 open/close cycles without jamming, fracture, rocking or unacceptable migration."
    - id: edge-safety
      criterion: "No sharp burrs, proud wall edges or snagging seams after finishing."
    - id: repeatability
      criterion: "Three unchanged-revision final sets meet dimensions, fit, packed-set stability and use criteria."
    - id: watermark
      criterion: "Domain, product ID and version are readable on the intended printer/material/bed coupon and match the release record."

deliverables:
  after_requirements_and_concept_approval:
    editable_source: "CadQuery/Python parametric B-Rep source and profile configuration"
    design_neutral: ["STEP assembly", "STEP files per unique tray geometry"]
    manufacturing: ["one profile-specific safe-core 3MF", "internal validation STLs per generated tray"]
    documentation: ["assembly guide", "measurement guide", "print profile", "test plan", "validation report", "release manifest"]
    visuals: ["approved concept sheet", "model renders", "dimensioned fit diagram", "packed-set stability and underside marking evidence"]
  step: "required design-neutral B-Rep export from the CadQuery master"

