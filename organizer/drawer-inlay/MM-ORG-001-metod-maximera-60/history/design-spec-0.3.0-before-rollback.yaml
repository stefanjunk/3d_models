requirements:
  labels:
    user_stated:
      - "Use the current drawer inlay as the source design."
      - "Research common drawer sizes, including IKEA and DIN/ISO context."
      - "Create a variant for the selected common drawer size after the required approvals."
      - "Minimize connectors because they make the finished product unstable."
      - "Use connectors only when segmentation is otherwise required by the printer."
      - "The inlay is no longer required to be tool-specific."
      - "Remove the screwdriver comb."
      - "Reintroduce connectors between the necessary printed sections."
      - "Keep the individual part inlays as large as possible."
    inferred:
      - "The variant should remain eligible for the MM-ORG-001 digital MVP rather than become a large-printer-only internal print."
      - "The Kobra 3 Max first prototype should remain a four-part 2 × 2 layout because four is the minimum rectangular part count for the selected usable footprint."
    recommended:
      - "Target IKEA METOD/MAXIMERA nominal 60 × 60 cm first."
      - "Use a 512 × 491 × 50 mm assembled envelope derived from the published 516 × 495 × 50 mm UPPDATERA reference."
      - "Generate the fewest tray modules that fit the selected printer profile: one piece on a sufficiently large bed, four pieces for Kobra 3 Max, or nine pieces for a common 220 mm bed."
      - "For the Kobra 3 Max profile retain four approximately 256 × 245.5 mm trays and join only their four shared seam segments."
      - "Reuse the R1.6 planar-jigsaw principle, but regenerate it seam-relatively in CadQuery and qualify new clearances because the inherited R1.6 coupon has a documented physical non-fit."
      - "Use two flush planar connector pairs per shared seam segment as the default: eight mating locations total prevent each seam from pivoting around a single connector."
      - "Use CadQuery as the new source of truth; use R1.6 as a form and connector-principle reference rather than extending or scaling its Manifold3D geometry."
      - "Build and validate plain geometry first; decorative surfaces remain a later noncritical derivative."
    unresolved: []

goal_and_scope:
  function: >
    A full-footprint general-purpose drawer organizer derived from the calm,
    rounded R1.6 form language and sized for the published insert envelope of
    an IKEA METOD/MAXIMERA 60 × 60 cm drawer system. It is generated as the
    fewest independent closed trays that fit a selected printer profile. The
    four maximally large Kobra-profile trays join across the necessary internal
    seams with flush, coupon-qualified planar connectors.
  intended_users:
    - "Adults organizing household, office, hobby, utility or kitchen-adjacent non-food-contact items"
    - "3D-printer owners using the fixed safe-core 3MF through metriCreate"
    - "Future metriMade printed-product customers after fulfillment qualification"
  included:
    - "Four large FDM tray modules forming one connector-aligned fixed-size organizer on the Kobra 3 Max profile"
    - "General-purpose compartment mix selected at requirements approval"
    - "Rounded internal transitions and finger-access features derived from R1.6 where useful"
    - "Flush planar connectors at required internal seams plus optional outer-perimeter fit shims"
    - "Generated product-specific metriMade underside marking at final geometry gate"
  excluded:
    - "No universal-DIN, universal-600-mm or all-METOD compatibility claim"
    - "No 37 cm-deep MAXIMERA variant in this revision"
    - "No food-contact, dishwasher-safe, child-directed or load-bearing claim"
    - "No live self-service resize in the first fixed revision"
    - "No screwdriver comb or dedicated tool lane"
    - "No additional subdivision beyond the minimum four Kobra-profile trays"
    - "No proud, under-floor, snap, dovetail or separate-hardware connector system"
    - "No surface texture before the plain fit architecture passes"

geometry:
  coordinate_convention:
    origin: "front-left-bottom of assembled organizer"
    axes: {x: "left-to-right", y: "front-to-back", z: "up"}
  target_system:
    status: approved
    manufacturer: IKEA
    cabinet_family: METOD
    drawer_family: MAXIMERA
    nominal_cabinet_mm: [600, 600]
    reference_accessory: "UPPDATERA 52 × 50 cm combination"
    published_reference_envelope_mm: [516, 495, 50]
    note: "Reference accessory dimensions are not asserted to be the exact clear drawer cavity."
  assembly_envelope_mm:
    value: [512, 491, 50]
    status: recommended
    rationale: "2 mm nominal clearance per side relative to the published 516 × 495 mm reference envelope"
  maximum_release_envelope_mm:
    value: [514, 493, 50.5]
    status: recommended
    rationale: "Fail-closed manufactured/assembled maximum; real-drawer coupon remains mandatory"
  structure:
    floor_thickness_mm: {value: 2.6, status: inherited-recommended}
    base_wall_thickness_mm: {value: 3.2, status: inherited-recommended}
    outer_wall_height_mm: {value: 50.0, status: recommended}
    divider_height_mm: {value: 44.0, status: recommended}
    outer_corner_radius_mm: {value: 3.0, status: inherited-recommended}
  functional_layout:
    status: approved
    dedicated_tool_lane: false
    screwdriver_comb: false
    selected_profile: kobra_3_max_420
    selected_set:
      open_trays: 1
      two_compartment_trays: 1
      four_compartment_trays: 2
      total_trays: 4
      total_compartments: 11
    recommended_sets:
      common_220:
        open_trays: 3
        two_compartment_trays: 3
        four_compartment_trays: 3
      kobra_3_max_420:
        open_trays: 1
        two_compartment_trays: 1
        four_compartment_trays: 2
      one_piece:
        layout: "mixed fixed compartments derived from the selected general-purpose concept; no internal manufacturing seams"
  segmentation_profiles:
    policy: "fewest parts that fit the selected usable print footprint; connectors only at the resulting necessary seams"
    common_220:
      usable_footprint_mm: [216, 216]
      columns: 3
      rows: 3
      module_count: 9
      nominal_module_mm: [170.667, 163.667]
    kobra_3_max_420:
      status: approved-first-prototype
      official_build_volume_mm: [420, 420, 500]
      usable_footprint_mm: [416, 416]
      columns: 2
      rows: 2
      module_count: 4
      nominal_module_mm: [256, 245.5]
    one_piece:
      minimum_recommended_usable_footprint_mm: [516, 495]
      columns: 1
      rows: 1
      module_count: 1

interfaces:
  drawer_fit:
    type: "drop-in; no screws, adhesive or drawer modification"
    nominal_clearance_per_side_mm: 2.0
    evidence_required: "real target drawer/revision plus fit-corner coupon and assembled set"
  module_connection:
    type: planar_jigsaw
    status: approved
    source: "R1.6 principle only; positions and dimensions regenerated from seam-relative CadQuery parameters"
    shared_seam_segments: 4
    recommended_connectors_per_segment: 2
    recommended_total_mating_locations: 8
    placement: "spaced symmetrically along each shared edge segment, outside corner and divider-root keep-outs"
    z_policy: "integrated only within the floor plane; no feature below the drawer-contact datum"
    assembled_envelope_policy: "male lugs and female sockets mate inside the nominal 512 × 491 mm packed envelope"
    legacy_reference:
      type: planar_jigsaw
      lug_radius_mm: 4.0
      neck_length_mm: 5.0
      neck_width_mm: 4.0
      nominal_clearance_per_side_mm: 0.30
      qualification: "not inherited as production geometry; documented real coupon non-fit"
    coupon_clearance_sweep_mm: [0.30, 0.40, 0.50]
    rationale: "two points on each necessary seam resist relative rotation while the four-part minimum keeps each tray as large as the Kobra profile permits"
  packed-set-stability:
    primary: "two flush planar connector pairs per shared seam segment, supplemented by drawer-perimeter constraint"
    adjustment: "optional non-connecting perimeter shims in 0.5, 1.0 and 2.0 mm"
    prohibited: "proud seam connectors, under-floor features or forced-fit connector geometry that can rock on the drawer bottom"
  protected_regions:
    - "drawer-contact perimeter and bottom datum"
    - "flat tray undersides, abutting module walls and connector root keep-outs"
    - "finger-access grooves"
    - "wall roots and internal divider junctions"
    - "watermark safe region and remaining floor wall"

