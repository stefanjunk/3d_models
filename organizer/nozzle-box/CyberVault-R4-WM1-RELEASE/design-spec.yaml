decision_log:
  - revision: 1
    decision: "Hybridroute gewaehlt: CadQuery fuer funktionale Geometrie und Text; Mesh-Hoehenkartenrelief fuer dichte Cyber-Oberflaechen."
    rationale: "Praezise Passungen bleiben editierbar, waehrend die kuenstlerische Textur ohne fragile B-Rep-Pixelflaechen erzeugt werden kann."
  - revision: 1
    decision: "Austauschbarer Dueseneinsatz empfohlen."
    rationale: "Die konkrete Kobra-3-Max-Duesenvariante kann abweichen; das Gehaeuse bleibt wiederverwendbar."
    status: superseded-by-revision-2
  - revision: 2
    decision: "Alle zwoelf Aufnahmen fest in den Unterkasten integrieren; kein austauschbarer Einsatz und keine Zukaufteile."
    rationale: "Direkte Benutzeranforderung fuer eine vollstaendig gedruckte Ein-Druck-Loesung."
  - revision: 3
    decision: "Offene Drei-Punkt-Aufnahmen fuer komplette Kobra-3-Max-Quick-Swap-Duesen verwenden."
    rationale: "Sichere Lokalisierung bei besserer Toleranz gegen kleine Unterschiede zwischen alter und neuer Duesenrevision."
  - revision: 3
    decision: "Die Zwei-Punkt-Couponvariante mit 0,35 mm Spiel je Seite als Produktionspassung verwenden."
    rationale: "Der Benutzer hat diese Variante am realen PETG-Coupon als am besten passend ausgewaehlt."
  - revision: 3
    decision: "Produktions-CAD mit Replicad 0.23.1 auf OpenCascade und Manifold3D als unabhaengiger Mesh-/Kollisionspruefung erzeugen."
    rationale: "Im Arbeitsraum war kein CadQuery/OpenSCAD/FreeCAD verfuegbar; die Route liefert weiterhin editierbares parametrisches B-Rep, STEP, STL und unabhaengige Meshvalidierung."
  - revision: 3
    decision: "JSI-WM-001-R1 standard mittig auf der druckbettseitigen Unterseite des Unterkastens platzieren."
    rationale: "Die freie 50-x-20-mm-Zone nimmt das nominale 32-x-10-mm-Profil mit 9 mm horizontalem und 5 mm vertikalem Rand auf; bei 0,40 mm Rezess bleiben 2,60 mm Boden."
  - revision: 4
    decision: "Die Aussenhaut als dichtes, vollflaechiges Cyber-/Science-Fiction-Line-Art-Relief neu gestalten und die kuenstlerische Vorlage per Bildgenerierung erzeugen."
    rationale: "Der Revision-3-Entwurf wirkt durch nur 3,9 % belegte Hoehenkartenpixel zu leer. Eine hierarchische Kombination aus Reaktorkern, Paneelen, Datenbahnen, Hex-Struktur und exakten parametrischen Glyphen erhoeht die visuelle Dichte, ohne Passungen oder Mechanik zu veraendern."
  - revision: 4
    decision: "Anforderungen Revision 4 freigegeben; Konzeptphase fuer die neue Aussenhaut entsperrt."
    rationale: "Explizite Benutzerfreigabe vom 2026-08-11. Produktions-CAD und Fertigungsexporte bleiben bis zur Konzeptfreigabe gesperrt."
  - revision: 4
    decision: "Konzeptkandidat mit dichtem Reaktorkern-/Datenbahnrelief und kontinuierlichem Seitenband erzeugt."
    rationale: "Das Blatt macht die geforderte hohe Flaechenbelegung, zwei Reliefhierarchien und die Funktionsfreizonen sichtbar. KI-Schrift bleibt nicht fertigungsautoritativ und wird im CAD parametrisch ersetzt."
  - revision: 4
    decision: "Konzept Revision 4 freigegeben; Produktions-CAD fuer die neue Aussenhaut entsperrt."
    rationale: "Explizite Benutzerfreigabe vom 2026-08-11. Innenraum, Duesensitze, Scharnier und Rastverschluss bleiben als unveraenderte, physisch bestaetigte Referenz erhalten."
  - revision: 4
    decision: "R4 als hybriden Druckmesh-Kandidaten mit OpenCascade-Funktionsmaster und Hoehenkarten-Boolean fuer die dichte Deckelgravur ausgeben."
    rationale: "Die 85,24-prozentige dekorative Rasterabdeckung ist als robuste B-Rep-Einzelfeatur unnoetig schwer, bleibt im geschlossenen Manifold-Mesh jedoch reproduzierbar und vollstaendig erhalten. STEP bleibt der editierbare Funktionsmaster; 3MF/STL sind die fertigungsautoritativen Reliefdateien."
  - revision: 4
    decision: "JSI-WM-001-R1 nach Abschluss der R4-Reliefgeometrie erneut integrieren und den Kandidaten als CYBERVAULT-R4-CAD-A-WM1 sperren."
    rationale: "Das Wasserzeichen ist damit die letzte geplante Produktgeometrieaenderung. Die erneute Evidenz bestaetigt 0,40 mm Rezess, 2,60 mm Restboden und unveraendertes Bett-Datum."
  - revision: 4
    decision: "Kennzeichnung und finalen Release fuer CYBERVAULT-R4-CAD-A-WM1 freigeben."
    rationale: "Explizite Benutzerfreigabe vom 2026-08-11. Die finale Ausgabe veraendert keine Modellgeometrie; nur Status, Metadaten, Dateinamen, Berichte und Paketmanifest werden auf RELEASE gesetzt."
