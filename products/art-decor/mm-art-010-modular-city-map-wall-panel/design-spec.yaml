    working_crs: "ETRS89 / UTM zone 33N (EPSG:25833)"
    source_crs: "WGS84 / OSM source coordinates, transformed without anisotropic art scaling"
  print_part_indexing:
    parts: [left, right]
    split: "one vertical seam at global X = 300 mm"

geometry:
  assembled_nominal_mm: [600.0, 400.0]
  print_split: {columns: 2, rows: 1}
  main_part_nominal_mm: [300.0, 400.0]
  main_part_envelope_max_mm: [300.0, 400.0, 5.0]
