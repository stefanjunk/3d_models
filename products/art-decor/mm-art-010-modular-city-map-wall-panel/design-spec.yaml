  backer_thickness_mm: 3.0
  front_relief:
    inlay_depth_mm: 0.6
    transport_emboss_height_mm: 0.6
    minimum_isolated_color_width_mm: 0.9
    minimum_label_stroke_mm: 1.0
    small_island_min_area_mm2: 0.8
  light_apertures:
    representation: "through-part negative geometry derived from selected simplified map paths"
    minimum_width_mm: 2.0
    minimum_ligament_mm: 5.0
    maximum_open_area_fraction_per_part: 0.12
    center_seam_keepout_mm: 8.0
    joiner_hanger_keepout_mm: 12.0
    rear_diffuser_land_width_mm: 6.0
