acceptance_details:
  digital:
    - "Two globally registered Berlin halves reconstruct one nominal 600 x 400 mm artwork with one vertical seam and no independent scaling"
    - "No rear grid, magnet pocket, replaceable-tile datum or service retainer exists in the current production architecture"
    - "All color solids are manifold, positive-volume, aligned and pairwise non-overlapping"
    - "Both 300 x 400 mm main halves fit the verified 420 x 420 mm Kobra 3 Max bed"
    - "Permanent seam, three one-way connectors, isolated snap-in hanger/standoff parts and LED lands have unique parametric owners and pass collision/ligament checks"
    - "Every intended light opening is truly open and preserves seam/joiner/hanger/attribution keep-outs"
  slicer:
    - "Exact Anycubic Slicer Next profiles import each half as one aligned four-color assembly without auto-arrangement"
    - "All four semantic bodies map to the intended ACE slots and remain visible in the final layer preview"
    - "No first-layer island, missing thin route, unsupported inlay or cross-seam feature loss"
    - "Transition count and purge estimate stay within the approved one-off pilot budget"
  physical:
    - "The connector coupon selects the actual pocket clearance, spring geometry and locating-land allowance"
    - "A representative glue-free seam/connector coupon passes one-time assembly, crack/whitening, flushness and defined pull/step checks before full assembly"
    - "The completed two-half artwork remains flat, permanently aligned and visually continuous"
    - "Installed artwork survives a mass-based proof load; wall anchors remain user/installer-selected"
    - "Halo/light-through gauge confirms strip envelopes, cable exits, diffuser lands and visible passage without a rear grid"
    - "Appearance, seam visibility, color contamination and lighting effect receive human approval"

