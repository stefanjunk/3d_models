requirements_trace:
  user_stated:
    - "Create the city/street-map wall product with the 3D-design workflow"
    - "Allow and plan for up to four colors"
    - "Make the 600 x 400 mm wall picture from multiple 3D-printed parts"
    - "Create Berlin as the first city-map pilot"
    - "Prepare optional customer-added rear halo lighting and light-through openings"
    - "Keep the palette abstract and avoid wasteful pseudo-realistic color mixing"
    - "Use Oak for the light base plate"
    - "Use Mint Green for the middle relief and area level"
    - "Use Midnight for the dark street network"
    - "Use Sky Blue for the Berlin boundary and accents"
    - "Treat this four-color selection as a product variant and slicer/filament-loading choice, not as a redesign"
    - "Make palette selection parameterizable and prepare a separate size parameter axis"
    - "Add selectable map extents later as a separate, more complex capability"
    - "Add the metriCreate.com logo slightly raised at Sterkrader Straße 24, 13507 Berlin"
    - "Keep the address configurable for later products"
    - "Allow the location artwork to be replaced by another logo, image or icon"
    - "Do not use a rear grid"
    - "Do not make the printed sections replaceable"
    - "Treat each pilot as a permanent one-off artwork"
    - "Use the Anycubic Kobra 3 Max Combo for four-color printing"
    - "Use glue-free plug connectors for the printed assembly"
    - "Support a boundary-cropped Berlin silhouette with no surrounding printed geometry"
    - "Support a rectangular Umland relief with the Berlin administrative boundary marked"
    - "Reduce unintended free area and create one Berlin example of each display mode"
  inferred:
    - "One-off means one permanently assembled physical Berlin artwork, even though its main body requires more than one print"
    - "Indoor decorative adult product, not a navigation aid or structural wall component"
    - "The design remains complete and mountable without customer lighting"
    - "The concealed connector and local hanger/standoff plugs are one-way assembly interfaces; destructive removal does not make the artwork a replaceable system"
    - "The 600 x 400 mm size is a maximum envelope for boundary_crop and the fixed rectangular size for context_outline"
    - "The current qualified size remains 600 x 400 mm; another size requires parametric regeneration because functional interfaces must retain absolute dimensions"
    - "The user-supplied headquarters attribution is accepted as content input; the official address source verifies only the address point"
    - "A replacement bitmap is interpreted as a monochrome silhouette/mask, not as arbitrary five-plus-color image printing"
  recommended:
    - "Use two permanent 300 x 400 mm printed halves instead of the superseded six 200 mm tiles; both halves fit the verified 420 x 420 mm Kobra 3 Max bed and reduce visible seams from seven to one"
    - "Join the halves permanently with discrete seam locating lands and three concealed loose one-way spring/tenon connectors; no structural adhesive"
    - "Create the 18 mm halo gap with isolated snap-in printed hanger/standoff parts, not a frame or grid"
    - "Apply optional LED strip directly to declared rear adhesive lands or small local clips and reserve matched cable passages across the center seam"
    - "Keep four existing semantic tools/bodies as geometry authority and apply palette presets only through the slicer/ACE filament map; do not regenerate or rename geometry for a colorway"
    - "For future sizes, scale the map/envelope in X/Y but preserve connector clearances, wall gap, relief heights, light keep-outs and minimum printable feature sizes as absolute process-controlled dimensions"
    - "Use OpenStreetMap vector data with an immutable extraction snapshot and visible attribution"
    - "Use indoor PLA, the standard 0.4 mm nozzle and 0.20 mm layers as the provisional colored-art process"
    - "Use boundary_crop as the customer-facing default and a 12 percent per-side Umland margin for context_outline"
    - "Mark Berlin in context_outline with a 2.4 mm Sky Blue relief boundary"
    - "Use the selected compact metriCreate M mark rather than the wide wordmark so the default 16.5 mm symbol remains legible and does not obscure the local street field"
    - "Center the mark on the resolved address, raise it 0.6 mm, and merge it into semantic tool 4 so the design still uses at most four filaments"
    - "Freeze each address-to-coordinate result and keep location, artwork asset, width, orientation, relief height and semantic tool as independent parameters"
  unresolved_consequential: []
  unresolved_nonblocking:
    - "Exact connector and snap clearances, insertion force and retention require a Kobra 3 Max process-matched coupon before print-candidate approval"
    - "The four physical spool identities are recorded as FIL-0005, FIL-0001, FIL-0003 and FIL-0002; exact batches, conditioning, measured swatches and opacity remain to be recorded before final slicing"
    - "Final aperture appearance and opacity remain subject to a physical light coupon"
    - "Additional production sizes are not yet implemented or qualified"
    - "Selectable map extents remain deferred and require a newly frozen geospatial source plus full placement and validation"
    - "The selected metriCreate logo asset is clearance-pending and blocks commercial release until the brand gate is closed"

function:
  summary: >
    A unique permanent Berlin street-map wall artwork offered in two controlled
    display modes: an irregular Berlin-boundary silhouette inside a maximum
    600 x 400 mm envelope, or a 600 x 400 mm rectangular Umland field with the
    Berlin boundary marked. Each is printed as two four-color halves on the
    Anycubic Kobra 3 Max Combo. The
    halves are permanently registered by concealed one-way printed connectors
    into one non-serviceable picture. Local connector springs and isolated
    snap-in hanger/standoff parts provide
    assembly and an 18 mm halo cavity without a rear grid. Selected abstract
    paths pass optional customer-added light through the visible face. A
    parameterized, slightly raised single-color site marker can identify a
    frozen address using a replaceable logo, icon or monochrome image mask.
  intended_users:
    - "adult indoor decor customers"
    - "customers commissioning one unique city artwork"
  included:
    - "two permanent Berlin main relief halves"
    - "one selected display mode: boundary_crop or context_outline"
    - "three small concealed one-way printed seam connectors"
    - "small snap-in hanger/standoff parts and lighting-interface gauge"
    - "Anycubic Slicer Next project 3MFs with four aligned named volumes plus named per-color meshes"
    - "parameterized front location marker in one existing semantic color body"
    - "rebuildable map-data and CAD pipeline with provenance"
  excluded:
    - "separate rear grid, rear frame or replaceable tile system"
    - "magnets, serviceable retainers or tile-removal features"
    - "LED strip, controller, power supply, wiring, diffuser and electrical connectors"
    - "wall screws, wall plugs/anchors, structural adhesive and installation services"
    - "outdoor, wet-room, emergency-signage, navigation or wall-load-rating claims"

