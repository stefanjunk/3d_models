    rule: "clip every semantic source layer against one immutable global panel frame, then split once at X = 300 mm; never fit or normalize halves independently"
    seam_rule: "global feature coordinates and relief heights remain identical on both sides of the permanent seam"

permanent_assembly:
  architecture: "two non-replaceable main prints permanently joined into one unique artwork; no rear grid"
  nominal_owner: "one parametric global seam skeleton owns both mating edges, three connector pockets, snap-in standoff sockets and wall plane"
  interface_source: "source/v0.3.0/interface_geometry.py with interface-parameters.json; provisional 0.25 mm per-side product clearance remains physical-coupon controlled"
  seam_interface: "discrete locating lands plus three concealed loose one-way spring/tenon connectors; no structural adhesive"
  wall_interface: "isolated upper hanger/standoff and lower standoff parts lock into local rear sockets; exact wall anchors remain installer-selected"
  assembly_sequence:
    - "print and test the process-matched multi-clearance connector coupon"
    - "insert three selected one-way connectors into the first half, align both halves on a flat fixture and press together once"
    - "snap the isolated hanger/standoff parts into their local rear sockets and verify the 18 mm wall plane"
    - "optionally apply customer lighting directly to the rear lands and route the cable without energizing it during mechanical assembly"
    - "mount the finished single artwork using substrate-appropriate customer-selected anchors"
  replaceable_sections: false
  service_cycles: 0
  protected_regions:
    - "visible map face and cross-seam features"
    - "center seam locating lands, connector pockets and one-way spring roots"
    - "hanger/standoff snap sockets and wall-fastener access"
    - "LED lands, cable routes, attribution and future watermark"

backlight_preparation:
  included_as: "mechanical preparation only"
  effect: "indirect halo against the wall plus selected front-through abstract paths"
  wall_standoff_target_mm: 18.0
  led_strip_keepout_mm: {width: 12.0, thickness: 4.0}
  compatible_nominal_strip_width_mm: [8.0, 10.0]
  cable_channel_min_mm: [6.0, 4.0]
  exits: [left, right, bottom]
  attachment: "direct rear adhesive lands or small local printed clips; no grid and no live electrical interface"
  optional_customer_diffuser: "local 6 mm lands accept thin removable diffuser film behind selected openings; diffuser is not supplied"
  thermal_rule: "open, ventilated low-power LED installation only; no temperature or fire-safety claim until the exact customer system is qualified"
  no_light_state: "the permanently assembled artwork and wall mounting must pass without any light component installed"

