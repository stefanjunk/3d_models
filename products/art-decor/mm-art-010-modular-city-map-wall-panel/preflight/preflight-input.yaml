product: Permanent One Off City Map Wall Relief with Parameterized Site Marker
intended_use: 'A unique permanent Berlin street-map wall artwork offered in two controlled display modes: an irregular
  Berlin-boundary silhouette inside a maximum 600 x 400 mm envelope, or a 600 x 400 mm rectangular Umland field
  with the Berlin boundary marked. Each is printed as two four-color halves on the Anycubic Kobra 3 Max Combo. The
  halves are permanently registered by concealed one-way printed connectors into one non-serviceable picture. A
  parameterized, slightly raised single-color logo/icon/image-silhouette marks a frozen address or coordinate without
  exceeding the existing four-tool budget. Local
  connector springs and isolated snap-in hanger/standoff parts provide assembly and an 18 mm halo cavity without
  a rear grid. Selected abstract paths pass optional customer-added light through the visible face.'
