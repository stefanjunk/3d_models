product: MM-ART-010 Berlin permanent one-off city-map wall relief with two display modes
intended_use: Unique indoor decorative wall relief, assembled without adhesive from two four-color main prints; either an irregular Berlin silhouette inside a maximum 600 x 400 mm envelope or a rectangular 600 x 400 mm Umland field with Berlin marked.
user_context: Adult indoor customer; optional customer-supplied low-power rear lighting; Kobra 3 Max Combo production.
host_variant:
  manufacturer: Anycubic
  model: Kobra 3 Max Combo
  revision: null
  variant_confirmed: true
lifecycle_states: [transport, assembly, use, failure]
requirements:
  - id: REQ-ASSEMBLY-001
    text: No rear grid, magnets, adhesive, or replaceable image sections; use concealed printed one-way plug connectors.
    acceptance_criterion: The assembled artwork has one controlled center seam and cannot separate during the defined handling and proof tests.
    priority: MUST
    source: user
  - id: REQ-LIGHT-001
    text: Prepare an 18 mm halo gap and front-through openings for an optional customer lighting add-on.
    acceptance_criterion: The artwork passes mechanically without lighting and the declared strip/cable volumes remain clear.
    priority: MUST
    source: user
  - id: REQ-DISPLAY-MODE-001
    text: Support boundary_crop, removing all printed geometry outside the Berlin administrative boundary.
    acceptance_criterion: The printed outer perimeter follows Berlin and no backer/color body exists outside the boundary.
    priority: MUST
    source: user
  - id: REQ-DISPLAY-MODE-002
    text: Support context_outline, retaining a rectangular Umland field and clearly marking the Berlin administrative boundary.
    acceptance_criterion: The full selected context extent contains mapped Umland and Berlin has a distinct robust boundary relief.
    priority: MUST
    source: user
