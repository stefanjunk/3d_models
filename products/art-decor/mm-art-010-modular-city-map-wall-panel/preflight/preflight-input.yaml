  - {id: E-CONNECT, kind: PRINTED_PART, name: One-way connector set, source_ref: design-spec.yaml}
  - {id: E-MOUNT, kind: PRINTED_PART, name: Local snap-in hanger and standoff set, source_ref: design-spec.yaml}
