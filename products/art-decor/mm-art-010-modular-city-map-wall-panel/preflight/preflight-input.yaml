requirements:
- Preserve the explicit purpose within the cited scope.
- Close every blocking preflight gate before production release.
- Replace the former compact metriCreate marker with the canonical stacked metriMade logo at Sterkrader Straße 24, 13507 Berlin.
- Target recognition from about 2 m with a 54.0 × 57.18 mm proposed envelope and require a physical human sight test.
- Parameterize location, artwork asset/type, width, orientation, relief height and existing semantic tool.
- Keep artwork replacement fail-closed for rights, feature-width, placement, mesh and slicer validation.
