acceptance_details:
  digital:
    - "Each pilot reconstructs one nominal 600 x 400 mm projected terrain extent from two permanent halves without anisotropic distortion or independent normalization"
    - "No rear grid, magnet pocket, replaceable-tile datum or service retainer exists in the current production architecture"
    - "Both halves are watertight, positive-volume, correctly wound and height-continuous at the permanent center seam"
    - "Every 16-bit master, transform, acquisition state, CRS and licence record is hash-bound"
    - "Both 300 x 400 mm main halves fit the verified 420 x 420 mm Kobra 3 Max bed"
    - "Permanent seam, three one-way connectors, isolated snap-in hanger/standoff parts and LED lands have unique parametric owners and pass collision/ligament checks"
    - "Reference/manufacturing mesh separation, resource budgets and protected-region comparison pass"
    - "Every intended light opening is truly open and preserves seam/joiner/hanger/attribution keep-outs"
  slicer:
    - "Exact Anycubic Slicer Next profiles import each half without missing terrain or auto-arrangement"
    - "Three layer-change heights are identical across both halves of one pilot and use no more than four colors"
    - "No first-layer islands, seam-edge gaps, missing peaks/benches or unsupported relief regions"
    - "Reported time, material and G-code tool changes are hash-bound to exact profiles and artifacts"
  physical:
    - "The connector coupon selects the actual pocket clearance, spring geometry and locating-land allowance"
    - "A representative glue-free seam/connector coupon passes one-time assembly, crack/whitening, flushness and defined pull/step checks before full assembly"
    - "Relief-depth and color-band coupon selects readable depth and thresholds under normal and grazing light"
    - "The completed two-half artwork remains flat, permanently aligned and terrain-continuous"
    - "Installed artwork survives a mass-based proof load; wall anchors remain user/installer-selected"
    - "Halo/light-through gauge confirms strip envelopes, cable exits, diffuser lands and visible passage without a rear grid"
    - "Appearance, seam continuity, sharp-edge handling and lighting effect receive human approval"

