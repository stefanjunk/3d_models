    origin: "lower-left corner of assembled visible panel"
    x: "projected east/right"
    y: "projected north/up"
    z: "out from wall toward viewer"
  geospatial_policy:
    source_crs: "record per dataset"
    working_crs: "appropriate ETRS89 UTM zone in metres; never latitude/longitude degrees as physical XY"
    aspect_policy: preserve
    fit: contain
    distortion_tolerance_pct: 0.75
  print_part_indexing:
    parts: [left, right]
    split: "one vertical seam at global X = 300 mm"

geometry:
  assembled_nominal_mm: [600.0, 400.0]
  print_split: {columns: 2, rows: 1}
  main_part_nominal_mm: [300.0, 400.0]
  main_part_envelope_max_mm: [300.0, 400.0, 12.0]
  permanent_center_seam_target_mm: 0.25
  seam_coupon_range_mm: [0.15, 0.25, 0.35, 0.45]
  outer_frame_target_mm: 8.0
  backer_thickness_mm: 3.0
  relief:
    maximum_depth_mm: 7.0
    target_total_thickness_max_mm: 10.0
    reference_pitch_mm: [0.30, 0.30]
    physical_pixel_aspect: 1.0
    continuous_tone_bits: 16
    normalization: "one global min/max and contrast transform per complete one-off; never normalize halves independently"
    vertical_scale: "reported physical exaggeration uses no more than 7.0 mm relief without clipping source elevations"
  light_apertures:
    representation: "through-part negative geometry derived from selected simplified contour, valley or mine-bench paths"
    minimum_width_mm: 2.0
    minimum_ligament_mm: 5.0
    maximum_open_area_fraction_per_part: 0.12
    center_seam_keepout_mm: 8.0
    joiner_hanger_keepout_mm: 12.0
    rear_diffuser_land_width_mm: 6.0
  segmentation:
    rule: "generate one global terrain raster and seam-locked mesh field, then split once at X = 300 mm"
    seam_vertices: "locked against simplification and derived from identical global samples"
    internal_border: "none; terrain continues through the one permanent seam"
    external_border: "outer perimeter only"

permanent_assembly:
  architecture: "two non-replaceable main prints per pilot permanently joined into one unique artwork; no rear grid"
  nominal_owner: "one parametric global seam skeleton owns both mating edges, three connector pockets, snap-in standoff sockets and wall plane"
  seam_interface: "discrete locating lands plus three concealed loose one-way spring/tenon connectors; no structural adhesive"
  wall_interface: "isolated upper hanger/standoff and lower standoff parts lock into local rear sockets; exact wall anchors remain installer-selected"
  assembly_sequence:
    - "print and test the process-matched multi-clearance connector coupon"
    - "insert three selected one-way connectors into the first half, align both halves on a flat assembly fixture and press together once"
    - "snap the isolated hanger/standoff parts into their local rear sockets and verify the 18 mm wall plane"
    - "optionally apply customer lighting directly to rear lands and route the cable without energizing it during mechanical assembly"
    - "mount the finished single artwork using substrate-appropriate customer-selected anchors"
  replaceable_sections: false
  service_cycles: 0
  protected_regions:
    - "relief surface and cross-seam height samples"
    - "center seam locating lands, connector pockets and one-way spring roots"
    - "hanger/standoff snap sockets and wall-fastener access"
    - "LED lands, cable routes, attribution and future watermark"

backlight_preparation:
  included_as: "mechanical preparation only"
  effect: "indirect halo against the wall plus selected front-through terrain paths"
  wall_standoff_target_mm: 18.0
  led_strip_keepout_mm: {width: 12.0, thickness: 4.0}
  compatible_nominal_strip_width_mm: [8.0, 10.0]
  cable_channel_min_mm: [6.0, 4.0]
  exits: [left, right, bottom]
  attachment: "direct rear adhesive lands or small local printed clips; no grid and no live electrical interface"
  optional_customer_diffuser: "local 6 mm lands accept thin removable diffuser film behind selected openings; diffuser is not supplied"
  thermal_rule: "open, ventilated low-power LED installation only; no temperature or fire-safety claim until the exact customer system is qualified"
  no_light_state: "the permanently assembled artwork and wall mounting must pass without any light component installed"

