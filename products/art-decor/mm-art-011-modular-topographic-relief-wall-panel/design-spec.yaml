    - "permanent center connector fracture or disengagement"
    - "sharp relief peaks or fragments after impact"
    - "warping that opens the visible permanent seam"
    - "customer-installed lighting heat, wiring or power-supply misuse"
    - "misinterpretation of deliberately exaggerated or dated terrain"
