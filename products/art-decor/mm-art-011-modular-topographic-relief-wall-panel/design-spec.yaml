requirements_trace:
  user_stated:
    - "Create the topographic wall-relief product with the 3D-design workflow"
    - "Allow and plan for up to four colors"
    - "Make each 600 x 400 mm picture from multiple 3D-printed parts"
    - "Create Harz and Rheinisches Braunkohlerevier pilots"
    - "Prepare optional customer-added rear halo lighting and light-through openings"
    - "Keep the palettes abstract and avoid wasteful pseudo-realistic color mixing"
    - "Do not use a rear grid"
    - "Do not make the printed sections replaceable"
    - "Treat each pilot as a permanent one-off artwork"
    - "Use the Anycubic Kobra 3 Max Combo for four-color printing"
    - "Use glue-free plug connectors for the printed assembly"
  inferred:
    - "Each one-off is one permanently assembled physical artwork, even though its main body requires more than one print"
    - "Terrain remains continuous-tone geometry; four colors do not replace the 16-bit source master"
    - "Indoor decorative adult product, not a surveying, navigation, planning or mine-safety model"
    - "The concealed connector and local hanger/standoff plugs are one-way assembly interfaces; destructive removal does not make the artwork a replaceable system"
  recommended:
    - "Use two permanent 300 x 400 mm printed halves per pilot; both halves fit the verified 420 x 420 mm Kobra 3 Max bed and reduce visible seams to one"
    - "Join the halves permanently with discrete seam locating lands and three concealed loose one-way spring/tenon connectors; no structural adhesive"
    - "Create the 18 mm halo gap with isolated snap-in printed hanger/standoff parts"
    - "Apply optional LED strip directly to declared rear lands or small local clips and reserve matched cable passages across the center seam"
    - "Use a separate immutable 16-bit global terrain master and one elevation-to-Z transform for each one-off"
    - "Use four horizontal elevation bands with only three global color changes per half"
    - "Use Copernicus DEM GLO-30 for Harz and current official GeoBasis NRW DGM1 for the changing mining-region pilot"
    - "Use indoor PLA, the standard 0.4 mm nozzle and 0.20 mm layers as the provisional colored-art process"
  unresolved_consequential: []
  unresolved_nonblocking:
    - "Exact connector and snap clearances, insertion force and retention require a Kobra 3 Max process-matched coupon before print-candidate approval"
    - "Exact filament batches, swatches, opacity and layer-change purge matrix remain pending"
    - "Final vertical exaggeration, three color thresholds and light-path density remain subject to data/concept/coupon evidence"

function:
  summary: >
    Two unique permanent 600 x 400 mm topographic wall artworks: Harz and the
    Rheinisches Braunkohlerevier. Each one-off is printed as two 300 x 400 mm
    four-color halves on the Anycubic Kobra 3 Max Combo and permanently joined
    into one non-serviceable relief using concealed one-way printed connectors.
    Local connector springs and isolated snap-in hanger/standoff parts provide
    assembly and an 18 mm halo cavity without a
    rear grid. Selected terrain-derived paths pass optional customer-added
    light through the visible face.
  intended_users:
    - "adult indoor decor customers"
    - "customers commissioning one unique regional terrain artwork"
  included:
    - "two permanent main relief halves per pilot"
    - "three small concealed one-way printed seam connectors per pilot"
    - "small snap-in hanger/standoff parts and seam/relief/light coupons"
    - "rebuildable 16-bit source-registration and adaptive-mesh pipeline"
    - "source, acquisition-state, licence and attribution records"
  excluded:
    - "separate rear grid, rear frame or replaceable tile system"
    - "magnets, serviceable retainers or tile-removal features"
    - "LED strip, controller, power supply, wiring, diffuser and electrical connectors"
    - "wall screws, wall plugs/anchors, structural adhesive and installation services"
    - "outdoor, wet-room, survey, navigation, planning, mine-safety or current-operations claims"

