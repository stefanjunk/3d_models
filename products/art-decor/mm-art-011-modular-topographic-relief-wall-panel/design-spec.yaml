risk:
  class: decorative
  hazards:
    - "artwork or local hanger snap interface detaches from the wall"
    - "permanent center connector fractures or disengages"
    - "sharp terrain peaks or fragments cause handling injury after impact"
    - "warping creates a visible height discontinuity or unstable wall plane"
    - "customer lighting overheats, is wired incorrectly or blocks ventilation"
    - "abstract, exaggerated or dated terrain is mistaken for current survey or safety data"
  mitigations:
    - "multi-clearance connector/snap coupons, in-plane spring orientation, distributed interfaces and a flat assembly fixture"
    - "mass-based proof load on the assembled hanger/standoff system before installation"
    - "edge/peak handling review and explicit decorative-data disclaimer"
    - "open 18 mm cavity, explicit LED keep-outs and no supplied electrical claim"
    - "installer selects wall anchors for the actual substrate"

