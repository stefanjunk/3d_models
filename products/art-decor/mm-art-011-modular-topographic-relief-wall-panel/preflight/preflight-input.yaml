product: Permanent One Off Topographic Relief Wall Panel
intended_use: 'Two unique permanent 600 x 400 mm topographic wall artworks: Harz and the Rheinisches Braunkohlerevier.
  Each one-off is printed as two 300 x 400 mm four-color halves on the Anycubic Kobra 3 Max Combo and permanently
  joined into one non-serviceable relief. Local rear seam keys and isolated hanger/standoff blocks provide assembly
  and an 18 mm halo cavity without a rear grid. Selected terrain-derived paths pass optional customer-added light
  through the visible face.'
