  minimum_visible_feature_basis: >-
    Preliminary three-perimeter target for the pinned 0.4 mm profile; final geometry
    must be measured and validated after Step1X processing.

generative:
  concept_role: mandatory whole-product Gate 0B image after requirements approval
  step1x_role: appearance-led organic geometry proposal after concept approval
  authority: >-
    Image generation owns only the approved appearance reference. Step1X-3D may propose
    massing and surface character; physical scale, flat support plane, minimum features,
    topology repair and release marking remain explicit engineering responsibilities.
  hidden_geometry: synthesized from one image and unverified until mesh inspection
  texture_status: unsupported by the owned geometry-only Step1X fork

risk:
  class: decorative
  criticality: K0
  scope_limit: Dry indoor adult desk or shelf display only; not a children's toy.
  hazards:
    - A narrow footprint or raised tentacle makes the figurine tip or rock on the desk.
    - A thin generated tentacle tip becomes sharp, fragile or breaks during handling.
    - The generated body contains non-manifold regions, floaters or an unusable underside.
  controls:
    - Four broad low tentacles and a flat support plane with a physical 10-degree tilt check
    - Minimum-feature and bare-hand edge inspection before any release
    - Watertightness, connected-component, self-intersection and bed-contact audits
    - No toy, safety, durability or commercial claim before physical and human gates pass

