requirements:
  user_stated:
    - Create a new product not already represented in the portfolio.
    - Make a funny, uplifting comic octopus figurine for desk display.
    - Create a concept image first and present it for human review.
    - Do not run Step1X-3D until the concept image has been approved.
  inferred:
    - Intended use is non-functional decoration on a dry indoor adult desk or shelf.
    - The character is an original generic octopus and not based on a third-party character or artwork.
    - The figurine is one coherent printed body without separate accessories or purchased parts.
  recommended:
    - Use a compact planning envelope no larger than 110 x 105 x 95 mm.
    - Give the character exactly eight clearly readable tentacles: four broad low tentacles form the stable base, two curl forward, and two lift as expressive arms.
    - Use an oversized rounded head tilted slightly to one side, large raised oval eyes, one arched brow, puffed cheeks and a broad asymmetrical grin.
    - Keep every tip blunt and thick, avoid isolated thin fingers or whiskers, and reserve a broad flat underside for printing and the later product mark.
    - Show a coral-orange body with a pale peach underside and small teal eye accents in the concept image; treat color as visual direction only because the local Step1X fork is geometry-only.
    - Use a clean three-quarter hero view on a subtle desk context plus a small front and side view for the concept sheet.
    - Use the pinned Kobra 3 Max / SUNLU PETG Black / 0.4 mm / 0.20 mm baseline for first manufacturability checks unless the owner requests another process.
  unresolved:
    - Whether a later release should be single-color or enter a separate multicolor workflow
    - Seller legal identity, target markets/channels and outgoing licence
    - Physical print, surface, stability and appearance results

function:
  summary: >-
    A one-piece comic octopus whose expressive face and dancing tentacle pose create
    a cheerful desk companion while four broad tentacles provide a stable display base.
  included:
    - Exactly eight recognizable tentacles integrated into one continuous body
    - Four broad low tentacles forming the primary desk-support footprint
    - Two forward curls and two lifted gesture tentacles for a lively silhouette
    - Geometric facial features readable without texture or printed labels
    - Flat hidden underside for support-free registration and later release marking
  excluded:
    - Cable holding, phone holding, storage or any other functional organizer role
    - Separate props, magnets, electronics, moving joints or purchased hardware
    - Third-party character likenesses, logos, text or branded trade dress
    - Child-toy, food-contact, outdoor, wet, vehicle, electrical, medical, load-bearing or safety use
  interfaces:
    - preflight/interfaces/IF-EXT-MEC-SUP-PLN-001.json
    - preflight/interfaces/IF-HUM-GEO-CON-FREEFORM-001.json

dimensions:
