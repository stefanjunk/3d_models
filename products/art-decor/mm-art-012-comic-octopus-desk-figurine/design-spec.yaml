acceptance:
  - id: AC-SILHOUETTE-001
    criterion: The approved concept and final model visibly contain one head and exactly eight distinct tentacles with no detached accessory.
    method: Front, side, top and three-quarter visual inspection.
    status: planned
  - id: AC-TOPOLOGY-001
    criterion: The manufacturing mesh is one watertight, consistently wound connected component with no self-intersections or floaters.
    method: Deterministic mesh audit.
    status: planned
  - id: AC-FEATURE-001
    criterion: No user-reachable tip or facial feature is thinner than 1.35 mm at released scale and no bare-hand edge is sharp after normal support removal.
    method: Mesh thickness/protrusion audit plus physical bare-hand inspection.
    status: planned
  - id: AC-STABILITY-001
    criterion: The printed figurine remains upright without sliding or rocking at a 10-degree base tilt in four cardinal directions on the recorded test surface.
    method: Physical prototype tilt and rocking test.
    status: planned
  - id: AC-APPEARANCE-001
    criterion: The owner confirms that the printed character reads as funny, cheerful and recognizably comic-octopus from normal desk-view distance.
    method: Human appearance review of the physical prototype.
    status: planned

