# MM-FUR-001 — Bill of materials, revision 0.1.0
#
# STATE: CONCEPT_ONLY. Quantities derive from a NOMINAL 1000 x 1000 mm niche that
# has NOT been measured. Prices are 2026 German retail ESTIMATES for budgeting, not
# quotes. Buy nothing that cannot be returned before the measurement gate is closed.
#
# Every panel dimension below is generated by source/corner_cabinet.py.
# Authoritative files: exports/cut-list.csv, exports/drill-plan.csv.

meta:
  product: MM-FUR-001 Corner cabinet with glass display top (Eckkommode)
  revision: 0.1.0
  generated_from: source/params.yaml + source/corner_cabinet.py
  currency: EUR
  price_basis: "German DIY-store and glazier retail, September 2026, ESTIMATE ONLY"
  assembled_mass_kg: 81.3            # birch plywood variant, incl. glass and hardware
  assembly_note: "Assemble in place. The finished unit is about 81 kg."

# --------------------------------------------------------------------------- #
timber:
  # ONE thickness for the whole carcass: 18 mm. That is deliberate - it means one
  # material order, one cut service and one drill-depth regime.
  quantity_needed:
    blank_area_m2: 6.084             # what the cut service bills
    net_area_m2: 5.521               # what ends up in the cabinet
    offcut_from_the_three_diagonal_cuts_m2: 0.563
  variant_A_recommended:
    material: Birch plywood 18 mm (Multiplexplatte Birke), E1, BB/CP or better
    why: >
      Cross-banded plywood stays flat. Flatness is a functional requirement here,
      because a rigid 11 kg glass plate lies directly on the top plate: a cupped
      top plate makes the glass rock and the postcards will not lie flat. Plywood
      also holds panel-edge screws far better than softwood and needs no
      knot-blocking primer. It is real wood (solid rotary-cut veneers, no fibre
      or chip board), and once painted opaque white the species is invisible.
    sourcing_route_preferred: "Order the 13 blanks individually from a cut-to-size
      service (Bauhaus 'Multiplexplatte nach Mass', Hornbach, toom, or an online
      panel cutter). You pay for 6.084 m2 and handle no waste."
    sourcing_route_alternative: "Buy full 2500 x 1250 x 18 mm sheets. Guillotine
      nesting of three 927-965 mm wide pentagon blanks is inefficient: the
      generator's packer needs 4 sheets (12.5 m2, 49 % utilisation); a careful
      manual nest reaches 3 sheets. Only worth it if you want the offcuts."
    price_estimate_eur: [260, 340]
    price_note: "about 43-55 EUR/m2 cut to size; 3-4 full sheets would be 405-540 EUR"
  variant_B_alternative:
    material: Glued solid spruce or pine panel 18 mm (Leimholzplatte Fichte/Kiefer), A/B
    why: >
      Cheaper and unambiguously 'Massivholz' if that matters to you. Bauhaus
      'Leimholzplatte nach Mass' cuts spruce to any size up to 1220 x 2500 mm at
      18 mm, which covers the 965 mm pentagon blanks.
    caveats:
      - "Softwood glued panel can cup. If you use it, use plywood for P02 (top
         plate) anyway, or accept the risk to the glass interface."
      - "Knots bleed through white paint. A shellac-based knot blocker is then
         mandatory, not optional."
      - "Lower screw-holding in the panel edge; use glue on every joint."
    price_estimate_eur: [185, 250]
  cut_service_fees:
    straight_cuts_90deg: 22           # approximate number of billed cuts
    diagonal_cuts_45deg: 3            # P01, P02, P08 - one straight cut each
    diagonal_availability: >
      Market-dependent. OBI lists straight cuts plus corner routing and cut-outs;
      toom lists diagonal corner panels as a special order; Hornbach states cut
      types vary by store (minimum part 100 x 230 mm). Ask before you order.
      FALLBACK: each diagonal is ONE straight cut across a square blank and is
      easy with a circular saw on a guide rail.
    price_estimate_eur: [25, 60]

panels:                               # from exports/cut-list.csv
  - {id: P01, de: Bodenplatte,               qty: 1, blank_mm: [965, 965], t: 18, shape: "square blank + 1 diagonal cut (625 mm legs removed)"}
  - {id: P02, de: Deckplatte,                qty: 1, blank_mm: [965, 965], t: 18, shape: "identical blank to P01; NO holes - display face"}
  - {id: P08, de: Mittelboden,               qty: 1, blank_mm: [927, 927], t: 18, shape: "square blank + 1 diagonal cut"}
  - {id: P03, de: Rueckwand Wandseite 2,     qty: 1, blank_mm: [965, 864], t: 18, shape: rectangle}
  - {id: P04, de: Rueckwand Wandseite 1,     qty: 1, blank_mm: [947, 864], t: 18, shape: rectangle}
  - {id: P05, de: Seitenwange Wandseite 1,   qty: 1, blank_mm: [322, 864], t: 18, shape: rectangle}
  - {id: P06, de: Seitenwange Wandseite 2,   qty: 1, blank_mm: [322, 864], t: 18, shape: rectangle}
  - {id: P07, de: Mittelsteg unten,          qty: 1, blank_mm: [450, 423], t: 18, shape: rectangle}
  - {id: P09, de: Mittelsteg oben,           qty: 1, blank_mm: [450, 423], t: 18, shape: rectangle}
  - {id: P10, de: Tuer,                      qty: 4, blank_mm: [440, 439], t: 18, shape: "4 identical blanks, 2 drill variants"}

battens:
  material: Softwood square batten 20 x 20 mm (Vierkantleiste Kiefer/Fichte)
  total_length_mm: 4918
  purchase: 3 x 2000 mm
  price_estimate_eur: [9, 15]
  pieces:
    - {id: L01, de: Traglatte Rueckwand Wand 2, qty: 1, length_mm: 907}
    - {id: L02, de: Traglatte Rueckwand Wand 1, qty: 1, length_mm: 907}
    - {id: L03, de: Traglatte Seitenwange,      qty: 2, length_mm: 283}
    - {id: L04, de: Eckleiste unten,            qty: 3, length_mm: 423}
    - {id: L05, de: Eckleiste oben,             qty: 3, length_mm: 423}

# --------------------------------------------------------------------------- #
glass:
  id: P11
  item: Glass display plate
  qty: 1
  type: "ESG / toughened safety glass, 6 mm, clear (low-iron optional)"
  shape: "pentagon: 961 x 961 mm square with one corner removed by a 882.2 mm
          straight cut; exact outline in exports/dxf/P11-glass.dxf"
  area_m2: 0.729
  mass_kg: 10.9
  edges: "all edges ground AND polished (poliert / C-Kante)"
  corners: "the two 90 deg corners and the corner point ground or radiused R5"
  price_estimate_eur: [70, 165]
  price_note: "ESG 6 mm runs about 63-140 EUR/m2 to size; polished edges are usually
    included; a five-sided special shape is quoted on request"
  SAFETY_REQUIREMENTS_NOT_OPTIONS:
    - "ESG, not float glass. This plate is handled by hand at every card change."
    - "Polished edges and ground corners. An as-cut edge will cut you."
    - "6 mm, not 4 mm, so the plate does not flex over the unsupported field."
  HARD_RULE: >
    Toughened glass cannot be recut. Build and paint the carcass, level it, MEASURE
    the finished top plate, and only then order the glass to the as-built outline.

# --------------------------------------------------------------------------- #
hardware:
  - id: H01
    item: Cup hinge (Topfband) 35 mm, HALF OVERLAY / Mittelanschlag, ~110 deg
    qty: 8
    spec: >
      35 mm cup, cup depth 11.5-12.5 mm, cup centre 22.5 mm from the door edge
      (C = 5 mm), supplied with a System-32 cross mounting plate, distance 0 mm.
      MUST be the half-overlay (Mittelanschlag) crank, not full overlay: both doors
      of a row hinge on the same 18 mm centre partition and each overlays it by
      7.5 mm. Soft-close (gedaempft) is a worthwhile option.
    VERIFY_BEFORE_DRILLING: "that the article's overlay adjustment range covers
      7.5 mm on an 18 mm mid panel. This is an open item in the preflight."
    price_estimate_eur: [32, 76]
  - id: H02
    item: Bow handle (Buegelgriff), 128 mm hole spacing
    qty: 4
    spec: "brushed stainless look or matt white; M4 screws at least 22 mm long for
      an 18 mm door; mounted VERTICALLY on the outer edge of each door, 40 mm from
      that edge, centred on the door height"
    price_estimate_eur: [20, 50]
  - id: H03
    item: Height-adjustable furniture foot, 100 mm, M8, with screw-on plate
    qty: 6
    spec: "load rating >= 50 kg each (design load about 14 kg each); adjustment
      range at least +/- 8 mm; plate fixed with 4 x 4.0 x 16 mm screws; matt black
      or white"
    price_estimate_eur: [24, 50]
  - id: H04
    item: Galvanised angle bracket 40 x 40 mm
    qty: 10
    spec: "8 fix the top plate from inside so the display surface has no screw
      holes at all; 2 spare"
    price_estimate_eur: [6, 12]
  - id: H05
    item: Chipboard screw 4.5 x 50 mm, countersunk, TX
    qty: 35
    spec: "bottom panel into the bottom edges of the vertical panels; 26 positions
      are pre-drilled in P01"
    price_estimate_eur: [5, 9]
  - id: H06
    item: Chipboard screw 4.0 x 40 mm
    qty: 70
    spec: "battens to panel faces, roughly 200 mm pitch"
    price_estimate_eur: [5, 9]
  - id: H07
    item: Chipboard screw 4.0 x 30 mm
    qty: 30
    spec: "mid shelf down onto the battens from below"
    price_estimate_eur: [4, 7]
  - id: H08
    item: Screw 4.0 x 16 mm and 3.5 x 16 mm
    qty: 60
    spec: "foot plates (24), angle brackets (32), hinge cups (16). 16 mm maximum
      so nothing breaks through an 18 mm panel."
    price_estimate_eur: [5, 10]
  - id: H09
    item: Wood glue D3 (wasserfest), 750 g
    qty: 1
    price_estimate_eur: [7, 12]
  - id: H10
    item: Self-adhesive door buffer, transparent, 10 mm
    qty: "1 pack (>= 12)"
    spec: "2 per door on the carcass front edges"
    price_estimate_eur: [3, 6]

hardware_optional:
  - id: H11
    item: Stainless glass stop / retainer
    qty: 2
    spec: "at the two wall-side edges, so the plate cannot slide backwards; the front
      edge stays free for inserting cards"
    price_estimate_eur: [8, 20]
  - id: H12
    item: Anti-tip bracket set
    qty: 1
    spec: "RECOMMENDED IF CHILDREN HAVE ACCESS. The cabinet is deep and heavy, so it
      is not a load path in the design, but a climbing child on an open lower door is
      a credible failure mode (see preflight IF-HUM-USR-USR-VOLUME-010)."
    price_estimate_eur: [5, 12]

# --------------------------------------------------------------------------- #
finish:
  system: "opaque white, satin (seidenmatt), RAL 9010 or RAL 9016"
  painted_area_m2: 11.39              # both faces of every panel plus all edges
  items:
    - {item: "Wood filler, white (Holzspachtel)", qty: "400 g", price_estimate_eur: [6, 11],
       note: "plywood edges show the ply lines; fill, sand, fill again"}
    - {item: "Adhesion primer / Vorstreichfarbe, white", qty: "750 ml", price_estimate_eur: [12, 22],
       note: "for variant B (spruce) use a SHELLAC-BASED knot blocker instead, or the knots will bleed through"}
    - {item: "Acrylic furniture lacquer, white satin", qty: "3 x 750 ml", price_estimate_eur: [45, 75],
       note: "2 coats. Paint BOTH faces and ALL edges of every panel equally - unequal
         sealing is what makes a panel cup, and the top plate must stay flat for the glass."}
    - {item: "Abrasive paper P120 / P180 / P240", qty: "1 set", price_estimate_eur: [6, 12]}
  price_estimate_eur: [69, 120]

# --------------------------------------------------------------------------- #
tools_required:
  must_have:
    - "35 mm Forstner bit PLUS a cup-hinge drilling jig (Topfband-Bohrschablone), or a drill press"
    - "Drill-depth stop - the 12.5 mm cup in an 18 mm door leaves only 5.5 mm"
    - "Wood bits 2 / 3 / 4 / 4.5 / 5 mm and a 9-10 mm countersink"
    - "Cordless driver with TX/PZ bits"
    - "1 m spirit level, 500 mm try square, tape measure, pencil"
    - "4-6 clamps"
    - "Foam roller and brush"
  needed_if_the_store_will_not_cut_the_diagonals:
    - "Circular saw plus guide rail (3 cuts of 883 / 883 / 830 mm)"
  optional:
    - "5 mm shelf-pin drilling jig if you later add extra shelves"

# --------------------------------------------------------------------------- #
cost_summary_estimate_eur:
  variant_A_birch_plywood: [560, 900]
  variant_B_spruce_glued_panel: [485, 810]
  breakdown_note: >
    Timber + cut fees + glass + hardware + finish. The two biggest swing factors are
    the panel route (cut-to-size versus full sheets) and the hinge grade (plain
    versus soft-close). Excludes tools.
