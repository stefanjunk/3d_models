# MM-FUR-001 — design specification, revision 0.1.0
#
# ############################################################################ #
# SCHEMA NOTE — READ FIRST
# This repository's design-spec schema is written for FDM printing. It requires
# a `printer.build_volume_mm`, a `manufacturing.nozzle_mm` and `branding`.
# THIS PRODUCT HAS NO PRINTER, NO NOZZLE AND NO MESH. Rather than leave the
# required fields blank or invent plausible FDM values, they are filled with
# explicitly labelled surrogates from the real process and every surrogate is
# named as such on the line below it. See decision-log.md, entry D-13.
# ############################################################################ #

