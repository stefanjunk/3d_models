<text x="830" y="235" class="eyebrow">DESIGN INTENT</text><text x="830" y="285" class="body">Provide a parametric one-piece FDM concept for a basket</text><text x="830" y="323" class="body">microsorter; the host-furniture interface remains</text><text x="830" y="361" class="body">provisional until measured and physically tested.</text><line x1="830" y1="520" x2="1320" y2="520" stroke="#75d1ce" stroke-width="2"/><text x="830" y="570" class="note">CURRENT-MODEL BASIS</text><text x="830" y="610" class="body">Complete product candidate shown</text><text x="830" y="648" class="body">in its digital model state.</text><text x="830" y="720" class="note">P2 LIMIT</text><text x="830" y="760" class="body">Not a real print or release proof.</text><text x="830" y="798" class="body">No physical or commercial claim.</text>
