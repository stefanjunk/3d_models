<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e9eef4"/>
    </linearGradient>
    <linearGradient id="part" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7f9"/>
      <stop offset="1" stop-color="#b9c5cf"/>
    </linearGradient>
    <linearGradient id="partSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8c4ce"/>
      <stop offset="1" stop-color="#8b9aa7"/>
