  </g>
  <path d="M130 337 V353 M1447 337 V353 M130 347 H1447" class="dimline"/>
  <text x="788" y="374" text-anchor="middle" class="dim">945,0 mm = 16 × 52,5 mm + 1 × 105,0 mm</text>
