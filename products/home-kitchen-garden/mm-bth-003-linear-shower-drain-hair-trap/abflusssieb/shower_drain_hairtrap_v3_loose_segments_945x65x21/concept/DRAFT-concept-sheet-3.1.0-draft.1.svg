    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#b9c4cf" stroke-width="1" opacity="0.22"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563a6"/>
    </marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 35px 'DejaVu Sans',sans-serif; fill:#172331; }
      .subtitle { font: 400 18px 'DejaVu Sans',sans-serif; fill:#526170; }
      .panelTitle { font: 700 23px 'DejaVu Sans',sans-serif; fill:#1d2b38; }
      .label { font: 600 17px 'DejaVu Sans',sans-serif; fill:#273747; }
      .small { font: 400 14px 'DejaVu Sans',sans-serif; fill:#465767; }
      .tiny { font: 500 12px 'DejaVu Sans',sans-serif; fill:#405262; }
      .dim { font: 600 15px 'DejaVu Sans',sans-serif; fill:#2563a6; }
      .identity { font: 700 15px 'DejaVu Sans',sans-serif; fill:#0d4775; }
      .panel { fill:#ffffff; stroke:#c4ced8; stroke-width:2; }
      .part { fill:url(#part); stroke:#435463; stroke-width:2; }
      .double { fill:#d8ebf7; stroke:#176a9c; stroke-width:3; }
      .catcher { fill:#8698a6; stroke:#3b4b58; stroke-width:2; }
      .hole { fill:#eaf0f4; stroke:#516473; stroke-width:1.1; }
      .dimline { fill:none; stroke:#2563a6; stroke-width:2; marker-start:url(#arrow); marker-end:url(#arrow); }
      .callout { fill:none; stroke:#2563a6; stroke-width:2.4; marker-end:url(#arrow); }
      .outline { fill:none; stroke:#334155; stroke-width:2.2; }
    </style>
