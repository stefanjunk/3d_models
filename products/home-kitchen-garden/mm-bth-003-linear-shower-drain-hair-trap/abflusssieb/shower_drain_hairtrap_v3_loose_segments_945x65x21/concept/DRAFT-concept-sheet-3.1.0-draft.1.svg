  <text x="70" y="58" class="title">MM-BTH-003 · Linear Shower Drain Hair Trap</text>
  <text x="70" y="88" class="subtitle">Konzeptprüfung · Revision 3.1.0-draft.1 · 16 Einzelsegmente + 1 markiertes Doppelsegment</text>
  <rect x="1325" y="38" width="205" height="50" rx="8" fill="#fff6d8" stroke="#d7a72e" stroke-width="2"/>
