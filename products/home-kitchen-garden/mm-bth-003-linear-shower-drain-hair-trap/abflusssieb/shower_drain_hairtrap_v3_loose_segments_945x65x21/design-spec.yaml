branding:
  required: true
  brand: metriMade
  domain: metriMade.com
  asset_id: MM-WM-001-R1
  product_id: MM-BTH-003
  version: 3.1.0-draft.1
  operation: recessed
  preferred_surface: flat-nonfunctional-low-stress-underside
  selected_surface: flat-nonfunctional-low-stress-inner-side-wall
  surface_exception: No obstruction-free underside region fits the canonical scale-1.0 profile without consuming the U-profile bed-contact land; the user explicitly selected the inner side wall.
  depth_mm: 0.4
  minimum_host_wall_mm: 1.2
  minimum_remaining_wall_mm: 0.8
  provisional_generated_envelope_mm: [80.97, 12.8, 0.4]
  generated_status: pending-after-concept-approval
  placement_status: proposed-requires-approval
  rejected_single_segment_inside_wall_mm: [52.5, 16.8]
  proposed_double_segment_inside_wall_mm: [105.0, 16.8]
  proposed_safe_rectangle_mm: [101.0, 12.8]
  placement_rationale: The exact MM-BTH-003 draft profile cannot fit the single-segment wall. A 105 mm two-funnel segment provides the smallest flat inner side wall that retains the canonical profile at scale 1.0 with 2.0 mm edge clearance.

function:
  goal: Catch hair while allowing shower water to drain through a 945 mm linear drain channel.
  intended_user: private household user
  included:
    - sixteen loose, identical, individually printable 52.5 mm U-profile segments
    - one loose, individually printable 105.0 mm U-profile double segment with the product watermark recessed into one inner side wall
    - eighteen preserved funnel-and-swirl-rib catcher fields across the complete assembly
    - assembly-reference layout showing the nominal 945 mm row
    - print-oriented single- and double-segment manufacturing meshes rotated 90 degrees onto one complete U-profile end
  excluded:
    - connectors, keys, snaps, tongues, rails, magnets, or separate fasteners
    - claims of certified drainage capacity, hygiene, food contact, or slip safety
    - printer upload or printer start
  service:
    maintenance: Segments remain individually removable for cleaning.
    cycles: unknown
    service_life: unknown

risk:
  class: normal-functional
  hazards:
    - insufficient drainage or clogging
    - sharp print defects at segment ends
    - dimensional accumulation or gaps across seventeen loose pieces
    - material degradation in warm water and household cleaning agents
  evidence_boundary: Digital checks do not replace a physical installed-fit, drainage, cleaning, or hair-retention test.

fabrication:
  preference: balanced-hybrid
  printed_parts: sixteen identical 52.5 mm segments plus one marked 105.0 mm double segment
  purchased_parts: none
  assembly: Place the sixteen single segments and one unconnected double segment end-to-end in the drain channel.

printer:
  assumed_machine: Anycubic Kobra 3 Max
  assumption_basis: Existing project includes a Kobra 3 Max print plate; exact successful coupon machine was not restated.
  build_volume_mm: [420, 420, 500]
  bed_fit_for_one_print_oriented_segment: pass-by-envelope
  enclosure: unknown

geometry:
  installed_envelope_mm: [945.0, 65.0, 21.0]
  printed_part_count: 17
  single_segment_count: 16
  single_segment_length_mm: 52.5
  marked_double_segment_count: 1
  marked_double_segment_length_mm: 105.0
  segment_width_mm: 65.0
  segment_height_mm: 21.0
  catcher_count_total: 18
  catchers_per_single_segment: 1
  catchers_per_marked_double_segment: 2
  catcher_entry_diameter_mm: 46.0
  catcher_floor_diameter_mm: 38.0
  catcher_depth_mm: 2.5
  single_segment_catcher_center_from_each_end_mm: 26.25
  marked_double_segment_catcher_centers_from_start_mm: [26.25, 78.75]
  solid_end_margin_each_side_mm: 3.25
  minimum_selected_end_margin_mm: 3.0
  top_thickness_mm: 4.2
  side_wall_thickness_mm: 3.0
  side_wall_height_below_top_mm: 16.8
  nominal_length_equation: 16 * 52.5 + 1 * 105.0 = 945.0
  protected_geometry:
    - 46 mm funnel entry and 38 mm funnel floor
    - 2.8 mm sieve holes on the existing 4.3 mm hexagonal pitch
    - five edge-start swirl ribs and center boss per funnel
    - continuous 4.2 mm top and 3.0 mm side-wall load paths outside the catcher cut
    - flat U-profile end cross-section used as the 90-degree print-bed contact

interfaces:
  drain_channel:
    nominal_length_mm: 945.0
    nominal_width_mm: 65.0
    nominal_height_mm: 21.0
    fit_clearance: unchanged from the requested nominal envelope; physical installation remains a human gate
  part_to_part:
    type: loose-butt-joint
    connector_geometry: prohibited
    nominal_gap_mm: 0.0
    retention: drain-channel containment only

manufacturing:
  process: FFF
  material: PETG
  material_status: recommended-from-baseline-not-user-confirmed
  nozzle_mm: 0.4
  nozzle_status: recommended-for-preserved-2.8-mm-holes-not-user-confirmed
  layer_height_mm: 0.2
  slicer:
    name: Anycubic Slicer Next
    version: 1.3.9.4
    executable: /usr/bin/AnycubicSlicerNext
    status: user-selected; command-line model info is available, but the exact Kobra 3 Max machine, PETG filament and process profiles remain unknown
  profile: use Anycubic Slicer Next; reproduce the successful coupon settings if they can be identified, otherwise create and physically qualify an explicit Kobra 3 Max PETG profile
  orientation:
    assembly_source: X length, Y width, Z height
    print_export: rotate 90 degrees about global Y and translate to Z minimum 0
    bed_contact: one complete U-profile end cross-section
  supports: none-intended-based-on-user-coupon-result
  target_formats:
    - editable CadQuery source
    - STEP assembly-orientation master
    - DRAFT STL in 90-degree print orientation
    - DRAFT assembly-reference STEP
    - 3MF only after exact slicer/profile confirmation

