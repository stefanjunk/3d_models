  process: FFF
  material: PETG
  material_status: local SUNLU PETG Black user preset selected; physical product/color/batch unconfirmed
  nozzle_mm: 0.4
  nozzle_status: local Kobra 3 Max 0.4 mm hardened-steel preset selected; physical nozzle identity unconfirmed
  layer_height_mm: 0.2
  slicer:
    name: Anycubic Slicer Next
    version: 1.3.9.4
    executable: /usr/bin/AnycubicSlicerNext
    status: local draft slice PASS for both manufacturing STLs; GUI layer-by-layer and physical reviews remain pending
  profile:
    machine: Anycubic Kobra 3 Max 0.4 hardened steel nozzle
    process: 0.20mm PETG Tool @AC K3 Max
    filament: SUNLU PETG Black new @Anycubic Kobra 3 Max 0.4 nozzle
    evidence: validation/anycubic-slicer-next-summary-3.1.0-draft.1.json
  orientation:
    assembly_source: X length, Y width, Z height
    print_export: rotate 90 degrees about global Y and translate to Z minimum 0
    bed_contact: one complete U-profile end cross-section
  supports: none-intended-based-on-user-coupon-result
  target_formats:
    - editable CadQuery source
    - STEP assembly-orientation master
    - DRAFT STL in 90-degree print orientation
    - DRAFT assembly-reference STEP
    - 3MF only after exact slicer/profile confirmation

optimization:
  status: pass-selected-variant
  geometry_count_status: selected-and-digitally-validated
  objective: Preserve the approved 945 mm envelope and eighteen catcher fields while creating one scale-1.0 host surface for the canonical MM-BTH-003 watermark on an inner side wall.
  baseline_slicer_report: null
  previous_selected_variant: 18-identical-segments
  proposed_variant: 16-single-segments-plus-one-marked-double-segment
  comparison_report: build/segment-count-optimization-3.1.0-draft.1.json
  mesh_simplification:
    status: pass-no-simplification
    baseline_master_mesh: exports/master/DRAFT-SHOWER-DRAIN-HAIRTRAP-3.0.0-draft.1-segment-master.stl
    baseline_manufacturing_mesh: exports/manufacturing/DRAFT-SHOWER-DRAIN-HAIRTRAP-3.0.0-draft.1-segment-on-end.stl
    protected_regions:
      - funnel surfaces
      - sieve-hole edges
      - swirl ribs
      - U-profile bed-contact cross-section
      - installed envelope datums
    rationale: Each manufacturing STL uses the byte-identical audited master tessellation followed by only the declared rigid +90-degree transform. No independent simplification is used on protected funnel or watermark geometry.

acceptance:
  - id: GEO-001
    criterion: The nominal installed envelope is 945.0 × 65.0 × 21.0 mm.
    method: Deterministic parameter and assembly-bounds check.
    status: pass
    evidence: build/build-report-3.1.0-draft.1.json
  - id: GEO-002
    criterion: Exactly sixteen 52.5 mm single segments and one 105.0 mm double segment sum to 945.0 mm without connector overlap or protrusion.
    method: Deterministic count, equality, and assembly-overlap check.
    status: pass
    evidence: build/build-report-3.1.0-draft.1.json
  - id: GEO-003
    criterion: Single segments contain one centered 46 mm funnel; the double segment contains two unchanged funnel modules at 26.25 and 78.75 mm; every exposed or inter-module tangent retains at least 3.0 mm solid material.
    method: Parameter assertions and section measurement.
    status: pass
    evidence: build/build-report-3.1.0-draft.1.json
  - id: GEO-004
    criterion: No key, slot, snap, rail, tongue, magnet pocket, or other segment connector exists.
    method: Source-feature audit and geometry inspection.
    status: pass
    evidence: build/build-report-3.1.0-draft.1.json
  - id: MESH-001
    criterion: Single and marked-double STEP/STL exports are each one positive-volume component with the specified assembly-orientation extents; their manufacturing STLs are the corresponding valid print-oriented components.
    method: STEP re-import plus deterministic mesh audit.
    status: pass
    evidence:
      - validation/single-master-mesh-audit-3.1.0-draft.1.json
      - validation/double-master-mesh-audit-3.1.0-draft.1.json
      - validation/single-manufacturing-mesh-audit-3.1.0-draft.1.json
      - validation/double-manufacturing-mesh-audit-3.1.0-draft.1.json
  - id: DfAM-001
    criterion: Each print-oriented STL is a rigid 90-degree rotation of its master, has Z minimum 0, and preserves the respective single- or double-segment geometry.
    method: Deterministic bounds plus inverse rigid transform and vertex-set, face-count, and volume comparison from the same master tessellation.
    status: pass
    evidence: build/build-report-3.1.0-draft.1.json
  - id: DfAM-002
    criterion: The selected 90-degree orientation is checked in the exact successful coupon slicer profile for continuous bed contact and no required supports.
    method: Exact slicer dry run and layer-preview review.
    status: pass-retained-gcode-review; GUI-layer-review-pending
    evidence: validation/anycubic-slicer-next-summary-3.1.0-draft.1.json
  - id: WM-001
    criterion: The exact canonical metriMade.com / MM-BTH-003 / v3.1.0-draft.1 profile is recessed at scale 1.0 into the marked double segment's inner side wall with compliant edge clearance and remaining wall.
    method: Canonical generator, selector, B-Rep section, readable interior-side preview, mesh audit, slicer preview and exact-process coupon.
    status: blocked-physical-coupon-and-human-watermark-approval
    evidence:
      - validation/watermark/side-wall-selector-3.1.0-draft.1.json
      - validation/watermark/watermark-placement-report-3.1.0-draft.1.json
      - validation/watermark/watermark-visual-review-3.1.0-draft.1.json
      - validation/anycubic-slicer-next-summary-3.1.0-draft.1.json
  - id: PHY-001
    criterion: Seventeen printed pieces fit the real drain without buckling, excessive cumulative gap, rocking, or sharp exposed edges.
    method: Human physical installed-fit inspection.
    status: blocked-physical-test
  - id: PHY-002
    criterion: Drainage, cleaning, and hair retention are acceptable with the preserved funnel geometry.
    method: Human process-matched water and hair test.
    status: blocked-physical-test

