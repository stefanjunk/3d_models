acceptance:
  - id: AC-LICENCE-001
    criterion: New geometry run records a clean owned-fork source commit at or after f00dd46 and no texture output.
    method: step1x-run.json and runtime-profile inspection.
    status: pass_with_record_discrepancy_and_commercial_warn
  - id: AC-MESH-001
    criterion: Manufacturing mesh is one consistently wound watertight component with positive volume.
    method: Organic mesh inspector and deterministic FDM mesh audit.
    status: pass
  - id: AC-ENVELOPE-001
    criterion: Longest XY extent is 200.0 mm within conversion precision and the provisional digital height does not exceed 65.0 mm.
    method: Registration and mesh bounds reports.
    status: pass
  - id: AC-SUPPORT-001
    criterion: Candidate has min Z = 0, an 80 mm continuous flat bed-contact disc and a warning-free exact slice with declared support settings.
    method: Mesh bed-contact analysis and exact slicer report.
    status: pass_digital
  - id: AC-TRAY-001
    criterion: One continuous open central depression remains usable and free of closed hidden pockets.
    method: Section and top-view review plus physical dry-item test.
    status: pass_visual_physical_test_pending
  - id: AC-EDGE-001
    criterion: No zero-thickness, disconnected or physically uncomfortable hand-reachable petal tip.
    method: Digital thin-feature screen and physical hand/snag inspection.
    status: pass_digital_physical_test_pending
  - id: AC-STABILITY-001
    criterion: Empty tray does not rock and the declared dry-item load stays upright at a 10-degree quasistatic tilt.
    method: Physical prototype on a recorded flat surface.
    status: not_run_release_blocking

