risk:
  class: normal-functional
  criticality: K1
  hazards:
    - Rocking or tipping spills lightweight contents.
    - Thin or sharp petal tips can snag or scratch.
    - Hidden shells or unsupported geometry can cause print failure.
  controls:
    - Owner-confirmed parametric disc foot and bed-contact measurement.
    - One-component watertight topology gate and thin-feature review.
    - Exact-profile slicer dry run and physical edge/tilt tests.
    - Scope limitation to adult dry non-food decorative use.

