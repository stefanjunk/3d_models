requirements:
  user_stated:
    - Audit the existing Sunflower Bowl / Tray for the suspected Hunyuan licence problem.
    - Recreate it with Step1X-3D and continue product development.
    - Do not repair or parametrically reconstruct the generated flower body.
    - Add the original real-print disc foot parametrically; only the foot may be parametric.
  inherited_as_new_requirements:
    - Preserve the selected Idea 1 "Sanfte Bluete" sunflower language.
    - Nominal outside diameter 200 mm.
    - Nominal 80 mm diameter × 6 mm disc foot recovered from the owner-confirmed Anycubic 3MF setup.
    - One-piece orientation with the disc foot on the bed.
  inferred:
    - Adult dry-indoor decorative storage only.
    - Lightweight keys, jewellery or similar dry non-food contents.
    - Emptying and dry cleaning by hand; no fluid service.
  recommended:
    - Use a new prompt-bound source image and a geometry-only Step1X run.
    - Keep functional authority for the owner-confirmed disc foot in deterministic post-processing and validation.
    - Preserve the Step1X flower body without repair; allow only uniform scale/registration and the foot Boolean.
    - Reserve a later underside marking region without changing this draft's appearance.
  unresolved:
    - Owner approval of the selected 200 × 195.775 × 59.157 mm generated envelope
    - Exact yellow production filament, batch and complete profile
    - Physical rocking, 10-degree tilt, edge comfort and snag results
    - Final seller identity, markets, outgoing licence, IP searches and commercial approval

function:
  summary: >-
    A one-piece sunflower-shaped decorative tray with a central open depression
    for lightweight dry non-food items and a broad flat underside.
  included:
    - Organic sunflower petal massing and central seed-disc appearance
    - Open accessible tray depression
    - Parametric 80 × 6 mm bed-facing disc foot
  excluded:
    - Food contact and tableware claims
    - Watertightness, liquid containment or plant-pot use
    - Outdoor, child-toy, structural, impact or compatibility claims
    - Any reuse of legacy 1.stl, 2.stl or sunflower_bowl.3mf mesh geometry in the new derivative chain; factual disc dimensions remain documented evidence only

