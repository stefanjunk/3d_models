requirements:
  - Recreate the selected "Sanfte Bluete" appearance with a new post-cleanup geometry-only Step1X run.
  - Keep the outside envelope at nominally 200 mm longest XY; final generated height remains owner-confirmation pending.
  - Do not repair or parametrically reconstruct the Step1X flower body.
  - Add only the owner-confirmed 80 mm diameter × 6 mm disc foot parametrically.
  - Provide one connected watertight body and allow build-plate-only tree support when the exact slicer requires it.
  - Preserve a useful open tray depression and rounded hand-reachable petal edges.
  - Exclude food contact, direct fluid containment, outdoor use, child-toy use and load-bearing claims.
