acceptance_criteria:
  - id: AC-01
    criterion: Jedes Einzelteil passt mit mindestens 5 mm Randreserve in 420 x 420 x 500 mm Bauraum.
    test: CAD-Huellkoerperpruefung und Slicer-Dry-Run
  - id: AC-02
    criterion: Der montierte Stapel steht auf ebener Flaeche kippsicher und Module koennen sich nicht unbeabsichtigt verdrehen oder abheben.
    test: Montagepruefung und Kipppruefung im leeren sowie gefuellten Zustand
  - id: AC-03
    criterion: 800 L/h laufen ohne Rueckstau oder unkontrolliertes Ueberlaufen durch alle drei Stufen.
    test: 30-min-Wassertest, danach Test mit teilweise zugesetzter Feinfiltermatte
  - id: AC-04
    criterion: Keine sichtbare Leckage an Schlauch- und Ablassanschluessen bei 1.2 m statischer Wassersaeule.
    test: 60-min-Dichtheitstest
  - id: AC-05
    criterion: Alle Schmutz- und Filtereinsatzteile sind ohne Zerstoerung und mit maximal einem Handwerkzeug entnehmbar.
    test: Wartungsdurchlauf und dokumentierte Demontagezeit
  - id: AC-06
    criterion: System ist vollstaendig entleerbar; keine geschlossenen Frosttaschen groesser als 5 ml.
    test: CAD-Schnittpruefung und Entleerungstest
  - id: AC-07
    criterion: Das System verbessert sichtbar die Partikelfracht, ohne eine hygienische Freigabe zu behaupten.
    test: Vorher-/Nachher-Proben mit Truebungs- oder Sedimentvergleich; Poolchemie separat pruefen
  - id: AC-08
    criterion: >-
      Der interne tangentiale Stage-1-Auslass bleibt vom gefuellten Stillstand
      bis 1200 L/h vollstaendig unter Wasser; der externe 25-mm-Schlauch bleibt
      durch mindestens 15 mm freien Luftspalt hydraulisch vom Behaelter getrennt.
    test: CAD-Hoehenpruefung sowie Stillstands-, Rueckfluss- und Sichtpruefung bei 1, 10, 100, 400, 800 und 1200 L/h
  - id: AC-09
    criterion: Der Schlammweg von Stufe 1 bleibt an jeder Stelle mindestens 10 mm frei und 1 bis 6 mm grosse Testpartikel koennen ohne Ausbau des Trichters ueber den 25-mm-Ablass ausgespuelt werden.
    test: CAD-Mindestspaltpruefung und Spuelversuch mit definierter Testpartikelmasse
  - id: AC-10
    criterion: Stufe 2 besitzt einen ohne Ausbau erreichbaren Sedimentablass; mindestens 80 Prozent einer definierten feinen Testsandmasse werden in einem dokumentierten Spuelzyklus entfernt.
    test: Sediment einbringen, absetzen lassen, bei gestoppter Pumpe spuelen und rueckgewonnene Trockenmasse bestimmen
  - id: AC-11
    criterion: >-
      Nach dem einmaligen Anfuellen transportiert das System jeden stabilen
      Zufluss groesser 0 bis 1200 L/h ohne definierte Mindest-Durchflussrate;
      bei 0 L/h bleibt es rueckflussfrei im gefuellten Stillstand.
    test: Anfuellvolumen messen, danach stabilen Durchfluss bei 1, 10, 100, 400, 800 und 1200 L/h beobachten

acceptance:
