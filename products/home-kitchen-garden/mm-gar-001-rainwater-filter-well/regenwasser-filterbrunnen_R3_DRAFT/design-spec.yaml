schema_version: 1
project:
  name: Regenwasser-Filterbrunnen fuer Pool
  revision: 3
  status: r3-draft-cad-validated
  date: 2026-08-12
  objective:
    value: >-
      Modularer, 3D-druckbarer Filterbrunnen zur sichtbaren mechanischen
      Aufbereitung von Regenwasser vor der Einleitung in einen privaten Pool.
    provenance: user-stated

workflow:
  requirements_approval:
    status: approved
    spec_revision: 3
    approved_by: user
    approved_at: 2026-08-12T15:47:05+02:00
    reason: >-
      Hydraulische Wartbarkeit von Stufe 1 und Stufe 2 verbessern: tieferer
      getauchter Zulauf, weniger verstopfungsanfaelliger Schlammweg und eigener
      spuelbarer Sedimentablass fuer die Lamellenstufe. Der hydraulische
      Betriebsbereich soll ohne Mindestdurchfluss von 0 bis 1200 L/h reichen.
    previous_approved_revision: 2
  concept_approval:
    status: approved
    spec_revision: 3
    approved_by: user
    approved_at: 2026-08-12T16:04:00+02:00
    previous_approved_revision: 2
    asset: assets/concept-r3.png
    source_asset: assets/concept-r3.svg
    generated_with: precise-technical-svg
    visual_ambiguity: >-
      Nicht masshaltige Funktionsdarstellung. Die Draufsicht zeigt die
      tangentiale Richtung, waehrend der Laengsschnitt Fallrohr, Klarwasserweg
      und beide Sedimentablaesse getrennt darstellt. Verbindliche Masse stehen
      ausschliesslich in dieser Spezifikation.
  watermark_approval:
    status: blocked
    spec_revision: 3
    asset_id: JSI-WM-001-R1
    reason: >-
      Die R3-Kennzeichnung wurde nach der Primaerverifikation als letzte geplante
      Geometrieaenderung integriert und die Regression ist bestanden. Fuer die
      finale Freigabe fehlen noch echter Slicer-Toolpath-Nachweis und ausdrueckliche
      Nutzerfreigabe der Kennzeichnung.
    r3_evidence:
      - build/draft-r3/renders/DRAFT_R3_watermark_underside.png
      - build/draft-r3/renders/DRAFT_R3_watermark_closeup.png
      - build/draft-r3/renders/DRAFT_R3_watermark_section.png
      - build/draft-r3/renders/DRAFT_R3_watermark_geometric_layers.png
