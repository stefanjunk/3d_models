    decision: >-
      Stage-1-Zulaufmitte wird als empfohlener Ausgangswert von 220 mm auf
      160 mm abgesenkt; die Einlasskrone bleibt bei 800 L/h mindestens 40 mm
      unter dem erwarteten Wasserspiegel.
    provenance: recommended
    superseded_by: D-018
  - id: D-015
    date: 2026-08-12
    decision: >-
      Der Stage-1-Schlammweg wird von 3 mm auf mindestens 10 mm vergroessert
      und mit einem bodennahen 25-mm-Vollquerschnitt-Ablass verbunden.
    provenance: recommended
  - id: D-016
    date: 2026-08-12
    decision: >-
      Stufe 2 erhaelt einen mindestens 5 Grad geneigten Sedimentsammelboden,
      mindestens 15 mm freien Absetzraum und einen eigenen bodennahen
      25-mm-Vollquerschnitt-Ablass.
    provenance: recommended
  - id: D-017
    date: 2026-08-12
    decision: >-
      Der gewuenschte hydraulische Betriebsbereich wird auf 0 bis 1200 L/h
      erweitert; es soll keine Mindest-Durchflussrate geben.
    provenance: user-stated
  - id: D-018
    date: 2026-08-12
    decision: >-
      Der direkte getauchte Schlauchanschluss wird durch einen offenen,
      beluefteten Einlaufbecher mit mindestens 15 mm Luftspalt, 32-mm-Fallrohr
      und getauchtem tangentialem 28-mm-Auslass bei Z=155 mm ersetzt. Dadurch
      bleiben Stillstand und Kleinstmengen moeglich, ohne Rueckwaertssiphon.
    provenance: recommended
  - id: D-019
    date: 2026-08-12
    decision: >-
      Anforderungen Revision 3 einschliesslich 0 bis 1200 L/h,
      offenem Einlaufbecher, Luftspalt und getrennten Schlammablaessen wurden
      ausdruecklich freigegeben; das Konzept-Gate ist geoeffnet.
    provenance: user-stated
  - id: D-020
    date: 2026-08-12
    decision: >-
      Konzept Revision 3 wurde ausdruecklich freigegeben; parametrisches
      Produktions-CAD und DRAFT-Fertigungsexporte duerfen erzeugt werden.
    provenance: user-stated
  - id: D-021
    date: 2026-08-12
    decision: >-
      Die freigegebene R3-Geometrie ist als 17 druckbare Teiltypen umgesetzt;
      STL-Regression und elf R3-Schnittstellen-/Hydraulikkriterien sind bestanden.
      Der Stand bleibt bis Slicer- und physischen Tests DRAFT.
    provenance: implementation-validation

