unresolved_questions:
  - id: UQ-001
    question: Welches konkrete UV-stabilisierte PETG samt Herstellerprofil wird gedruckt?
    release_impact: Temperatur, Volumenstrom, Kuehlung und Trocknung koennen erst dann finalisiert werden.
  - id: UQ-002
    question: Welcher konkrete Anycubic-/Orca-Slicer und welches Maschinenprofil werden verwendet?
    release_impact: Toolpath-, Zeit-, Material- und Kennzeichnungspruefung bleiben bis dahin blockiert.
  - id: UQ-003
    question: Auf welchem Untergrund wird die Kippsicherung montiert?
    release_impact: M8-Ankerart und zulaessiges Anzugsmoment muessen untergrundsspezifisch festgelegt werden.

