function:
  value: >-
    Partikelhaltiges Regenwasser bei 800 L/h durch Wirbelabscheidung,
    Lamellensedimentation und drei sequenzielle mechanische Filtermedien
    drucklos fuer die anschliessende Einleitung in den Pool vorfiltern.
  provenance: user-stated

risk:
  class: normal-functional
  class_provenance: recommended
  boundaries:
    - value: Das System ist ein druckloser mechanischer Vorfilter, kein Druckbehaelter.
      provenance: recommended
    - value: Keine Zusage zur mikrobiologischen oder chemischen Trinkwasserqualitaet.
      provenance: recommended
    - value: Pooldesinfektion, pH-Regelung und uebliche Poolfiltration bleiben erforderlich.
      provenance: recommended
    - value: Dachablaufwasser soll vor dem System einen Laubfang und First-Flush-Abscheider durchlaufen.
      provenance: recommended

functional_scope:
  included:
    - value: Drei separat druckbare und uebereinander stapelbare Filtermodule.
      provenance: user-stated
    - value: Stufe 1 als langsamer Vortex-/Wirbelabscheider mit tangentialem Zulauf.
      provenance: user-stated
    - value: Stufe 2 als Absetzstufe mit herausnehmbarer Lamellenkassette.
      provenance: user-stated
    - value: Stufe 3 als Durchlauffilter mit von oben entnehmbaren Medienkoerben.
      provenance: user-stated
    - value: Wasseruebergabe von Stufe zu Stufe durch Schwerkraft.
      provenance: user-stated
    - value: Sichtbarer, reinigbarer Schmutzfang in Wirbel- und Lamellenstufe.
      provenance: inferred
    - value: Notueberlauf gegen unkontrolliertes Ueberlaufen bei zugesetztem Filter.
      provenance: recommended
  excluded:
    - value: Aktiver Hochdruck-Hydrozyklon oder motorisierte Zentrifuge.
      provenance: user-stated
    - value: Biologischer Langsamsandfilter.
      provenance: user-stated
    - value: Vollstaendige Entfernung geloester Metalle, Salze oder organischer Chemikalien.
      provenance: user-stated

hydraulics:
  operating_mode:
    value: Oben gepumpter Zulauf, danach offene drucklose Schwerkraftkaskade zum Pool.
    provenance: user-stated
    status: confirmed
  design_flow_lph:
    value: 800
    hydraulic_operating_range: [0, 1200]
    minimum_required_flow_lph: 0
    provenance: user-stated
    status: confirmed
    rationale: >-
      800 L/h bleibt der Auslegungs- und Vergleichspunkt. Es gibt keinen
      hydraulischen Mindestdurchfluss: Bei kleinen Mengen arbeitet Stufe 1
      zunehmend als ruhiges Absetzbecken statt als ausgepraegter Wirbelabscheider.
      Bei 0 L/h befindet sich das System im gefuellten Stillstand und es findet
      naturgemaess kein Wassertransport statt.
  inlet_interface:
    value: >-
      Austauschbarer Halter fuer 25-mm-Schlauch-Nennweite, angenommen Innen-Ø,
      mit freiem Luftspalt ueber einem offenen Einlaufbecher; der Becher speist
      ein 32-mm-Fallrohr mit getauchtem tangentialem 28-mm-Auslass.
    hose_size_provenance: user-stated
    architecture_provenance: recommended
    status: confirmed-with-measurement
    verification: >-
      Schlauch-Innen-Ø messen und Passcoupon drucken; Luftspalt, Becherueberlauf,
      Rueckflussfreiheit und 1200-L/h-Kapazitaet vor dem Vollbetrieb pruefen.
  initial_fill_behavior:
    value: >-
      Nach vollstaendiger Entleerung fuellen sich zuerst Stufe 1 und danach
      Stufe 2 bis zu ihren Standrohrkanten. Erst danach erreicht Wasser Stufe 3.
      Dies ist ein einmaliges Anfuellvolumen und keine Mindest-Durchflussrate.
    estimated_volume_to_first_stage3_outflow_l: [20, 27]
    provenance: recommended
  outlet_mode:
    value: Sichtbare Kaskade in den Pool mit austauschbarem optionalem 25-mm-Schlauchanschluss
    provenance: user-stated
    status: confirmed
  max_static_head_m:
    value: 1.2
    provenance: recommended
  pressurized_operation_allowed:
    value: false
    provenance: recommended

geometry:
  coordinate_convention:
    value: Z nach oben; Wasserfluss im Stapel von oben nach unten
    provenance: recommended
  module_envelope_mm:
    max_x: 330
    max_y: 330
    max_z: 300
    provenance: recommended
  assembled_envelope_mm:
    diameter: 330
    height_target: 850
    height_max: 1000
    provenance: recommended
    built_height: 851
    installed_footprint_with_cascade: [330, 406]
  stage_1_vortex:
    nominal_diameter_mm: 300
    standpipe_weir_z_mm: 210
    expected_water_level_at_800_lph_mm: 214
    expected_water_level_range_standby_to_1200_lph_mm: [210, 219.5]
    inlet_center_z_mm: 155
    inlet_passage_id_mm: 28
    inlet_downcomer_clear_id_mm: 32
    inlet_receiver_normal_level_max_z_mm: 260
    inlet_receiver_emergency_overflow_z_mm: 268
    inlet_hose_outlet_lower_edge_min_z_mm: 283
    inlet_air_gap_min_mm: 15
    minimum_inlet_crown_submergence_at_800_lph_mm: 45
    minimum_inlet_crown_submergence_operating_range_mm: 40
    standpipe_od_mm: 50
    sediment_funnel_inner_radius_mm: 35
    minimum_sludge_annular_gap_mm: 10
    sludge_drain_clear_id_mm: 25
    sludge_drain_low_point_max_z_mm: 20
    features:
      - offener beluefteter Einlaufbecher als passive Rueckfluss- und Siphonsperre
      - getauchter tangentialer Innenauslass fuer einen ruhigen Volumenwirbel
      - sicherer Becherueberlauf in Stufe 1 bei blockiertem Fallrohr
      - beruhigter zentraler Klarwasserabzug
      - konischer, herausnehmbarer Schlammfang mit mindestens 10 mm freiem Schlammweg
      - beruhigter Unterraum gegen Wiederaufwirbelung
      - bodennaher 25-mm-Vollquerschnitt-Ablass mit externem Ventil
  stage_2_lamella:
    nominal_diameter_mm: 300
    plate_angle_deg: 60
    plate_gap_mm: 12
    plate_count_target: 12
    drop_tube_clear_id_mm: 32
    sediment_floor_min_slope_deg: 5
    minimum_clearance_below_lamella_mm: 15
    sludge_drain_clear_id_mm: 25
    sludge_drain_low_point_max_z_mm: 20
    features:
      - Bodenzulauf mit Stroemungsdiffusor
      - nach oben gerichtete Stroemung durch Kassette
      - oberer Sammelring zum naechsten Modul
      - vom Diffusor geschuetzter, geneigter Sedimentsammelboden
      - eigener bodennaher 25-mm-Vollquerschnitt-Ablass mit externem Ventil
      - Routinespuelung ohne Ausbau des Moduls; Kassette bleibt fuer Grundreinigung entnehmbar
  stage_3_media:
    nominal_diameter_mm: 300
    media_sequence:
      - 300-500 um Edelstahl- oder Kunststoffnetz
      - grobe waschbare Filtermatte
      - 50-100 um Feinfiltermatte, nur mit Ueberlaufanzeige
    features:
      - drei separat entnehmbare Koerbe
      - Verteilerplatte gegen Kanalbildung
      - Reinwassersammelraum
      - vier optionale 9-mm-Bohrungen fuer eine untergrundspezifische M8-Kippsicherung
  stacking_interface:
    value: Zentrierbund plus spritzgeschuetzte Ueberlappung; drei mechanische Sicherungen je Fuge
    provenance: recommended
  watertightness_strategy:
    value: Drucklose Wasserfuehrung; EPDM-Flachdichtungen nur an Ablass- und Schlauchanschluessen
    provenance: recommended

