schema_version: 1
project:
  name: UNREGISTERED-AROMA-DIFFUSER-FLUENT-R2
  units: mm
  product_family: dry-diffuser-shell-form-study
  language: de
  manufacturing: fdm-fff
  risk_class: normal-functional
intent:
  visual_language:
    keywords: [fluid, sculptural, warm-ivory, asymmetric, restrained]
    forbidden_characteristics: [uniform-screw, serrated-crown, exposed-vial]
  symmetry: asymmetric
  visible_surfaces: [outer-envelope, crown-rim]
  reference_role: inspiration
  reference_provenance:
    - file: ../../concepts/r1/fluent-hero-r1.png
      role: primary-style-authority-not-measured-geometry
      provenance: ../../concepts/r1/PROVENANCE.md
semantic_parameters:
  - {name: height_mm, value: 240, min: 228, max: 252, unit: mm, affects: [envelope-only]}
  - {name: width_mm, value: 92, min: 88, max: 98, unit: mm, affects: [envelope-only]}
  - {name: depth_mm, value: 86, min: 82, max: 90, unit: mm, affects: [envelope-only]}
  - {name: twist_deg, value: 155, min: 140, max: 170, unit: deg, affects: [rib-rails]}
  - {name: rib_count, value: 12, min: 10, max: 14, unit: count, affects: [envelope]}
  - {name: rib_depth_mm, value: 8.0, min: 6.5, max: 9.0, unit: mm, affects: [envelope]}
  - {name: crown_valley_fraction, value: 0.60, min: 0.57, max: 0.64, unit: ratio, affects: [crown]}
hardpoints:
  tolerance_mm: 0.10
  datum_planes: [{name: table, axis: Z, offset_mm: 0}]
  points: []
  axes: [{name: purchased-vial-axis, origin_mm: [0, 0, 4], direction: [0, 0, 1]}]
  protected_faces: []
  keep_out_volumes:
    - {name: nominal-vial, type: cylinder, diameter_mm: 50, height_mm: 64, base_mm: [0, 0, 4], status: nominal-reference-not-fit}
surface_strategy:
  primary: bspline-loft
  implementation: cubic-station-splines-with-analytic-radial-rib-and-crown-fields
  continuity_default: G2
  continuity_status: target-not-certified
  intentional_creases: [temporary-radial-rim-closure, service-bottom]
  section_count_target: 12
  controls_per_curve_target: 6
  closed_section_seam_landmark: positive-local-X
reference_fitting:
  enabled: false
  target_file: ../../concepts/r1/fluent-hero-r1.png
  fit_region: style-only
  maximum_rms_error_mm: 1.0
  maximum_local_error_mm: 3.0
  preserve_target_noise: false
fdm:
  printer_build_volume_mm: [426, 420, 501]
  nozzle_mm: 0.4
  layer_height_range_mm: [0.12, 0.20]
  intended_orientation: upright-candidate-not-sliced
  visible_orientation_sensitive_regions: [ribs, crown, upper-overhang]
  minimum_wall_mm: 1.2
  maximum_overhang_deg_from_vertical: 50
  mesh_export:
    chord_tolerance_mm: 0.08
    angular_tolerance_deg: 4
    maximum_edge_mm: 2.0
acceptance:
  hardpoint_drift_mm_max: 0.10
  watertight_when_solid: true
  connected_components_expected: 1
  degenerate_face_count_max: 0
  curvature_spikes_allowed: 0
  unexplained_curvature_extrema_per_primary_curve_max: 4
  self_intersections_allowed: false
  minimum_signed_volume_mm3: 1
  slicer_review_required: true
  physical_coupon_required: true
outputs:
  editable_source_required: true
  step_required: false
  obj_required: true
  stl_or_3mf_required: false
  reports_required: true
phase_boundary:
  status: CONCEPT_ONLY
  lifecycle: P0-form-study
  exclusions: [manufacturing-release, P2-handoff, fitted-holder, wet-use, commercial-release]
  approval: User requests parametric or Step1X creation; visual study authorized, no human appearance or physical approval recorded.
