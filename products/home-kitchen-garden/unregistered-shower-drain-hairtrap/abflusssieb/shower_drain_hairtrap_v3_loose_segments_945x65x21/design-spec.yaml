  preferred_surface: flat-nonfunctional-low-stress-underside
  depth_mm: 0.4
  minimum_host_wall_mm: 1.2
  minimum_remaining_wall_mm: 0.8
  status: blocked-until-concept-and-production-geometry

function:
  goal: Catch hair while allowing shower water to drain through a 945 mm linear drain channel.
  intended_user: private household user
  included:
    - eighteen loose, identical, individually printable U-profile segments
    - one preserved funnel-and-swirl-rib catcher field per segment
    - assembly-reference layout showing the nominal 945 mm row
    - print-oriented manufacturing mesh rotated 90 degrees onto one segment end
  excluded:
    - connectors, keys, snaps, tongues, rails, magnets, or separate fasteners
    - claims of certified drainage capacity, hygiene, food contact, or slip safety
    - printer upload or printer start
  service:
    maintenance: Segments remain individually removable for cleaning.
    cycles: unknown
    service_life: unknown

risk:
  class: normal-functional
  hazards:
    - insufficient drainage or clogging
    - sharp print defects at segment ends
    - dimensional accumulation or gaps across eighteen loose pieces
    - material degradation in warm water and household cleaning agents
  evidence_boundary: Digital checks do not replace a physical installed-fit, drainage, cleaning, or hair-retention test.

fabrication:
  preference: balanced-hybrid
  printed_parts: eighteen identical loose segments
  purchased_parts: none
  assembly: Place the eighteen unconnected segments end-to-end in the drain channel.

printer:
  assumed_machine: Anycubic Kobra 3 Max
  assumption_basis: Existing project includes a Kobra 3 Max print plate; exact successful coupon machine was not restated.
  build_volume_mm: [420, 420, 500]
  bed_fit_for_one_print_oriented_segment: pass-by-envelope
  enclosure: unknown

geometry:
  installed_envelope_mm: [945.0, 65.0, 21.0]
  segment_count: 18
  segment_length_mm: 52.5
  segment_width_mm: 65.0
  segment_height_mm: 21.0
  catcher_count_total: 18
  catchers_per_segment: 1
  catcher_entry_diameter_mm: 46.0
  catcher_floor_diameter_mm: 38.0
  catcher_depth_mm: 2.5
  catcher_center_from_each_end_mm: 26.25
  solid_end_margin_each_side_mm: 3.25
  minimum_selected_end_margin_mm: 3.0
  top_thickness_mm: 4.2
  side_wall_thickness_mm: 3.0
  side_wall_height_below_top_mm: 16.8
  nominal_length_equation: 18 * 52.5 = 945.0
  protected_geometry:
    - 46 mm funnel entry and 38 mm funnel floor
    - 2.8 mm sieve holes on the existing 4.3 mm hexagonal pitch
    - five edge-start swirl ribs and center boss per funnel
    - continuous 4.2 mm top and 3.0 mm side-wall load paths outside the catcher cut
    - flat U-profile end cross-section used as the 90-degree print-bed contact

interfaces:
  drain_channel:
    nominal_length_mm: 945.0
    nominal_width_mm: 65.0
    nominal_height_mm: 21.0
    fit_clearance: unchanged from the requested nominal envelope; physical installation remains a human gate
  segment_to_segment:
    type: loose-butt-joint
    connector_geometry: prohibited
    nominal_gap_mm: 0.0
    retention: drain-channel containment only

manufacturing:
  process: FFF
  material: PETG
  material_status: recommended-from-baseline-not-user-confirmed
  nozzle_mm: 0.4
  nozzle_status: recommended-for-preserved-2.8-mm-holes-not-user-confirmed
  layer_height_mm: 0.2
  profile: reuse exact successful coupon profile; exact slicer and profile hash remain unknown
  orientation:
    assembly_source: X length, Y width, Z height
    print_export: rotate 90 degrees about global Y and translate to Z minimum 0
    bed_contact: one complete U-profile end cross-section
  supports: none-intended-based-on-user-coupon-result
  target_formats:
    - editable CadQuery source
    - STEP assembly-orientation master
    - DRAFT STL in 90-degree print orientation
    - DRAFT assembly-reference STEP
    - 3MF only after exact slicer/profile confirmation

optimization:
  status: pending
  objective: Maximize identical single-funnel segment count while preserving at least 3.0 mm solid material from the 46 mm funnel tangent to each segment end and keeping the nominal total exactly 945 mm.
  baseline_slicer_report: null
  preliminary_selected_variant: 18-identical-segments
  comparison_report: DECISION-LOG.md
  mesh_simplification:
    status: pending
    master_mesh: null
    manufacturing_mesh: null
    protected_regions:
      - funnel surfaces
      - sieve-hole edges
      - swirl ribs
      - U-profile bed-contact cross-section
      - installed envelope datums
    rationale: Native CadQuery tessellation will be measured before any simplification decision.

acceptance:
  - id: GEO-001
    criterion: The nominal installed envelope is 945.0 × 65.0 × 21.0 mm.
    method: Deterministic parameter and assembly-bounds check.
    status: pending
  - id: GEO-002
    criterion: Exactly 18 identical segments of 52.5 mm nominal length sum to 945.0 mm without connector overlap or protrusion.
    method: Deterministic count, equality, and assembly-overlap check.
    status: pending
  - id: GEO-003
    criterion: Every segment contains exactly one centered 46 mm funnel and at least 3.0 mm solid end margin on both ends; the target margin is 3.25 mm.
    method: Parameter assertions and section measurement.
    status: pending
  - id: GEO-004
    criterion: No key, slot, snap, rail, tongue, magnet pocket, or other segment connector exists.
    method: Source-feature audit and geometry inspection.
    status: pending
  - id: MESH-001
    criterion: Each STEP/STL segment is one positive-volume, watertight, consistently wound component with 52.5 × 65.0 × 21.0 mm assembly-orientation extents.
    method: STEP re-import plus deterministic mesh audit.
    status: pending
  - id: DfAM-001
    criterion: The print-oriented STL is a rigid 90-degree rotation of the master, has Z minimum 0, and measures 21.0 × 65.0 × 52.5 mm up to axis ordering.
    method: Deterministic bounds and bidirectional surface comparison after inverse transform.
    status: pending
  - id: DfAM-002
    criterion: The selected 90-degree orientation is checked in the exact successful coupon slicer profile for continuous bed contact and no required supports.
    method: Exact slicer dry run and layer-preview review.
    status: blocked-exact-profile-unknown
  - id: PHY-001
    criterion: Eighteen printed pieces fit the real drain without buckling, excessive cumulative gap, rocking, or sharp exposed edges.
    method: Human physical installed-fit inspection.
    status: blocked-physical-test
  - id: PHY-002
    criterion: Drainage, cleaning, and hair retention are acceptable with the preserved funnel geometry.
    method: Human process-matched water and hair test.
    status: blocked-physical-test

unresolved:
