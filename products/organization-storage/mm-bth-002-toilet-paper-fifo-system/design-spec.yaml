    status: pending-interface-design
  - item: M5 x 20 bolts, washers and nuts for module seams
    quantity: 8 sets
    authority: measured-supplier-parts
    status: preliminary-length-requires-coupon
  - item: M3 countersunk screws and heat-set inserts for decorative skins
    quantity: 6 sets
    authority: measured-supplier-parts
    status: preliminary-interface-requires-coupon

optimization:
  status: pending
  baseline_slicer_report: null
  selected_variant: null
  comparison_report: null
  rationale: Compare the legacy six-body GLB-derived package against the three-module fully parametric candidate.
  mesh_simplification:
    status: not-beneficial
    master_mesh: exact STEP and CadQuery B-Rep source; no triangle mesh is design authority
    manufacturing_mesh: exports/draft/stl/DRAFT_*.stl
    method: direct-cadquery-tessellation-no-lossy-decimation
    tolerance_mm: 0.10
    protected_regions:
      - functional interfaces
      - wall mount load path
      - roll swept volume
      - inlay boundaries
      - bed-contact faces
    comparison_report: validation/digital-validation-r3.json
    resource_budget:
      triangle_target: 50000
      triangle_stop: 200000
      peak_memory_gib: 4
      max_mesh_mib: 50
      max_slicer_seconds: 120
    slicer_resolution_check:
      status: pending
      report: null
    rationale: >-
      Candidate-02 directly tessellates exact B-Reps at 0.10 mm chordal and
      0.15 rad angular tolerance. All 15 draft meshes are watertight,
      single-component and positive-volume; the largest is 11,792 triangles
      and 589,684 bytes, with 60,150 triangles and 3,008,760 bytes total.
      Lossy decimation would add interface, bed-plane and shallow-relief risk
      without a meaningful handling benefit. Exact-slicer resolution remains
      a separate pending gate.

acceptance:
  - id: requirements-current
    criterion: Requirements approval explicitly references project revision 3.0.0.
    method: workflow gate review
  - id: concept-current
    criterion: Approved concept image explicitly references the approved project revision.
    method: workflow gate review
  - id: geometry-valid
    criterion: Every manufacturing mesh is watertight, positive-volume and has the intended body count.
    method: automated mesh validation plus independent review
  - id: bed-fit
    criterion: Every part fits the confirmed build volume in its intended orientation.
    method: bounds check and exact target slicer
  - id: roll-envelope
    criterion: The approved digital gauge and physical worst-case roll samples clear loading, storage, descent and removal paths.
    method: CAD swept-volume review plus physical gauge and roll tests
  - id: fifo-reliability
    criterion: One hundred full five-roll cycles complete without a jam, double release, torn paper or manual intervention inside the shaft.
    method: physical cycle test with representative and adverse roll samples
  - id: module-joints
    criterion: Structural modules align without unintended play, separation or roll-catching seam steps.
    method: fit coupon, assembled section review and handling test
  - id: wall-mount
    criterion: The selected printed load path, screws and substrate-specific anchors pass the human-approved installed proof protocol without crack, slip or anchor movement.
    method: guarded physical installation test
  - id: cleanability
    criterion: User-accessible surfaces can be wiped and dried without unacceptable trapped liquid or inaccessible residue pockets.
    method: section review and physical cleaning test
  - id: surface-process
    criterion: Wave relief and gold inlay retain intended paths in the exact slicer and pass a process-matched appearance/fit coupon.
    method: exact slicer plus physical coupon
  - id: watermark-release
    criterion: The exact JSI-WM-001-R1 mark is recessed, readable from the finished underside, process-safe and approved on the current geometry revision.
    method: references/watermark-release-gate.md

legacy_evidence:
  package: 2/ZEN_KINTSUGI_WAVE_FIFO_5R_HYBRID_v2.0.0(2)/ZEN_KINTSUGI_WAVE_FIFO_5R_HYBRID_v2.0.0
  status: informative-only-not-current-approval
  useful:
    - watertight manufacturing meshes were reported for the default package
    - a diameter 122 x width 107 mm gauge reported zero static vertical intersections at 98 positions
    - side-panel rail geometry and coupons exist
  blocked_or_unknown:
    - no exact slicer result
    - no physical FIFO, roll-variation or jam test
    - no physical joint, rail or dovetail coupon results
    - no wall substrate, anchor or installed proof evidence
    - no requirements, concept or final release approval record

test_plan:
  status: active-draft-validation
  digital:
    - source parameter assertions and deterministic rebuild
    - B-Rep validity and single-solid checks
    - five-position rigid roll-gauge clearance regression
    - module seam non-intersection check
    - draft STL topology, bounds and manifest-integrity checks
  manufacturing:
    - exact confirmed-printer slicer dry run
    - joint and decorative-skin coupons
  physical:
    - representative/adverse-roll FIFO cycle test
    - installed substrate-specific guarded proof test
    - cleaning and optional-accessory checks

outputs:
  source: source/
  concept_assets: concept/
  exports: exports/
  validation: validation/
  final_model_report: reports/final-model-result.md

release_blockers:
  - confirmed roll envelope and adverse roll samples
  - confirmed printer, build volume, material and exact slicer profile
  - substrate-specific wall fasteners and guarded proof test
  - fit, FIFO, cleaning and accessory coupons/tests
  - optimization and manufacturing-mesh decisions
  - JuSt Innovation watermark integration and final release approval
