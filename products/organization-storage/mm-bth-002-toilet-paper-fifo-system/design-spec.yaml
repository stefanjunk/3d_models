  brand: JuSt Innovation
  asset_id: JSI-WM-001-R1
  operation: recessed
  preferred_surface: print-bed-facing-underside
  depth_mm: 0.40
  integration_stage: last-planned-solid-geometry-change

requirements_basis:
  user_stated:
    - id: USR-001
      statement: Review the toilet-paper stand and its concept image.
    - id: USR-002
      statement: Recommend design improvements and simplify the product.
    - id: USR-003
      statement: Redesign without an image-to-3D AI model.
  inferred:
    - id: INF-001
      statement: Preserve the recognizable ivory, wave and gold-kintsugi visual identity.
    - id: INF-002
      statement: Preserve the wall-mounted five-roll gravity-FIFO function unless corrected by the user.
    - id: INF-003
      statement: Bathroom use requires cleanable, moisture-tolerant surfaces and serviceable mounting.
  recommended:
    - id: REC-001
      statement: Use an exact parametric functional core and deterministic spline/vector decoration.
    - id: REC-002
      statement: Replace the six legacy body pieces with three structural modules holding at most two rolls each.
    - id: REC-003
      statement: Keep the scent tray as an optional removable accessory, not part of the base product.
    - id: REC-004
      statement: Use shallow procedural side waves and buffered spline kintsugi channels; use filament/finish for microtexture.
  resolved_by_user:
    - id: RES-001
      source_message: approved
      selected: five-roll FIFO with maximum roll envelope diameter 120 x width 105 mm
      resolved_at: 2026-08-21
    - id: RES-002
      source_message: approved
      selected: drilled wall fasteners with substrate-specific purchased anchors; no adhesive-only primary mounting
      resolved_at: 2026-08-21
    - id: RES-003
      source_message: approved
      selected: scent tray optional and removable
      resolved_at: 2026-08-21
  unresolved: []

function:
  summary: >-
    Wall-mounted vertical gravity-FIFO storage column for five spare toilet-paper
    rolls, loaded from the top and removed one at a time from the lower front.
  users:
    - adult household users
  included_functions:
    - five-roll vertical storage
    - gravity FIFO advancement
    - top loading and lower-front single-roll removal
    - visible roll inventory
    - serviceable wall mounting
    - optional removable dry-scent-stone tray
    - replaceable or separately printable decorative accent bodies
  excluded_functions:
    - adhesive-only primary wall mounting
    - open flame, candles or liquid fragrance oils
    - child-safety certification
    - load rating without substrate-specific physical testing
    - production dependence on AI-generated STL, OBJ or GLB geometry
  interfaces:
    - roll-to-shaft-clearance
    - top-loading-swept-volume
    - bottom-output-stop-and-removal-path
    - structural-module-joints
    - wall-fastener-and-anchor-system
    - optional-decor-skin-or-inlay
    - optional-scent-tray-retention

risk:
  class: structural
  rationale: A tall wall-mounted object can fall if its printed mounting path, fasteners or wall anchors fail.
  hazards:
    - falling assembly after anchor or printed-back failure
    - roll jams or unintended double release
    - finger pinch or sharp snagging edges at the output
    - moisture and residue trapped in deep relief or module seams
    - scent tray detachment or misuse with liquid or flame
  assumptions:
    - installation is performed by an adult
    - actual roll dimensions are checked against the approved envelope
    - wall substrate and suitable anchors are identified before installation
  required_human_review:
    - wall substrate, purchased fasteners and anchors
    - installed proof-test procedure
    - physical FIFO and jam testing

fabrication:
  preference: balanced-hybrid
  assembly_target: low-to-moderate
  repairability: required
  printed:
    - three structural body modules
    - deterministic decorative skins or inlays
    - optional scent tray
    - fit and FIFO coupons
  purchased:
    - substrate-specific wall anchors and screws
    - washers where required by the final bearing design
    - eight M5 module-joint bolts with washers and nuts
    - six M3 decorative-skin screws with matching heat-set inserts
  prohibited_primary_joints:
    - decorative GLB or raster-relief geometry in the wall-mount load path
    - adhesive-only structural joints
    - untested printed snap fits carrying the complete assembly

printer:
  model: Anycubic Kobra 3 Max from legacy documentation; user confirmation required
  build_volume_mm: [420, 420, 500]
  basis: legacy-project-documentation-not-yet-user-confirmed
  enclosure: false
  drying_available: recommended

manufacturing:
  process: fdm-fff
  structural_material: PETG
  decorative_materials:
    - PETG
    - PLA or Silk PLA for nonstructural removable accents only
  nozzle_mm: 0.60
  line_width_mm: 0.68
  layer_height_mm:
    structural: 0.30
    decorative: [0.20, 0.24, 0.30]
  supports_target: none-or-local-only
  target_formats:
    - editable-parametric-source
    - STEP where the selected backend supports it
    - 3MF
    - STL
    - assembly-preview
    - validation-reports
  profile_status: provisional-until-printer-and-slicer-confirmed

dimensions:
  units: mm
  coordinate_datum: rear mounting plane Y=0; +Y away from wall; +Z upward; X centered
  roll_envelope:
    nominal_max_diameter_mm: 120
    nominal_max_width_mm: 105
    digital_gauge_diameter_mm: 122
    digital_gauge_width_mm: 107
    status: legacy-values-pending-user-confirmation
  capacity_rolls: 5
  legacy_reference_envelope_mm:
    body: [140, 121, 664]
    total_with_crown_height_mm: 735
    total_width_with_tray_mm: 196
    status: informative-only
  proposed_envelope_target_mm:
    width_without_accessory_max: 150
    depth_max: 130
    height_without_optional_crown_max: 680
  proposed_module_architecture:
    structural_module_count: 3
    maximum_roll_positions_per_module: 2
    structural_joint_count: 2
    maximum_module_height_mm: 260
    status: recommended-for-approval

architecture:
  representation_authority:
    fifo-shaft-output-and-loading-clearances: parametric-brep-or-deterministic-solid
    wall-mount-load-path: parametric-brep-or-deterministic-solid
    module-joints: parametric-brep-or-deterministic-solid
    visible-wave-envelope: cubic-bspline-bezier-or-low-order-analytic-curves
    kintsugi-grooves-and-inlays: buffered-parametric-spline-network
    microtexture: material-finish-or-slicer-process
    standard-fasteners-and-anchors: purchased
  source_policy:
    concept_images: visual-inspiration-only
    legacy_glb_meshes: archived-reference-only
    image_to_3d_production_geometry: prohibited
  protected_geometry:
    - wall mounting holes, bearing pads and tool access
    - complete roll shaft and roll swept volumes
    - output stop and finger-access edges
    - module mating faces and alignment axes
    - print-bed faces
    - scent-tray retention interface when enabled

