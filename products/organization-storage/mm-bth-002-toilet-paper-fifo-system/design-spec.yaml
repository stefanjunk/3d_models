surfacing:
  method: sparse-cubic-curves-with-extrusion-or-sweep
  functional_core_separation: required
  semantic_parameters:
    - wave_amplitude
    - wave_wavelength
    - wave_phase
    - crown_height
    - crown_curl
    - kintsugi_trunk_offsets
    - kintsugi_branch_count
    - kintsugi_width
  continuity_targets:
    visible-wave-curves: G2-preferred
    structural-mating-edges: exact-or-intentionally-sharp
  validation:
    - silhouette review
    - curvature-comb review for crown and dominant waves
    - no unexplained curvature spikes
    - no drift of protected functional hardpoints

surface_texture:
  side_waves:
    representation: procedural-vector-or-analytic-relief
    minimum_feature_policy: at least two reliable extrusion paths where geometry is intended to remain distinct
    relief_depth_mm: [0.4, 1.2]
  kintsugi:
    representation: buffered-spline-groove-plus-separate-inlay-body
    nominal_width_mm: [1.8, 2.4]
    nominal_exposed_thickness_mm: [0.55, 0.80]
  microtexture:
    representation: filament-material-or-finish
    dense-raster-displacement: prohibited
  keepouts_required: true

loads:
  - id: stored-roll-weight
    value: measured-actual-five-roll-set
    status: measurement-required
  - id: assembly-self-weight
    value: exact-slicer-estimate-and-measured-print
    status: measurement-required
  - id: wall-mount-proof
    value: substrate-specific-human-approved-test-protocol
    status: release-blocking

duty:
  service_life_target_years: 5
  fifo_cycle_target: 100
  cleaning_access: tool-free-decor-access-preferred
  status: approved-in-revision-3.0.0

environment:
  indoor_outdoor: indoor
  location: bathroom
  temperature_c: [10, 40]
  moisture: high-humidity-and-occasional-splash
  uv: low
  chemicals:
    allowed: mild-household-bathroom-cleaner-after-material-check
    excluded: aggressive-solvents-and-unknown-disinfectants

purchased_parts:
