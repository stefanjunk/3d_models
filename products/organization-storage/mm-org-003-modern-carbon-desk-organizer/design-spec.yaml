risk:
  class: normal-functional
  criticality: K1
  scope_limit: Adult dry-indoor desk storage only.
  hazards: [drawer binding or rattle, stack rocking, small-item loss through a corner, snagging texture, tip risk with an extended loaded drawer]
  controls: [closed matched-radius pockets, full-travel CAD collision sweep, smooth interface keep-outs, fit and texture coupons, no load claim before testing]

