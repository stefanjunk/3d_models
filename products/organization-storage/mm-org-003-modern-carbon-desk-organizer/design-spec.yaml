  preference: integrated-print
  preference_basis: The housing, drawers and sorter are separate one-piece prints; no purchased precision or wear component is required for this low-load experimental draft.
  process: FDM/FFF
  release_scope: Digital DRAFT only until exact-profile slicing and physical qualification pass.

