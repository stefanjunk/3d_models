appearance:
  form_language: Modern rounded fascia silhouettes with continuous reveals and closed rounded containment corners.
  color: Dark charcoal or black recommended; color is not encoded as manufacturing geometry.
  carbon_effect:
    intent: Stylized directional tow cue plus material highlight; not a structural carbon claim.
    representation: Compact procedural 45-degree recessed grooves on named exterior badge surfaces.
    motif_pitch_mm: 3.2
    groove_width_mm: 0.8
    groove_depth_mm: 0.24
    coupon_pitches_mm: [2.4, 3.2, 4.0]
    target_surfaces: [drawer fascia panels, housing side badge panels, sorter front and side badge panels]
    keepouts: [sliding faces, stack pegs and sockets, bed datums, finger scoops, hand-contact edges, 4 mm panel borders]
    claim_boundary: Carbon-look only; no laminate or composite performance claim.

optimization:
  status: pending
  rationale: The compact shell/perimeter-frame architecture is retained; matched rounded pockets add only required corner material while the procedural texture stays far below the dense legacy mesh burden.
  pending_reason: Geometry and mesh budgets pass, but no exact-profile baseline/candidate slicer comparison exists for the corrected revision.
  mesh_simplification:
    status: not-beneficial
    master_mesh: modern-carbon-desk-organizer-compact-v2.0.0/exports/master/DRAFT-MM-ORG-003-compact-assembly-preview-2.0.0-draft.2.stl
    protected_regions: [drawer guides and travel envelope, rear stops, closed containment corners, divider junctions, stack pegs and sockets, bed datums, rounded fascia, texture fields]
    resource_budget:
      triangle_target: 250000
      triangle_stop: 500000
      peak_memory_gib: 2.0
      max_mesh_mib: 25.0
      max_slicer_seconds: 120.0
    rationale: STEP B-Reps are tessellated directly at 0.05 mm chordal tolerance; global lossy decimation would risk functional and visual regions without useful slicer evidence.

acceptance:
  - {id: AC-PREFLIGHT-001, criterion: The corrective preflight is schema-valid and current for 2.0.0-draft.2., method: 3d-design-preflight validator., status: passed}
  - {id: AC-CORNER-001, criterion: Four housing-rear bay probes and four sorter-corner probes retain positive material., method: Exact CadQuery point classification., status: passed-digital}
  - {id: AC-MOTION-001, criterion: The drawer has zero housing collision at nine positions over its full 181.9 mm insertion travel., method: Exact CadQuery B-Rep intersection sweep., status: passed-digital}
  - {id: AC-STACK-001, criterion: Housing and seated sorter have zero unintended B-Rep intersection while retaining 0.2 mm depth reserve., method: Exact CadQuery intersection and source calculation., status: passed-digital}
  - {id: AC-MESH-001, criterion: Housing drawer and sorter STL files are watertight consistently wound positive-volume single components with zero boundary and nonmanifold edges., method: fdm_ci audit-mesh release profile., status: passed-digital}
  - {id: AC-3MF-001, criterion: The print-set package has valid millimetre 3MF structure and four build items using three watertight mesh objects., method: fdm_ci validate-3mf release profile., status: passed-digital}
  - {id: AC-FIT-001, criterion: A selected process-matched coupon slides freely without objectionable rattle and the unchanged full drawer repeats that result., method: Physical fit coupon and full prototype., status: planned}
  - {id: AC-TEXTURE-001, criterion: The selected carbon cue reads correctly at desk distance under three light angles without snagging., method: Vertical-wall texture coupon and human appearance review., status: planned}
  - {id: AC-SLICE-001, criterion: Exact source/profile slicer run passes with manual layer support seam and path review., method: fdm_ci slice-anycubic-next when a complete Anycubic profile set is selected., status: not-run}

