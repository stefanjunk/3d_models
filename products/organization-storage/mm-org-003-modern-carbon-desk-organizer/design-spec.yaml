requirements:
  user_stated:
    - The housing must visibly read as carbon-inspired rather than coarse triangulated crosshatch.
    - Rear housing corners and upper-sorter containment corners must not be open.
    - Drawer fronts must match the rounded front language of the housing.
    - Recheck the complete design and verify that the interfaces have enough nominal play.
  retained:
    - Two identical drawers and one removable six-bin top sorter.
    - Common-printer footprint with each unique production part within 220 x 220 x 250 mm.
    - Smooth protected sliding, stack, bed, divider and hand-contact regions.
  unresolved:
    - Exact printer, filament product, nozzle hardware and complete slicer profile.
    - Qualified XY sliding clearance for that exact process.
    - Physical appearance, drawer cycling, stack retention and anti-tip results.

function:
  summary: Compact two-drawer desk organizer with a removable six-compartment top sorter for dry indoor stationery, cables, small tools and small electronics.
