  name: Modern Carbon Desk Organizer Compact
  revision: 2.0.0-draft.1
  units: mm
  lineage:
    portfolio_record: PORT-004
    derivative_of: modern-carbon-desk-organizer-v1.1.2
    reason: smaller modular derivative for common 220 mm printers
  status: experimental-digital-candidate

workflow:
  autonomy_policy: autonomy-policy.json
  requirements_approval:
    status: approved
    decision: AUTO_APPROVED
    spec_revision: 2.0.0-draft.1
