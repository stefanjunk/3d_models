    sha256: 178918f8b0e475fd8431e87453fd5e8aadcd5d8eb2d2c80e43bf068c6a03896e
    basis: Concept visibly maps the compact envelope, two identical drawers, removable six-bin sorter and sparse inset twill treatment; exact dimensions remain controlled by this specification.
