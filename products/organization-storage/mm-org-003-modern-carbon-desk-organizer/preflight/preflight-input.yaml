  - modern-carbon-desk-organizer-compact-v2.0.0/validation/interface-report.json
  - owner correction dated 2026-09-05 in the active design review
manufacturing_profile:
  printer: common Cartesian/CoreXY 220 x 220 x 250 mm class; exact machine unknown
  process: FDM/FFF
  nozzle_mm: 0.4
  material: ordinary PLA or supplier-specific Tough PLA; exact product unknown
  orientation_known: true
known_loads_environment:
