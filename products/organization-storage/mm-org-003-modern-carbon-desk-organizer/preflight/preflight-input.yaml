product: Modern Carbon Desk Organizer Compact
intended_use: >-
  Provide a compact two-drawer desk organizer with a removable six-bin sorter,
  closed containment corners, coherent rounded fronts, and a recognizable
  carbon-twill appearance for dry indoor stationery storage.
user_context: >-
  On 2026-09-05 the owner rejected revision 2.0.0-draft.1 as visually and
  geometrically poor: the housing did not read as carbon, rear housing corners
  and upper-sorter corners appeared open, and the straight drawer fronts did
  not match the rounded housing language. The owner also requested a renewed
  clearance and overall design audit.
host_variant:
  manufacturer: null
  model: common 220 x 220 x 250 mm FFF printer class
  revision: null
  variant_confirmed: false
lifecycle_states:
  - transport
  - assembly
  - calibration
  - use
  - cleaning
  - service
  - disassembly
  - storage
  - failure
requirements:
  - Preserve the 210 x 190 mm housing/sorter footprint and 173 mm total height; report the 3.2 mm proud drawer fascia in the true assembled depth.
  - Close rear housing and all sorter containment corners with continuous printable walls.
  - Match drawer-front silhouette and reveals to the approved rounded form language.
  - Replace the coarse crossed-groove cue with a physically scaled stylized 2x2 carbon twill.
  - Preserve smooth drawer sliding faces, stack interfaces, bed datums, and hand-contact edges.
  - Verify nominal CAD clearances and require a process-matched coupon before claiming physical fit.
known_components:
  - housing
  - two identical drawers
  - removable six-bin sorter
  - fit-clearance coupon
  - texture-scale coupon
  - adult desk user
  - dry indoor environment
available_evidence:
  - modern-carbon-desk-organizer-compact-v2.0.0/design-spec.yaml
  - modern-carbon-desk-organizer-compact-v2.0.0/model-parameters.json
  - modern-carbon-desk-organizer-compact-v2.0.0/cad/build_compact_organizer.py
