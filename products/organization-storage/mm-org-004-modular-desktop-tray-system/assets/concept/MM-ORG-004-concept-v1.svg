<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#202c3a"/></linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8da1b8"/><stop offset="1" stop-color="#506477"/></linearGradient>
    <style>
      .title{font:700 34px sans-serif;fill:#f4f7fb}.sub{font:18px sans-serif;fill:#a9b8c8}.label{font:700 19px sans-serif;fill:#e8eef5}.note{font:15px sans-serif;fill:#b9c7d5}.dim{font:14px monospace;fill:#78d6c6}.edge{stroke:#d7e1eb;stroke-width:3;fill:url(#tray)}.inner{fill:#253444;stroke:#b8c7d7;stroke-width:2}.socket{fill:#f2a65a;stroke:#ffe0b8;stroke-width:2}.dash{stroke:#78d6c6;stroke-width:2;stroke-dasharray:8 7;fill:none}
    </style>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <text x="55" y="62" class="title">MM-ORG-004 · MODULAR DESKTOP TRAY SYSTEM</text>
  <text x="57" y="94" class="sub">Three visual styles · one underside interface · support-conscious FDM</text>

  <g transform="translate(55 145)">
    <text x="0" y="0" class="label">TOP / ARRANGEMENT</text>
    <g transform="translate(15 35)">
      <rect x="0" y="0" width="235" height="235" rx="12" class="edge"/>
      <rect x="18" y="18" width="199" height="199" rx="8" class="inner"/>
      <text x="18" y="265" class="note">PRECISION · 76 × 76 × 28</text>
      <path d="M235 100h18v35h-18" class="socket"/>
    </g>
    <g transform="translate(290 35)">
      <rect x="0" y="0" width="355" height="235" rx="28" class="edge"/>
      <rect x="18" y="18" width="319" height="199" rx="20" class="inner"/>
      <text x="18" y="265" class="note">SOFT · 112 × 76 × 34</text>
      <path d="M0 100h-18v35H0" class="socket"/>
      <path d="M355 100h18v35h-18" class="socket"/>
    </g>
    <g transform="translate(685 35)">
      <rect x="0" y="0" width="440" height="235" rx="48" class="edge"/>
      <rect x="18" y="18" width="404" height="199" rx="38" class="inner"/>
      <text x="18" y="265" class="note">LOUNGE · 150 × 76 × 40</text>
      <path d="M0 100h-18v35H0" class="socket"/>
    </g>
    <path d="M253 152h19M663 152h22" class="dash"/>
    <text x="320" y="337" class="dim">Modules arrange freely; declared product envelope ≤ 230 × 180 × 45 mm</text>
  </g>

  <g transform="translate(55 535)">
    <text x="0" y="0" class="label">UNDERSIDE INTERFACE</text>
    <g transform="translate(15 35)">
      <path d="M0 58h95l16-18h32l16 18h95v58h-95l-16 18h-32l-16-18H0z" fill="#34485b" stroke="#d7e1eb" stroke-width="3"/>
      <path d="M92 63l20-18h30l20 18-20 18h-30z" class="socket"/>
      <text x="0" y="165" class="note">Two receiver bosses meet across a 1.0 mm nominal gap.</text>
    </g>
    <g transform="translate(390 32)">
      <path d="M0 55l24-25h38l18 25 18-25h38l24 25-24 25H98L80 55 62 80H24z" fill="#f2a65a" stroke="#ffe0b8" stroke-width="3"/>
      <text x="0" y="115" class="note">Bow-tie link inserts from the bottom while trays are inverted.</text>
      <text x="0" y="142" class="note">The desktop blocks withdrawal in normal use; 0.30 mm clearance/side.</text>
    </g>
    <g transform="translate(825 20)">
      <path d="M0 20h280v18H0z" fill="#687d92"/>
      <path d="M82 38h116v62H82z" fill="#506477" stroke="#d7e1eb" stroke-width="3"/>
      <path d="M115 38v35h50V38" fill="#f2a65a" stroke="#ffe0b8" stroke-width="3"/>
      <path d="M0 102h280" stroke="#78d6c6" stroke-width="4"/>
      <text x="0" y="135" class="note">SECTION · short bridged socket roof</text>
      <text x="0" y="160" class="dim">trays print bottom-down · no generated support</text>
    </g>
  </g>
  <text x="57" y="772" class="note">Concept v1 · exact geometry is controlled by design-spec.yaml and config/model-parameters.json · physical fit not yet tested</text>
</svg>
