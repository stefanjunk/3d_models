<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#243240"/></linearGradient><style>.t{font:700 34px sans-serif;fill:#f4f7fb}.s{font:17px sans-serif;fill:#afbecd}.h{font:700 20px sans-serif;fill:#e9eff6}.n{font:15px sans-serif;fill:#bdcad7}.d{font:14px monospace;fill:#78d6c6}.part{fill:#6f879d;stroke:#dce6ef;stroke-width:3}.desk{fill:#b88352;stroke:#f0c999;stroke-width:3}.cable{fill:none;stroke:#f2a65a;stroke-width:12}.dash{fill:none;stroke:#78d6c6;stroke-width:2;stroke-dasharray:8 7}</style></defs>
  <rect width="1200" height="760" fill="url(#bg)"/><text x="55" y="62" class="t">MM-ORG-005 · DESK-EDGE CABLE CLIP KIT</text><text x="57" y="95" class="s">Parametric desk gap + cable diameter · PETG leaf flexure · side-printed</text>
  <g transform="translate(60 150)"><text class="h">FUNCTIONAL SIDE SECTION</text>
    <path class="part" d="M170 105h390v24H198v152h362v24H174V105z"/>
    <path class="part" d="M198 281h362l-10 19H198z"/>
    <rect class="desk" x="255" y="132" width="360" height="145" rx="7"/>
    <path class="part" d="M170 160a62 62 0 1 0 0 90h36v-22h-32a38 38 0 1 1 0-46h32v-22z"/>
    <path class="cable" d="M92 205h93"/><path class="dash" d="M200 83h360M200 325h360"/>
    <text x="255" y="365" class="d">desk edge inserts from right · nominal jaw controlled by JSON</text>
    <text x="35" y="395" class="n">C-ring keeps a passive cable accessible; it is not electrical insulation or certified strain relief.</text>
  </g>
