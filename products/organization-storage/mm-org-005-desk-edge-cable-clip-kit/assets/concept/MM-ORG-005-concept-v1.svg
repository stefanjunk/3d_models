    <g transform="translate(0 45)"><rect class="part" width="405" height="82" rx="17"/><text x="25" y="34" class="h">THIN</text><text x="25" y="61" class="n">12 mm desk · 3.5 mm cable</text></g>
    <g transform="translate(0 150)"><rect class="part" width="405" height="98" rx="20"/><text x="25" y="41" class="h">STANDARD</text><text x="25" y="70" class="n">15 mm desk · 5.0 mm cable</text></g>
    <g transform="translate(0 272)"><rect class="part" width="405" height="114" rx="23"/><text x="25" y="47" class="h">THICK</text><text x="25" y="79" class="n">18 mm desk · 7.0 mm cable</text></g>
  </g>
  <g transform="translate(60 610)"><text class="h">PRINT ORIENTATION</text><path class="part" d="M235 15h350v32H235z"/><path class="dash" d="M205 62h410"/><text x="640" y="42" class="d">large XZ profile on bed → flexure follows continuous in-layer paths</text><text x="0" y="100" class="n">Concept v1 · exact dimensions live in design-spec.yaml and config/model-parameters.json · force, fatigue and marking remain physical gates</text></g>
