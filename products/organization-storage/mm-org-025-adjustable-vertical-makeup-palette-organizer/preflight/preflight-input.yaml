product: Mm Org 025 Adjustable Vertical Makeup Palette Organizer
intended_use: Fully parametric digital print candidate for SKU-007, the vertical makeup-palette organizer. One 190
  × 106 mm base provides sixteen 11.5 mm grid stations. Seven identical removable dividers form six default compartments
  with 20.6/20.6/20.6/20.6/32.1/43.6 mm clear widths.
