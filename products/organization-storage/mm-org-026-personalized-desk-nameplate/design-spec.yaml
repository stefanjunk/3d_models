  - {id: R4, text: Make insert fit measurable., acceptance: 3.0 mm key and 3.2 3.4 3.6 mm inclined-slot gauge bracket production., status: PASS_DIGITAL_PHYSICAL_DEFERRED}
  - {id: R5, text: Fit the researched product envelope and print support-free., acceptance: installed system fits 200 x 62 x 55 mm and exact-profile slice passes., status: PASS_DIGITAL}
  - {id: R6, text: Bound privacy and product claims., acceptance: customer names are minimized and no credential affiliation accessibility or outdoor claim is made., status: PASS_DIGITAL_HUMAN_DEFERRED}

manufacturing:
  process: FDM
  material: PLA
  supports: prohibited
  reference_profile: Anycubic Kobra 3 Max, 0.4 mm nozzle, 0.20 mm Standard, Anycubic PLA

validation:
