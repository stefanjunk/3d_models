    - Tipping or sliding during placement
    - Sharp or rough printed contact edges
  controls:
    - Loose non-clamping datums and open removal path
    - Two-datum measurement coupon
    - Physical insertion, marking and 10-degree stability tests
    - No release claim before physical and human gates pass

