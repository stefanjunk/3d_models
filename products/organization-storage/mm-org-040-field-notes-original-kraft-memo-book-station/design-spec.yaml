requirements:
  user_stated:
    - Register MM-ORG-040 as one new product at revision 0.1.0.
    - Produce a prospective preflight and linked design contract without concept or CAD.
    - Use DE seller, DE market, digital-first commercial intake and release ID MM-ORG-040-0.1.0.
    - Authorize schema 1.1 workflow policy as project-owner-via-chat-2026-09-01, no more permissive than the preflight ceiling.
  research_evidenced:
    - One closed Field Notes Original Kraft memo book uses the published 89 x 140 mm planform.
    - Use two loose desk datums without clamping the spine.
    - Keep top and spine side open; thickness is not a fit interface.
    - Use a planning envelope no larger than 175 x 115 x 55 mm.
    - Use the pinned Kobra 3 Max / SUNLU PETG Black / 0.4 mm hardened-nozzle / 0.20 mm baseline, flat stable base down and support-free, unless a later validated revision supersedes it.
  inferred:
    - Adult dry indoor tabletop use is the only intended environment.
    - The prospective printed station is one custom part with no purchased hardware currently defined.
  recommended:
    - Select the exact left- or right-spine orientation during requirements normalization.
    - Derive loose datum clearance through the two-datum coupon rather than inventing a tolerance now.
    - Preserve a finger-access removal path and a flat nonfunctional underside region for the later watermark.
  unresolved:
    - Exact left/right orientation and optional label treatment
    - Clearance candidate values and detailed geometry
    - Direct measurement, book mass, cover condition and physical desk surface
    - Final outgoing license, seller legal identity, trademark wording and DE sales channel

function:
  summary: >-
    A prospective one-piece station registers one closed named memo book against
    two loose desk datums for repeatable adult indoor writing or display placement.
  included:
    - Loose planform registration using the published 89 x 140 mm nominal dimensions
    - Open top and removal path
    - Non-clamping treatment of the stapled spine
    - Stable support on a dry flat desk or shelf
  excluded:
    - Other notebook editions or generic compatibility
    - Thickness-controlled capture
    - Archival, impact, security, child, wall, vehicle, or regulated use
  interfaces:
    - preflight/interfaces/IF-EXT-GEO-LOC-EDGE-001.json
    - preflight/interfaces/IF-EXT-MEC-SUP-PLN-001.json

