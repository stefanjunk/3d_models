verification_plan:
  - Inspect the source-defined 89 x 140 mm planform.
  - Print one two-datum contact coupon on the pinned baseline.
  - Check free insertion and removal without clamping or visible marking.
  - Check upright retention after a 10-degree base tilt.
  - Repeat insertion and removal for 20 cycles on one current physical book.
  acceptance:
    - Coupon source-defined datums are within 0.30 mm of their specified values.
    - The book inserts and removes without force.
    - The book remains upright after a 10-degree base tilt.
    - No visible mark appears after 20 cycles.

