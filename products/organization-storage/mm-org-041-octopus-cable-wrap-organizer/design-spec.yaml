  minimum_wall_basis: three perimeters at the pinned 0.4 mm nozzle
  design_clearances:
    status: unresolved-until-cable-measurement-and-coupon

generative:
  role: sacrificial-preform
  authority: >-
    Step1X-3D owns massing and surface character only. Every functional dimension is
    re-created parametrically. The generated mesh is a proposal, not a measured reconstruction.
  reference_image: organic/reference/
  raw_meshes: organic/raw/step1x/
  protected_region: head dome and outer tentacle surfaces
  editable_seam_band: tentacle inner curls where channels are cut
  hidden_geometry: synthesized from one image; unverified against any physical object

risk:
  class: normal-functional
  criticality: K1
  scope_limit: Dry adult indoor desk use only; not a toy for children under 3.
  hazards:
    - A cable falls out of a channel that is wider than the cable
    - A tight or burred channel lip scuffs a cable jacket
    - A thin generated tentacle tip prints sharp or fragile
    - The body tips or slides during one-handed cable routing
  controls:
    - Compliant pinch detents below the measured minimum cable diameter, after measurement
    - Radiused channel lips and a thin-protrusion audit before export
    - Low centre of gravity and a maximised flat footprint
    - No fit, retention, comfort or stability claim before the coupon and physical tests pass

fabrication:
