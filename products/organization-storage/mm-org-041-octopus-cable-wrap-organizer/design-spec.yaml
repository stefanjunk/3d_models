  preference_basis: Generated appearance shell with a parametric functional interface; no purchased hardware is planned.
  process: FDM/FFF
  parts_status: Run-005 is a watertight one-part digital candidate with six CAD-owned channels; no physical print exists.
  release_scope: Digital first only after physical qualification and commercial clearance.

