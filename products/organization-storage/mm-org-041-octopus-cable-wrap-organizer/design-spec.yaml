optimization:
  status: applied
  baseline_slicer_report: reports/run-005/slice-baseline-383k.json
  selected_variant: organic/work/run-005/optimization/octopus-100k.stl
  comparison_report: reports/run-005/optimization-decision.json
  rationale: The 100k candidate reduces the manufacturing mesh by 73.87 percent while keeping sliced time and extrusion within 0.10 percent of the 382744-face baseline.
  mesh_simplification:
    status: applied
    master_mesh: organic/work/run-005/03-channels-parametric.stl
    manufacturing_mesh: result/mm-org-041-octopus-cable-wrap-organizer-v0.2.0.stl
    method: Blender planar-preserving collapse decimation with seeded bidirectional surface regression
    tolerance_mm: 0.15
    comparison_report: reports/run-005/optimization-100k-comparison.json
    protected_regions:
      - head dome and outer tentacle surfaces
      - cable channel floors and pinch lips
      - flat desk-support underside
      - future watermark safe region
    resource_budget:
      triangle_target: 100000
      triangle_stop: 400000
      peak_memory_gib: 8
      max_mesh_mib: 25
      max_slicer_seconds: 600
    slicer_resolution_check:
      status: passed
      report: reports/run-005/slice-candidate-100k.json
    rationale: Geometric regression passed at p95 0.0083 mm and maximum 0.0242 mm, far inside the 0.15 mm ceiling; exact-profile slicing also passed.

acceptance:
  - id: AC-MESH-001
    criterion: The repaired solid is watertight and manifold with zero self-intersections before and after the channel Boolean.
    method: Deterministic mesh audit.
    status: passed-digital-run-005
  - id: AC-WALL-001
    criterion: No feature is below 1.35 mm at the released scale and no tentacle tip ends below one nozzle width.
    method: Minimum-wall and thin-protrusion audit.
    status: planned
  - id: AC-ENVELOPE-001
    criterion: The released bounding box stays within 125 x 125 x 65 mm.
    method: Bounding-box measurement of the exported solid.
    status: passed-digital-run-005
  - id: AC-RETENTION-001
    criterion: Each declared channel retains its intended cable against a 2 N vertical tug.
    method: Printed coupon test with measured real cables.
    status: planned
  - id: AC-CYCLE-001
    criterion: No visible jacket deformation after 100 insertion cycles.
    method: Printed coupon test, before/after visual inspection.
    status: planned
  - id: AC-STABILITY-001
    criterion: With every declared channel loaded, the body remains upright after a 10-degree base tilt.
    method: Physical prototype test on a recorded dry flat surface.
    status: planned

