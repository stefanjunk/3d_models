requirements:
  user_stated:
    - Select one not-yet-created product from the portfolio that suits imagegen plus Step1X-3D and build it.
    - Auto-approve all workflow gates.
    - Run everything sequentially in this session without subagents.
    - Create a product concept image even when a design-process gate is configured for automatic approval.
  research_evidenced:
    - Implement research SKU-331 with its declared 125 x 125 x 65 mm envelope ceiling.
    - Provide organized retention channels for slack USB and audio desk cables.
    - Use two declared channel sizes, nominal 4 mm and 6 mm, with compliant pinch detents.
    - Use PETG with a buildplate-only support strategy.
    - Keep the object a decorative adult desk item with no child-safety or load-bearing claim.
  inferred:
    - Adult dry indoor desk or shelf use is the only intended environment.
    - The product is one single printed part; the felt liner stays optional and unspecified.
    - Cables are routed slack after placement and the channels never carry cable tension.
  recommended:
    - Keep the centre of gravity low and the flat footprint as large as the silhouette allows.
    - Radius every user-reachable channel lip and thicken tentacle tips above one nozzle width.
    - Reserve a flat non-functional underside region for the later metriMade mark.
  unresolved:
    - Measured outer diameters and jacket hardness of the real target cables
    - Retention force, insertion feel and 100-cycle jacket behaviour
    - As-built mass, centre of gravity and desk-surface friction
    - Final outgoing license, seller legal identity, image-generator terms and disclosure wording

function:
  summary: >-
    A one-piece decorative octopus body whose curled tentacles form open, parametrically
    cut channels that hold slack low-voltage desk cables separated and reachable.
  included:
    - Open cable-retention channels in two declared sizes with compliant pinch detents
    - A flat printed underside serving as both desk seat and support-free print seat
    - A generated organic appearance envelope from an own imagegen reference
  excluded:
    - Strain relief, bend-radius protection, insulation, EMC or power-delivery-heat function
    - Mains cables, damaged cables and cables under load
    - Child use, toy scope, load-bearing, wall, vehicle, outdoor, wet or food-contact use
    - Any measured-anatomy, scanned-original or third-party-likeness claim
  interfaces:
    - preflight/interfaces/IF-EXT-GEO-RET-SLOT-001.json
    - preflight/interfaces/IF-EXT-MEC-SUP-PLN-001.json
    - preflight/interfaces/IF-HUM-GEO-CON-FREEFORM-001.json
    - preflight/interfaces/IF-INT-GEO-CON-BODY-001.json

