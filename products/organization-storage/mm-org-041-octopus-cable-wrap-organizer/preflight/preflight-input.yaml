# Only what was actually known on 2026-09-04. UNKNOWN stays UNKNOWN.

scope:
  intended_function: >-
    Hold and separate several slack low-voltage USB and audio desk cables in open
    retention channels formed by the curled tentacles of a decorative generated
    octopus body standing on a dry indoor desk.
  exclusions:
    - measured animal anatomy, scanned originals, third-party characters or likenesses
    - cables under power-delivery heat, mains cables, damaged cables
    - strain relief, bend-radius protection, insulation, EMC function
    - load-bearing, wall, vehicle, outdoor, wet, food-contact use
    - toy for children under 3; any child-safety or small-parts claim
    - EU commercial use while the Step1X-3D licence conflict is open
  host_variant: >-
    No named host product. The cable population is a customer-side set of unmeasured
    low-voltage leads; this is the deliberate weak point of the current evidence.
  users: adults organizing their own desk, one-handed routing, no tools
  location: dry flat indoor desk or shelf, room temperature
  lifecycle_states:
    transport: boxed, decorative, no fragile-protrusion evidence yet
    assembly: none; single part placed on its flat underside
    use: repeated manual cable insertion and removal
    cleaning: dusting or a damp wipe; no solvent or dishwasher scope
    service: none defined
    disassembly: none; single part
    storage: dry indoor
  loads_temperatures_media:
    mechanical: several slack cables; no tension carried; own weight only
    thermal: room temperature only; no in-use cable heat scope
    media: none
    duration: UNKNOWN, no cycle-life evidence
  failure_consequence: >-
    Loss of tidiness or minor cosmetic cable-jacket marking. No injury, no property
    damage, no electrical hazard within the declared scope.

