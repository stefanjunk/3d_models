optimization:
  status: complete
  performed_at: "2026-09-05T12:30:00+02:00"
  approved_by: agent-attestation-under-autonomy-policy
  skill: optimize-fdm-design
  report: optimization/OPTIMIZATION-REPORT.md
  protected_geometry_map: optimization/protected-geometry.md
  variant_source: source/divider_variants.py
  baseline:
    mesh: source/generated/divider-block.stl
    sha256: e0d437c30ed9516fd42f0ea13429c730144ad5e61822f2e39f286454f2e23928
    print_time_s: 22857
    extruded_volume_mm3: 93284
    material_g_at_1p27: 118.5
    layers: 295
    peak_flow_mm3_s: 9.61
  infill_finding:
    status: NO_INFILL_CORE
    detail: >-
      Four wall loops from each side need 3.10 mm of the 1.6 mm divider plate, and the 2.0 mm
      floor is thinner than the 1.2 mm bottom plus 1.2 mm top shell. Extruded volume is 99.3 %
      of the CAD solid volume, so sparse_infill_density cannot move bulk on this part.
  selected_candidate:
    id: B2
    mesh: source/generated/variants/divider-block-b2-floor-thin-scoop.stl
    sha256: a20c3e1a1410350103c9a9bb3c2698f67b90e5510fc2a364ae069aec2c46285a
    process: qualified 0.20 mm baseline, unchanged
    print_time_s: 17785
    material_g_at_1p27: 93.9
    time_delta_pct: -22.2
    material_delta_pct: -20.8
    basis: Pareto set of one under the qualified-process constraint.
  deferred_candidate:
    id: C
    mesh: source/generated/variants/divider-block-b2-floor-thin-scoop.stl
    process: profiles/anycubic-slicer-next/process-0p28-petg-tool-k3max-CANDIDATE.json
    process_status: UNQUALIFIED
    print_time_s: 15174
    material_g_at_1p27: 89.5
    time_delta_pct: -33.6
    material_delta_pct: -24.4
    blocked_by: >-
      The 0.28 mm layer height is outside the calibration baseline
      MM-R3-K3MAX-PETG-0P4-0P20-2026-08-31. Release requires the human slicer-preflight gate.
  rejected:
    - {lever: divider through-windows, reason: opens a path between lanes; IF-EXT-GEO-LOC-SLOT-001 constrains "cards falling between lanes"}
    - {lever: floor windows or grid floor, reason: cards would reach the drawer bottom unevenly and loose contents would fall through}
    - {lever: lane depth 45 -> 38 mm, reason: 26 % engagement on a 148 mm card is unsupportable without a physical stability test}
    - {lever: sparse infill density, reason: NO_INFILL_CORE; there is no core to make sparser}
  mesh_simplification:
    status: not_required
    protected_regions: [lane side walls, lane floor, tab tops, flat underside, future mark region]
    rationale: >-
      The manufacturing mesh is 7180 triangles and 371 kB. It burdens neither import, slicing
      nor the controller, and reducing it would only risk the protected planar datums.

acceptance:
  - {id: AC-LANE-001, criterion: The lane coupon holds 105 mm plus the qualified clearance within 0.30 mm., method: Printed coupon measurement., status: planned}
  - {id: AC-INSERT-001, criterion: A card enters and leaves single-handed without snagging or bending., method: Physical filing test with real A6 cards., status: planned}
  - {id: AC-CYCLE-001, criterion: 100 filing cycles leave no scuff on the media., method: Before/after visual inspection., status: planned}
  - {id: AC-WALL-001, criterion: No feature is below 1.35 mm at the released scale., method: Minimum-wall audit., status: planned}
  - {id: AC-ENVELOPE-001, criterion: The generated block never exceeds the entered drawer envelope or the print envelope., method: Parametric sweep over configurator inputs., status: planned}

