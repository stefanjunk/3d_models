requirements:
  user_stated:
    - Design this as the second metriCreate MVP model, digital-first.
    - Follow the functional 3D design workflow and double-check the preflight before design starts.
    - Produce a concept image, then the 3D model, and bring the product to MVP readiness.
  research_evidenced:
    - Sort DIN A6 media in labelled open-top lanes cut to the ISO 216 A6 trimmed size 105 x 148 mm.
    - Keep the top and one long side fully open for finger access.
    - Stay within a 220 x 180 x 80 mm planning envelope or split into modules.
    - Use PETG on the pinned Kobra 3 Max baseline, support-free.
  inferred:
    - The customer drawer envelope is an input, never an assumed dimension.
    - One printed part per module; no purchased hardware.
    - Adult dry indoor filing is the only intended environment.
  recommended:
    - Keep the lane clearance a single named parameter so one coupon qualifies the whole family.
    - Give every index tab the 1.35 mm minimum wall so no tab can print below one nozzle width.
    - Reserve a flat nonfunctional underside region for the later mark.
  unresolved:
    - xy_clearance_sliding on this exact process (UNQUALIFIED, blocking)
    - Real card tolerance, bow, corner wear and stack growth
    - Tab height and text treatment for legibility
    - Outgoing licence, seller legal identity and the DE sales channel

function:
  summary: >-
    A parametric open-top lane block that files DIN A6 media by category in a
    customer-owned drawer, generated per order from the drawer envelope and a category list.
  included: [ISO 216 A6 lanes with a declared clearance, labelled index tabs, open top and one open long side, flat printed underside]
  excluded: [other paper formats, archival or moisture protection, load-bearing use, child use, any fit claim before the coupon]
  interfaces:
    - preflight/interfaces/IF-EXT-GEO-LOC-SLOT-001.json
    - preflight/interfaces/IF-EXT-GEO-CON-VOLUME-001.json
    - preflight/interfaces/IF-HUM-GEO-ACC-EDGE-001.json

dimensions:
