optimization:
  status: complete
  performed_at: "2026-09-05T13:00:00+02:00"
  approved_by: agent-attestation-under-autonomy-policy
  skill: optimize-fdm-design
  report: optimization/OPTIMIZATION-REPORT.md
  protected_geometry_map: optimization/protected-geometry.md
  variant_source: source/tray_variants.py
  baseline:
    mesh: source/generated/coin-tray.stl
    print_time_s: 15482
    extruded_volume_mm3: 59901
    material_g_at_1p27: 76.1
    layers: 81
    peak_flow_mm3_s: 8.61
  cost_finding:
    dominant_feature: internal solid infill
    detail: >-
      47.5 % of all filament goes into internal solid infill and a further 11.1 % into internal
      bridging, because eight recesses are cut to eight different depths and every solid layer
      spans the full 128 x 112 mm footprint. Walls together are only 25.7 %. Unlike MM-ORG-042
      a real sparse core exists here, so the levers are footprint and shell count.
  selected_candidate:
    id: D1
    mesh: source/generated/variants/coin-tray-b1-pitch.stl
    process: profiles/anycubic-slicer-next/process-0p20-petg-thinshell-k3max-CANDIDATE.json
    process_status: >-
      Qualified 0.20 mm layer height and 0.4 mm nozzle; only top/bottom shell thickness moves
      from 1.2 mm to 0.8 mm, so it is not the pinned profile and slicer-preflight stays human.
    print_time_s: 12528
    material_g_at_1p27: 60.8
    time_delta_pct: -19.1
    material_delta_pct: -20.0
    basis: Pareto set of one under the qualified-layer-height constraint.
  rejected:
    - {id: A, lever: "layer height 0.20 -> 0.28 mm", reason: "costs 3.3 % MORE material; the 1.2 mm bottom shell rounds up to 1.40 mm at 0.28 mm"}
    - {id: B2, lever: uniform recess depth, reason: "6 minutes and 0.9 g over B1, against sinking 1c/2c/5c coins up to 2.13 mm deeper"}
    - {id: C, lever: "B2 geometry on the 0.28 mm layer", reason: "6 minutes faster than D1 but 6.8 g heavier and outside the calibration baseline"}
    - {lever: hollowing the entry ramp, reason: "a 7.4 degree sloped plate over an open cavity would need support; the design is support-free today"}
    - {lever: open or windowed underside, reason: "trades cheap sparse infill for expensive bridging across the whole field"}
  mesh_simplification:
    status: not_required
    protected_regions: [recess walls, recess floors, slope surface, finger notches, flat underside, future mark region]
    rationale: >-
      The manufacturing mesh is 8032 triangles. It burdens neither import, slicing nor the
      controller, and decimating it would move the coin recess diameters.

acceptance:
