  - {id: AC-SEPARATION-001, criterion: No coin enters a recess of a smaller denomination, verified explicitly on the 2c/10c pair., method: Printed coupon cross-entry test., status: planned}
  - {id: AC-STABILITY-001, criterion: With every recess loaded the tray remains upright after a 10-degree tilt., method: Physical prototype test., status: planned}
  - {id: AC-WALL-001, criterion: No feature is below 1.35 mm at the released scale., method: Minimum-wall audit., status: planned}
  - {id: AC-CYCLE-001, criterion: 100 sorting cycles cause no cracking., method: Physical prototype cycling., status: planned}

