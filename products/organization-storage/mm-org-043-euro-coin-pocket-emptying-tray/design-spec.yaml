requirements:
  user_stated:
    - Design this as the second metriCreate MVP model, digital-first.
    - Follow the functional 3D design workflow and double-check the preflight before design starts.
    - Produce a concept image, then the 3D model, and bring the product to MVP readiness.
  research_evidenced:
    - Separate euro circulating coins into open labelled recesses sized to the EU-fixed nominal diameters.
    - Provide a swept slope so coins can be pushed in from a pocket without picking them up.
    - Stay within a 180 x 160 x 45 mm planning envelope.
    - Use PETG on the pinned Kobra 3 Max baseline, support-free.
  inferred:
    - Every recess needs a finger notch; a coin sitting flush defeats the purpose.
    - One printed part; no purchased hardware.
    - Adult dry indoor use is the only intended environment.
  recommended:
    - Bound the recess clearance below half the 1.00 mm 2c-to-10c diameter step.
    - Keep the walls low and the footprint wide so a one-handed sweep cannot tip the tray.
    - Reserve a flat nonfunctional underside region for the later mark.
  unresolved:
    - hole_delta_vertical on this exact process (UNQUALIFIED, blocking)
    - Finger-notch geometry, which has no measured basis
    - Coin wear and mixed mint years
    - Outgoing licence, seller legal identity and the DE sales channel

function:
  summary: >-
    A parametric one-piece tray with a swept slope and open, labelled, denomination-separated
    recesses, generated per order from the selected denominations, capacity and footprint.
  included: [recesses at the EU-fixed coin nominals plus a declared clearance, a swept entry slope, a finger notch per recess, flat printed underside]
  excluded: [worn/foreign/commemorative coins, secure storage or authentication, counting function, child use, any separation claim before the coupon]
  interfaces:
    - preflight/interfaces/IF-EXT-GEO-LOC-CYL-001.json
    - preflight/interfaces/IF-EXT-MEC-SUP-PLN-001.json
    - preflight/interfaces/IF-HUM-GEO-ACC-EDGE-001.json

