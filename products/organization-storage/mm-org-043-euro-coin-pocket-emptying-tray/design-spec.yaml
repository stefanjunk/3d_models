    spec_revision: 0.1.0
    asset: concept/concept-context-001.png
    asset_sha256_record: evidence/concept-image-record.json
    reason: >-
      Concept image generated from the approved requirements and reviewed against the design
      contract: eight graded recesses in two rows, a finger notch per recess, low walls and a
      flat seated underside all match. Deviations are recorded in the concept image record;
      no dimensional claim rests on the image.
    revisions:
      - id: concept-rev-1
        status: approved
        approved_by: agent-attestation-under-autonomy-policy
        approved_at: "2026-09-05T13:00:00+02:00"
        change: >-
          Cell pitch tightened from 31 mm to 28 mm. The footprint shrinks from 128 x 112 mm to
          116 x 106 mm, the material between recesses goes from 4.85 mm to 1.85 mm and the rear
          entry ramp narrows from 124 mm to 112 mm.
        reason: >-
          Silhouette change from the optimize-fdm-design pass. Every solid layer spans the
          footprint, so shrinking it removes 10.4 % of the material and 10.9 % of the time on
          the unchanged process. No coin recess diameter, the named clearance, the finger
          notches, the rim, the ramp angle or the flat underside change.
        limits: >-
          1.85 mm between recesses is above the 1.35 mm minimum wall but well below the
          original 4.85 mm. Drop resistance when coins are tipped in is a physical property and
          stays with the human fit-and-function and safety gates.
