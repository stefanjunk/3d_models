scope:
  intended_use: Let an adult sweep euro circulating coins out of a pocket across a shaped slope into open,
    labelled, denomination-separated recesses on a dry indoor desk or entryway surface.
  user_context: 'Adult daily pocket emptying. metriCreate digital-first: the customer selects denominations,
    coins per recess and footprint, and downloads the generated model.'
  variants:
  - Euro circulating coins 1c to 2 EUR at the EU-fixed nominal diameters
  - customer-selected denomination subset, recess capacity and tray footprint
  out_of_scope:
  - Worn, foreign, commemorative, damaged and pre-issue coins
  - Secure storage, authentication, counting or any financial-protection function
  - Child use — loose coins are a choking hazard
  - Wet, outdoor, load-bearing or vehicle use
  - Any separation claim before the recess clearance is qualified by coupon
