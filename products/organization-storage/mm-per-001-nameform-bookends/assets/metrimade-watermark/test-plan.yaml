project: MM-WM-001-R1
status: physical-execution-pending

digital_checks:
  - id: required-fields
    pass: generator rejects missing or malformed product ID/version
  - id: visible-identity
    pass: generated SCAD/profile geometry and sidecar metadata map to metriMade.com plus exact product ID/version
  - id: closed-outlines
    pass: SVG contains outlined paths and no live text
  - id: cutter-topology
    pass: STL cutter is watertight/manifold and has positive volume
  - id: coupon-topology
    pass: coupon STL is watertight/manifold and has positive volume
  - id: dimensions
    pass: generated layout envelope, cutter extents and 0.40 mm depth match metadata

physical_coupon:
  printer: record exact machine
  nozzle_mm: 0.40
  layer_height_mm: 0.20
  material: record exact manufacturer/material/color
  bed_surface: record exact surface
  checks:
    - domain legible without guessing
    - product ID legible without guessing
    - version legible without guessing
    - central M mark recognizable
    - no first-layer closure makes two characters ambiguous
    - no sharp burrs or loose features
    - remaining wall and local stiffness acceptable
  record: validation/physical-test-record.csv

release_gate:
  pass_only_if:
    - digital checks pass
    - slicer preview is archived
    - physical coupon passes using intended production settings
    - exact integrated product revision is revalidated
