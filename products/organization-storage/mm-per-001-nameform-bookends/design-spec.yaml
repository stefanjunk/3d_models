  seam_blend_px: 24
  front_relief_depth_mm: 0.6
  front_mesh_pitch_mm: 0.45
  front_mapping: "image X follows model X; image Y follows descending model Z; phase remains continuous across a half-name before glyph masking"
  front_mask: "glyph front faces only, tapered inside the outline so counters, silhouette, gaps, connector, side blade, foot, bed datum, and book-contact surfaces remain protected"
  exposed_flanks: "recommended pending coupon: same master and physical phase on outward-visible glyph perimeter strips, maximum 0.30 mm normal relief, 0.45 mm surface pitch, with gap and junction keep-outs"
  excluded_surfaces:
    - "rear connector web and local bridges"
    - "glyph backs and connector bonds"
