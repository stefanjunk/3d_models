acceptance:
  - id: paired-function
    criterion: "Left and right are mechanically mirrored; feet point inward; text reads normally from -Y"
    method: "Exact bounds/orientation assertions, assembly render, and interface contract"
  - id: geometry-valid
    criterion: "Each side is one positive watertight body with zero boundary/nonmanifold/duplicate faces; up to 10 sub-2.7e-9 mm² numerical Boolean sliver faces are permitted only when the exact-coordinate audit remains watertight and the exact slicer succeeds"
    method: "fdm_ci audit-mesh"
  - id: bed-fit
    criterion: "Each requested MA | RITA part fits the declared 350x120x165 mm maximum envelope and the 420x420x500 mm Kobra 3 Max profile"
    method: "mesh bounds plus exact slicer bed check"
  - id: text-valid
    criterion: "Requested glyphs exist; counters remain open; minimum stroke >=1.8 mm; default cap height is 122 mm; adjacent fronts retain >=1.2 mm visible gap; both halves share cap height and baseline"
    method: "Font sweep, polygon validity, outline-spacing assertions, front-view silhouette render, and slicer thin-wall review"
  - id: letter-only-front
    criterion: "From the approved front view there is no rectangular panel; only glyphs, open counters, and small shadowed rear bridges are visible"
    method: "Orthographic front silhouette comparison plus three-quarter concept/model render"
  - id: wood-front-transfer
    criterion: "Glyph fronts preserve candidate C source, 120 x 45 mm physical period, 24 px seam blend, 0.6 mm depth, 0.45 mm pitch, and direct full-master sampling"
    method: "Source-coordinate regression, relief-span report, mesh audit, exact slice, and process-matched letter coupon"
  - id: connector-integrity
    criterion: "Every glyph is fused through the recessed rear web with no disconnected island and survives the defined handling coupon without fracture"
    method: "Connectivity graph, watertight-body audit, section review, and physical handling test"
  - id: supports
    criterion: "No generated support; bridges/overhangs remain within the qualified profile"
    method: "CAD construction and exact slicer layer review"
  - id: stability
    criterion: "2.0 kg test row: no tip/fracture/permanent set and <=5 mm slide"
    method: "Calculation/FEM for comparison plus physical pair test"
  - id: package
    criterion: "Standards-valid left/right 3MFs bind exact geometry, units, profile identity, and hashes"
    method: "fdm_ci validate-3mf, freeze-project, and release manifest"
  - id: reproducibility
    criterion: "Default plus text/side parameter sweep rebuilds deterministically"
    method: "fdm_ci run-sweep and hash-bound reports"
  - id: physical-gate
    criterion: "Process-matched prototype passes visual, book-contact, load, slide, and handling tests"
    method: "test-plan.yaml with human evidence"

