function:
  summary: >
    A coordinated pair of distinct left and right bookends. Books stand between
    the two ends along X. Each part has a vertical side blade beside the books,
    a thin inward foot beneath the books, and a front-facing letter-dominant
    facade without a rectangular wing.
    The left and right text halves read as one name from the front; neither text
    half is mirrored. A recessed rear web only joins the glyphs; the side blade
    and foot retain the book load independently of the decorative glyphs.
  users:
    - "Adults retaining an indoor book row on a flat shelf or desk"
    - "3D-printer owners generating or printing a personalized pair"
  modes:
    split_name:
      description: "Automatic rendered-width split with shared font size and baseline"
      example: "STEFAN -> STE | FAN"
      default: true
    explicit_pair:
      description: "Independent --left-text and --right-text values, including initials"
    whole_name_each_side:
      description: "Optional same full name on both sides using the same freestanding-glyph architecture"
  text_contract:
    default_text: STEFAN
    font: "Bundled Noto Sans ExtraCondensed ExtraBold, SIL OFL; exact file, license, and hash recorded under source/v0.4.0/assets/fonts"
    normalization: "Unicode NFC"
    supported_initial_set: "Uppercase single-name variants A-Z, digits, hyphen, apostrophe, ÄÖÜẞ; spaces and lowercase remain fail-closed until their detached/descender connector behavior is explicitly implemented and swept"
    unsupported_glyph_behavior: "Fail closed with the missing code point; never substitute silently"
    split_rule: "Choose a character boundary minimizing the larger outline-packed half width, then use one common cap height and baseline"
    minimum_printed_stroke_mm: 1.8
    default_cap_height_mm: 122.0
    nominal_inter_glyph_gap_mm: 1.8
    minimum_finished_gap_mm: 1.2
    glyph_body_depth_mm: 12.0
  interfaces:
    - "Shelf/desk: flat underside; optional anti-slip pads are a later accessory, not assumed in the load claim"
    - "Books: side blade contacts the outer book cover; inward foot lies beneath the book row"
    - "Pair: no connector; spacing adapts to book-row width"
  excluded:
    - "No wall mounting, stacking, child-directed use, structural shelving, or book rows above the tested range"
    - "No claim that recessed dimples alone provide anti-slip performance"
    - "No automatic printer upload or start"

coordinate_system:
  units: mm
  x: "book-row direction; left to right when viewed from the front"
  y: "shelf depth; +Y moves away from the front viewer"
  z: "up; print-bed datum z=0"
  handedness:
    left: "letter facade extends toward -X; foot extends inward toward +X"
    right: "letter facade extends toward +X; foot extends inward toward -X"

geometry:
  fixed_parameters_mm:
    overall_height: 160
    side_blade_height: 150
    side_blade_depth: 115
    default_letter_facade_width: "derived from glyph outlines; 208.025 mm for MA and 275.348 mm for RITA at the requested MARITA split, cap height, and gap"
    inward_foot_length: 70
    inward_foot_thickness: "2.0 with a 15 mm support-free taper to a 0.6 mm inner toe"
    nominal_plate_thickness: 3.2
    nominal_rib_thickness: 2.4
    corner_radius: 3.0
    glyph_body_depth: 12.0
    rear_connector_thickness: 4.0
    rear_connector_front_setback_from_glyph_front: 10.0
    rear_connector_extension_behind_glyph: 2.0
    minimum_glyph_connector_overlap: 2.0
    local_bridge_band_width: 12.0
    nominal_inter_glyph_gap: 1.8
    minimum_finished_inter_glyph_gap: 1.2
  maximum_part_envelope_mm: [350, 120, 165]
  build_margin_on_420_mm_bed: "Requested MA | RITA limiting half retains about 71 mm in X and 305 mm in Y on the 420 mm bed before brim; it has only about 1.25 mm margin to the stricter 350 mm internal part-envelope gate"
  architecture:
    - "Continuous side blade and inward foot form the primary L-shaped book load path"
    - "Large extruded glyphs replace the rectangular front wing and create the visible facade silhouette"
    - "A 4.0 mm glyph-shaped rear layer and 12.0 mm-wide local bridges connect adjacent glyphs and the blade; counters remain open and no rectangular background is permitted"
    - "The connector begins 10.0 mm behind the glyph front, overlaps the 12.0 mm-deep glyph bodies by 2.0 mm, and extends 2.0 mm behind them so it is both better anchored and more deeply shadowed"
    - "Rounded triangular gussets connect side blade, glyph facade, and foot where hidden from the intended front view"
    - "Glyph geometry does not control stop height, foot length, or side-blade depth"

