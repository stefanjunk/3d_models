    - "Fix the audited design and continue using the recommended improvements"
    - "Support different letters, whole names, and a name split between left and right ends"
    - "Wood-texture transfer coupon variant C already looks quite good and is selected as the wood appearance basis"
    - "The visible front shall consist primarily of larger letters rather than a textured rectangular panel"
    - "Apply the wood appearance to the letters, explicitly including their front faces"
    - "Move the background far behind the letters so it is barely visible from the front and serves only to connect the letters"
    - "Set letters very close together while retaining a visible gap"
    - "The new name is MARITA"
  previously_approved:
    - "True mechanically mirrored left/right pair with books between the ends"
    - "Inward feet under the books so book weight stabilizes the pair"
    - "Fixed functional stop height independent of text length"
    - "Shared font size and baseline for split-name halves"
    - "Shell/rib construction instead of a 100%-solid ballast slab"
    - "Valid per-side 3MFs, exact print profile, deterministic validation, and physical test plan"
  approved_design_basis:
    - "Use Noto Sans ExtraCondensed ExtraBold as the default open-licensed glyph source so the letters can grow materially without exceeding the Kobra 3 Max bed"
    - "Use 122 mm default cap height and outline-position glyphs with 1.8 mm nominal gaps; preserve at least 1.2 mm after any side relief"
    - "Replace the full wing with 6.0 mm deep glyph bodies and a 2.4 mm rear connector web whose front begins 6.0 mm behind the glyph front"
    - "Generate only local rear bridges between neighboring glyphs and the functional side blade; do not fill counters or create a rectangular background"
    - "Keep the side-blade and inward-foot load path from 0.3.0 while making it visually subordinate from the front"
    - "Use accepted candidate C unchanged on glyph fronts; use a shallower mapped treatment on exposed glyph flanks only after a process-matched letter coupon"
  inferred:
    - "Front viewing direction is -Y; the complete split name reads left-to-right across the book row"
    - "The historical demonstration name is STEFAN, split STE | FAN"
    - "The requested MARITA variant uses the outline-balanced split MA | RITA because MAR | ITA exceeds the 350 mm per-part design envelope at 122 mm cap height"
    - "Indoor adult decorative/normal-functional use only"
  unresolved_nonblocking:
    - "Final color/material finish and optional heavy-duty fillable-ballast derivative"
    - "Exact filament product, color, batch, conditioning, and the complete profile used for the physical C print"

function:
  summary: >
    A coordinated pair of distinct left and right bookends. Books stand between
    the two ends along X. Each part has a vertical side blade beside the books,
    a thin inward foot beneath the books, and a front-facing letter-dominant
    facade without a rectangular wing.
    The left and right text halves read as one name from the front; neither text
    half is mirrored. A recessed rear web only joins the glyphs; the side blade
    and foot retain the book load independently of the decorative glyphs.
  users:
    - "Adults retaining an indoor book row on a flat shelf or desk"
    - "3D-printer owners generating or printing a personalized pair"
  modes:
    split_name:
      description: "Automatic rendered-width split with shared font size and baseline"
      example: "STEFAN -> STE | FAN"
      default: true
    explicit_pair:
      description: "Independent --left-text and --right-text values, including initials"
    whole_name_each_side:
      description: "Optional same full name on both sides using the same freestanding-glyph architecture"
  text_contract:
    default_text: STEFAN
    font: "Bundled Noto Sans ExtraCondensed ExtraBold, SIL OFL; exact file, license, and hash recorded under source/v0.4.0/assets/fonts"
    normalization: "Unicode NFC"
    supported_initial_set: "Uppercase single-name variants A-Z, digits, hyphen, apostrophe, ÄÖÜẞ; spaces and lowercase remain fail-closed until their detached/descender connector behavior is explicitly implemented and swept"
    unsupported_glyph_behavior: "Fail closed with the missing code point; never substitute silently"
    split_rule: "Choose a character boundary minimizing the larger outline-packed half width, then use one common cap height and baseline"
    minimum_printed_stroke_mm: 1.8
    default_cap_height_mm: 122.0
    nominal_inter_glyph_gap_mm: 1.8
    minimum_finished_gap_mm: 1.2
    glyph_body_depth_mm: 6.0
  interfaces:
    - "Shelf/desk: flat underside; optional anti-slip pads are a later accessory, not assumed in the load claim"
    - "Books: side blade contacts the outer book cover; inward foot lies beneath the book row"
    - "Pair: no connector; spacing adapts to book-row width"
  excluded:
    - "No wall mounting, stacking, child-directed use, structural shelving, or book rows above the tested range"
    - "No claim that recessed dimples alone provide anti-slip performance"
    - "No automatic printer upload or start"

coordinate_system:
  units: mm
  x: "book-row direction; left to right when viewed from the front"
  y: "shelf depth; +Y moves away from the front viewer"
  z: "up; print-bed datum z=0"
  handedness:
    left: "letter facade extends toward -X; foot extends inward toward +X"
    right: "letter facade extends toward +X; foot extends inward toward -X"

geometry:
  fixed_parameters_mm:
    overall_height: 160
    side_blade_height: 150
    side_blade_depth: 115
    default_letter_facade_width: "derived from glyph outlines; 208.025 mm for MA and 275.348 mm for RITA at the requested MARITA split, cap height, and gap"
    inward_foot_length: 70
    inward_foot_thickness: "2.0 with a 15 mm support-free taper to a 0.6 mm inner toe"
    nominal_plate_thickness: 3.2
    nominal_rib_thickness: 2.4
    corner_radius: 3.0
    glyph_body_depth: 6.0
    rear_connector_thickness: 2.4
    rear_connector_setback_from_glyph_front: 6.0
    nominal_inter_glyph_gap: 1.8
    minimum_finished_inter_glyph_gap: 1.2
  maximum_part_envelope_mm: [350, 120, 165]
  build_margin_on_420_mm_bed: "Requested MA | RITA limiting half retains about 71 mm in X and 305 mm in Y on the 420 mm bed before brim; it has only about 1.25 mm margin to the stricter 350 mm internal part-envelope gate"
  architecture:
    - "Continuous side blade and inward foot form the primary L-shaped book load path"
    - "Large extruded glyphs replace the rectangular front wing and create the visible facade silhouette"
    - "A glyph-shaped rear layer and only the local bridges needed between adjacent glyphs connect the facade; counters remain open and no rectangular background is permitted"
    - "The connector web begins 6.0 mm behind the glyph front so only small shadowed bridges can be seen through the gaps"
    - "Rounded triangular gussets connect side blade, glyph facade, and foot where hidden from the intended front view"
    - "Glyph geometry does not control stop height, foot length, or side-blade depth"

surface_texture:
  selected_candidate: "wood-texture-transfer-v0.2.0 candidate C — user reported on 2026-08-31 that it already looks quite good"
  source_master: "libraries/surface-textures/wood-001/master/wood-001-tile-16bit.png"
  source_sampling: "direct bilinear sampling from the full 1254 x 1254 16-bit master; no build-raster downsampling"
  repeating_patch_mm: [120.0, 45.0]
  seam_blend_px: 24
  front_relief_depth_mm: 0.6
  front_mesh_pitch_mm: 0.45
  front_mapping: "image X follows model X; image Y follows descending model Z; phase remains continuous across a half-name before glyph masking"
  front_mask: "glyph front faces only, tapered inside the outline so counters, silhouette, gaps, connector, side blade, foot, bed datum, and book-contact surfaces remain protected"
  exposed_flanks: "recommended pending coupon: same master and physical phase on outward-visible glyph perimeter strips, maximum 0.30 mm normal relief, 0.45 mm surface pitch, with gap and junction keep-outs"
  excluded_surfaces:
    - "rear connector web and local bridges"
    - "glyph backs and connector bonds"
    - "side-blade book-contact face, foot, bed datum, gussets, watermark region, and all minimum-wall zones"
  compute_budget:
    strategy: "sample only masked glyph patches and serialize each half separately; source pixels never become a full-surface vertex grid"
    target_triangles_each: 400000
    stop_triangles_each: 1000000
    max_mesh_mib_each: 50
    max_peak_memory_gib: 4
    max_exact_slicer_seconds: 240

duty:
  book_row_mass_kg: 2.0
  representative_book_row_width_mm: [100, 400]
  book_height_mm: [100, 240]
  service: "static indoor use for years; occasional repositioning"
  acceptance_load_case: >
    Pair supports a 2.0 kg row between the side blades with books resting on
    both inward feet; no tip, fracture, permanent deformation, or slide beyond
    5 mm during the defined physical test.
  design_safety_factor_min: 1.5
  note: "Book/foot contact distribution and shelf friction require physical validation"

