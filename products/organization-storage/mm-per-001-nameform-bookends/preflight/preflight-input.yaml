product: Nameform Split Pair Bookends
intended_use: A coordinated pair of distinct left and right bookends. Books stand between the two ends along X.
  Each part has a vertical side blade beside the books, a thin inward foot beneath the books, and a front-facing
  decorative wing. The left and right text halves read as one name from the front; neither text half is mirrored.
  Functional stop height does not change with the name.
