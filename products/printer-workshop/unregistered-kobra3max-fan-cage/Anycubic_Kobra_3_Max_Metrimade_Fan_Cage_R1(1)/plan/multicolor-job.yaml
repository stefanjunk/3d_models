version: 1
project:
  name: kobra3max-metrimade-wraparound-honeycomb-cover
  purpose: lightweight spatial full-front honeycomb shell with camera-visible branding and an airflow-conscious fan badge
  risk_class: normal-functional
  units: mm

printer:
  model: Anycubic Kobra 3 Max
  material_changer: ACE Pro
  nozzle_mm: 0.4
  layer_height_mm: 0.2
  max_filaments: 4
  slicer: Anycubic Slicer Next

source:
  path: assets/metrimade-lockup-horizontal-color.svg
  kind: owner_supplied_vector_plus_parametric_cad
  preserve_immutable: true
  units: mm
  texture_paths: [assets/metrimade-lockup-horizontal-color.svg]
  source_sha256: null

representation:
  method: separate_solids
  authoritative_color_data: named_solids
  destination_format: 3mf
  slicer_project_required: true

palette:
  path: plan/filament-palette.yaml
  maximum_colors: 4
  mapping_method: semantic_visual_intent
  dither: false
  island_cleanup:
    enabled: false
    minimum_area_mm2: 0.04
    minimum_width_mm: 0.8
    reassignment: none

geometry:
  minimum_color_width_mm: 0.8
  minimum_inlay_depth_mm: 0.6
  interface_clearance_mm: 0.0
  overlap_allowed: false
  gap_allowed_mm: 0.03
  shell_depth_mm: 0.6
  voxel_pitch_mm: 0.2

materials:
  require_same_polymer_family: true
  allowed_family: PETG
  opacity_review_required: true

purge:
  matrix_path: plan/purge-matrix.yaml
  maximum_changes: 16
  maximum_purge_volume_mm3: 5000
  permit_flush_into_infill: false
  light_wall_show_through_review: true

acceptance:
  all_color_parts_manifold: true
  preserve_common_coordinate_frame: true
  final_slicer_slot_mapping_reviewed: false
  final_slicer_preview_reviewed: false
  color_boundary_coupon_required: true
  maximum_mean_delta_e: 18.0
  maximum_p95_delta_e: 35.0
