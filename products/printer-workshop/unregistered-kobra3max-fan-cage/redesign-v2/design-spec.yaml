requirements_trace:
  user_stated:
    - "Den vorhandenen Fan Cage / Printhead Cover prüfen."
    - "Die fünf lokalen Beispiele im Ordner research/third-party/printer-workshop/printhead_cover zur Maß- und Aufbauanalyse verwenden."
    - "Das eigene Printhead Cover neu und mit dem eigenen Logo erstellen."
    - "Lizenzprobleme für eine spätere kommerzielle Nutzung vermeiden."
  inferred:
    - "Der Produktordner und die bisherigen Entwürfe benennen Kobra 3 Max als Zielgerät."
    - "Das bisherige runde Fan-Cage-Konzept soll durch eine vollständige Frontabdeckung ersetzt werden."
    - "Als maßgebliches Markenasset gilt das zentrale metriMade-Vektorasset im Repository."
    - "Geplant sind sowohl digitale Modelldateien als auch physische Verkäufe; DE/EU ist vorläufiger Prüfbereich."
  recommended:
    - "Keine Dreiecke, Flächen, Logos, Figuren oder Schriften aus den fünf Fremdmodellen in das Produkt übernehmen."
    - "Den nachweislich unter CC BY 4.0 veröffentlichten Kobra-3-Grundkörper nur als bemaßte technische Referenz verwenden und konservativ trotzdem attribuieren."
    - "Die neue Hülle vollständig parametrisch in CadQuery konstruieren; STEP ist der geometrische Master, STL/3MF sind abgeleitete DRAFT-Exporte."
    - "Für einen Max-Entwurf die reale Max-Schnittstelle mit Messschieber oder kalibrierten Fotos erfassen, bevor Clips oder Vollhülle modelliert werden."
    - "PETG mit 0,4-mm-Düse als Startprozess; sichtbare Logo-Inlays optional vierfarbig, zusätzlich ein einfarbiger Export."
    - "Fremde Marken nur sachlich in der Kompatibilitätsangabe nennen; kein Anycubic-Logo und keine Franchise-Motive auf dem Produkt."
  unresolved:
    - id: "Q-TARGET"
      question: "Zielgerät Kobra 3 Max/Max Combo oder Kobra 3/Combo?"
      recommendation: "Kobra 3 Max/Max Combo beibehalten, wenn der Produktordner korrekt ist; dann die 61,2 × 81,0-mm-Referenz nicht als Passmaß verwenden."
      tradeoff: "Ein zusätzlicher Messschritt verhindert einen konstruktiv sauberen, aber unpassenden Deckel."
    - id: "Q-MAX-MEASUREMENTS"
      question: "Welche realen Außen-, Tiefen- und Clipmaße besitzt die Originalabdeckung des Zielgeräts?"
      recommendation: "Originalabdeckung mit Messschieber vermessen und Front/Rückseite/Seitenprofil mit Maßstab fotografieren."
      tradeoff: "Kurzer manueller Aufwand gegen belastbare Passung und wesentlich geringeres Reklamationsrisiko."

function:
  summary: >-
    Vollständige, reversible Printhead-Frontabdeckung mit eigener metriMade-Gestaltung.
    Sie schützt und verkleidet den Druckkopf, bleibt wartbar und darf Lüfter, Sensoren,
    Kabel, Hotend, Werkzeugwechsel oder Achsbewegung nicht beeinträchtigen.
  intended_user: "Betreiber des bestätigten Anycubic-Zielmodells"
  included:
    - "eigenständig modellierte sichtbare Hülle"
    - "parametrische, couponfähige Rast-/Clip-Schnittstelle"
    - "metriMade-Bildmarke aus dem autorisierten Repository-Asset"
    - "einfarbige und optional vierfarbige Druckausgabe"
    - "Passcoupon vor Vollteil"
  excluded:
    - "keine Übernahme fremder Mesh-Geometrie"
    - "keine Bambu-, Anycubic-, Mandalorian-, Star-Wars- oder sonstigen Fremdlogos/-figuren"
    - "keine Aussage, dass Kobra 3 und Kobra 3 Max dieselbe Abdeckung verwenden"
    - "kein Drucker-Upload und kein Druckstart"

