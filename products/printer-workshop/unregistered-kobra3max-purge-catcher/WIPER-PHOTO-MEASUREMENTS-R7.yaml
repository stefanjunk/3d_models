visual_observations:
  - "Zwei Innensechskant-Schrauben liegen vertikal übereinander und sind von der sichtbaren Seite zugänglich."
  - "Die Schraubenköpfe sitzen auf einer schmalen schwarzen, mitfahrenden Halterung; Gewinde, Kopfmaße, Schraubenlänge und Bauteildicke sind aus den Fotos nicht belastbar bestimmbar."
  - "Purge-Ablage/Abstreifbereich liegt unterhalb und seitlich der Schrauben; ein dünner direkter Adapter kann näher am Maschinendatum bleiben als ein gehäuseumgreifender Clip."
  - "Unmittelbar hinter und neben der Schraubenebene befinden sich Wiper-/Führungsbauteile; tiefe rückwärtige Haken oder ein langer vertikaler Serviceweg sind kollisionskritisch."
  - "Die Fotos zeigen nur einen statischen Zustand und belegen weder die vollständige X/Y/Z-Hüllkurve noch die dynamische Purge-Flugbahn."

