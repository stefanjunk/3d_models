acceptance:
  - id: no-wiper-service-interface
    criterion: "Installation, Entleerung und normale Reinigung lösen oder belasten keine Wiper-Schraube und greifen nicht klemmend am Wipergehäuse an."
    method: "Montageablauf- und Lastpfadprüfung am realen Drucker"
  - id: one-datum-chain
    criterion: "Fangkopf und Innenbehälter werden vom selben Dock positioniert; der Behälter kann nicht in einer plausiblen, aber fehlausgerichteten Endlage eingesetzt werden."
    method: "CAD-Interfaceprüfung plus fünf Neuaufstellungen und zehn Behälterzyklen"
  - id: repeatable-registration
    criterion: "Nach fünf vollständigen Neuaufstellungen liegt die Fangöffnung jeweils innerhalb ±1,5 mm ihrer freigegebenen X/Y/Z-Lage."
    method: "Registrierungslehre und Messschieber; Messmethode/Unsicherheit dokumentieren"
  - id: stability
    criterion: "Das leere und das freigegebene Füllszenario kippen bei 3 N horizontaler Last am Fangkopf nicht und verschieben sich nach Entlastung höchstens 2 mm."
    method: "Federwaage/Kraftmessung auf realer Stellfläche; keine universelle Belastbarkeitsangabe"
  - id: machine-clearance
    criterion: "Bett, Kopf, Kabel und Wiper bleiben über den vollständigen stromlosen Bewegungsbereich kollisionsfrei; Zielreserve mindestens 5 mm, Abweichungen nur mit menschlicher Freigabe."
    method: "Keep-out-Lehre und manueller Vollwegtest"
  - id: capture-function
    criterion: "Mindestens drei beaufsichtigte Purge-Zyklen werden vollständig gefangen und alle Teile erreichen den Innenbehälter ohne Rückstau."
    method: "physischer Funktionstest"
  - id: independent-rights
    criterion: "Kein Drittanbieter-Mesh, keine Kontur, kein Maß, kein Clip-/Hakenprofil und keine Drittanbieter-Projektmetadaten sind in Quelle oder Export enthalten."
    method: "Provenienz-, Diff- und Paketprüfung"

