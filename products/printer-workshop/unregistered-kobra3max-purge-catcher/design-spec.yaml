requirements_trace:
  user_stated:
    - "Der vorhandene Purge-Catcher-Körper ist gut."
    - "Montage, Aufstellung und physisches Interface des vorhandenen Entwurfs sind nicht gut und sollen grundlegend anders gelöst werden."
    - "Die Modelle in research/third-party/printer-workshop dürfen als Beispiele betrachtet, aber wegen Lizenzrisiken nicht kopiert werden."
  inferred:
    - "Die R6-Fangfunktion nahe am Wiper, die offene Fallstrecke, die glatte Wabenstruktur und die metriMade-Gestaltung sollen grundsätzlich erhalten bleiben."
    - "Die Lösung soll ohne Eingriff in die Einstellung oder Befestigung des Purge-Wipers montierbar und wartbar sein."
    - "Fangkopf und Sammelbehälter sollen nicht länger als zwei unabhängig auszurichtende Objekte funktionieren."
    - "Das Maschineninterface ist normal-funktional, aber wegen möglicher Kollision mit Bett, Kopf, Kabeln und Wiper physisch zu qualifizieren."
  recommended:
    - "R7 wird als freistehender, am unbewegten Druckerchassis nur weich registrierter Dock-Tower ausgelegt; der Wiper trägt keine Zubehörlast."
    - "Eine breite Dockbasis trägt eine schlanke Rückensäule und den R6-Fangkopf; ein separat entnehmbarer Innenbehälter wird von derselben Basis positioniert."
    - "Drei weiche, austauschbare Anschläge bilden eine überbestimmungsarme 3-Punkt-Registrierung an zwei stationären Chassisflächen, ohne Klemmen oder Verschrauben."
    - "Die Erstjustage erfolgt außerhalb des Wipers über eine parametrierte X/Z-Verstellung mit handelsüblichen M4-Schrauben und Heat-Set-Inserts; im täglichen Betrieb bleibt sie unangetastet."
    - "Der Sammelbehälter wird zum Entleeren horizontal vom Drucker weg entnommen; weder Fangkopf noch Maschinenhardware müssen gelöst werden."
    - "Der R6-Schraubadapter, seine vertikale Schwalbenschwanzführung und der lose freistehende R6-Unterbehälter entfallen."
  unresolved_consequential:
    - id: DEC-R7-01
      question: "Soll jede Befestigung am Wiper einschließlich vorhandener Schrauben und aufgeschnappter Clips ausgeschlossen werden?"
      recommendation: "Ja; nur weiche, lastfreie Registrierung an einem stationären Chassisteil zulassen."
      tradeoff: "Mehr Standfläche und eine Rückensäule gegen deutlich geringeres Risiko für Wiper-Ausrichtung, Schraubeneingriff und Wartung."
      default_if_approved: "Kein Wiper-Schraub-, Klemm- oder Clipinterface."
    - id: DEC-R7-02
      question: "Darf der Unterbehälter Teil eines gemeinsamen Docks werden, solange der eigentliche Innenbehälter werkzeuglos entnehmbar bleibt?"
      recommendation: "Ja; gemeinsamer Datumspfad für Fangkopf und Behälter, aber separater herausziehbarer Innenbehälter."
      tradeoff: "Ein zusätzliches Dockteil gegen reproduzierbare Ausrichtung und einfacheres Entleeren."
      default_if_approved: "Dockbasis plus entnehmbarer Innenbehälter."
    - id: DEC-R7-03
      question: "Ist eine einmalige X/Z-Justage mit zwei M4-Verbindungen akzeptabel?"
      recommendation: "Ja; sie fängt unbekannte Maschinenmaße ab, ohne tägliche Bedienung oder Wiper-Hardware zu belasten."
      tradeoff: "Zwei Kaufteile und ein Einstellschritt gegen einen riskanten festen Bildmaß-Entwurf."
      default_if_approved: "M4-Hybridjustage mit separatem Maß-/Kollisionscoupon."

function:
  summary: >
    Ein kurzer Fangkopf fängt federnd ausgeworfene Filamentreste direkt am
    Purge-Wiper ab und leitet sie über eine offene, vollständig vom Dock
    ausgerichtete Fallstrecke in einen entnehmbaren Sammelbehälter.
  intended_user: "Betreiber eines Anycubic Kobra 3 Max"
  included:
    - "R6-Fangkopf als gestalterische und funktionale Ausgangsbasis"
    - "freistehende Dockbasis mit rutschhemmenden Füßen"
    - "schlanke, versteifte Tragsäule außerhalb des Bewegungsraums"
    - "lastfreie 3-Punkt-Registrierung am stationären Druckerchassis"
    - "einmalig einstellbare Fangkopfposition"
    - "werkzeuglos entnehmbarer Innenbehälter"
    - "Maß-, Registrierungs- und Kollisionscoupons vor dem Vollsatz"
  excluded:
    - "keine Schrauben, Clips oder Formabnahmen am Purge-Wiper"
    - "keine Magnete ohne verifizierte Chassiswerkstoffe und Elektronikabstände"
    - "keine Übernahme, Nachzeichnung oder Skalierung fremder Meshes, Konturen, Lochbilder oder Maße"
    - "kein Drucker-Upload und kein Druckstart"

geometry:
  coordinate_system:
    x: "+X vom Wiper in Richtung Prallwand"
    y: "+Y zur Bediener-/Druckerfront"
    z: "+Z nach oben"
  protected_baseline_features:
    - "Fangbereich nominell 62 x 44 mm"
    - "offene Fallstrecke nominell 57 x 39 mm"
    - "62 mm hohe Prallwand mit 12 mm Fanghaube"
    - "geschlossener oberer Schlagraum und glatte offene Waben darunter"
    - "vollständige metriMade-Lockups auf den drei sichtbaren Seiten"
  permitted_changes:
    - "Entfernung des R6-Schwalbenschwanzempfängers auf der Maschinenseite"
    - "lokale, eigene Verbindung zwischen Fangkopf und Dockträger"
    - "lokale Rippen und Lastpfade außerhalb von Einflug, Fallöffnung, Logos und Waben"
  planned_architecture:
    dock_base: "breite, tiefe Standfläche mit vier rutschhemmenden Füßen und Aufnahme für den Innenbehälter"
    registration: "drei austauschbare weiche Kontaktpunkte gegen zwei stationäre Chassis-Datumsflächen; keine Klemmkraft"
    mast: "kasten- oder U-förmiger Leichtbauquerschnitt mit Rippen; außerhalb aller Maschinen-Keep-outs"
    head_adjustment: "einmalige X/Z-Einstellung mit zwei M4-Klemmstellen; kein Spiel im täglichen Betrieb"
    bin_service: "horizontaler Auszug vom Drucker weg mit eindeutiger Endlage und Griff"
  unresolved_measurements:
    - "Tisch-zu-Wiper-Höhe am realen Drucker"
    - "Abstand und Orientierung geeigneter stationärer Chassisflächen zur Purge-Flugbahn"
    - "verfügbarer horizontaler Auszugsweg für den Innenbehälter"
    - "vollständige Bett-, Kopf-, Kabel- und Wiper-Keep-outs"

