risk:
  class: normal-functional
  hazards:
    - "Kollision mit bewegtem Bett, Werkzeugkopf, Kabeln oder Wiper"
    - "zu hohe bewegte Masse oder zu großer Hebelarm am Wiper"
    - "unzureichender Gewindeeingriff oder veränderte Wiper-Ausrichtung durch falsche Schraubenlänge"
    - "lokales Ausbrechen oder Kriechen der direkt gedruckten Schraubenzone"
    - "Purge trifft außerhalb des freien Falls oder bleibt an Waben-/Logo-Innenkanten hängen"
    - "heiße oder fadenförmige Purge-Reste außerhalb des Fangwegs"
  mitigations:
    - "bewegte Zielmasse höchstens 25 g und Schwerpunkt so dicht wie möglich an der Schraubenebene"
    - "Realmaß, Lochbildlehre und Schraubenlängen-/Gewindeeingriff-Nachweis vor einem Vollteil"
    - "durchgehende massive Schraubenpads mit lokalen Rippen; keine Waben oder Logo-Ausschnitte im Lastpfad"
    - "billige Lochbild-, Umriss-, Keep-out- und Flugbahn-Coupons vor dem Vollmodell"
    - "vollständige manuelle Maschinenbewegung und beaufsichtigte Purge-Zyklen bei niedriger, mittlerer und hoher Z-Position"

acceptance:
  - id: moving-source-frame
    criterion: "Fangöffnung und Abwärts-Umlenker bleiben über den gesamten freigegebenen Z-Weg starr im Bezugssystem des Purge-Wipers; kein stationärer Fang-Tower ist erforderlich."
    method: "CAD-Datumprüfung plus manueller Test an niedriger, mittlerer und hoher Z-Position"
  - id: measured-wiper-fasteners
    criterion: "Der gemessene vertikale Lochabstand von 17 mm sowie Schraubenkopf, Gewinde, Bauteildicke, Schraubenlänge und verbleibender Gewindeeingriff sind am realen Drucker dokumentiert; der Coupon sitzt ohne Verspannen oder Verändern der Wiper-Lage."
    method: "Messschieber, Schraubenidentifikation, Lochbild-/Dickenlehre und Vorher-Nachher-Datumsprüfung"
  - id: moving-mass
    criterion: "Der einteilige bodenlose Umlenker wiegt höchstens 25 g; die Masse wird als Projektwert und nicht als freigegebene Maschinenlast ausgewiesen."
    method: "CAD-Massenschätzung mit dokumentierter Dichte, danach Waage am gedruckten Satz"
  - id: direct-fixed-mount
    criterion: "Beide Schrauben gehen direkt durch den einteiligen Umlenkerkörper; es existiert kein separates Adapter-, Clip-, Schlitten- oder Rastinterface. Der montierte Körper lässt sich nur nach vollständigem Lösen beider Schrauben abnehmen."
    method: "CAD-Bauteil-/Schnittprüfung, BOM-Prüfung und Montageversuch am stromlosen Drucker"
  - id: open-downward-flow
    criterion: "Zwischen Trefferzone und vollständig bodenlosem Auslass gibt es keine purgetragende horizontale Tasche, Klappe, Hinterschneidung oder lange Leitung; Teststücke fallen ohne manuelles Nachhelfen aus."
    method: "CAD-Schnitt und physischer Brücken-/Ablagetest mit repräsentativen Purge-Stücken"
  - id: honeycomb-logo
    criterion: "Die sichtbaren Seitenwände besitzen offene Wabenfelder; das eigene Logo liegt mittig auf einer zusammenhängenden massiven Insel der sichtbaren Hauptwand und schwächt weder Schraubenlastpfad noch freien Purge-Weg."
    method: "CAD-Flächen-/Schwerpunktprüfung, Mesh-Audit, Slicer-Vorschau und menschliche Erscheinungsfreigabe"
  - id: machine-clearance
    criterion: "Bett, Kopf, Kabel, Wiper und Z-Rider bleiben über den vollständigen stromlosen X/Y/Z-Bewegungsbereich kollisionsfrei; Zielreserve mindestens 5 mm, Abweichungen nur mit menschlicher Freigabe."
    method: "Keep-out-Lehre und manueller Vollwegtest mit montierter bewegter Baugruppe"
  - id: capture-function
    criterion: "Je mindestens drei beaufsichtigte Purge-Zyklen bei niedriger, mittlerer und hoher Z-Position werden lokal gefangen und verlassen den bodenlosen Auslass ohne Rückstau."
    method: "neun physische Funktionszyklen mit markierter Fallbahn und dokumentierter Z-Position"
  - id: independent-rights
    criterion: "Kein Drittanbieter-Mesh, keine Kontur, kein Maß, kein Clip-/Hakenprofil und keine Drittanbieter-Projektmetadaten sind in Quelle oder Export enthalten."
    method: "Provenienz-, Diff- und Paketprüfung"

