requirements_trace:
  user_stated:
    - "Der vorhandene Purge-Catcher-Körper ist gut."
    - "Montage, Aufstellung und physisches Interface des vorhandenen Entwurfs sind nicht gut und sollen grundlegend anders gelöst werden."
    - "Die Modelle in research/third-party/printer-workshop dürfen als Beispiele betrachtet, aber wegen Lizenzrisiken nicht kopiert werden."
    - "Der Purge-Wiper fährt während des Drucks entlang der Z-Achse nach oben; Purge kann daher auch in größerer Z-Höhe ausgeworfen werden."
    - "Bevorzugt wird ein Fangkorb mit direkter Umlenkung nach unten am mitfahrenden Wiper statt eines Towers über die gesamte Z-Achse."
    - "Am realen Drucker wurden 17 mm Mitte-Mitte-Abstand der vertikal angeordneten Wiper-Schrauben gemessen."
    - "Von der unteren Schraube bis zur Purge-Ablageebene wurden 10 mm gemessen."
    - "Vom Schraubendatum bis zur horizontalen Purge-Wurfbahn wurden 37 mm und von der Schraubenebene horizontal nach hinten bis zur Wiper-Ausdehnung 40 mm angegeben."
    - "Sechs Fotos in Photos-1-001 dokumentieren Wiper, Schrauben und angelegte Maßstäbe."
    - "R7-DRAFT-2 wird trotz plausibler Maßgrafik nicht an den realen Drucker passen."
    - "Die Drittanbieterdatei research/third-party/printer-workshop/Anycubic_Kobra_3_Max_Poop_catcher.3mf würde nach Benutzerbewertung perfekt passen."
    - "Das Drittanbieterbeispiel darf nicht als Geometrie- oder Maßquelle verwendet werden."
    - "Unser Umlenker soll dieselben realen Maschinenschnittstellen nutzen: die beiden vorhandenen Wiper-Schrauben."
    - "Die beiden Schraublöcher werden direkt in den Umlenker konstruiert; der Umlenker wird fest verschraubt."
    - "Clip, Adapterplatte und jeder abnehmbare Schnellverschluss entfallen."
    - "Der Umlenker erhält keinen Boden, damit Purge unmittelbar nach unten fällt."
    - "Die offenen Wabenwände bleiben erhalten und das eigene Logo sitzt mittig auf der sichtbaren Wabenwand."
    - "Vor dem Produktions-CAD soll zunächst eine bemaßte Zeichnung erstellt werden."
  inferred:
    - "Die R6-Fangfunktion nahe am Wiper, die offene Fallstrecke, die glatte Wabenstruktur und die metriMade-Gestaltung sollen grundsätzlich erhalten bleiben."
    - "Der lokale Fangkopf muss dasselbe bewegte Z-Bezugssystem wie der Purge-Wiper besitzen; eine stationäre Fangöffnung an nur einer Z-Höhe ist ungeeignet."
    - "Die mitbewegte Baugruppe fängt nur und lenkt nach unten um; sie besitzt keinen integrierten Speicherboden."
    - "Das direkte Wiper-Interface ist normal-funktional, aber wegen bewegter Masse, Schraubeneingriff, Bett-, Kopf-, Kabel- und Wiper-Kollision physisch zu qualifizieren."
    - "Die direkte Schraubenzone wird als lokale massive Rippe/Lasche Bestandteil derselben Druckgeometrie wie der Umlenker."
    - "Ein separater stationärer Behälter darf unterhalb stehen, gehört aber nicht zur aktuellen Umlenker-Geometrie."
  recommended:
    - "R7 wird als leichter, direkt am Wiper befestigter Z-Rider ausgelegt, der der Purge-Quelle über den vollständigen Z-Weg folgt."
    - "Der weitgehend erhaltene R6-Fangkopf leitet Purge unmittelbar über einen glatten, offenen Auslass nach unten; es gibt keinen Tower, Schlauch oder Führungskanal über die volle Z-Höhe."
    - "Eine lokale massive Schraubenzone im Umlenker nutzt das unabhängig mit 17 mm Mitte-Mitte-Abstand gemessene Wiper-Schraubenpaar; ein Rundloch plus ein kurzes toleranzausgleichendes Sekundärloch wird nach bestätigtem Schraubenmaß bevorzugt."
    - "Die bewegte Baugruppe soll einschließlich Adapter höchstens 25 g wiegen; der Schwerpunkt bleibt möglichst dicht an Schraubenebene und Wiper. Dieser Wert ist ein vorläufiges Projektziel, keine zulässige Maschinenlast."
    - "Der untere Querschnitt bleibt vollständig offen; ein beliebiger separater Behälter kann darunter stehen, ohne mechanisches Interface zum Umlenker."
    - "Der freistehende Dock-Tower und die vertikale R6-Schwalbenschwanzführung entfallen."
    - "Vor neuer Vollgeometrie zuerst eine eigene 17-mm-Lochbild- und konservative Umrisslehre aus Benutzermessungen und Maschinenfotos ableiten; Gewinde, Kopf und Schraubenlänge am realen Drucker erfassen; keine Fremdkontur oder Fremdmaße verwenden."
  previous_requirements_decisions:
    - id: DEC-R7-01
      question: "Darf eine minimale Datumplatte mit dem vorhandenen, vertikal 17 mm beabstandeten Wiper-Schraubenpaar befestigt werden, sobald Kopfmaß, Schraubenlänge und Gewindeeingriff ergänzt wurden?"
      recommendation: "Ja; die nun gemessene Schraubenlage als eindeutiges Bewegungsdatum nutzen und die reale Schraubenlänge nur nach Messcoupon festlegen."
      tradeoff: "Einmalige Arbeit an zwei Maschinenverschraubungen gegen die leichteste, steifste und in jeder Z-Höhe korrekt ausgerichtete Lösung."
      default_if_approved: "Vermessene Zwei-Schrauben-Datumplatte; keine blind angenommene R6-Lochgeometrie."
      selected: "Vermessene Zwei-Schrauben-Datumplatte; Schraubendetails bleiben Couponpflicht."
    - id: DEC-R7-02
      question: "Soll der Fangkopf von der festen Datumplatte mit einem sehr kurzen seitlichen bzw. schwenkenden Schnellverschluss lösbar sein?"
      recommendation: "Ja; zweipunktig geführt, formschlüssig gegen Schwerkraft und mit positiver Rastung, ohne den langen vertikalen R6-Serviceweg."
      tradeoff: "Ein kleines zusätzliches Interface und ein Passcoupon gegen einfachere Reinigung ohne erneutes Lösen der Wiper-Schrauben."
      default_if_approved: "Kurzhub-Schnellverschluss; genaue Geometrie erst im freizugebenden Konzept."
      selected: "Kurzhub-Schnellverschluss mit zwei Führungsdatums und positiver Rastung."
    - id: DEC-R7-03
      question: "Darf der große Sammelbehälter stationär unter dem Wiper stehen und anhand der realen Purge-Landeflächen bei niedriger, mittlerer und hoher Z-Position dimensioniert werden?"
      recommendation: "Ja; nur Fangkopf und kurze Umlenkung bewegen, Speichervolumen und Abfallmasse bleiben stationär."
      tradeoff: "Eine etwas größere Boden-Fangfläche gegen sehr geringe bewegte Masse und den vollständigen Verzicht auf Tower oder Schlauch."
      default_if_approved: "Stationärer, werkzeuglos entnehmbarer Unterbehälter mit testbasiertem Einlaufbereich."
      selected: "Stationärer Unterbehälter mit aus Niedrig-/Mittel-/Hoch-Z-Tests abgeleitetem Einlaufbereich."

function:
  summary: >
    Ein einteiliger, bodenloser Umlenker ist mit den beiden vorhandenen
    Wiper-Schrauben fest am bewegten Purge-Wiper verschraubt, fängt
    Filamentreste unmittelbar an der Quelle und lässt sie durch einen freien
    unteren Auslass nach unten fallen.
  intended_user: "Betreiber eines Anycubic Kobra 3 Max"
  included:
    - "R6-Fangkopf als gestalterische und funktionale Ausgangsbasis"
    - "zwei direkt in eine lokale massive Umlenkerzone integrierte Schraublöcher am real vermessenen Wiper-Schraubenpaar"
    - "einteilige, ausschließlich durch Lösen der beiden Maschinenschrauben demontierbare Bauweise"
    - "lokaler, glatter Abwärts-Umlenker ohne Purge-Ablagekante"
    - "vollständig offener unterer Auslass ohne Boden oder Speichervolumen"
    - "offene Wabenwände mit mittig angeordneter eigener metriMade-Kennzeichnung auf der sichtbaren Hauptwand"
    - "Schrauben-/Lochbild-, Umriss-, Kollisions- und Flugbahn-Coupons vor dem Vollteil"
  excluded:
    - "kein stationärer Tower, Mast, Schlauch oder Kanal über die Z-Höhe"
    - "kein mitfahrender Speicherbehälter für angesammelten Purge"
    - "keine separate Datumplatte, kein Clip, kein Schlitten, keine Rastung und kein werkzeugloser Schnellverschluss"
    - "kein Boden und keine Klappe am Umlenker"
    - "keine Magnete ohne verifizierte Chassiswerkstoffe und Elektronikabstände"
    - "keine Übernahme, Nachzeichnung oder Skalierung fremder Meshes, Konturen, Lochbilder oder Maße"
    - "kein Drucker-Upload und kein Druckstart"

