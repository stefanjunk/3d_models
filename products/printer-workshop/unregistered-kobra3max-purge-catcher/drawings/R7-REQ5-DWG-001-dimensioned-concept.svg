  <text x="1475" y="753" text-anchor="middle" class="label" fill="#0369a1">offener Auslass · keine Bodenfläche</text>

  <!-- Notes and title block -->
  <rect x="45" y="792" width="1170" height="330" class="panel"/>
  <text x="68" y="830" class="panel-title">Zeichnungshinweise und Prüfstatus</text>

  <text x="70" y="867" class="note-head">Verbindlich gemessen / übernommen</text>
  <text x="70" y="895" class="label">1 · Schraubenabstand vertikal: 17</text>
  <text x="70" y="923" class="label">2 · untere Schraube bis Purge-Ablageebene: 10</text>
  <text x="70" y="951" class="label">3 · Schraubendatum bis horizontale Purge-Wurfbahn: 37</text>
  <text x="70" y="979" class="label">4 · Schraubenebene bis rückwärtige Wiper-Ausdehnung: 40</text>
  <text x="70" y="1007" class="label">5 · Körper: 62 × 44 × 62; Haube: 12; Öffnung: 57 × 39</text>

  <text x="650" y="867" class="note-head">Vor CAD / Coupon zwingend zu ergänzen</text>
  <text x="650" y="895" class="tbd">A · Gewinde-/Schaft-Ø und Lochspiel</text>
  <text x="650" y="923" class="tbd">B · Kopf-Ø, Kopfhöhe und Werkzeugzugang</text>
  <text x="650" y="951" class="tbd">C · Schraubenlänge, Auflagendicke, Gewindeeingriff</text>
  <text x="650" y="979" class="tbd">D · vollständige Maschine-/Kabel-/Bett-/Rollen-Hüllkurve</text>
  <text x="650" y="1007" class="tbd">E · endgültige Position des 62 × 44 × 62-Fangkörpers</text>

  <line x1="70" y1="1038" x2="1188" y2="1038" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="1067" class="small">RECHTEGRENZE: Die Drittanbieter-3MF ist keine Geometrie-, Kontur- oder Maßquelle. Verwendet werden nur eigene Konstruktion, eigene Fotos und eigene Messungen.</text>
  <text x="70" y="1093" class="small">FREIGABEGRENZE: Dieses Blatt beschreibt Anforderungen und Datumsbeziehungen. Es ist weder Passnachweis noch Fertigungszeichnung und erzeugt keine Druckfreigabe.</text>

