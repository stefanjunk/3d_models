  <text x="748" y="641" class="small" fill="#92400e">Wiper-Ausdehnung</text>
  <text x="900" y="641" class="label">Schraubenauflage</text>
  <text x="900" y="666" class="small">zulässige neue Hülle:</text>
  <text x="900" y="687" class="tbd">TBD per Umrisslehre</text>
  <text x="680" y="746" class="small">Bett, Rollen, Kopf, Kabel und Werkzeugweg sind noch nicht vollständig bemaßt.</text>

  <!-- PANEL C -->
  <rect x="1220" y="130" width="535" height="640" class="panel"/>
  <text x="1243" y="166" class="panel-title">C · Direktverschraubung und Schnitt</text>
  <text x="1243" y="190" class="small">Feste Montage; kein Clip, Adapter, Schlitten oder Verschluss</text>

