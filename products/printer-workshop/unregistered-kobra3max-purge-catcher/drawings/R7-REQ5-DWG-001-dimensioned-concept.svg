  <line x1="150" y1="250" x2="150" y2="205" class="ext"/>
  <line x1="430" y1="250" x2="430" y2="205" class="ext"/>
  <line x1="150" y1="210" x2="430" y2="210" class="dim"/>
  <text x="290" y="203" text-anchor="middle" class="dimtext">62 · Fangbreite</text>

  <line x1="535" y1="270" x2="565" y2="270" class="ext"/>
  <line x1="535" y1="550" x2="565" y2="550" class="ext"/>
  <line x1="555" y1="270" x2="555" y2="550" class="dim"/>
  <text x="575" y="415" transform="rotate(90 575 415)" text-anchor="middle" class="dimtext">62 · Prallwandhöhe</text>

  <line x1="440" y1="270" x2="470" y2="270" class="ext"/>
  <line x1="440" y1="324" x2="470" y2="324" class="ext"/>
  <line x1="460" y1="270" x2="460" y2="324" class="dim"/>
