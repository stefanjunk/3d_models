  <rect x="1465" y="308" width="48" height="58" rx="8" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
  <rect x="1300" y="328" width="177" height="18" rx="9" fill="#64748b" stroke="#334155" stroke-width="3"/>
