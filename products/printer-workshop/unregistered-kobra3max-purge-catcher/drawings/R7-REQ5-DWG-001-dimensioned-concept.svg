  <rect x="0" y="0" width="1800" height="1200" fill="#f8fafc"/>
  <rect x="24" y="22" width="1752" height="1128" fill="#fff" stroke="#0f172a" stroke-width="3"/>

  <text x="52" y="68" class="title">Anycubic Kobra 3 Max · bodenloser Purge-Umlenker</text>
  <text x="52" y="98" class="subtitle">Bemaßtes Konzept- und Datumsprüfblatt · R7 · Anforderungen 0.7.0-requirements.5 · alle Maße in mm</text>
  <rect x="1410" y="42" width="325" height="52" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="1572" y="65" text-anchor="middle" class="note-head" fill="#92400e">NICHT ZUR FERTIGUNG</text>
  <text x="1572" y="86" text-anchor="middle" class="small">Konzept / Messprüfung / TBD offen</text>

  <!-- PANEL A -->
  <rect x="45" y="130" width="590" height="640" class="panel"/>
  <text x="68" y="166" class="panel-title">A · Eigenes Funktionsdesign</text>
  <text x="68" y="190" class="small">Geschützte R6-Fanggeometrie; Maschinenlage noch nicht freigegeben</text>

  <!-- Isometric-ish body -->
  <polygon points="150,270 430,270 514,222 234,222" fill="#c7eee7" stroke="#0f766e" stroke-width="4"/>
  <polygon points="430,270 514,222 514,502 430,550" class="part-dark"/>
  <rect x="150" y="270" width="280" height="280" class="part"/>
  <rect x="155" y="326" width="270" height="218" fill="url(#honey)" stroke="none"/>
  <polygon points="434,325 510,281 510,496 434,539" fill="url(#honey)" stroke="none"/>
  <rect x="150" y="270" width="280" height="54" fill="#99ded2" stroke="#0f766e" stroke-width="4"/>

  <!-- Open bottom -->
  <line x1="150" y1="550" x2="175" y2="550" stroke="#0f766e" stroke-width="4"/>
  <line x1="405" y1="550" x2="430" y2="550" stroke="#0f766e" stroke-width="4"/>
  <line x1="175" y1="550" x2="405" y2="550" stroke="#0284c7" stroke-width="3" stroke-dasharray="9 7"/>
  <path d="M 245 430 C 260 485, 270 535, 270 610" class="flowline"/>
  <path d="M 335 430 C 320 485, 310 535, 310 610" class="flowline"/>
  <text x="290" y="634" text-anchor="middle" class="label" fill="#0369a1">freier Fall · kein Boden</text>

  <!-- Logo island -->
  <rect x="235" y="390" width="112" height="54" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="291" y="413" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#0f766e">metriMade</text>
  <text x="291" y="433" text-anchor="middle" class="tiny">mittig / eigene Marke</text>

  <!-- Integrated mount pad -->
  <path d="M 108 332 L150 312 L150 462 L108 442 Z" fill="#99ded2" stroke="#0f766e" stroke-width="4"/>
  <circle cx="126" cy="352" r="10" fill="#fff" stroke="#0f766e" stroke-width="4"/>
