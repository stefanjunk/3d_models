  <path d="M 1300 590 L1370 590 L1425 665 L1425 716" fill="none" stroke="#0f766e" stroke-width="16" stroke-linejoin="round"/>
  <path d="M 1650 590 L1580 590 L1525 665 L1525 716" fill="none" stroke="#0f766e" stroke-width="16" stroke-linejoin="round"/>
