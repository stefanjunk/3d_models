<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#0284c7"/>
    </marker>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#f59e0b" stroke-width="3" opacity="0.30"/>
    </pattern>
    <pattern id="honey" width="42" height="36.4" patternUnits="userSpaceOnUse">
      <path d="M10.5 0 L31.5 0 L42 18.2 L31.5 36.4 L10.5 36.4 L0 18.2 Z"
            fill="none" stroke="#0f766e" stroke-width="3" opacity="0.72"/>
    </pattern>
    <style>
      .title { font: 700 32px 'DejaVu Sans', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px 'DejaVu Sans', sans-serif; fill: #475569; }
      .panel-title { font: 700 21px 'DejaVu Sans', sans-serif; fill: #0f172a; }
      .label { font: 500 16px 'DejaVu Sans', sans-serif; fill: #1e293b; }
      .small { font: 400 14px 'DejaVu Sans', sans-serif; fill: #475569; }
      .tiny { font: 400 12px 'DejaVu Sans', sans-serif; fill: #475569; }
      .dimtext { font: 700 17px 'DejaVu Sans', sans-serif; fill: #92400e; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .tbd { font: 700 16px 'DejaVu Sans', sans-serif; fill: #b91c1c; }
      .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .part { fill: #d7f3ee; stroke: #0f766e; stroke-width: 4; }
      .part-dark { fill: #99ded2; stroke: #0f766e; stroke-width: 4; }
      .host { fill: #dbe4ea; stroke: #475569; stroke-width: 4; }
      .unknown { fill: #fff7ed; fill-opacity: 0.48; stroke: #b91c1c; stroke-width: 3; stroke-dasharray: 10 7; }
      .datum { stroke: #0e7490; stroke-width: 3; stroke-dasharray: 10 7; }
      .centerline { stroke: #64748b; stroke-width: 2; stroke-dasharray: 12 8 2 8; }
      .dim { stroke: #b45309; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .ext { stroke: #b45309; stroke-width: 1.5; }
      .leader { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flowline { stroke: #0284c7; stroke-width: 5; fill: none; marker-end: url(#flow); }
      .note-head { font: 700 16px 'DejaVu Sans', sans-serif; fill: #0f172a; }
