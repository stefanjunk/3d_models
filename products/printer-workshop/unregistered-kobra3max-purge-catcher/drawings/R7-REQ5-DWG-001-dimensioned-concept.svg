  <text x="1590" y="276" class="tbd">Kopfhöhe TBD</text>
  <path d="M 1390 344 L1575 386" class="leader"/>
  <text x="1585" y="388" class="tbd">Loch-Ø TBD</text>
  <line x1="1370" y1="455" x2="1465" y2="455" class="dim"/>
  <text x="1417" y="448" text-anchor="middle" class="tbd">Auflage t = TBD</text>
  <text x="1248" y="482" class="tbd">Schraubenlänge: TBD</text>
  <text x="1248" y="505" class="tbd">verbleibender Gewindeeingriff: TBD</text>
  <text x="1248" y="529" class="small">Demontage nur durch vollständiges Lösen beider Schrauben.</text>

  <!-- Bottomless section -->
