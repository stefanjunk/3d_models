  <text x="70" y="678" class="note-head">Weitere geschützte Funktionsmaße</text>
  <text x="70" y="703" class="label">Tiefe außen: 44</text>
  <text x="265" y="703" class="label">freie Fallöffnung: 57 × 39</text>
  <text x="70" y="731" class="small">Waben-/Logomaße und Wandstärken: nach Konzept- und Couponfreigabe.</text>
  <text x="70" y="753" class="small">Ansicht formbeschreibend; Maßlinien sind die verbindliche Information.</text>

  <!-- PANEL B -->
  <rect x="655" y="130" width="545" height="640" class="panel"/>
  <text x="678" y="166" class="panel-title">B · Eigene Maschinendatums</text>
  <text x="678" y="190" class="small">Nur Benutzermaße; keine Fremdgeometrie oder Fremdmaße</text>

