schema_version: "1.1"
job: purge-catcher-stacked-lockup-three-sides-five-material
source_svg: evidence/metrimade-lockup-stacked-color.svg
source_preservation: full viewBox and original path transforms/order/colors; uniform scale only
input_3mf: models/3mf/metriMade-purge-catcher-3sides-5material-core.3mf
fallback_stl_parts:
  - models/stl/catcher-body-white-honeycomb.stl
  - models/stl/catcher-logo-navy-3sides.stl
  - models/stl/catcher-logo-teal-3sides.stl
  - models/stl/catcher-logo-aqua-3sides.stl
  - models/stl/catcher-logo-sand-3sides.stl
registration:
  coordinate_frame: catcher installed coordinates
  transform_for_all_parts: identity
  faces: [-Y front, -X left, +X display/right]
  outward_view: upright and non-mirrored on every face
  tolerance_mm: 0.0
palette: plan/filament-palette.yaml
strategy: direct per-triangle core-3MF base-material assignment; no component hierarchy
fallback_import: Import all five aligned STL files together as one object with multiple parts, then assign white/navy/teal/aqua/sand.
slicer_checks:
  - three complete stacked lockups are visible and not mirrored
  - symbol and wordmark retain their supplied spacing and relative positions
  - one aligned catcher is shown, not five auto-arranged objects
  - side honeycomb ribs remain fused to the continuous containment skin
  - opposite impact wall and inward hood remain fully solid
  - lower outlet and upper intake remain open
  - both vertical slots are open through the mounting plate
  - purge tower and waste estimate are acceptable before export
status: CONDITIONAL_UNTIL_DESTINATION_SLICER_AND_PHYSICAL_COUPON
