  language: de
  verbatim: "schaue dir unsere purge cathcer an. und schau mal hier /home/stefan/Projekte/3d_models/research/third-party/printer-workshop da sind einige beispiele wie so ein purge cathcer montuiert oder aufgestellt werden kann. unser purge cathcer design ist gut, aber die montage/ aufstellung /physisches interface ist nicht gut. überlege dir etwas anderes. nutze die beispiele aber kopiere nicht, damit wir keine lizenz probleme bekommen"
