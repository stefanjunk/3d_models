analysis:
  observed_problem:
    - "Wiper-Schrauben tragen die Zubehörlast und müssen für die Erstmontage angefasst werden."
    - "Die Entnahmerichtung der Schwalbenschwanzführung liegt vertikal in Maschinennähe."
    - "Fangkopf und Unterbehälter besitzen keine gemeinsame Datumskette."
    - "Die Purge-Quelle bewegt sich mit dem Wiper entlang Z; der vorgeschlagene stationäre Dock-Tower besaß nur eine feste Fanghöhe."
    - "Die Fotos zeigen ein zugängliches vertikales Zwei-Schrauben-Datum mit 17 mm Mitte-Mitte-Abstand und unmittelbar benachbarte Wiper-/Führungsgeometrie."
    - "Alle realen Pass-, Kollisions- und Fangtests sind offen."
    - "R7-DRAFT-2 bildete die reale Wiper-Schale, Metallablage, Rollen, Kabel-, Bett- und Montagehüllkurve nicht ab und wurde vom Benutzer als nicht passend verworfen."
  preferred_response: "leichter, direkt am Wiper mitfahrender Fangkopf mit kurzer offener Abwärtsumlenkung und stationärem Unterbehälter"
  status: "requirements changes-requested after R7-DRAFT-2 external-fit rejection"
  causal_hypothesis: >
    Der erste R7-Vorschlag schlug die Fangfunktion fälschlich dem stationären
    Druckerbezugssystem zu. Da die Purge-Quelle zusammen mit dem Wiper entlang Z
    verfährt, muss der lokale Fangkopf im bewegten Wiper-Bezugssystem liegen;
    nur die nachgelagerte Speicherkapazität kann stationär bleiben.
  alternatives:
    - "Die Firmware könnte Purge trotz Wiper-Z-Bewegung nur an wenigen festen Höhen anfordern; das wird ohne Maschinen-/G-Code-Evidenz nicht vorausgesetzt."
    - "Ein flexibler Schlauch oder vollständiger Z-Kanal könnte alle Höhen abdecken, würde aber Masse, Widerstand, Kollisionsfläche und Wartungsaufwand erhöhen und widerspricht der Präferenz."
    - "Ein direkt aufgeschnapptes Interface könnte leichter als eine Schrauben-Datumplatte sein, benötigt aber ein vollständig vermessenes Gehäuseprofil und qualifizierte Montagekräfte."
    - "Ein einteilig verschraubter Fangkopf wäre leichter als ein Schnellverschluss, erschwert jedoch Reinigung und wiederholtes Lösen kann die Wiper-Lage beeinflussen."
