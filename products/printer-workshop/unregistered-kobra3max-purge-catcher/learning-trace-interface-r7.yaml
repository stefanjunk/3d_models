rejected_intermediate_proposal:
  revision: 0.7.0-requirements.1
  proposal: "freistehender, weich am stationären Chassis registrierter Dock-Tower mit entnehmbarem Innenbehälter"
  status: rejected-by-follow-up-correction
  reason: "Der stationäre Fangkopf folgt der entlang Z bewegten Purge-Quelle nicht; ein Tower über die volle Z-Höhe ist unerwünscht."
follow_up_correction:
  language: de
  verbatim: "der purge wiper läuft entlang der z achse nach oben, wenn weiter ob die farbegewechselt wird, dann wird dort auch purge ausgeworfen. deshalb wäre mir ein fang korb mit umleitung nach unten direkt am wiper lieber, anstatt einen tower, der die ganze z achse abdeckt"
  normalized:
    - "Der Purge-Wiper und die Auswurfquelle bewegen sich während des Drucks entlang Z."
    - "Purge tritt auch bei höheren Z-Positionen auf."
    - "Der Fangkorb soll direkt am Wiper mitfahren und lokal nach unten umlenken."
    - "Ein Tower über die gesamte Z-Achse ist nicht gewünscht."
  measurement_offer:
    verbatim: "ich kann dir den abstand zwischen den schrauben vermessen"
    status: fulfilled-in-next-user-message
  accepted_result: null
physical_measurement_follow_up:
  language: de
  verbatim: "es gibt im purge catcher folder einen folder photos-1-001 mit foto des purge wiper und der schrauben. zwischen den schrauben sind 17mm, von der unteren schraube bis zur ebene wo das purge drauf extrudiert wird sind es 10mm. von den schrauben bis zur horizontalen ebene wo entlange der purge geschleudert wird, sind es 37mm. von der ebene der schraube, horizintal nach hinten zum purge wiper sind es 40mm. schaue dir die fotos an"
  normalized:
    - "vertikaler Schraubenabstand Mitte-Mitte: 17 mm"
    - "untere Schraube bis Purge-Ablageebene: 10 mm"
    - "Schraubendatum bis horizontale Purge-Wurfbahn: 37 mm"
