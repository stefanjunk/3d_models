product: Anycubic Kobra 3 Max Purge Catcher — Interface Neuentwurf
intended_use: Ein leichter Fangkopf fährt direkt mit dem Purge-Wiper entlang Z, fängt Filamentreste unmittelbar
  an der Quelle und lenkt sie ohne langen Kanal nach unten in einen stationären, entnehmbaren Sammelbehälter.
user_context: Betreiber eines Anycubic Kobra 3 Max; die konkrete Maschine ist durch eigene Fotos und Benutzermessungen
  dokumentiert, Serien-/Revisionskennung und vollständige Maschinenhüllkurve bleiben unbekannt.
