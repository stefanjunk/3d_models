<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fb"/>
      <stop offset="1" stop-color="#e8eef2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#18313d" flood-opacity="0.14"/>
    </filter>
    <g id="mark">
      <path d="M8 221C2 213 0 202 0 190V62C0 27 27 0 61 0H157C168 0 177 4 184 11L91 71V174L8 221Z"/>
      <path d="M132 70L195 36V191C195 207 191 217 182 226L132 193V70Z"/>
      <path d="M18 230L92 184L174 231C164 237 154 238 142 238H44C33 238 24 235 18 230Z"/>
    </g>
    <style>
      .title { font: 800 46px Inter, Arial, sans-serif; fill: #132a35; }
      .subtitle { font: 500 22px Inter, Arial, sans-serif; fill: #56707c; }
      .tier { font: 800 27px Inter, Arial, sans-serif; fill: #132a35; letter-spacing: 1px; }
      .detail { font: 500 18px Inter, Arial, sans-serif; fill: #56707c; }
      .measure { font: 700 18px Inter, Arial, sans-serif; fill: #087f8c; }
      .wm-domain { font: 800 32px Inter, Arial, sans-serif; fill: #0d222b; }
      .wm-trace { font: 800 26px Inter, Arial, sans-serif; fill: #0d222b; }
      .wm-small { font: 800 23px Inter, Arial, sans-serif; fill: #0d222b; }
      .flow { font: 800 20px Inter, Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <text x="90" y="82" class="title">metriMade watermark R2</text>
  <text x="90" y="119" class="subtitle">Three purpose-built footprints · no geometry scaling · most-informative fit wins</text>

  <g transform="translate(70 170)" filter="url(#shadow)">
    <rect width="460" height="490" rx="24" fill="#ffffff"/>
    <text x="32" y="52" class="tier">FULL</text>
    <text x="32" y="83" class="detail">Default · complete visible identity</text>
    <rect x="32" y="126" width="396" height="126" rx="14" fill="#edf3f5" stroke="#c4d4da"/>
    <g transform="translate(51 143) scale(.39)" fill="#0d222b"><use href="#mark"/></g>
    <text x="147" y="178" class="wm-domain">metriMade.com</text>
    <text x="147" y="222" class="wm-trace">MM-ORG-001 · v0.1.0</text>
    <line x1="32" y1="280" x2="428" y2="280" stroke="#d6e1e5"/>
    <text x="32" y="318" class="measure">≈ 63.8 × 12.8 mm</text>
    <text x="32" y="356" class="detail">• Existing R1 proportions preserved</text>
    <text x="32" y="388" class="detail">• Domain + product ID + version</text>
    <text x="32" y="420" class="detail">• First choice when it fits safely</text>
    <rect x="32" y="445" width="110" height="28" rx="14" fill="#d7f0f1"/>
    <text x="52" y="465" class="measure">100% area</text>
  </g>

  <g transform="translate(570 170)" filter="url(#shadow)">
    <rect width="460" height="490" rx="24" fill="#ffffff"/>
    <text x="32" y="52" class="tier">COMPACT</text>
    <text x="32" y="83" class="detail">Smaller · complete visible identity</text>
    <rect x="62" y="126" width="336" height="126" rx="14" fill="#edf3f5" stroke="#c4d4da"/>
    <g transform="translate(82 144) scale(.37)" fill="#0d222b"><use href="#mark"/></g>
    <text x="174" y="166" class="wm-small">metriMade.com</text>
    <text x="174" y="201" class="wm-small">MM-ORG-001</text>
    <text x="174" y="235" class="wm-small">v0.1.0</text>
    <line x1="32" y1="280" x2="428" y2="280" stroke="#d6e1e5"/>
    <text x="32" y="318" class="measure">≈ 41.0 × 11.2 mm</text>
    <text x="32" y="356" class="detail">• Three stacked text lines</text>
    <text x="32" y="388" class="detail">• Keeps the controlled domain</text>
    <text x="32" y="420" class="detail">• Used only when Full does not fit</text>
    <rect x="32" y="445" width="110" height="28" rx="14" fill="#d7f0f1"/>
    <text x="52" y="465" class="measure">≈ 56% area</text>
  </g>

  <g transform="translate(1070 170)" filter="url(#shadow)">
    <rect width="460" height="490" rx="24" fill="#ffffff"/>
    <text x="32" y="52" class="tier">MICRO</text>
    <text x="32" y="83" class="detail">Minimum · human-readable trace</text>
    <rect x="76" y="136" width="308" height="106" rx="14" fill="#edf3f5" stroke="#c4d4da"/>
    <g transform="translate(95 149) scale(.31)" fill="#0d222b"><use href="#mark"/></g>
    <text x="174" y="184" class="wm-small">MM-ORG-001</text>
    <text x="174" y="220" class="wm-small">v0.1.0</text>
    <line x1="32" y1="280" x2="428" y2="280" stroke="#d6e1e5"/>
    <text x="32" y="318" class="measure">≈ 36.0 × 9.6 mm</text>
    <text x="32" y="356" class="detail">• Logo + exact ID + exact version</text>
    <text x="32" y="388" class="detail">• Domain retained in digital records</text>
    <text x="32" y="420" class="detail">• Last resort before placement blocks</text>
    <rect x="32" y="445" width="110" height="28" rx="14" fill="#d7f0f1"/>
    <text x="52" y="465" class="measure">≈ 42% area</text>
  </g>

  <g transform="translate(90 730)">
    <text x="0" y="-28" class="tier">AUTOMATIC SAFE-REGION SELECTION</text>
    <rect x="0" y="0" width="240" height="58" rx="29" fill="#0d6974"/>
    <text x="87" y="37" class="flow">FULL</text>
    <path d="M250 29H315" stroke="#54717d" stroke-width="4"/><path d="M315 29l-14-9v18z" fill="#54717d"/>
    <rect x="325" y="0" width="240" height="58" rx="29" fill="#0d6974"/>
    <text x="383" y="37" class="flow">COMPACT</text>
    <path d="M575 29H640" stroke="#54717d" stroke-width="4"/><path d="M640 29l-14-9v18z" fill="#54717d"/>
    <rect x="650" y="0" width="240" height="58" rx="29" fill="#0d6974"/>
    <text x="725" y="37" class="flow">MICRO</text>
    <path d="M900 29H965" stroke="#54717d" stroke-width="4"/><path d="M965 29l-14-9v18z" fill="#54717d"/>
    <rect x="975" y="0" width="240" height="58" rx="29" fill="#8b3c47"/>
    <text x="1060" y="37" class="flow">BLOCK</text>
    <text x="0" y="101" class="detail">Try 0° and 90° at scale 1.0 · preserve edge/wall clearances · select Micro only after Full and Compact fail</text>
  </g>
</svg>
