requirements_trace:
  user_stated:
    - "Der Rumpf soll deutlich fischförmiger und insgesamt stromlinienförmiger werden."
    - "Die Form soll mit Freeform-Surfacing statt nur mit technischen Grundkörpern entstehen."
    - "Längsrippen und/oder Flossen dürfen die Fischsilhouette in der Seitenansicht unterstützen."
  inferred:
    - "Das bestehende Flapping-Tail-U-Boot, seine segmentierte Beweglichkeit und seine Antriebsfunktion bleiben erhalten."
    - "Gesucht ist eine klar lesbare, abstrahierte Fischform und kein realistisches Tier mit Augen, Maul oder Schuppentextur."
    - "Die neutrale, gerade Montageansicht ist die maßgebliche Silhouette; Gelenkspalte bleiben wegen der Beweglichkeit sichtbar."
  recommended:
    - "Eine gemeinsame kubische Seiten- und Draufsicht-Führungskurve steuert Nase, vier Glieder, Kapsel und Heckübergang."
    - "Die aktuelle Folge fast zylindrischer Trommeln wird durch registrierte elliptische Freiform-Querschnitte mit weichen Schultern ersetzt."
    - "Fünf runde Aufsatzrippen werden durch drei breite, flache und G1/G2-verblendete Längskämme ersetzt: dorsal sowie links/rechts an der Schulter."
    - "Eine kleine zurückgepfeilte Rückenflosse und zwei kurze, nach hinten gepfeilte Brustflossen geben eine eindeutige Fischlesbarkeit bei geringer zusätzlicher Stirnfläche."
    - "Die einseitig nach unten laufende Schwanzflosse wird bei gleicher Antriebsschnittstelle durch eine symmetrische, weich gerundete Schwanzflosse ersetzt."
    - "Keine Kiemen-, Schuppen- oder Hochrelief-Dekoration; die Silhouette und der Highlight-Verlauf tragen die Form."
  unresolved_nonblocking:
    - "Die endgültige Stärke von Rücken- und Brustflossen wird erst im Konzeptbild visuell bestätigt."
    - "Der exakte Material-/Düsen-/Slicerprofilname bleibt für den späteren Anycubic-Slicer-Gate offen; die bestehende PETG-/0,4-mm-Basis bleibt vorläufig."

function:
  summary: >
    Ein gelenkiges, ballastierbares Spielzeug-U-Boot, das sich über eine
    motorisch schlagende Schwanzflosse fortbewegt und in neutraler Stellung
    als kompakter, stromlinienförmiger Fisch lesbar ist.
  users: ["erwachsene Bedienperson", "beaufsichtigtes Spielzeug-/Demomodell"]
  included:
    - "Bestehende Nase mit Schwimmblasen-Kolben"
    - "Vier wasserdichte Gelenksegmente mit je ±10 Grad Seitenschwenkbereich"
    - "Wasserdichte Elektronik-/Ballastkapsel mit Bajonettdeckel"
    - "Bestehender N20-Kurbel-/Rocker-Antrieb und seitlich schlagende Flosse"
    - "Neue freiformige Fischhülle, flache Längskämme, Rücken- und Brustflossen"
  excluded:
    - "Keine Änderung an Elektrik, Motor, Batterieformat, Ballastkonzept oder Schwimmblasenfunktion"
    - "Keine realistische Tierhaut, Schuppenstruktur, Augen oder Maul"
    - "Kein autonomer Drucker-Upload oder Druckstart"

geometry:
  coordinate_system:
    x: "Nase nach Heck"
    y: "Backbord/Steuerbord"
    z: "oben"
  current_assembled_bbox_mm: [413.2, 48.56, 86.13]
  current_problem:
    - "Fast konstante zylindrische Querschnitte erzeugen eine Trommel-/Raupenwirkung."
    - "Der Sprung vom vierten Segment zur 44-mm-Kapsel unterbricht die Seiten- und Draufsicht-Silhouette."
    - "Fünf schmale Rundrippen lesen sich als aufgesetzte Stäbe statt als organische Körperform."
    - "Die aktuelle Schwanzflosse liegt vollständig unter der Körperachse und liest sich eher als Kiel/Ruder als als Fischschwanz."
  target_envelope:
    style: "abstrahierte stromlinienförmige Fisch-/Thunfischsilhouette mit technischer U-Boot-Anmutung"
    body_strategy: "shared global guide curves plus registered elliptical section lofts per removable/moving part"
    neutral_joint_alignment: "adjacent section heights and widths match within 1.0 mm per side at every joint"
    joint_end_setback_mm: 1.5
    longitudinal_crests: 3
    dorsal_fin_count: 1
    pectoral_fin_count: 2
    tail_fin: "bilaterally symmetric rounded caudal planform on unchanged rocker tang/pin interface"
    continuity:
      primary_visible_envelope: G2-intent
      fin_roots: G1-minimum
      joint_cut_faces: intentional-sharp

protected_interfaces:
  hardpoint_drift_mm_max: 0.10
  items:
    - "Fünf vertikale Gelenkachsen, 4,5-mm-Bohrungen, Ohren und Zungen"
    - "Bajonettgeometrie, Deckelsitz und alle O-Ring-Nuten"
    - "Motorwellen-Gland, Motorhalter, Batteriemulden und Ballastbox"
    - "Kurbel-, Rocker- und Flossen-Schwenkvolumen"
    - "Schwimmblasenbohrung, Kolbenweg und Bedienknopf-Zugriff"
    - "Kieltasche und M12x1,5-Stopfengewinde"
  clearance_policy: >
    Freiformflächen dürfen ausschließlich die äußere sichtbare Hülle ändern.
    Exakte Bohrungen, Dichtflächen, Achsen und Sitzflächen werden nach jeder
    Hülländerung regeneriert oder deterministisch gegen die Baseline geprüft.

duty:
  speed: "langsam, spielzeugtypisch; bestehender N20 mit 150–300 U/min"
  cycle_target: "mindestens bestehender digitaler Mechanikbereich; physische Dauerprüfung offen"
  service_life: "gelegentliche Nutzung im Becken, keine Dauerimmersion"

risk:
  class: normal-functional
  hazards:
    - "Wassereintritt in Batterie-/Motorkapsel"
    - "Quetsch- und Klemmstellen an Gelenken und schlagender Flosse"
    - "Abbrechende dünne Flossen oder kleine Befestigungsteile"
  mitigations:
    - "Dicht- und Mechanikschnittstellen bleiben geometrisch geschützt und werden erneut geprüft."
    - "Flossen erhalten verrundete Vorderkanten, druckbare Mindestdicke und bleiben außerhalb aller Bewegungsvolumen."
    - "Physischer Dichtigkeits-, Passungs- und Schwimmtest bleibt vor Nutzung erforderlich."

