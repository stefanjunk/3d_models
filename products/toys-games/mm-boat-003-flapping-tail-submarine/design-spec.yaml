acceptance_detail:
  digital:
    - "Die neutrale Seiten- und Draufsicht folgt einer durchgehenden Fischsilhouette ohne den aktuellen 36-zu-44-mm-Kapselsprung."
    - "Alle geschützten Hardpoints bleiben innerhalb 0,10 mm der Version-1.0-Baseline."
    - "Alle Gelenke erreichen weiterhin ±10 Grad ohne Kollision; der Rocker-/Flossenschlag bleibt kollisionsfrei."
    - "Nase, vier Segmente, Kapsel und Deckel exportieren als jeweils ein gültiger, positiver, wasserdichter Körper."
    - "Rippen-/Flossenwurzeln besitzen keine sichtbaren Tangentenkanten außerhalb absichtlich scharfer Gelenkschnitte."
    - "Jedes Druckteil passt in 220 x 220 x 250 mm; lokale Mindestdicke sichtbarer Flossen beträgt mindestens 2,4 mm."
    - "Verdrängung, Trockenmasse und Ballastplan werden neu gerechnet und bleiben trimmbar."
  visual_human:
    - "Die Seitenansicht wird eindeutig als Fisch gelesen und nicht mehr als Raupe aus Zylindern."
    - "Flossen und Längskämme wirken integriert und nicht dekorativ aufgeklebt."
    - "Das Gesamtbild bleibt ein technisches Spielzeug-U-Boot und wird nicht comicartig."
  physical:
    - "Prozessgleicher Gelenk-/Flossen-Coupon bzw. erster Prototyp bestätigt Mindestdicke und Bruchsicherheit."
    - "Dichtigkeits-, Trimm- und Schwimmtest im Becken bestätigt Funktion und Lage."

acceptance:
  - id: fish-silhouette
    criterion: "Die neutrale Seiten- und Draufsicht bildet eine durchgehende, technisch-abstrahierte Fischsilhouette ohne den aktuellen Trommel- und Kapselsprung-Eindruck."
    method: "human concept/model review plus registered silhouette overlay"
  - id: hardpoint-drift
    criterion: "Alle geschützten Achsen, Bohrungen, Dicht- und Sitzflächen bleiben innerhalb 0,10 mm der Version-1.0-Baseline."
    method: "deterministic CadQuery hardpoint comparison"
  - id: motion-clearance
    criterion: "Alle fünf Gelenke erreichen ±10 Grad und der vollständige Rocker-/Flossenschlag bleibt kollisionsfrei."
    method: "parameter sweep and solid-intersection tests"
  - id: mesh-validity
    criterion: "Alle druckbaren Druckkörper sind positive, gültige, wasserdichte Einzelkörper und passen in 220 x 220 x 250 mm."
    method: "CadQuery validity, Trimesh audit and bed-fit preflight"
  - id: trim-feasible
    criterion: "Die neu gerechnete Verdrängung, Trockenmasse und Ballastkapazität erlauben weiterhin den Zieltrimm knapp unter der Wasseroberfläche."
    method: "buoyancy report and physical basin test"
  - id: fdm-features
    criterion: "Sichtbare Flossen sind mindestens 2,4 mm dick, besitzen verrundete Vorderkanten und benötigen in der vorgesehenen Orientierung keine unzugänglichen Supports."
    method: "geometry report, exact slicer preflight and process-matched coupon"

