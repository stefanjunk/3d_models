function:
  summary: "Modular five-inch FPV quadcopter research frame using four 10 x 10 x 1 mm carbon square tubes, printed PA-CF nodes and common 30.5 mm electronics."
  included:
    - "Parametric hub, arm clamps, motor mounts, battery deck and fit coupon"
    - "ExpressLRS control, analog camera/VTX and independently powered recovery buzzer requirements"
    - "Staged manufacturing, electrical, propulsion and flight acceptance plan"
  excluded:
    - "Flight authorization, autonomous operation or certification claims"
    - "Operation above people, public space or outside applicable legal rules"
    - "Any claim that current source-only geometry is print- or flight-approved"

geometry:
  legacy_reference:
    wheelbase_mm: 230
    arms: "four 10 x 10 x 1 mm CFK square tubes, nominal 103 mm cuts"
    flight_stack: "30.5 x 30.5 mm class"
    battery_deck_mm: [80, 52]
    camera_envelope_mm: [19, 19, 22]
  protected_regions:
    - "Motor/propeller sweep and arm-to-node clamp load paths"
    - "Flight-controller, ESC, camera, VTX, antenna, battery and fastener envelopes"
    - "Carbon isolation, wiring bend radii, cooling flow and tool access"

interfaces:
  control: "RadioMaster RP1 V2 ELRS 2.4 GHz LBT over serial CRSF; Pocket M2 EdgeTX transmitter"
  video: "RunCam Phoenix 2 SE V2 plus SpeedyBee TX800 analog 5.8 GHz; exact units and legal settings must be verified"
  power: "4S 1300 mAh XT60 candidate; flight stack, motor/propeller and voltage compatibility remain qualification items"
  family_matrix: "../FPV-VEHICLE-COMPONENT-MATRIX.md"

risk:
  class: safety-critical
  boundary: "Propulsion and vehicle-control changes require qualified human review; no unsupervised or unproven flight"
  hazards:
    - "High-energy propeller contact, flyaway or loss of control"
    - "Carbon clamp or motor-mount fracture in flight"
    - "LiPo fire, electrical short, VTX overheating or radio interference"
  mitigations:
    - "Props-off electrical gates, smoke stopper, serial failsafe and bounded test area"
    - "Fit coupons, proof loads, instrumented propulsion tests and qualified inspection before hover"

loads:
  - "Measured motor thrust, torque and vibration across the approved propeller/output limit"
  - "Arm/node static proof and cyclic clamp retention loads derived from the selected propulsion system"
  - "Battery retention and landing-impact loads with explicit factors and test fixtures"

test_plan: "legacy-package/openquad_cf5/configs/acceptance_test_plan.md"

