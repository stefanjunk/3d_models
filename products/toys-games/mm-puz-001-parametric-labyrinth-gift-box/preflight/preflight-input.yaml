product: Mm Puz 001 Parametric Labyrinth Gift Box
intended_use: A two-piece cylindrical gift box generated with Python and CadQuery. The inner cup has an optional
  full-diameter grip collar, one part carries a recessed cylindrical maze, and the other carries a single follower.
  The maze graph is a perfect spanning tree, so it has exactly one validated graph route between the locked position
  and the opening.
