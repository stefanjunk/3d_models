function:
  summary: "Supervised three-thruster tethered mini ROV for clear, calm freshwater tests, with a purchased 75 mm watertight enclosure, printed PETG frame interfaces and Pi/Pico control."
  included:
    - "Forward/reverse, yaw and vertical thrust using two horizontal and one vertical thruster"
    - "Ethernet tether control/video, wide camera, independent microcontroller watchdog and leak sensing"
    - "Optional above-water Wi-Fi/ExpressLRS buoy after direct-tether validation"
  excluded:
    - "Direct submerged Wi-Fi, Bluetooth, ExpressLRS or 5.8 GHz FPV as a primary link"
    - "Occupancy, rescue, open-water, current, saltwater or depth-rating claims"
    - "Printed pressure hull, printed propellers or unverified cable penetrators"

geometry:
  legacy_reference:
    envelope_mm: [320, 240, 180]
    tube: "10 x 8 mm CFK/GFK; two 300 mm and two 190 mm cuts"
    enclosure: "75 mm COTS locking WTE, approximately 220 mm usable"
    thrusters: "three 2828 underwater outrunners with 60 mm purchased CW/CCW propellers"
  protected_regions:
    - "Propeller sweep, guards, nozzle clearances and fastener depth"
    - "WTE sealing faces, O-rings, penetrators, vent and tether strain relief"
    - "Camera field, flotation/ballast adjustment, tube interfaces and service access"

interfaces:
  control_video: "5–10 m Ethernet data tether between topside and Pi Zero 2 W; Pico 2 provides PWM and 300 ms watchdog"
  optional_surface_link: "Wi-Fi and/or ExpressLRS only on a buoy above water"
  camera: "Raspberry Pi Camera Module 3 Wide behind a planar transparent COTS front"
  power: "3S 2200 mAh LiPo, fused distribution, verified 5 V BEC and three separate bidirectional ESCs"
  family_matrix: "../FPV-VEHICLE-COMPONENT-MATRIX.md"

risk:
  class: safety-critical
  boundary: "Pressure, propulsion, LiPo and vehicle-control changes require qualified human review and staged adult-supervised testing"
  hazards:
    - "Leak, pressure-body failure, trapped pressure or LiPo short in water"
    - "Propeller injury, unexpected thrust, tether entanglement or loss of vehicle"
    - "Loss of topside/agent link, brownout or uncontrolled ESC neutral"
  mitigations:
    - "Purchased WTE, cable-matched penetrators, vent, vacuum/leak gates and leak sensor"
    - "Props-off failsafe gates, 300 ms watchdog, fusing, guards and bounded pool trials"

loads:
  - "External pressure and leak integrity through staged 0.5–1 m tests before any increase, with 3 m maximum project target only after approval"
  - "Tether tensile load bypassing the penetrator through a dedicated strain-relief load path"
  - "Measured bidirectional thruster current, thrust, vibration and guard/nozzle clearance"
  - "Buoyancy, ballast and passive roll/pitch righting behavior of the complete wet assembly"

test_plan: "legacy-package/docs/BUILD_AND_TEST.md"

