requirements_trace:
  user_stated:
    - "Find the RC-car design in the toy folder"
    - "Integrate it into the repository structure with a portfolio record and product ID"
    - "Create a product folder, move the design there, review it and improve it"
  legacy_report_stated:
    - "Low-speed modular 1:10 camera rover on a COTS crawler chassis"
    - "Two 10 x 10 x 1 mm, 390 mm rails at 84 mm center spacing"
    - "Printed nodes, 168 x 104 x 5.6 mm windowed/ribbed deck and fixed-tilt 19 mm camera bracket"
    - "Independent RC-control and video paths"
    - "PETG starting material, ASA option, M3 fasteners and fit coupons"
    - "Bodypost and rail interfaces are parameterized rather than universally slotted"
  inferred:
    - "The drivable chassis, steering, drivetrain, wheels, bearings, radio control and battery safety remain purchased assemblies"
    - "The product scope is the removable printed/purchased payload structure, not a fully printed RC car"
    - "The intended operating surface is private, controlled ground with direct visual supervision"
    - "Fabrication preference is balanced-hybrid"
  recommended:
    - "Use Tamiya CC-02 as the first measured reference chassis, without claiming compatibility before measurement"
    - "Keep the traction battery in the lowest approved COTS chassis position; do not place it on the upper sensor deck"
    - "Route payload loads into measured chassis/frame hardpoints; bodyposts may locate a light cover but are not the primary structural load path"
    - "Use a replaceable front camera guard, radiused impact features and cable strain relief"
    - "Use a removable electronics deck with local pads, edge beams, few large radiused windows and load-oriented ribs"
    - "Start with PETG and a 0.6 mm nozzle on the Anycubic Kobra 3 Max, subject to user confirmation and process coupons"
    - "Limit the first driving stage to 5 km/h and direct line of sight until braking, failsafe, latency and range tests pass"
    - "Rebuild precise interfaces in CadQuery and retain STEP alongside DRAFT STL/3MF"
  unresolved:
    - "Exact reference chassis/revision and measured mounting hardpoints"
    - "Measured rail section, rail spacing, bodypost diameter/spacing and available vertical envelope"
    - "Exact camera, VTX, receiver, antenna, cable and fastener envelopes"
    - "Approved nominal payload and proof-load target"
    - "Exact printer, nozzle, PETG product, drying state and slicer profiles"

function:
  summary: >
    A removable, modular sensor and camera payload structure for a low-speed
    1:10 COTS RC crawler. The printed parts provide measured adapters, a stiff
    lightweight deck, camera protection, electronics retention, cable routing
    and antenna separation without modifying the steering or drivetrain.
  intended_users:
    - "adult hobby builder"
    - "supervised test operator"
  included:
    - "Measured chassis/frame adapter set"
    - "Two purchased structural rails and printed rail nodes"
    - "Removable electronics/sensor deck"
    - "Fixed-tilt 19 mm camera mount with replaceable guard"
    - "Antenna mount outside conductive rail shadow"
    - "Cable routing, strain relief and accessible fasteners"
    - "Interface coupons and staged physical test plan"
  excluded:
    - "Steering, throttle, ESC, receiver or drivetrain redesign"
    - "Autonomous driving, public-road use or unsupervised operation"
    - "High-speed operation or a validated payload/load rating before tests"
    - "Printer upload or print start"
    - "Commercial or toy-safety certification claims"

coordinate_system:
  units: mm
  origin: "vehicle longitudinal center plane at the lowest payload mounting datum; exact chassis datum unresolved"
  x: "vehicle forward"
  y: "vehicle left"
  z: "up"

geometry:
  legacy_reference_only:
    rail_section_mm: [10.0, 10.0, 1.0]
    rail_length_mm: 390.0
    rail_center_spacing_mm: 84.0
    bodypost_diameter_mm: 6.0
    deck_envelope_mm: [168.0, 104.0, 5.6]
    camera_envelope_mm: [19.0, 19.0, 22.0]
    camera_tilt_slot_mm: 8.0
  redesign_constraints:
    battery_location: "lowest approved COTS chassis location, not the payload deck"
    primary_mount: "measured chassis/frame hardpoints; exact pattern unresolved"
    rail_connection: "non-drilled purchased rail captured by split clamps and M3 through-fasteners"
    camera_protection: "replaceable guard must stay outside the optical field and transfer impact into reinforced nodes"
    cable_protection: "strain relief and bend radii must avoid steering, suspension, driveshaft and wheel envelopes"
    service_access: "battery disconnect, fasteners and electronic modules removable without destructive disassembly"
  protected_regions:
    - "Steering, suspension, wheel, driveshaft and motor motion envelopes"
    - "Battery access and visible emergency disconnect"
    - "Measured chassis mounting datums and rail alignment"
    - "Camera optical field and antenna active elements"
    - "Fastener seats, clamp bores, split planes and tool access"
    - "Bed faces and future watermark safe region"

interfaces:
  chassis:
    status: unresolved
    recommended_reference: "Tamiya CC-02, exact kit/revision to be measured"
  rails:
    status: provisional
    nominal: "two 10 x 10 x 1 mm square tubes"
    coupon_clearances_mm: [10.20, 10.35, 10.50]
  fasteners:
    recommended: "M3 metal through-bolts, washers and Nyloc nuts or captured metal nuts"
    rule: "No printed primary fastener and no heat-set insert in a primary clamp load path without a dedicated coupon"
  camera:
    status: provisional
    nominal: "19 x 19 x 22 mm with M2 mounting"
  bodyposts:
    status: "locator-only candidate; not accepted as primary structural support"
    coupon_diameters_mm: [6.10, 6.25, 6.40]

duty:
  operating_mode: "low-speed supervised hobby rover on controlled private ground"
  recommended_speed_limit_kmh: 5.0
  recommended_service_payload_g: 500
  recommended_static_proof_load_g: 1000
  cycle_targets:
    mount_remove: 25
    camera_tilt_adjust: 25
    controlled_drive_minutes: 60
  service_life_target: "one hobby season pending physical qualification"

environment:
  intended: "outdoor splash/dust exposure during short supervised runs"
  exclusions:
    - "No immersion"
    - "No rainproof or dustproof rating"
    - "No hot-vehicle or prolonged UV claim before exact-material evidence"
  review_items:
    - "VTX cooling and temperature under stationary and moving conditions"
    - "CFK or metal rail antenna shadowing"
    - "Moisture drainage and cleanability"

risk:
  class: normal-functional
  boundary: "Printed work does not modify vehicle control; any control-system or high-speed change requires qualified human review"
  hazards:
    - "Payload detachment or rail-clamp fracture on a moving vehicle"
    - "High center of gravity causing rollover"
    - "Camera/antenna impact and cable entanglement"
    - "LiPo damage, wiring short, BEC brownout or hot VTX"
    - "Loss of control or video and delayed stopping"
    - "Conductive/irritating dust when cutting CFK"
  mitigations:
    - "Low-mounted battery, frame-directed load path, metal through-fasteners and conservative speed"
    - "Guarded camera, bounded cable routes, visible disconnect and independent control/video paths"
    - "Fit, slip, load, BEC, thermal, failsafe, range, braking and drive tests before FPV use"

