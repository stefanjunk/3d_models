acceptance:
  - id: AC-REQ-001
    criterion: "The approved requirements identify one exact measured reference chassis and all mounting hardpoints before production CAD starts."
  - id: AC-DIG-001
    criterion: "Every printed part is generated deterministically as a positive solid with STEP and watertight single-component STL outputs."
  - id: AC-INT-001
    criterion: "The assembly clears all declared steering, suspension, wheel, driveshaft, motor, battery-access and disconnect envelopes across the motion sweep."
  - id: AC-MFG-001
    criterion: "Every part fits the approved printer in its intended orientation and exact slicing has no required FAIL, NOT_RUN or REVIEW_REQUIRED check."
  - id: AC-LOAD-001
    criterion: "The approved service-load, proof-load and 50 N clamp-slip tests meet the limits in acceptance_plan.physical."
  - id: AC-SAFE-001
    criterion: "Failsafe, receiver-stall, range, video-under-load, VTX-temperature, braking and supervised 5 km/h driving tests pass before FPV use."

acceptance_plan:
  digital:
    - "All generated printed parts are deterministic positive solids with STEP and watertight single-component STL exports"
    - "Assembly clears steering, suspension, wheels, driveshaft, motor, battery access and disconnect envelopes across a declared motion sweep"
    - "Rail and chassis datums match the approved measured interface contract"
    - "No primary clamp relies on layer-peel loading, unsupported fastener roofs or inaccessible support"
    - "Each part fits the approved printer volume in its intended orientation"
    - "Exact machine/process/filament slicing produces no required FAIL, NOT_RUN or REVIEW_REQUIRED check"
  physical:
    - "Selected rail and chassis coupons assemble without cracking, forcing or uncontrolled play"
    - "At 500 g service load, elastic deck deflection is at most 2.0 mm and residual set after unloading is at most 0.2 mm"
    - "At 1000 g static proof load, no crack, white stress mark, fastener pull-through or rail slip occurs; residual set is at most 0.5 mm"
    - "A 50 N rail-clamp slip test produces less than 0.5 mm movement"
    - "Camera guard survives the approved low-energy impact coupon without contacting the lens or releasing fragments"
    - "Failsafe stops propulsion, receiver does not reboot at steering stall, and the emergency disconnect stays reachable"
    - "Range, video-under-motor-load, VTX temperature, braking distance and 5 km/h supervised driving tests pass"
  release_limits:
    - "Digital geometry does not certify strength, compatibility, radio range, safety or legal operation"
    - "Physical-print, fit/function, appearance, safety and commercial release remain human-controlled"

deliverables:
  current:
    - "Integrated product folder and portfolio identity"
    - "Unchanged legacy report with SHA-256 inventory"
    - "Requirements draft, design audit and decision log"
  after_approval:
    - "Approved concept sheet with overview, underside mounting and camera-guard detail"
    - "Purchased/printed decomposition and product-specific BOM"
    - "Parametric CadQuery source and parameter file"
    - "DRAFT STEP/STL/3MF exports and assembly preview"
    - "Geometry, interface, mesh, optimization and exact-slicer reports"
    - "Fit/load/impact/electrical/radio/thermal/driving physical test plan"
    - "Product-specific metriMade.com watermark as the last solid-geometry change"
