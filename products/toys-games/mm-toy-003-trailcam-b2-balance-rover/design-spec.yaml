  after_concept_and_decomposition_approval:
    - "Parametric CadQuery source and parameter set"
    - "DRAFT STEP/STL/3MF manufacturing candidates and assembly renders"
    - "Geometry, mass-property, interface, control-model, optimization, mesh and exact-slicer reports"
    - "Restrained bench, tethered balance, failsafe, thermal and supervised driving test plan"
    - "Product-specific metriMade.com watermark as the last solid-geometry change"

acceptance:
  - id: ACC-ARCH-001
    criterion: "Every full-vehicle artifact has exactly two wheels on one common geometric axis and no caster or second axle"
    method: "component inventory, orthographic review and assembly-axis check"
  - id: ACC-MASS-001
    criterion: "Calculated assembled center of mass is 70-110 mm above the wheel axis, within 3 mm laterally, with at least +/-12 mm longitudinal trim provision"
    method: "mass-property report using measured purchased-component masses and registered CAD proxies"
  - id: ACC-GEO-001
    criterion: "Overall envelope is at most 260 x 190 x 250 mm in the nominal upright pose and each printed body fits 220 x 220 x 250 mm"
    method: "deterministic CAD bounds and bed-fit checks"
  - id: ACC-AXIS-001
    criterion: "The left/right output axes and hub interfaces meet the hardware-derived coaxiality and runout tolerance frozen before production CAD"
    method: "interface contract, CAD inspection gauge and physical dial/roll test"
  - id: ACC-LAND-001
    criterion: "Landing protection remains clear through +/-12 degrees pitch and contacts before camera, battery or exposed electronics at a tip"
    method: "motion sweep, collision check and unpowered low-height tip coupon"
  - id: ACC-CTRL-001
    criterion: "On a restrained rig the controller meets declared loop deadlines with no stale IMU/encoder sample, watchdog reset or unbounded motor command"
    method: "timestamped firmware log and hardware-in-loop report"
  - id: ACC-BAL-001
    criterion: "On a firm level surface the supervised prototype holds zero command for 60 seconds with pitch RMS <=1.5 degrees and wheel drift <=100 mm"
    method: "logged IMU/encoder trial after identified plant and current-limited tuning"
  - id: ACC-REC-001
    criterion: "The supervised prototype recovers from release at +/-8 degrees without landing contact, current-limit violation or leaving a 1 m test corridor"
    method: "tethered repeated trial, five passes per direction"
  - id: ACC-FAIL-001
    criterion: "Tip, stale sensor/encoder, watchdog, RC-loss, undervoltage and overcurrent cases produce the specified bounded state transition and require deliberate re-arm"
    method: "fault-injection matrix on a restrained rig before free driving"
  - id: ACC-MECH-001
    criterion: "Motor pods, wheel hubs, battery restraint and landing parts show no crack, loosening, pull-through or permanent set after the approved proof/cycle tests"
    method: "process-matched coupons and assembled physical test plan"
  - id: ACC-FPV-001
    criterion: "Camera field remains unobstructed and FPV loss cannot command or inhibit the RC/controller stop path"
    method: "view-frustum CAD check and powered interference/failsafe bench test"
  - id: ACC-MFG-001
    criterion: "All DRAFT manufacturing meshes are watertight, correctly oriented, within wall/feature thresholds and exact-slice successfully with complete approved profiles"
    method: "fdm_ci mesh audits and slice-anycubic-next reports plus human layer/support/seam review"

release_limits:
  - "Requirements approval authorizes concept work, not production CAD or operation"
  - "Concept approval authorizes decomposition, not a physical safety claim"
  - "Digital validation cannot qualify active vehicle control, LiPo safety, RF legality or physical durability"
  - "Physical-print, fit/function, appearance, safety and commercial release remain human-controlled"
