requirements_trace:
  user_stated:
    - "Review the TrailCam rover"
    - "Create a similar design as a new product in another folder"
    - "Use only one axle and two wheels"
    - "Add a control system that keeps the rover upright"
  inferred:
    - "Similar design includes the TrailCam FPV camera function and serviceable printed architecture"
    - "One axle means one common geometric wheel axis; the two wheels remain independently driven"
    - "The rover is a low-speed, remotely controlled hobby platform for supervised private use"
    - "The new product must not modify or replace MM-TOY-002"
  recommended:
    - "Use 120 mm wheels and firm, mostly level surfaces for the first controlled prototype"
    - "Use two encoder gearmotors, a rigidly mounted 6-axis IMU, a real-time controller and a dual bidirectional motor driver"
    - "Use cascaded pitch/rate, velocity and yaw control; do not derive balance directly from the RC receiver"
    - "Keep ELRS control and analog 5.8 GHz FPV independent"
    - "Use non-rolling sacrificial landing skids/hoops so a powered-off or tipped rover does not strike the camera or electronics"
    - "Use a balanced-hybrid construction: printed frame/guards/trays with purchased motors, encoders, hubs, tires, fasteners and electronics"
  unresolved:
    - "Whether the first prototype should target smooth indoor/hard outdoor ground only or rough terrain"
    - "Whether analog FPV and the TrailCam/OpenQuad radio ecosystem shall be retained exactly"
    - "Whether non-rolling landing skids/hoops are accepted despite the strict two-wheel architecture"
    - "Exact motor, encoder, controller, IMU, motor-driver, battery and wheel products and measured envelopes"
    - "Exact printer, PETG product, drying state and Anycubic machine/process/filament JSON profiles"

function:
  summary: >
    A two-wheel, single-axis FPV camera rover that actively balances its body as
    an inverted pendulum. Two independently driven coaxial wheels provide pitch
    stabilization, forward/reverse motion and differential yaw steering. A
    protected front camera, independent control/video links and serviceable
    electronics remain visually and functionally related to TrailCam CF10.
  intended_users:
    - "adult hobby builder"
    - "supervised test operator"
  included:
    - "One geometric wheel axis and exactly two driven wheels"
    - "Two independent motor/encoder channels; no mechanical differential"
    - "IMU-based active upright stabilization"
    - "Remote forward/reverse and differential steering commands"
    - "Protected fixed-tilt FPV camera and analog video transmitter mounts"
    - "Independent ELRS control receiver path"
    - "Printed structural core, motor pods, battery cradle, electronics tray, camera guard and landing protection"
    - "Accessible emergency battery disconnect, current protection and bounded cable paths"
    - "Deterministic control-model, geometry, interface and slicer evidence before a print candidate"
  excluded:
    - "Four-wheel chassis, second axle, suspension arms, steering linkage or caster wheel"
    - "Autonomous navigation, person transport, public-road use or unsupervised operation"
    - "Operation on stairs, steep slopes, loose deep terrain, water or near traffic"
    - "A safety, balance, runtime, range or payload claim before physical tests"
    - "Printer upload or print start"
    - "Commercial or toy-safety certification claims"

operating_scenarios:
  start:
    - "Place the rover near upright while supported by the landing protection"
    - "Power the control system; require sensor calibration and a deliberate arm command"
    - "Enable motor torque only inside the approved capture-angle and health limits"
  drive:
    - "Balance continuously while tracking bounded speed and yaw commands"
    - "Keep FPV loss independent from motion control and retain a visible line-of-sight operator"
  stop:
    - "Command zero speed while maintaining balance"
    - "Disarm and let the body settle onto a non-rolling sacrificial landing surface"
    - "Use the reachable battery disconnect before service"
  off_nominal:
    - "On excessive tilt, sensor fault, encoder fault, motor-driver fault, undervoltage or overcurrent, command a bounded shutdown and disarm after tip detection"
    - "On RC loss, command zero velocity/yaw while balance remains healthy; indicate the fault and disarm after a confirmed tip"

coordinate_system:
  units: mm
  origin: "intersection of the common wheel axis and vehicle longitudinal center plane"
  x: "vehicle forward"
  y: "vehicle left along the wheel axis"
  z: "up in the nominal balanced pose"

geometry:
  architecture:
    wheel_count: 2
    axle_count: 1
    axle_definition: "one shared geometric axis; no mandatory continuous shaft"
    motor_count: 2
    suspension: "none in revision 0.1.0; compliant tires provide the only passive terrain compliance"
  target_envelope_mm:
    overall_width_max: 260
    body_length_max: 190
    upright_height_max: 250
    individual_print_part_max: [220, 220, 250]
  wheels:
    target_diameter: 120
    allowed_diameter_range: [110, 130]
    target_tread_width: 40
    wheel_center_track_target: 205
  mass_properties:
    target_total_mass_g: 1800
    maximum_design_mass_g: 2200
    target_center_of_mass_above_axis_mm: [70, 110]
    lateral_center_of_mass_offset_max_mm: 3
    longitudinal_center_of_mass_trim_range_mm: [-12, 12]
    acceptance_scope: "complete assembled rover including wheels, hubs, motors, brackets, printed parts and all declared COTS masses"
    scope_decision:
      status: approved
      selected_option: A
      approved_by: Stefan
      approved_at: "2026-08-30"
      evidence: "User response: A"
      effect: "retain ACC-MASS-001 unchanged and redesign the mass stack"
  upright_clearances:
    minimum_body_ground_clearance_mm: 25
    landing_protection_contact_tilt_min_deg: 22
  appearance:
    language: "open ribbed FDM frame, anthracite structural parts, orange replaceable camera/landing accents, visible service fasteners"
    source_boundary: "MM-TOY-002 concept is style and platform evidence only, not dimensional authority"
  protected_regions:
    - "wheel and tire rotation envelopes"
    - "motor/encoder shaft and hub interfaces"
    - "IMU datum and vibration-isolation boundary"
    - "battery access, restraint and disconnect corridor"
    - "camera optical field and antenna active regions"
    - "landing contact zones and motor/electronics cooling paths"
    - "fastener seats, mating faces, bed faces and future watermark region"

interfaces:
  wheel_drive:
    status: provisional
    owner: "purchased motor, shaft, metal hub and wheel components"
    contract: "left and right output axes coaxial within the measured assembly tolerance; each wheel independently reversible and encoder-observed"
  structure:
    status: recommended
    contract: "printed central spine/cage carries motor pods, battery, electronics and landing loads through metal M3/M4 through-fasteners or captured nuts"
  imu:
    status: provisional
    contract: "rigid, repeatable datum near the central frame; axis mapping, vibration spectrum and temperature drift must be calibrated"
  control:
    status: provisional
    controller: "real-time MCU class with deterministic timer/interrupt control; exact board unresolved"
    sensors: "6-axis gyro/accelerometer plus one quadrature encoder per wheel"
    actuators: "two bidirectional DC gearmotor channels with current limiting and fault reporting"
  camera:
    status: provisional
    nominal: "RunCam Phoenix 2 SE V2 19 mm analog camera family; measure the exact unit before CAD freeze"
  video_transmitter:
    status: provisional
    nominal: "SpeedyBee TX800 20 x 20 mm analog VTX family; exact revision, cooling and legal power unresolved"
  radio_control:
    status: provisional
    ecosystem: "EdgeTX plus ExpressLRS 2.4 GHz LBT"
    receiver: "surface PWM or serial receiver compatible with the controller; exact unit unresolved"
    independence: "loss or failure of the FPV video path shall not prevent a commanded stop or control failsafe"
  battery:
    status: unresolved
    contract: "centered above the wheel axis inside a guarded, strapped, serviceable cradle with fuse/current protection and reachable disconnect"
  landing_protection:
    status: recommended
    contract: "non-rolling front/rear skids or hoops remain clear during normal balance motion and limit camera/electronics impact after disarm or tip-over"

concept_visualization:
  selected_asset: concepts/trailcam-b2-balance-concept-v0.1.0-r1.png
  role: "Appearance and architecture review only; not dimensional, control, strength or manufacturing evidence"
  style_reference: "MM-TOY-002 concept v0.4.0-r2 for open ribbed FDM language, orange protection and studio presentation only"
  visible_intent:
