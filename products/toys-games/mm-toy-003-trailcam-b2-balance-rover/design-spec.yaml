    wheel_center_track_target: 216
    selected_candidate: "BaneBots T81P-496BB with T81H-RM61 hub"
    selected_candidate_diameter: 123.825
    selected_candidate_tread_width: 20.32
    selected_candidate_overall_width_at_target_track: 236.32
    projected_unchanged_body_height: 251.4125
    projected_height_excess_over_requirement: 1.4125
    integration_status: requires_cad_envelope_revision
    note: "The target remains an architecture requirement; selected candidate values own the next CAD revision, require a roof/axle envelope correction, and must be sample-confirmed"
  mass_properties:
