    maximum_design_mass_g: 2200
    target_center_of_mass_above_axis_mm: [70, 110]
    lateral_center_of_mass_offset_max_mm: 3
    longitudinal_center_of_mass_trim_range_mm: [-12, 12]
    acceptance_scope: "complete assembled rover including wheels, hubs, motors, brackets, printed parts and all declared COTS masses"
    scope_decision:
      status: approved
      selected_option: A
      approved_by: Stefan
      approved_at: "2026-08-30"
      evidence: "User response: A"
      effect: "retain ACC-MASS-001 unchanged and redesign the mass stack"
  upright_clearances:
    minimum_body_ground_clearance_mm: 25
    landing_protection_contact_tilt_min_deg: 22
  appearance:
    language: "open ribbed FDM frame, anthracite structural parts, orange replaceable camera/landing accents, visible service fasteners"
    source_boundary: "MM-TOY-002 concept is style and platform evidence only, not dimensional authority"
  protected_regions:
    - "wheel and tire rotation envelopes"
    - "motor/encoder shaft and hub interfaces"
    - "IMU datum and vibration-isolation boundary"
    - "battery access, restraint and disconnect corridor"
    - "camera optical field and antenna active regions"
    - "landing contact zones and motor/electronics cooling paths"
    - "fastener seats, mating faces, bed faces and future watermark region"

interfaces:
  wheel_drive:
    status: selected_dimensioned_candidate_unmeasured
    owner: "Pololu 4755 motor and 1995 bracket plus BaneBots T81H-RM61 6 mm hub and T81P-496BB wheel"
    contract: "6 mm D-shaft with 16 mm available length to matched T81 hub/wheel interface; two hub set screws at 90 degrees and 3/4 inch snap-ring retention; left and right axes coaxial within measured assembly tolerance; each wheel independently reversible and encoder-observed"
  structure:
    status: recommended
    contract: "printed central spine/cage carries motor pods, battery, electronics and landing loads through metal M3/M4 through-fasteners or captured nuts"
  imu:
    status: selected_dimensioned_candidate_unmeasured
    owner: "Adafruit 4502 ISM330DHCX breakout; official EagleCAD/Fab Print nominal 25.4 x 17.78 mm, two 2.5 mm holes at 20.32 mm centers"
    contract: "rigid, repeatable keyed datum near the central frame; delivered PCB revision, installed connector height, sensor axis mapping, vibration spectrum and temperature drift must be measured and calibrated"
  control:
    status: selected_candidate_unmeasured
    controller: "PJRC Teensy 4.1 without headers"
    sensors: "Adafruit 4502 ISM330DHCX carrier over rigid SPI plus one quadrature encoder per Pololu 4755 motor"
    actuators: "Pololu 2507 dual VNH5019 driver with about 140 mV/A current sense and EN/DIAG per channel"
  camera:
    status: selected_candidate_unmeasured
    nominal: "RunCam Phoenix 2 SE V2 19 x 19 x 22 mm analog camera; measure exact delivered lens and screw geometry before CAD freeze"
  video_transmitter:
    status: selected_candidate_unmeasured
    nominal: "SpeedyBee TX800 with 20 x 20 mm M3 pattern; exact revision, cooling, antenna strain and lawful local configuration remain test/review owned"
  radio_control:
    status: selected_candidate_unmeasured
    ecosystem: "EdgeTX plus ExpressLRS 2.4 GHz LBT"
    receiver: "RadioMaster RP3 V2 EU-LBT diversity receiver over CRSF UART"
    independence: "loss or failure of the FPV video path shall not prevent a commanded stop or control failsafe"
  battery:
    status: component_driven_draft_unmeasured
    candidate: "Gens ace GEA503S60X6GT 3S 5000 mAh XT60; manufacturer-declared 154 x 43 x 25 mm and 359 g nominal ledger mass"
    contract: "centered above the wheel axis inside a redesigned guarded, strapped, serviceable cradle with Littelfuse ATO protection, Pololu D24V50F5 logic rail and reachable AMASS XT60E-M service disconnect"
  landing_protection:
    status: recommended
    contract: "non-rolling front/rear skids or hoops remain clear during normal balance motion and limit camera/electronics impact after disarm or tip-over"

