    - "Two independent coaxial motor pods with no suspension, steering linkage or caster"
    - "Compact upright ribbed printed cage between the wheels"
    - "Battery centered above the axle, with electronics and controller above it"
    - "Forward camera inside a replaceable orange guard and separated antenna mounts"
    - "Non-rolling orange landing protection and accessible modular electronics"
    - "Exploded separation of wheels, motors, frame, battery, electronics, camera and protection"
  deliberate_simplifications:
    - "Wheel, motor, PCB, camera, antenna, fastener and battery shapes are generic visual proxies, not supplier-authoritative geometry"
    - "The upper-right side view shows one wheel silhouette because the far wheel is coaxially occluded"
    - "The apparent skid-to-floor gap is illustrative; the 22 degree contact threshold and all clearances remain specification/CAD-owned"
    - "No image proportion, board placement, cable path, center of mass or field-of-view cone is a measured result"

control_system:
  architecture:
    inner_loop: "gyro-rate and pitch stabilization"
    outer_loop: "wheel velocity/position trim"
    yaw_loop: "differential wheel torque/speed command"
    command_source: "bounded remote speed and yaw demands; never raw pass-through motor PWM"
  minimum_rates_hz:
    imu_sample: 500
    pitch_control_update: 250
    encoder_velocity_update: 100
    command_and_failsafe_update: 50
  provisional_limits:
    arm_capture_angle_deg: 5
    normal_dynamic_pitch_deg: 12
    tip_detection_angle_deg: 35
    tip_confirmation_ms: 150
    speed_limit_kmh: 2.5
  required_protections:
    - "positive arm/disarm state and startup self-test"
    - "watchdog and stale-sensor/encoder detection"
    - "motor current limit, driver thermal fault and battery undervoltage handling"
    - "tip-over motor disarm and deliberate re-arm"
    - "RC-loss zero speed/yaw command with independent balance-health handling"
    - "parameter logging and versioned firmware/configuration"
  engineering_targets:
    motor_output_speed_range_rpm: [100, 150]
    continuous_wheel_torque_min_nm_each: 0.35
    transient_current_limited_wheel_torque_target_nm_each: 1.0
    note: "Selection targets only; verify with identified hardware, system identification and a restrained test rig"

duty:
  operating_mode: "low-speed supervised hobby rover on firm, mostly level private ground"
  speed_limit_kmh: 2.5
  target_runtime_min: 20
  cycle_targets:
    arm_disarm: 100
    controlled_drive_minutes: 120
    tip_recovery_or_protected_landing: 50
    battery_remove_install: 50
  service_life_target: "one hobby season pending physical qualification"

environment:
  intended: "indoor floor and dry, firm outdoor pavement/compacted ground during supervised tests"
  provisional_temperature_c: [10, 35]
  exclusions:
    - "No rain, immersion, deep dust, mud, sand or grass claim"
    - "No steep slope, stair, curb or drop-edge operation"
    - "No prolonged UV or hot-vehicle storage claim before exact material evidence"

risk:
  class: normal-functional
  boundary: >
    This is a moving vehicle with active stability control. Digital models and
    bench calculations cannot qualify its control safety. All powered balance,
    failsafe and driving stages require restrained tests followed by explicit
    supervised human approval; any higher speed, autonomous or public-space use
    requires qualified engineering review.
  hazards:
    - "Unexpected wheel acceleration during arming, tuning or sensor failure"
    - "Tip-over impact damaging the camera, battery or electronics"
    - "Loss of balance or control near people, pets, edges or traffic"
    - "Motor stall, driver overheating, LiPo damage, short circuit or BEC brownout"
    - "Loose wheel/hub, printed motor-pod fracture or battery release"
    - "RC or FPV loss, interference and delayed stopping"
  mitigations:
    - "Restrained wheels-off-ground and tethered low-energy test ladder before free balancing"
    - "Deliberate arming, bounded commands, watchdog, current limiting, tip disarm and reachable disconnect"
    - "Guarded battery/camera, metal wheel hubs and fasteners, protected cables and non-rolling landing protection"
    - "Private clear test area, direct line of sight and conservative speed limit"

fabrication:
  preference: balanced-hybrid
  printed_scope:
    - "central structural cage/spine"
    - "motor pods and alignment features"
    - "battery cradle and electronics tray"
    - "camera guard and antenna/cable retainers"
    - "sacrificial non-rolling landing skids/hoops"
  purchased_scope:
    - "motors, encoders, metal shafts/hubs, wheels and tires"
    - "controller, IMU, motor driver, receiver, camera, VTX and power electronics"
    - "battery, fuse/disconnect and metal fasteners"
  target_formats: [step, stl, 3mf]

