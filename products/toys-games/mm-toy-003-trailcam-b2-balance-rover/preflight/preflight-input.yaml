product: Trailcam B2 Balance Fpv Rover
intended_use: A two-wheel, single-axis FPV camera rover that actively balances its body as an inverted pendulum.
  Two independently driven coaxial wheels provide pitch stabilization, forward/reverse motion and differential yaw
  steering. A protected front camera, independent control/video links and serviceable electronics remain visually
  and functionally related to TrailCam CF10.
