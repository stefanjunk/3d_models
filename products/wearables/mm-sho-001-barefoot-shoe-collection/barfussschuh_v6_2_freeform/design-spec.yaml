project:
  id: MM-SHO-001
  name: "Barfußschuh V6.2 – Freeform Upper mit Komfortkragen"
  revision: 6.2.0-draft.2
  units: mm
  lineage: ../barfussschuh_v6_1_fitfix
  status: concept-review
  intended_user: "erwachsene Testperson; technischer Schuhprototyp"

workflow:
  autonomy_policy: null
  requirements_approval:
    status: approved
    spec_revision: 6.2.0-draft.2
    approved_by: Stefan
    approved_on: 2026-08-28
    basis: "Nutzerfreigabe 'freigegben' nach Draft-2-Vorschlag; Draft-1-Render zeigte unzureichende Fersenreserve und spitze Kragenübergänge"
  concept_approval:
    status: pending
    spec_revision: 6.2.0-draft.2
    asset: previews/concept-v6.2.0-draft.2.png
    asset_sha256: 18d2643250238dd3f82bf6527fe6eec787b1870fdffa8fb1d0da26124c960ca7
