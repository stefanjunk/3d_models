# Mystery Puzzle Box — Test Plan
# Linked from design-spec.yaml (test_plan). Revision v1.1.

printer:
  model: Anycubic Kobra 3 Max
  build_volume_mm: [420, 420, 500]
  nozzle_mm: 0.4
  material: PLA
  layer_height_mm: 0.2

scope: |
  Decorative puzzle box, risk class: decorative.
  Mechanism is low-cycle (occasional opening), all springs are printed PLA flexures,
  so the decisive validation is a mechanism coupon + assembly prototype (V4/V5).
  No structural or safety proof loads required.

coupons:
  - id: coupon-flexure
    feature: "Leaf-spring strain/force and 50-cycle endurance for the three flexure types (bolt return, hold pawl, button return)."
    specimens:
      - bolt spring: 30 x 6 x 1.2 mm leaf, 2.25 mm deflection
      - pawl leaf: 14 x 5 x 1.0 mm leaf, 0.6 mm deflection
      - button return: 20 x 5 x 1.0 mm leaf, 1.5 mm deflection
    orientation: same as in final parts (leaf horizontal, layers along leaf length)
    test: "Deflect to operating deflection 20x, then 50 cycles; record force at operating deflection and any crack/creep."
    pass_criteria:
      - "Force within +/-30% of calculation"
      - "No visible crack after 50 cycles"
  - id: coupon-ratchet
    feature: "Ratchet pitch 0.75 mm, drive-hook ride-over, hold-pawl catch, 45-deg chamfer reset."
    specimens: "3D-ratchet strip with one drive track (steep tooth) + hold track, printed at final layer height."
    test: "Manually cycle: drive hook advances one tooth per press; second press does not advance; hold pawl blocks spring return; chamfer reset allows Y+ pass-through."
    pass_criteria: "All four behaviors confirmed without binding."
  - id: coupon-sliding-fit
    feature: "Pin-in-bore sliding fit (6 x 4 mm rectangular bore), 0.25 mm clearance."
    test: "Pin slides freely under spring force; no stiction at room temperature."
    pass_criteria: "Full 1.5 mm travel restored by spring within 1 s."

assembly_prototype:
  id: prototype-v1
  parts: [body, lid, button x3, bolt]
  sequence:
    1. "Insert bolt into channel; flex hold pawl aside while seating bolt at locked stop."
    2. "Insert three buttons through their bores; verify springs restore them."
    3. "Place lid; verify it seats flush and the tip engages the notch."
  tests:
    - id: button-travel
      test: "Each button slides 1.5 mm and returns by spring."
      pass: "Travel >= 1.3 mm, return within 1 s, no permanent deformation."
    - id: latch-release
      test: "Press all three buttons in random orders (6 permutations x 3 repeats); latch must retract and lid must lift. Then close lid; latch must re-engage automatically."
      pass: "18/18 open cycles, 18/18 relock cycles, no jamming."
    - id: one-shot-per-button
      test: "Press the same button three times without touching the others; lid must NOT open."
      pass: "Lid stays locked in all repeats."
    - id: seam-visual
      test: "Closed box at 0.5 m distance; continuous ? pattern across seam, no visible seam line."
      pass: "Pattern continuity confirmed by inspection."

release_gates:
  - "All coupons pass (V4) before final assembly prototype."
  - "All assembly_prototype tests pass (V5) before watermark gate (Gate 0C)."
  - "Gate 0C user approval before exports are labeled final."

reporting:
  results_file: validation/prototype-results.md
  evidence: "Photos of coupon cycling, prototype open/close cycles, and seam close-up."
