printed:
  - part: honeycomb-module-textured
    quantity: 1 per cell
    material: PETG recommended; wood-filled filament only after supplier/profile review
  - part: bridge-clip
    quantity: 2 per shared cell edge
    material: PETG preferred for elastic reserve
  - part: rear-wall-spacer
    quantity: 2 per mounted cell when rear bridge clips are used
    material: Same rigid material as module; 2.4 mm nominal thickness
purchased:
  - part: wall screw
    quantity: 2 per mounted cell
    requirement: Shank and head must fit the printed ear/counterbore; include 2.4 mm extra length when rear spacers are used.
  - part: wall anchor
    quantity: 2 per mounted cell
    requirement: Select for actual substrate, edge distance, installation method, and tested load.
optional:
  - part: felt or thin cork pad
    quantity: 2-4 per cell
    purpose: Prevent wall marking and compensate small wall irregularities; do not replace the rigid 2.4 mm spacers used with rear clips.
