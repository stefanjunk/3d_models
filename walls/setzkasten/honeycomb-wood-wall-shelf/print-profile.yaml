module:
  orientation: rear frame ring and mounting ears on build plate
  material: PETG
  nozzle_mm: 0.4
  layer_height_mm: 0.20
  line_width_mm: 0.44
  walls: 5
  top_bottom_layers: 5
  infill: 20% gyroid or cubic
  supports: none expected
  seam: place on a rear outer corner where possible
  notes:
    - Inspect texture toolpaths; narrow ridges must not disappear.
    - Verify both visible mounting ears and their counterbores are complete.
    - Use a brim only if the large hexagonal footprint lifts.
    - Do not scale in the slicer because scaling changes wall thickness, screw fit, texture depth, and clip fit.
connector:
  orientation: cap flat on build plate, U opening upward
  material: PETG
  nozzle_mm: 0.4
  layer_height_mm: 0.20
  walls: 4
  infill: 100% or forced solid by wall count
  supports: none
rear_wall_spacer:
  orientation: flat face on build plate
  material: PETG
  nozzle_mm: 0.4
  layer_height_mm: 0.20
  walls: 4
  infill: 100%
  supports: none
wood_filled_variant:
  nozzle_mm: 0.6
  nozzle_material: abrasion-resistant
  status: provisional
  requirements:
    - Follow exact filament supplier temperature and drying instructions.
    - Reprint texture and clip coupons; do not reuse the PETG clearances blindly.
    - Expect lower or supplier-specific strength and do not infer a load rating from appearance.
